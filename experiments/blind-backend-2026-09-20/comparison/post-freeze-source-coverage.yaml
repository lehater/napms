  - statement_id: W1-005-ACTIVE-INACTIVE
    classification: ADMITTED
    admitted_ref: experiments/blind-backend-2026-09-20/source-product-wave1.md
    sanitized_statement: Active and Inactive transitions preserve identity/history/permission provenance without a new decision.
  - statement_id: W1-006-EFFECTIVE-CONDITIONS
