statements:
  - id: W1-001-SUBMIT-AUTH-SCOPE
    source_ref: c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-001
    text: An actor with effective request authority for the relevant scope may submit a proposal.
  - id: W1-002-DECISION-SUBJECT
    source_ref: c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-002
    text: Permission decision remains correlated to the exact immutable semantic subject proposed.
  - id: W1-003-NOTALLOWED-NO-RULE
    source_ref: c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-003
    text: NotAllowed produces no authoritative Access Rule.
  - id: W1-004-IDEMPOTENT-RULE
    source_ref: c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-004
    text: Same allowed semantic identity resolves one stable authoritative Rule and starts Active.
  - id: W1-005-ACTIVE-INACTIVE
    source_ref: c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-005
    text: Active and Inactive are reversible without a new permission decision and preserve identity/history.
  - id: W1-006-EFFECTIVE-CONDITIONS
    source_ref: c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-006
    text: Allowed access may carry declarative operational/effective conditions including schedule/periodicity where applicable.
  - id: W1-007-TECHNICAL-REALIZATION
    source_ref: c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-007
    text: Technical realization changes alone do not change Rule identity or rewrite historical permission.
  - id: W1-008-EXPORT-AUTH-SCOPE
    source_ref: c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-008
    text: Export subset selection requires the required read/export authority for the relevant domain-policy scope.
  - id: W1-009-LOGICAL-TIME
    source_ref: c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-009
    text: Export uses one logical evaluation time and required realization must be valid/coherent for it.
  - id: W1-010-COMPLETE-EXPORT
    source_ref: c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-010
    text: Successful export is complete, vendor-neutral and sufficiently explainable.
  - id: W1-011-NO-PARTIAL-SUCCESS
    source_ref: c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-011
    text: Missing required realization prevents complete successful export; diagnostics may be explicit non-success.
  - id: W1-012-INDEPENDENT-PROVENANCE
    source_ref: c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-012
    text: Normalization must preserve independent Rule/decision provenance and not broaden/narrow semantics.
  - id: W1-013-AUTHORITY-PROVENANCE-SCOPE-TIME
    source_ref: c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-013
    text: End-to-end provenance includes requesting actor and effective authority scope/time.
  - id: W1-E1-NO-SAME-APPLICATION
    source_ref: c403ceed:docs/requirements/wave1-acceptance-examples.md#E1
    text: No blanket same-Application invariant; validity follows described interaction and valid references.
  - id: Q-001-NUMERIC-TARGETS
    source_ref: docs/requirements/first-mvp-quality-targets.yaml#decision
    text: Numeric latency, throughput, availability and scale targets are explicitly NOT_REQUIRED for first MVP.

