implementation_boundary:
  includes: [backend HTTP/JSON API, modular-monolith modules, PostgreSQL persistence, OIDC authentication, scoped/time authority admission, vendor-neutral policy materialization]
  excludes: [frontend implementation, provider-specific rendering, firewall/provider mutation, configured-state reconciliation, historical export, distributed services]
  rule: Implement only accepted backend design; codebase structure and dependencies must satisfy the backend component design; unexpected semantic gaps route upstream.

vertical_sequence:
  - foundation: migrate and serve modes, exact schema verification, PostgreSQL pool, OIDC/JWKS initialization, health and correlation
  - resource: Site ResponsibilityGroup Resource AuthorityScopeRef Endpoint address history and responsibility history
  - application: Application Component independent Interaction immutable InteractionRevision and canonical TrafficClause
  - deployment_business: ComponentDeployment BusinessProcess criticality participant-attributed ConnectivityNeed
  - access: AccessRequest scoped request authority final ALLOWED/DENIED PolicyRule evidence justification Active/Inactive EffectiveWindow
  - materialization: all-or-subset selection scoped export authority one snapshot evaluationAt provenance and normalized rows
  - closure: security operability migrations idempotency cancellation and fresh-database end-to-end verification

completion_definition:
  - Application is treated as a reusable network communication profile; cross-Application Interaction is rejected while multiple independent Interactions for the same intra-Application Component pair remain supported.
  - Resource has immutable AuthorityScopeRef and explicit logical Endpoint membership; no automatic grouping by address Site responsibility or name occurs.
  - BusinessProcess criticalityLabel is representable without score ordering taxonomy or propagation.
  - AccessRequest requires a current participant-attributed Need plus effective scoped access.request authority for the source Resource scope at admissionAt; destination scope authority is not required merely to submit.
  - DENIED creates no PolicyRule; ALLOWED converges one PolicyRule per exact AccessSubject including immutable InteractionRevision.
  - PolicyRule supports reversible ACTIVE/INACTIVE and absolute EffectiveWindow without new permission decision.
  - Additional Needs attach without duplicate Rule; zero current Needs yields reconciliation and no automatic revoke.
  - Materialization supports ALL or explicit Rule subset and requires scoped policy.export authority for every selected Resource scope at evaluationAt.
  - One read-only REPEATABLE READ snapshot and database transaction_timestamp() govern materialization.
  - Export is self-contained for request authority permission business and technical provenance; each selected effective Rule remains represented even when a current source/destination address is absent, with row-level technical readiness distinguishing deployable tuples from incomplete realization.
  - Idempotency replays exact persisted response and has no first-MVP TTL.
  - migrate owns DDL and advisory serialization; serve verifies exact migration IDs/checksums and never auto-migrates.
  - OIDC HTTPS issuer/discovery/JWKS algorithm kid audience time subject permission and authority-claim semantics are proven.
  - Numeric latency throughput availability and scale targets are explicitly NOT_REQUIRED for first MVP.
  - Every required verification scenario has executable evidence before implementation is COMPLETE.

open_questions: []
implementation_authorization: DESIGN_COMPLETE_BACKEND

delivery_contract:
  release:
    - Release one coherent backend baseline: locked runtime/dependencies, application package, migration set and matching verification baseline.
    - Authorize release only when BACKEND-IMPLEMENTATION Coverage/Engineering Graph target is complete, required verification passes and no blocking Question remains.
    - Serve refuses a schema whose applied migration ids/checksums do not match the release expectation.
  rollback:
    - Code rollback is allowed only when current schema and public contracts remain compatible with the previous baseline.
    - An incompatible migration requires an explicitly tested reverse/repair migration or restoration of a compatible pre-migration database state; code must not reinterpret a newer incompatible schema.
    - A destructive or semantics-changing migration without an accepted recovery path blocks release.
error_handling_contract:
  - Domain rejection, invalid export selection, authentication/authorization denial, concurrency conflict and technical dependency failure remain distinct through application and HTTP mapping; missing current address is normal enriched export data, not an application failure.
  - Infrastructure/library exceptions are translated at their owning adapter boundary; framework/database/OIDC exception types do not cross into domain contracts.
  - Catch-all handling must not convert unknown commit outcome, dependency inability or internal failure into an accepted domain result.
  - Errors exposed externally use the accepted HTTP status/representation contract; diagnostic detail remains safe and correlation-friendly without leaking secrets.
  - Retry is never invented by a generic error wrapper; retry/idempotency behavior follows the owning system/interface contract.
