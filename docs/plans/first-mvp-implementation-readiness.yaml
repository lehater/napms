version: 4
kind: implementation-readiness
id: NAPMS-FIRST-MVP-IMPLEMENTATION-READINESS
status: PILOT_CURRENT

goal: Turn the accepted first-MVP design into executable implementation slices and explicit completion criteria without reopening product, domain or architecture decisions.

design_refs:
  requirements: docs/requirements/first-mvp-policy-export.yaml
  journey: docs/model/use-cases/first-mvp-policy-export.yaml
  system_structure: docs/architecture/structurizr/workspace.dsl
  application_architecture: docs/architecture/mvp-system-rules.yaml
  security_architecture: docs/architecture/mvp-security-architecture.yaml
  module_contracts: docs/architecture/mvp-module-contracts.yaml
  shared_technical_conventions: docs/architecture/mvp-technical-representation.yaml
  http_contract: docs/contracts/http/napms.openapi.yaml
  persistence: docs/architecture/persistence/mvp-persistence.yaml
  quality_requirements: docs/architecture/mvp-quality-requirements.yaml
  threat_model: docs/architecture/mvp-threat-model.yaml
  observability: docs/architecture/mvp-observability.yaml

implementation_boundary:
  includes: [browser workflow, HTTP/JSON application API, modular-monolith modules, PostgreSQL persistence, Authority Management admission, vendor-neutral policy materialization, table and CSV export]
  excludes: [provider-specific rendering, Network Enforcement Placement, Access Policy Realization, Network Environment Operations, Technical Access Evidence, external IdP, distributed services]
  rule: Implement one end-to-end vertical journey while preserving accepted semantic and architecture ownership.

vertical_sequence:
  - Author Resources and AddressSpace
  - Author Application Components Interaction and traffic revision
  - Create source and destination ComponentDeployments
  - Establish BusinessProcess and current ConnectivityNeed
  - Submit RuleChange for exact deployments/revision/Need
  - Decide Pending RuleChange
  - Materialize all current effective rules
  - Render same successful result as table and CSV

frontend:
  steps: [Resources, Application and Components, Interactions and Traffic, Deployments, Business Connectivity, Policy Rule and Decision, Current Policy Export]
  rule: UI drives the API and displays validation/Unresolved outcomes; it never becomes authority for domain invariants or authorization.

implementation_slices:
  - 'foundation: session/auth admission, OpenAPI edge, composition root, PostgreSQL migrations and diagnostic correlation'
  - 'authoring: RC + ACC + AD + Business Connectivity'
  - 'policy: Access Policy lifecycle and cross-module validation'
  - 'export: complete materialization + JSON table + CSV'
  - 'frontend: complete browser journey'
  - 'verification: module + integration + API + end-to-end proof'

completion_definition:
  - OpenAPI covers every required journey operation and explicit outcome.
  - PostgreSQL migrations establish only module-owned state needed by the journey.
  - Backend interfaces implement the canonical module contracts and introduce no internal HTTP.
  - Protected operations implement the canonical security boundary and Authority Management admission.
  - Browser completes the journey without hidden/manual state fabrication.
  - Implementation preserves the quality, threat-control and observability constraints referenced above.
  - Verification covers happy path, rejection, withdrawal, authorization and Unresolved export.
  - No coding step requires a new product/domain/system-architecture decision.

open_questions:
  - Numeric performance, availability and scale targets are not present in accepted product truth and must not be invented during implementation.
implementation_authorization: NOT_GRANTED_BY_THIS_ARTIFACT
