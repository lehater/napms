implementation_boundary:
  includes: [backend HTTP/JSON API, modular-monolith modules, PostgreSQL persistence, OIDC authentication, scoped/time authority admission, vendor-neutral policy materialization]
  excludes: [frontend implementation, provider-specific rendering, firewall/provider mutation, configured-state reconciliation, historical export, distributed services]
  rule: Implement only accepted backend design; unexpected semantic gaps route upstream.

vertical_sequence:
  - foundation: migrate and serve modes, exact schema verification, PostgreSQL pool, OIDC/JWKS initialization, health and correlation
  - resource: Site ResponsibilityGroup Resource AuthorityScopeRef Endpoint address history and responsibility history
  - application: Application Component independent Interaction immutable InteractionRevision and canonical TrafficClause
  - deployment_business: ComponentDeployment BusinessProcess criticality participant-attributed ConnectivityNeed
  - access: AccessRequest scoped request authority final ALLOWED/DENIED PolicyRule evidence justification Active/Inactive EffectiveWindow
  - materialization: all-or-subset selection scoped export authority one snapshot evaluationAt provenance and normalized rows
  - closure: security operability migrations idempotency cancellation and fresh-database end-to-end verification

completion_definition:
  - Cross-Application Interaction and multiple independent Interactions for the same Component pair are supported.
  - Resource has immutable AuthorityScopeRef and explicit logical Endpoint membership; no automatic grouping by address Site responsibility or name occurs.
  - BusinessProcess criticalityLabel is representable without score ordering taxonomy or propagation.
  - AccessRequest requires current participant-attributed Need plus effective scoped access.request authority for every participating Resource scope at admissionAt.
  - DENIED creates no PolicyRule; ALLOWED converges one PolicyRule per exact AccessSubject including immutable InteractionRevision.
  - PolicyRule supports reversible ACTIVE/INACTIVE and absolute EffectiveWindow without new permission decision.
  - Additional Needs attach without duplicate Rule; zero current Needs yields reconciliation and no automatic revoke.
  - Materialization supports ALL or explicit Rule subset and requires scoped policy.export authority for every selected Resource scope at evaluationAt.
  - One read-only REPEATABLE READ snapshot and database transaction_timestamp() govern materialization.
  - Export is self-contained for request authority permission business and technical provenance; only selected effective Rules require technical realization.
  - Idempotency replays exact persisted response and has no first-MVP TTL.
  - migrate owns DDL and advisory serialization; serve verifies exact migration IDs/checksums and never auto-migrates.
  - OIDC HTTPS issuer/discovery/JWKS algorithm kid audience time subject permission and authority-claim semantics are proven.
  - Numeric latency throughput availability and scale targets are explicitly NOT_REQUIRED for first MVP.
  - Every required verification scenario has executable evidence before implementation is COMPLETE.

open_questions: []
implementation_authorization: DESIGN_COMPLETE_BACKEND
