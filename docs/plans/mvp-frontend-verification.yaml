version: 1
kind: verification-design
id: NAPMS-MVP-FRONTEND-VERIFICATION
status: CURRENT

purpose: Define evidence proving every accepted first-MVP frontend subject and shared human-interface constraint.

basis:
  requirements: docs/requirements/first-mvp-product-requirements.yaml
  subject_obligations: docs/harness/coverage/frontend-subject-obligations-v1.yaml
  human_interface: docs/contracts/ui/mvp-human-interface.yaml
  presentation_system: docs/contracts/ui/mvp-presentation-system.yaml
  screen_view_design: docs/contracts/ui/mvp-screen-view-design.yaml
  architecture: docs/architecture/mvp-frontend-architecture.yaml
  components: docs/architecture/mvp-frontend-component-design.yaml
  http: docs/contracts/http/napms.openapi.yaml

levels:
  contract: API mapping and accepted HTTP/error semantics
  feature: deterministic subject-specific controller/view-state behavior
  presentation: structural/geometry/visual conformance to accepted Presentation System and Screen/View contracts
  accessibility: keyboard and semantic status/error structure
  integration: browser frontend against canonical API boundary
  end_to_end: accepted first-MVP cross-subject journey

presentation_evidence:
  design_time:
    - DTCG token document parses with supported token types and resolvable aliases.
    - every material presentation invariant references a canonical token or structural rule.
    - every canonical workspace has explicit ordered Screen/View composition.
    - reference-backed decisions declare evidence role, constrained properties and semantic exclusions.
  implementation_time:
    environment:
      rule: Screenshot and geometry baselines run in a pinned browser/runtime/font environment with deterministic data.
    geometry:
      required:
        - shell/sidebar and workspace geometry for desktop reference viewport
        - material control/table dimensions declared by the Presentation System
        - full-width Resource detail workspace
    visual_regression:
      required:
        - Resource Catalogue accepted presentation state
        - Resource Detail accepted presentation state
        - AppShell shared presentation
      baseline_governance: >-
        A baseline is derived from accepted reference intent or explicitly reviewed output.
        Updating a baseline alone cannot redefine canonical presentation knowledge.
    responsive_matrix:
      viewports:
        - {id: desktop-reference, width: 1440, height: 1000}
        - {id: desktop-compact, width: 1280, height: 900}
        - {id: narrow, width: 390, height: 900}
      oracle: required information/actions and semantic reading/focus order remain available after reflow.
    interaction:
      required:
        - hover/focus/disabled/selection states where the accepted pattern exposes them
        - keyboard reachability and focus visibility
        - disclosure focus/state behavior
    reference_conformance:
      rule: >-
        Visual comparison proves adopted presentation properties only. Differences caused
        by deliberately excluded legacy semantics are accepted when traceable to the
        Screen/View reference_adaptation contract.

required_subject_evidence:
  - Resource management can locate/inspect/author current facts and inspect history.
  - Application management preserves reusable description independent from deployment.
  - Component management treats Components as communication participants, not network devices.
  - Interaction management supports distinct directed reasons and complete traffic semantics.
  - Deployment management binds Component to Resource independent from current address.
  - Business Process/Connectivity Need workflows preserve justification independently from permission.
  - Access Request submission exposes backend authority rejection and immutable permission outcome.
  - Policy Rule workflow preserves authoritative identity/history and Active/Inactive semantics.
  - Policy Export distinguishes complete success from unresolved/degraded output and preserves provenance.

shared_evidence:
  - every canonical workspace implements the Screen/View composition that inherits NAPMS-MVP-PRESENTATION-SYSTEM.
  - equivalent actions/states use the shared presentation patterns unless an accepted local deviation exists.
  - primary/secondary information and action hierarchy remains recognizable across workspaces.
  - loading/empty/not-found/rejected/conflict/technical states are not conflated.
  - responsive rendering preserves required information/actions.
  - accessibility obligations are exercised with keyboard and semantic-role/name/status assertions.
  - frontend never treats disabled/hidden UI as security authority.
  - transport DTO mapping remains confined to the API boundary.

traceability:
  rule: Every required subject is traced to the canonical subject-obligation contract and accepted requirement refs.

transition_revalidation:
  rule: Changes to accepted product scope, subject obligations, human-interface state model, Presentation System, Screen/View composition, API contract, security boundary, routing or component ownership re-run affected evidence.
