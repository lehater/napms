version: 4
kind: test-intent
id: NAPMS-FIRST-MVP-TEST-INTENT
status: CURRENT

purpose: Define minimum executable verification proving implementation realizes every accepted first-MVP requirement; tests do not create design truth.

design_refs:
  requirements: docs/requirements/first-mvp-product-requirements.yaml
  journey: docs/model/use-cases/first-mvp-policy-export.yaml
  resource_catalogue_domain: docs/model/contexts/resource-catalogue/domain-model.yaml
  authority_management_language: docs/model/contexts/authority-management/language.yaml
  application_communication_domain: docs/model/contexts/application-communication-catalogue/domain-model.yaml
  application_deployment_domain: docs/model/contexts/application-deployment/domain-model.yaml
  business_connectivity_domain: docs/model/contexts/business-connectivity/domain-model.yaml
  access_policy_domain: docs/model/contexts/access-policy/domain-model.yaml
  system_rules: docs/architecture/mvp-system-rules.yaml
  security_architecture: docs/architecture/mvp-security-architecture.yaml
  http_contract: docs/contracts/http/napms.openapi.yaml
  persistence: docs/architecture/persistence/mvp-persistence.yaml
  quality_requirements: docs/architecture/mvp-quality-requirements.yaml
  threat_model: docs/architecture/mvp-threat-model.yaml
  observability: docs/architecture/mvp-observability.yaml

levels:
  domain: owner invariants and state transitions
  integration: owner-contract locking transactions persistence and shared snapshot
  api_security: HTTP OIDC admission idempotency concurrency and failure mapping
  end_to_end: fresh database through complete vendor-neutral materialization

required_scenarios:
  - id: MVP-REQ-RESOURCE
    verifies: [REQ-RES-001, REQ-RES-002, REQ-RES-003, REQ-RES-004, REQ-RES-005, REQ-RES-006]
    expect: Resource identity and Endpoint identity survive realization changes; AuthorityScopeRef remains independent; no automatic endpoint grouping; Site/responsibility history remains explainable.
  - id: MVP-REQ-APPLICATION
    verifies: [REQ-APP-001, REQ-APP-002, REQ-INT-001, REQ-INT-002, REQ-INT-003]
    expect: Application is a reusable network communication profile; Cross-Application Interaction is rejected; multiple independent Interactions for the same intra-Application pair are accepted; revision traffic semantics are immutable and canonical.
  - id: MVP-REQ-DEPLOYMENT
    verifies: [REQ-DEP-001, REQ-DEP-002]
    expect: Deployment identity is independent from IP and materialization uses all current addressed Endpoints of each participating Resource.
  - id: MVP-REQ-BUSINESS
    verifies: [REQ-BUS-001, REQ-BUS-002, REQ-BUS-003, REQ-BUS-004, REQ-BUS-005, REQ-BUS-006, REQ-BUS-007, REQ-BUS-008, REQ-BUS-009]
    expect: Participant-side Needs remain independent business justification; additional Needs do not duplicate Rule; retirement preserves history; zero current Needs does not revoke; criticalityLabel is opaque metadata.
  - id: MVP-REQ-REQUEST-AUTHORITY
    verifies: [REQ-AUTH-001, REQ-PERM-001]
    expect: AccessRequest succeeds with effective access.request authority for the source Resource scope at server-owned admissionAt; destination request authority is not required; exact source authority evidence is stored and request admission remains distinct from later permission decision.
  - id: MVP-REQ-PERMISSION
    verifies: [REQ-PERM-002, REQ-PERM-003, REQ-RULE-001, REQ-RULE-002]
    expect: DENIED creates no Rule; ALLOWED creates or resolves exactly one Rule for exact Deployment pair plus immutable InteractionRevision and repeated allowed requests converge.
  - id: MVP-REQ-RULE-OPERATIONS
    verifies: [REQ-RULE-003, REQ-RULE-004, REQ-RULE-005]
    expect: ACTIVE to INACTIVE to ACTIVE and EffectiveWindow preserve Rule identity and permission evidence; technical realization changes do not redefine access.
  - id: MVP-REQ-EXPORT-AUTHORITY
    verifies: [REQ-AUTH-002, REQ-EXP-001]
    expect: ALL or explicit subset materialization fails before result exposure unless policy.export is effective for every selected Resource scope at evaluationAt.
  - id: MVP-REQ-MATERIALIZATION
    verifies: [REQ-EXP-002, REQ-EXP-003, REQ-EXP-004, REQ-EXP-005, REQ-EXP-006, REQ-EXP-007]
    expect: One REPEATABLE READ snapshot and one evaluationAt produce one complete enriched selected-policy result; effective Rules with complete current addresses emit READY rows, effective Rules with missing current addresses remain represented by INCOMPLETE rows with Resource identity/name and null address fields, non-effective Rules emit no effective rows, and traffic semantics/provenance are never merged away.
  - id: MVP-REQ-PROVENANCE
    verifies: [REQ-PROV-001]
    expect: Export contains ExportAuthorityEvidence and per-Rule request authority permission Need state and technical actor/time provenance sufficient for explanation without policy.read.
  - id: MVP-REQ-QUALITY
    verifies: [REQ-QUAL-001]
    method: INSPECTION
    expect: No implementation or acceptance gate invents mandatory numeric latency throughput availability or scale targets.
  - id: MVP-REQ-SCALE
    verifies: [REQ-SCALE-001, REQ-SCALE-002, REQ-SCALE-003, REQ-SCALE-004]
    method: INSPECTION
    expect: Architecture Driver Closure and system topology preserve the accepted first-MVP scale, single-organization boundary, no-growth assumption and no heavy asynchronous runtime requirement; listed reopen conditions remain explicit.
  - id: MVP-OIDC
    verifies: [REQ-AUTH-001, REQ-AUTH-002]
    expect: HTTPS-only issuer/discovery/JWKS asymmetric algorithm allow-list required kid exact issuer/audience/exp/nbf/sub and malformed permission/authority claims have accepted 401 versus 503 behavior.
  - id: MVP-IDEMPOTENCY
    verifies: [REQ-MVP-001]
    expect: Same key and fingerprint replays exact persisted response before current If-Match; different fingerprint conflicts; concurrent commit/rollback/unknown outcomes follow the accepted semantics.
  - id: MVP-FRESH-START
    verifies: [REQ-MVP-001]
    expect: Empty PostgreSQL through migrate then serve and public HTTP can complete the full backend journey without manual database fabrication.

coverage_rule: Every ACCEPTED REQ-* in canonical Product Requirements must appear in at least one scenario verifies list or have an explicit non-test verification method.

verification_coverage:
  requirement_traceability: Every ACCEPTED REQ-* is mapped by coverage_rule to executable evidence or an explicit inspection method.
  architecture: Verify owner/module dependency rules, no cross-owner persistence coupling, no internal HTTP and exact schema/startup boundaries.
  interface_machine: Verify documented success/error/authorization/idempotency/concurrency semantics of the v1 HTTP contract.
  interface_human: Verify the accepted Resource navigation/detail/history states and transitions where those contracts are included in the selected implementation scope.
  data: Verify migration/schema constraints, history/current uniqueness, transaction semantics and representative fresh-database behavior.
  security: Verify OIDC validation, scoped authority admission, fail-closed dependency semantics and relevant threat controls.
  quality: Verify explicit qualitative quality constraints and inspect that forbidden numeric targets are not invented.

transition_revalidation:
  rule: Changes to schema, public HTTP semantics, OIDC/security boundary, owner/module topology or materialization consistency re-run the affected verification classes before acceptance.
  scope: Revalidate the affected capability closure; unchanged upstream semantics need not be re-proven wholesale.
