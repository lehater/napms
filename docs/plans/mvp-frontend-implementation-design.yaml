version: 2
kind: implementation-plan
id: NAPMS-MVP-FRONTEND-IMPLEMENTATION-DESIGN
status: CURRENT

goal: Realize the accepted first-MVP browser frontend without inventing user-visible, security, architecture, component or test decisions.

basis:
  human_interface: docs/contracts/ui/mvp-human-interface.yaml
  presentation_system: docs/contracts/ui/mvp-presentation-system.yaml
  screen_view_design: docs/contracts/ui/mvp-screen-view-design.yaml
  architecture: docs/architecture/mvp-frontend-architecture.yaml
  components: docs/architecture/mvp-frontend-component-design.yaml
  verification: docs/plans/mvp-frontend-verification.yaml
  tests: docs/plans/mvp-frontend-test-design.yaml

implementation_boundary:
  includes:
    - local-dev authentication bootstrap into the canonical bearer boundary
    - application shell/routing and canonical API boundary
    - Organization Structure administration within the Resource-management subject
    - Resource management with current OrganizationalUnit ownership/history
    - Application/Component/Interaction management
    - ComponentDeployment management
    - Business Process/Connectivity Need management
    - Approval Policy current-revision inspection/publication
    - Access Request submission ApprovalBasis/progress side decisions cancellation and terminal outcomes
    - Policy Rule authorization-episode inspection/revocation/justification
    - Policy Export selection/result with row-level completeness diagnostics
    - shared accessibility/responsiveness/error-state obligations
  excludes:
    - new product/domain semantics
    - alternate frontend authorization
    - direct persistence
    - multilingual/localization support

sequence:
  - realize shared Presentation System tokens/pattern primitives and application shell without changing canonical design semantics
  - establish local-dev sign-in bootstrap, runtime bearer state and API boundary/error mapping
  - establish application shell composition behind the authenticated runtime gate
  - implement Organization Structure Resource and Application/Component/Interaction features
  - implement Deployment and Business Connectivity features
  - implement Approval Policy Access Request and Policy Rule features
  - implement Policy Export feature
  - satisfy shared accessibility/responsiveness evidence
  - run subject-specific feature/integration/end-to-end verification

delivery:
  release: Frontend ships with a compatible backend/OpenAPI baseline and green required verification.
  rollback: Frontend rollback requires API/schema/application compatibility.
  migration: No independent frontend persistence migration exists in this scope.

completion_definition:
  - every REQUIRED frontend subject in docs/harness/coverage/frontend-subject-obligations-v1.yaml has exact subject-scoped semantic proof;
  - all selected frontend capabilities are materialized by canonical design artifacts;
  - all eleven canonical workspaces have accepted Screen/View composition inheriting the shared Presentation System;
  - frontend verification/test contracts are executable and green when implementation is authorized;
  - no unresolved design Question blocks FRONTEND-IMPLEMENTATION;
  - Engineering Coverage for FRONTEND-IMPLEMENTATION is complete.
