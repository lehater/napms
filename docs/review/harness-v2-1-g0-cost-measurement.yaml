findings:
  - id: MEASURE-G0-01
    priority: P1
    finding: >-
      Semantic duplication is materially lower after the control-plane correction: G0 reused
      current anchor validation evidence and did not reload canonical product documents.
  - id: MEASURE-G0-02
    priority: P1
    finding: >-
      The dominant remaining cost is transport/runtime orchestration: repeated contract loading,
      manual validation-plan selection and non-atomic Contents API mutation plumbing.
  - id: MEASURE-G0-03
    priority: P1
    finding: >-
      A content-addressed immutable engine bundle can remove steady-state per-transaction reads of
      unchanged H1-H10 contracts while retaining exact version/fingerprint binding.
  - id: MEASURE-G0-04
    priority: P1
    finding: >-
      A compiled validation plan can reuse current receipts and select only target-specific checks;
      uncertainty about receipt freshness or applicability must fail closed and force validation.
  - id: MEASURE-G0-05
    priority: P1
    finding: >-
      Repository persistence needs one compare-and-swap atomic writer for evidence plus state
      effects; Git commit creation must be an implementation detail, not a sequence of semantic steps.

