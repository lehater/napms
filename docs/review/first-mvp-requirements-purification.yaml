classification_rule:
  KEEP: Observable product meaning remains valid without importing downstream design.
  GENERALIZE: Preserve the observable requirement but remove tactical/domain/architecture realization from the statement.
  RETIRE: Previous normative meaning is materially superseded and its REQ id is not reused for the replacement.
  ADD: Explicitly accepted product behavior was missing from the canonical requirements artifact.

