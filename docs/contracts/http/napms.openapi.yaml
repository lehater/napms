openapi: 3.1.0
info:
  title: NAPMS First MVP Backend API
  version: 2.0.0
security:
  - OIDCBearer: []

paths:
  /v1/organization:
    get:
      operationId: getOrganization
      responses:
        '200': {description: Current Organization, content: {application/json: {schema: {$ref: '#/components/schemas/OrganizationView'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/organizational-units:
    get:
      operationId: listOrganizationalUnits
      responses:
        '200': {description: Organizational Unit collection, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/OrganizationalUnitView'}}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createOrganizationalUnit
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateOrganizationalUnitRequest'}}}}
      responses: {'201': {description: Created}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '413': {$ref: '#/components/responses/PayloadTooLarge'}, '422': {$ref: '#/components/responses/Rejected'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/organizational-units/{organizationalUnitRef}:
    get:
      operationId: getOrganizationalUnit
      parameters: [{$ref: '#/components/parameters/OrganizationalUnitRef'}]
      responses: {'200': {description: Organizational Unit, content: {application/json: {schema: {$ref: '#/components/schemas/OrganizationalUnitView'}}}}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/organizational-units/{organizationalUnitRef}/parent:
    put:
      operationId: reparentOrganizationalUnit
      parameters: [{$ref: '#/components/parameters/OrganizationalUnitRef'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReparentOrganizationalUnitRequest'}}}}
      responses: {'200': {description: Reparented}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '413': {$ref: '#/components/responses/PayloadTooLarge'}, '422': {$ref: '#/components/responses/Rejected'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/organizational-units/{organizationalUnitRef}/retirement:
    post:
      operationId: retireOrganizationalUnit
      parameters: [{$ref: '#/components/parameters/OrganizationalUnitRef'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {description: Retired}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/Rejected'}, '503': {$ref: '#/components/responses/Unavailable'}}

  /v1/resources:
    get:
      operationId: listResources
      parameters:
        - {$ref: '#/components/parameters/CatalogueSearch'}
        - {$ref: '#/components/parameters/ResourceOrganizationalUnitFilter'}
        - {$ref: '#/components/parameters/ResourceSiteFilter'}
        - {$ref: '#/components/parameters/ResourceSortBy'}
        - {$ref: '#/components/parameters/CatalogueSortDirection'}
        - {$ref: '#/components/parameters/CataloguePage'}
        - {$ref: '#/components/parameters/CataloguePageSize'}
      responses:
        '200':
          description: Resource catalogue page
          content: {application/json: {schema: {$ref: '#/components/schemas/ResourceCataloguePage'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createResource
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateResourceRequest'}}}}
      responses: {'201': {description: Created}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '413': {$ref: '#/components/responses/PayloadTooLarge'}, '422': {$ref: '#/components/responses/Rejected'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/resources/{resourceRef}:
    get:
      operationId: getResource
      parameters: [{$ref: '#/components/parameters/ResourceRef'}]
      responses: {'200': {description: Resource, content: {application/json: {schema: {$ref: '#/components/schemas/ResourceView'}}}}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/resources/{resourceRef}/organizational-owner:
    put:
      operationId: moveResourceOrganizationalOwner
      parameters: [{$ref: '#/components/parameters/ResourceRef'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MoveResourceOrganizationalOwnerRequest'}}}}
      responses: {'200': {description: Organizational owner moved}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '413': {$ref: '#/components/responses/PayloadTooLarge'}, '422': {$ref: '#/components/responses/Rejected'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/resources/{resourceRef}/endpoints:
    post:
      operationId: addResourceEndpoint
      parameters: [{$ref: '#/components/parameters/ResourceRef'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false}}}}
      responses: {'201': {description: Endpoint created}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '413': {$ref: '#/components/responses/PayloadTooLarge'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/resources/{resourceRef}/endpoints/{endpointRef}/address:
    put:
      operationId: setEndpointAddress
      parameters: [{$ref: '#/components/parameters/ResourceRef'}, {$ref: '#/components/parameters/EndpointRef'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AddressRealization'}}}}
      responses: {'200': {description: Updated}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '413': {$ref: '#/components/responses/PayloadTooLarge'}, '422': {$ref: '#/components/responses/Rejected'}, '503': {$ref: '#/components/responses/Unavailable'}}
    delete:
      operationId: clearEndpointAddress
      parameters: [{$ref: '#/components/parameters/ResourceRef'}, {$ref: '#/components/parameters/EndpointRef'}, {$ref: '#/components/parameters/IfMatch'}]
      responses: {'204': {description: Cleared}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '404': {$ref: '#/components/responses/NotFound'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/resources/{resourceRef}/site:
    put:
      operationId: setResourceSite
      parameters: [{$ref: '#/components/parameters/ResourceRef'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SetResourceSiteRequest'}}}}
      responses: {'200': {description: Updated}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '413': {$ref: '#/components/responses/PayloadTooLarge'}, '422': {$ref: '#/components/responses/Rejected'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/resources/{resourceRef}/responsibilities/{role}:
    put:
      operationId: setResourceResponsibility
      parameters: [{$ref: '#/components/parameters/ResourceRef'}, {$ref: '#/components/parameters/ResponsibilityRole'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SetResourceResponsibilityRequest'}}}}
      responses: {'200': {description: Updated}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '413': {$ref: '#/components/responses/PayloadTooLarge'}, '422': {$ref: '#/components/responses/Rejected'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/applications:
    get:
      operationId: listApplications
      parameters:
        - {$ref: '#/components/parameters/CatalogueSearch'}
        - {$ref: '#/components/parameters/ApplicationComponentFilter'}
        - {$ref: '#/components/parameters/ApplicationSortBy'}
        - {$ref: '#/components/parameters/CatalogueSortDirection'}
        - {$ref: '#/components/parameters/CataloguePage'}
        - {$ref: '#/components/parameters/CataloguePageSize'}
      responses:
        '200':
          description: Application catalogue page
          content: {application/json: {schema: {$ref: '#/components/schemas/ApplicationCataloguePage'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createApplication
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateNamedRequest'}}}}
      responses: {'201': {description: Created}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '413': {$ref: '#/components/responses/PayloadTooLarge'}, '422': {$ref: '#/components/responses/Rejected'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/applications/{applicationRef}:
    get:
      operationId: getApplication
      parameters: [{$ref: '#/components/parameters/ApplicationRef'}]
      responses: {'200': {description: Application detail}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/applications/{applicationRef}/components:
    post:
      operationId: addComponent
      parameters: [{$ref: '#/components/parameters/ApplicationRef'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateNamedRequest'}}}}
      responses: {'201': {description: Created}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '413': {$ref: '#/components/responses/PayloadTooLarge'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/interactions:
    post:
      operationId: createInteraction
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateInteractionRequest'}}}}
      responses: {'201': {description: Created}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '413': {$ref: '#/components/responses/PayloadTooLarge'}, '422': {$ref: '#/components/responses/Rejected'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/interactions/{interactionRef}:
    get:
      operationId: getInteraction
      parameters: [{$ref: '#/components/parameters/InteractionRef'}]
      responses: {'200': {description: Interaction detail}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/interactions/{interactionRef}/revisions:
    post:
      operationId: publishInteractionRevision
      parameters: [{$ref: '#/components/parameters/InteractionRef'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PublishRevisionRequest'}}}}
      responses: {'201': {description: Published}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '413': {$ref: '#/components/responses/PayloadTooLarge'}, '422': {$ref: '#/components/responses/Rejected'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/deployments:
    get:
      operationId: listDeployments
      parameters:
        - {$ref: '#/components/parameters/CatalogueSearch'}
        - {$ref: '#/components/parameters/DeploymentComponentFilter'}
        - {$ref: '#/components/parameters/DeploymentResourceFilter'}
        - {$ref: '#/components/parameters/DeploymentSortBy'}
        - {$ref: '#/components/parameters/CatalogueSortDirection'}
        - {$ref: '#/components/parameters/CataloguePage'}
        - {$ref: '#/components/parameters/CataloguePageSize'}
      responses:
        '200': {description: Deployment catalogue, content: {application/json: {schema: {$ref: '#/components/schemas/DeploymentCataloguePage'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createDeployment
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateDeploymentRequest'}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/DeploymentView'}}}}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '413': {$ref: '#/components/responses/PayloadTooLarge'}, '422': {$ref: '#/components/responses/Rejected'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/deployments/{deploymentRef}:
    get:
      operationId: getDeployment
      parameters: [{$ref: '#/components/parameters/DeploymentRef'}]
      responses:
        '200': {description: Deployment detail, content: {application/json: {schema: {$ref: '#/components/schemas/DeploymentView'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/processes:
    get:
      operationId: listBusinessProcesses
      parameters:
        - {$ref: '#/components/parameters/CatalogueSearch'}
        - {$ref: '#/components/parameters/ProcessCriticalityFilter'}
        - {$ref: '#/components/parameters/ProcessOrganizationFilter'}
        - {$ref: '#/components/parameters/ProcessSortBy'}
        - {$ref: '#/components/parameters/CatalogueSortDirection'}
        - {$ref: '#/components/parameters/CataloguePage'}
        - {$ref: '#/components/parameters/CataloguePageSize'}
      responses:
        '200': {description: Business Process catalogue, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessProcessCataloguePage'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createBusinessProcess
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateProcessRequest'}}}}
      responses: {'201': {description: Created}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '413': {$ref: '#/components/responses/PayloadTooLarge'}, '422': {$ref: '#/components/responses/Rejected'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/processes/{processRef}:
    get:
      operationId: getBusinessProcess
      parameters: [{$ref: '#/components/parameters/ProcessRef'}]
      responses: {'200': {description: Business Process detail, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessProcessView'}}}}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/processes/{processRef}/responsible-organization:
    put:
      operationId: setProcessResponsibleOrganization
      parameters: [{$ref: '#/components/parameters/ProcessRef'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {externalReference: {type: [string, 'null']}, displayName: {type: [string, 'null']}}}}}}
      responses: {'200': {description: Updated}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '413': {$ref: '#/components/responses/PayloadTooLarge'}, '422': {$ref: '#/components/responses/Rejected'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/processes/{processRef}/criticality:
    put:
      operationId: setProcessCriticality
      parameters: [{$ref: '#/components/parameters/ProcessRef'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SetCriticalityRequest'}}}}
      responses: {'200': {description: Updated}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '413': {$ref: '#/components/responses/PayloadTooLarge'}, '422': {$ref: '#/components/responses/Rejected'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/processes/{processRef}/needs:
    post:
      operationId: declareConnectivityNeed
      parameters: [{$ref: '#/components/parameters/ProcessRef'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateNeedRequest'}}}}
      responses: {'201': {description: Created}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '413': {$ref: '#/components/responses/PayloadTooLarge'}, '422': {$ref: '#/components/responses/Rejected'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/processes/{processRef}/needs/{needRef}/retirement:
    post:
      operationId: retireConnectivityNeed
      parameters: [{$ref: '#/components/parameters/ProcessRef'}, {$ref: '#/components/parameters/NeedRef'}, {$ref: '#/components/parameters/IfMatch'}]
      responses: {'200': {description: Retired}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/Rejected'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/approval-policies/{organizationRef}:
    get:
      operationId: getApprovalPolicy
      parameters: [{$ref: '#/components/parameters/OrganizationRef'}]
      responses: {'200': {description: Approval Policy, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalPolicyView'}}}}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/approval-policies/{organizationRef}/revisions:
    post:
      operationId: publishApprovalPolicyRevision
      parameters: [{$ref: '#/components/parameters/OrganizationRef'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PublishApprovalPolicyRevisionRequest'}}}}
      responses: {'201': {description: Revision published}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '413': {$ref: '#/components/responses/PayloadTooLarge'}, '422': {$ref: '#/components/responses/Rejected'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/access-requests:
    get:
      operationId: listAccessRequests
      parameters:
        - {$ref: '#/components/parameters/CatalogueSearch'}
        - {$ref: '#/components/parameters/AccessRequestSourceDeploymentFilter'}
        - {$ref: '#/components/parameters/AccessRequestDestinationDeploymentFilter'}
        - {$ref: '#/components/parameters/AccessRequestStatusFilter'}
        - {$ref: '#/components/parameters/AccessRequestSortBy'}
        - {$ref: '#/components/parameters/CatalogueSortDirection'}
        - {$ref: '#/components/parameters/CataloguePage'}
        - {$ref: '#/components/parameters/CataloguePageSize'}
      responses:
        '200': {description: Access Request catalogue, content: {application/json: {schema: {$ref: '#/components/schemas/AccessRequestCataloguePage'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: submitAccessRequest
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SubmitAccessRequestRequest'}}}}
      responses: {'201': {description: Submitted}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '413': {$ref: '#/components/responses/PayloadTooLarge'}, '422': {$ref: '#/components/responses/Rejected'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/access-requests/{requestRef}:
    get:
      operationId: getAccessRequest
      parameters: [{$ref: '#/components/parameters/RequestRef'}]
      responses: {'200': {description: Access Request, content: {application/json: {schema: {$ref: '#/components/schemas/AccessRequestView'}}}}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/access-requests/{requestRef}/approval-decisions:
    post:
      operationId: recordAccessRequestApprovalDecision
      parameters: [{$ref: '#/components/parameters/RequestRef'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecordApprovalDecisionRequest'}}}}
      responses: {'200': {description: Approval decision recorded and request state reevaluated}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '413': {$ref: '#/components/responses/PayloadTooLarge'}, '422': {$ref: '#/components/responses/Rejected'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/access-requests/{requestRef}/cancellation:
    post:
      operationId: cancelAccessRequest
      parameters: [{$ref: '#/components/parameters/RequestRef'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {description: Request cancelled}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/Rejected'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/policy-rules:
  /v1/policy-rules:
    get:
      operationId: listPolicyRules
      parameters:
        - {$ref: '#/components/parameters/CatalogueSearch'}
        - {$ref: '#/components/parameters/PolicyRuleSourceDeploymentFilter'}
        - {$ref: '#/components/parameters/PolicyRuleDestinationDeploymentFilter'}
        - {$ref: '#/components/parameters/PolicyRuleRevocationStateFilter'}
        - {$ref: '#/components/parameters/PolicyRuleSortBy'}
        - {$ref: '#/components/parameters/CatalogueSortDirection'}
        - {$ref: '#/components/parameters/CataloguePage'}
        - {$ref: '#/components/parameters/CataloguePageSize'}
      responses:
        '200': {description: Policy Rule catalogue, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyRuleCataloguePage'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/policy-rules/{policyRuleRef}/revocation:
    post:
      operationId: revokePolicyRule
      parameters: [{$ref: '#/components/parameters/PolicyRuleRef'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/RevokePolicyRuleRequest'}}}}
      responses: {'200': {description: Authorization episode revoked}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '413': {$ref: '#/components/responses/PayloadTooLarge'}, '422': {$ref: '#/components/responses/Rejected'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/policy-rules/{policyRuleRef}/justifications:
  /v1/policy-rules/{policyRuleRef}/justifications:
    post:
      operationId: attachPolicyRuleJustification
      parameters: [{$ref: '#/components/parameters/PolicyRuleRef'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AttachJustificationRequest'}}}}
      responses: {'200': {description: Attached}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '413': {$ref: '#/components/responses/PayloadTooLarge'}, '422': {$ref: '#/components/responses/Rejected'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/policy-rules/{policyRuleRef}:
    get:
      operationId: getPolicyRule
      parameters: [{$ref: '#/components/parameters/PolicyRuleRef'}]
      responses: {'200': {description: PolicyRule, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyRuleView'}}}}, '401': {$ref: '#/components/responses/Unauthenticated'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '503': {$ref: '#/components/responses/Unavailable'}}
  /v1/policy-materializations:
    post:
      operationId: materializeCurrentPolicy
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyMaterializationRequest'}}}}
      responses:
        '200':
          description: Complete enriched selected-policy representation; individual rows may be technically INCOMPLETE when current address realization is missing
          content: {application/json: {schema: {$ref: '#/components/schemas/PolicyMaterializationResult'}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/Rejected'}
        '503': {$ref: '#/components/responses/Unavailable'}

components:
  securitySchemes:
    OIDCBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CatalogueSearch: {name: search, in: query, required: false, schema: {type: string, maxLength: 200}}
    CatalogueSortDirection: {name: sortDirection, in: query, required: false, schema: {type: string, enum: [asc, desc], default: asc}}
    CataloguePage: {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
    CataloguePageSize: {name: pageSize, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
    ResourceOrganizationalUnitFilter: {name: organizationalUnitRef, in: query, required: false, schema: {$ref: '#/components/schemas/StableId'}}
    ResourceSiteFilter: {name: siteRef, in: query, required: false, schema: {$ref: '#/components/schemas/StableId'}}
    ResourceSortBy: {name: sortBy, in: query, required: false, schema: {type: string, enum: [displayName, resourceRef, organizationalUnitRef], default: displayName}}
    ApplicationComponentFilter: {name: componentRef, in: query, required: false, schema: {$ref: '#/components/schemas/StableId'}}
    ApplicationSortBy: {name: sortBy, in: query, required: false, schema: {type: string, enum: [name, applicationRef], default: name}}
    DeploymentComponentFilter: {name: componentRef, in: query, required: false, schema: {$ref: '#/components/schemas/StableId'}}
    DeploymentResourceFilter: {name: resourceRef, in: query, required: false, schema: {$ref: '#/components/schemas/StableId'}}
    DeploymentSortBy: {name: sortBy, in: query, required: false, schema: {type: string, enum: [deploymentRef, componentRef, resourceRef], default: deploymentRef}}
    ProcessCriticalityFilter: {name: criticalityLabel, in: query, required: false, schema: {type: string, minLength: 1}}
    ProcessOrganizationFilter: {name: organizationExternalReference, in: query, required: false, schema: {type: string, minLength: 1}}
    ProcessSortBy: {name: sortBy, in: query, required: false, schema: {type: string, enum: [name, processRef, criticalityLabel], default: name}}
    AccessRequestSourceDeploymentFilter: {name: sourceDeploymentRef, in: query, required: false, schema: {$ref: '#/components/schemas/StableId'}}
    AccessRequestDestinationDeploymentFilter: {name: destinationDeploymentRef, in: query, required: false, schema: {$ref: '#/components/schemas/StableId'}}
    AccessRequestStatusFilter: {name: status, in: query, required: false, schema: {type: string, enum: [PENDING, ALLOWED, DENIED, CANCELLED, EXPIRED, INVALIDATED]}}
    AccessRequestSortBy: {name: sortBy, in: query, required: false, schema: {type: string, enum: [submittedAt, requestRef, status], default: submittedAt}}
    PolicyRuleSourceDeploymentFilter: {name: sourceDeploymentRef, in: query, required: false, schema: {$ref: '#/components/schemas/StableId'}}
    PolicyRuleDestinationDeploymentFilter: {name: destinationDeploymentRef, in: query, required: false, schema: {$ref: '#/components/schemas/StableId'}}
    PolicyRuleRevocationStateFilter: {name: revocationState, in: query, required: false, schema: {type: string, enum: [CURRENT, REVOKED]}}
    PolicyRuleSortBy: {name: sortBy, in: query, required: false, schema: {type: string, enum: [policyRuleRef, createdAt, revokedAt], default: policyRuleRef}}
    ResourceRef: {name: resourceRef, in: path, required: true, schema: {$ref: '#/components/schemas/StableId'}}
    EndpointRef: {name: endpointRef, in: path, required: true, schema: {$ref: '#/components/schemas/StableId'}}
    ResponsibilityRole: {name: role, in: path, required: true, schema: {type: string, enum: [OWNER, ADMINISTRATOR]}}
    ApplicationRef: {name: applicationRef, in: path, required: true, schema: {$ref: '#/components/schemas/StableId'}}
    InteractionRef: {name: interactionRef, in: path, required: true, schema: {$ref: '#/components/schemas/StableId'}}
    DeploymentRef: {name: deploymentRef, in: path, required: true, schema: {$ref: '#/components/schemas/StableId'}}
    ProcessRef: {name: processRef, in: path, required: true, schema: {$ref: '#/components/schemas/StableId'}}
    NeedRef: {name: needRef, in: path, required: true, schema: {$ref: '#/components/schemas/StableId'}}
    OrganizationRef: {name: organizationRef, in: path, required: true, schema: {$ref: '#/components/schemas/StableId'}}
    OrganizationalUnitRef: {name: organizationalUnitRef, in: path, required: true, schema: {$ref: '#/components/schemas/StableId'}}
    RequestRef: {name: requestRef, in: path, required: true, schema: {$ref: '#/components/schemas/StableId'}}
    PolicyRuleRef: {name: policyRuleRef, in: path, required: true, schema: {$ref: '#/components/schemas/StableId'}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1}}

  responses:
    Unauthenticated: {description: Missing or invalid authentication}
    Forbidden: {description: Required permission or scoped authority not effective}
    Conflict: {description: Stale version or idempotency conflict}
    Rejected: {description: Semantic validation or reference rejection}
    NotFound: {description: Not found}
    Unavailable: {description: Dependency unavailable or outcome cannot be established}
    PayloadTooLarge: {description: Request payload exceeds the accepted transport limit}

  schemas:
    StableId: {type: string, format: uuid}
    Timestamp: {type: string, format: date-time}

    HostAddress:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties: {kind: {const: HOST}, value: {type: string, minLength: 1}}
    Prefix:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties: {kind: {const: PREFIX}, value: {type: string, minLength: 1}}
    AddressRealization:
      oneOf:
        - {$ref: '#/components/schemas/HostAddress'}
        - {$ref: '#/components/schemas/Prefix'}

    OrganizationView:
      type: object
      required: [organizationRef, displayName, lifecycleState, version]
      properties:
        organizationRef: {$ref: '#/components/schemas/StableId'}
        displayName: {type: string}
        lifecycleState: {type: string, enum: [ACTIVE, RETIRED]}
        version: {type: integer, minimum: 0}

    OrganizationalUnitView:
      type: object
      required: [organizationalUnitRef, organizationRef, displayName, lifecycleState, version]
      properties:
        organizationalUnitRef: {$ref: '#/components/schemas/StableId'}
        organizationRef: {$ref: '#/components/schemas/StableId'}
        parentUnitRef:
          oneOf:
            - {$ref: '#/components/schemas/StableId'}
            - {type: 'null'}
        displayName: {type: string}
        lifecycleState: {type: string, enum: [ACTIVE, RETIRED]}
        version: {type: integer, minimum: 0}

    CreateOrganizationalUnitRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: {type: string, minLength: 1}
        parentUnitRef:
          oneOf:
            - {$ref: '#/components/schemas/StableId'}
            - {type: 'null'}

    ReparentOrganizationalUnitRequest:
      type: object
      additionalProperties: false
      required: [parentUnitRef]
      properties:
        parentUnitRef:
          oneOf:
            - {$ref: '#/components/schemas/StableId'}
            - {type: 'null'}

    CreateResourceRequest:
      type: object
      additionalProperties: false
      required: [displayName, organizationalUnitRef]
      properties:
        displayName: {type: string, minLength: 1}
        organizationalUnitRef: {$ref: '#/components/schemas/StableId'}
        siteRef: {$ref: '#/components/schemas/StableId'}

    MoveResourceOrganizationalOwnerRequest:
      type: object
      additionalProperties: false
      required: [organizationalUnitRef]
      properties:
        organizationalUnitRef: {$ref: '#/components/schemas/StableId'}
    ResourceCataloguePage:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ResourceView'}}
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 100}

    ResourceView:
      type: object
      required: [resourceRef, displayName, organizationalUnitRef, version, current, history]
      properties:
        resourceRef: {$ref: '#/components/schemas/StableId'}
        displayName: {type: string}
        organizationalUnitRef: {$ref: '#/components/schemas/StableId'}
        version: {type: integer, minimum: 0}
        current: {$ref: '#/components/schemas/ResourceCurrentFacts'}
        history: {$ref: '#/components/schemas/ResourceHistory'}

    ResourceCurrentFacts:
      type: object
      required: [endpoints, responsibilities]
      properties:
        endpoints: {type: array, items: {$ref: '#/components/schemas/ResourceEndpointView'}}
        siteRef:
          oneOf:
            - {$ref: '#/components/schemas/StableId'}
            - {type: 'null'}
        responsibilities:
          type: array
          items: {$ref: '#/components/schemas/CurrentResourceResponsibility'}

    ResourceEndpointView:
      type: object
      required: [endpointRef]
      properties:
        endpointRef: {$ref: '#/components/schemas/StableId'}
        address:
          oneOf:
            - {$ref: '#/components/schemas/AddressRealization'}
            - {type: 'null'}

    CurrentResourceResponsibility:
      type: object
      required: [role, organizationRef]
      properties:
        role: {type: string, enum: [OWNER, ADMINISTRATOR]}
        organizationRef: {$ref: '#/components/schemas/StableId'}

    ResourceHistory:
      type: object
      required: [organizationalOwnership, endpointAddresses, sites, responsibilities]
      properties:
        organizationalOwnership: {type: array, items: {$ref: '#/components/schemas/ResourceHistoryFact'}}
        endpointAddresses: {type: array, items: {$ref: '#/components/schemas/ResourceHistoryFact'}}
        sites: {type: array, items: {$ref: '#/components/schemas/ResourceHistoryFact'}}
        responsibilities: {type: array, items: {$ref: '#/components/schemas/ResourceHistoryFact'}}

    ResourceHistoryFact:
      type: object
      required: [factRef, effectiveFrom, changedBySubject]
      properties:
        factRef: {$ref: '#/components/schemas/StableId'}
        subjectRef: {$ref: '#/components/schemas/StableId'}
        role: {type: string, enum: [OWNER, ADMINISTRATOR]}
        value: {}
        effectiveFrom: {$ref: '#/components/schemas/Timestamp'}
        effectiveUntil:
          oneOf:
            - {$ref: '#/components/schemas/Timestamp'}
            - {type: 'null'}
        changedBySubject: {type: string}

    SetResourceSiteRequest:
      type: object
      additionalProperties: false
      required: [siteRef]
      properties:
        siteRef:
          oneOf:
            - {$ref: '#/components/schemas/StableId'}
            - {type: 'null'}

    SetResourceResponsibilityRequest:
      type: object
      additionalProperties: false
      required: [organizationRef]
      properties:
        organizationRef:
          oneOf:
            - {$ref: '#/components/schemas/StableId'}
            - {type: 'null'}

    ApplicationCataloguePage:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ApplicationCatalogueItem'}}
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 100}

    ApplicationCatalogueItem:
      type: object
      additionalProperties: false
      required: [applicationRef, name, version, components]
      properties:
        applicationRef: {$ref: '#/components/schemas/StableId'}
        name: {type: string, minLength: 1}
        version: {type: integer, minimum: 1}
        components:
          type: array
          items: {$ref: '#/components/schemas/ApplicationComponentSummary'}

    ApplicationComponentSummary:
      type: object
      additionalProperties: false
      required: [componentRef, name]
      properties:
        componentRef: {$ref: '#/components/schemas/StableId'}
        name: {type: string, minLength: 1}

    CreateNamedRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties: {name: {type: string, minLength: 1}}

    CreateInteractionRequest:
      type: object
      additionalProperties: false
      required: [sourceComponentRef, destinationComponentRef]
      properties:
        sourceComponentRef: {$ref: '#/components/schemas/StableId'}
        destinationComponentRef: {$ref: '#/components/schemas/StableId'}
        purpose: {type: string}

    PortRange:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from: {type: integer, minimum: 0, maximum: 65535}
        to: {type: integer, minimum: 0, maximum: 65535}
    TrafficClause:
      type: object
      additionalProperties: false
      required: [ipProtocol]
      properties:
        ipProtocol: {type: integer, minimum: 0, maximum: 255}
        sourcePorts: {type: array, items: {$ref: '#/components/schemas/PortRange'}}
        destinationPorts: {type: array, items: {$ref: '#/components/schemas/PortRange'}}
    PublishRevisionRequest:
      type: object
      additionalProperties: false
      required: [trafficClauses]
      properties:
        trafficClauses: {type: array, minItems: 1, items: {$ref: '#/components/schemas/TrafficClause'}}

    DeploymentCataloguePage:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/DeploymentView'}}
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 100}

    DeploymentView:
      type: object
      additionalProperties: false
      required: [deploymentRef, componentRef, resourceRef]
      properties:
        deploymentRef: {$ref: '#/components/schemas/StableId'}
        componentRef: {$ref: '#/components/schemas/StableId'}
        resourceRef: {$ref: '#/components/schemas/StableId'}

    CreateDeploymentRequest:
      type: object
      additionalProperties: false
      required: [componentRef, resourceRef]
      properties:
        componentRef: {$ref: '#/components/schemas/StableId'}
        resourceRef: {$ref: '#/components/schemas/StableId'}

    BusinessProcessCataloguePage:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/BusinessProcessView'}}
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 100}

    BusinessProcessView:
      type: object
      additionalProperties: false
      required: [processRef, name, description, organizationExternalReference, organizationDisplayName, criticalityLabel, version, needs]
      properties:
        processRef: {$ref: '#/components/schemas/StableId'}
        name: {type: string, minLength: 1}
        description:
          oneOf:
            - {type: string}
            - {type: 'null'}
        organizationExternalReference:
          oneOf:
            - {type: string}
            - {type: 'null'}
        organizationDisplayName:
          oneOf:
            - {type: string}
            - {type: 'null'}
        criticalityLabel:
          oneOf:
            - {type: string}
            - {type: 'null'}
        version: {type: integer, minimum: 1}
        needs:
          type: array
          items: {$ref: '#/components/schemas/ConnectivityNeedView'}

    ConnectivityNeedView:
      type: object
      additionalProperties: false
      required: [needRef, interactionRef, participantComponentRef, businessBasis, status]
      properties:
        needRef: {$ref: '#/components/schemas/StableId'}
        interactionRef: {$ref: '#/components/schemas/StableId'}
        participantComponentRef: {$ref: '#/components/schemas/StableId'}
        businessBasis: {type: string, minLength: 1}
        status: {type: string, enum: [ACTIVE, RETIRED]}

    CreateProcessRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        description: {type: string}
        criticalityLabel: {type: string, minLength: 1}
    SetCriticalityRequest:
      type: object
      additionalProperties: false
      required: [criticalityLabel]
      properties:
        criticalityLabel:
          oneOf:
            - {type: string, minLength: 1}
            - {type: 'null'}

    CreateNeedRequest:
      type: object
      additionalProperties: false
      required: [interactionRef, participantComponentRef, businessBasis]
      properties:
        interactionRef: {$ref: '#/components/schemas/StableId'}
        participantComponentRef: {$ref: '#/components/schemas/StableId'}
        businessBasis: {type: string, minLength: 1}

    ApprovalPolicyRevisionView:
      type: object
      required: [revisionRef, revisionNo, selfApprovalAllowed, publishedAt]
      properties:
        revisionRef: {$ref: '#/components/schemas/StableId'}
        revisionNo: {type: integer, minimum: 1}
        selfApprovalAllowed: {type: boolean}
        requestTtlSeconds:
          oneOf:
            - {type: integer, minimum: 1}
            - {type: 'null'}
        publishedAt: {$ref: '#/components/schemas/Timestamp'}

    ApprovalPolicyView:
      type: object
      required: [policyRef, organizationRef, currentRevision]
      properties:
        policyRef: {$ref: '#/components/schemas/StableId'}
        organizationRef: {$ref: '#/components/schemas/StableId'}
        currentRevision: {$ref: '#/components/schemas/ApprovalPolicyRevisionView'}

    PublishApprovalPolicyRevisionRequest:
      type: object
      additionalProperties: false
      required: [selfApprovalAllowed]
      properties:
        selfApprovalAllowed: {type: boolean}
        requestTtlSeconds:
          oneOf:
            - {type: integer, minimum: 1}
            - {type: 'null'}

    SubmitAccessRequestRequest:
      type: object
      additionalProperties: false
      required: [sourceDeploymentRef, destinationDeploymentRef, interactionRevisionRef, needRef]
      properties:
        sourceDeploymentRef: {$ref: '#/components/schemas/StableId'}
        destinationDeploymentRef: {$ref: '#/components/schemas/StableId'}
        interactionRevisionRef: {$ref: '#/components/schemas/StableId'}
        needRef: {$ref: '#/components/schemas/StableId'}

    AccessRequestCataloguePage:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AccessRequestView'}}
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 100}

    ApprovalBasisSide:
      type: object
      required: [basisSideRef, approvalPolicyRevisionRef, scopeKind, scopeRef, coversSource, coversDestination]
      properties:
        basisSideRef: {$ref: '#/components/schemas/StableId'}
        approvalPolicyRevisionRef: {$ref: '#/components/schemas/StableId'}
        scopeKind: {type: string, enum: [ORGANIZATION, ORGANIZATIONAL_UNIT]}
        scopeRef: {$ref: '#/components/schemas/StableId'}
        coversSource: {type: boolean}
        coversDestination: {type: boolean}

    ApprovalObligationView:
      type: object
      required: [obligationRef, basisSideRef, status]
      properties:
        obligationRef: {$ref: '#/components/schemas/StableId'}
        basisSideRef: {$ref: '#/components/schemas/StableId'}
        status: {type: string, enum: [PENDING, APPROVED, DENIED]}

    ApprovalDecisionView:
      type: object
      required: [decisionRef, obligationRef, result, decidedByActorRef, decidedAt, authorityEvidence]
      properties:
        decisionRef: {$ref: '#/components/schemas/StableId'}
        obligationRef: {$ref: '#/components/schemas/StableId'}
        result: {type: string, enum: [APPROVED, DENIED]}
        decidedByActorRef: {type: string}
        decidedAt: {$ref: '#/components/schemas/Timestamp'}
        authorityEvidence: {$ref: '#/components/schemas/AuthorityEvidence'}

    AccessRequestView:
      type: object
      required: [requestRef, version, sourceDeploymentRef, destinationDeploymentRef, interactionRevisionRef, needRef, submittedAt, status, approvalBasis, approvalObligations, approvalDecisions]
      properties:
        requestRef: {$ref: '#/components/schemas/StableId'}
        version: {type: integer, minimum: 0}
        sourceDeploymentRef: {$ref: '#/components/schemas/StableId'}
        destinationDeploymentRef: {$ref: '#/components/schemas/StableId'}
        interactionRevisionRef: {$ref: '#/components/schemas/StableId'}
        needRef: {$ref: '#/components/schemas/StableId'}
        submittedAt: {$ref: '#/components/schemas/Timestamp'}
        expiresAt:
          oneOf:
            - {$ref: '#/components/schemas/Timestamp'}
            - {type: 'null'}
        status: {type: string, enum: [PENDING, ALLOWED, DENIED, CANCELLED, EXPIRED, INVALIDATED]}
        approvalBasis: {type: array, items: {$ref: '#/components/schemas/ApprovalBasisSide'}}
        approvalObligations: {type: array, items: {$ref: '#/components/schemas/ApprovalObligationView'}}
        approvalDecisions: {type: array, items: {$ref: '#/components/schemas/ApprovalDecisionView'}}
        terminalReason:
          oneOf:
            - {type: string}
            - {type: 'null'}
        terminalAt:
          oneOf:
            - {$ref: '#/components/schemas/Timestamp'}
            - {type: 'null'}
        resultingPolicyRuleRef:
          oneOf:
            - {$ref: '#/components/schemas/StableId'}
            - {type: 'null'}

    RecordApprovalDecisionRequest:
      type: object
      additionalProperties: false
      required: [obligationRef, result]
      properties:
        obligationRef: {$ref: '#/components/schemas/StableId'}
        result: {type: string, enum: [APPROVED, DENIED]}

    EffectiveWindow:
      type: object
      additionalProperties: false
      properties:
        effectiveFrom: {$ref: '#/components/schemas/Timestamp'}
        effectiveUntil: {$ref: '#/components/schemas/Timestamp'}
    RevokePolicyRuleRequest:
      type: object
      additionalProperties: false
      properties:
        reason: {type: string, minLength: 1}

    AttachJustificationRequest:
      type: object
      additionalProperties: false
      required: [needRef]
      properties: {needRef: {$ref: '#/components/schemas/StableId'}}

    PolicyRuleCataloguePage:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PolicyRuleView'}}
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 100}

    RevocationEvidence:
      type: object
      required: [actorRef, participatingSide, scopeKind, scopeRef, revokedAt, authorityEvidence]
      properties:
        actorRef: {type: string}
        participatingSide: {type: string, enum: [SOURCE, DESTINATION]}
        scopeKind: {type: string, enum: [ORGANIZATION, ORGANIZATIONAL_UNIT]}
        scopeRef: {$ref: '#/components/schemas/StableId'}
        revokedAt: {$ref: '#/components/schemas/Timestamp'}
        reason:
          oneOf:
            - {type: string}
            - {type: 'null'}
        authorityEvidence: {$ref: '#/components/schemas/AuthorityEvidence'}

    PolicyRuleView:
      type: object
      required: [policyRuleRef, accessRequestRef, version, revocationState, effectiveWindow, sourceDeploymentRef, destinationDeploymentRef, interactionRevisionRef, createdAt, authorizationEvidence, justifications]
      properties:
        policyRuleRef: {$ref: '#/components/schemas/StableId'}
        accessRequestRef: {$ref: '#/components/schemas/StableId'}
        version: {type: integer, minimum: 0}
        revocationState: {type: string, enum: [CURRENT, REVOKED]}
        effectiveWindow: {$ref: '#/components/schemas/EffectiveWindow'}
        sourceDeploymentRef: {$ref: '#/components/schemas/StableId'}
        destinationDeploymentRef: {$ref: '#/components/schemas/StableId'}
        interactionRevisionRef: {$ref: '#/components/schemas/StableId'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        revokedAt:
          oneOf:
            - {$ref: '#/components/schemas/Timestamp'}
            - {type: 'null'}
        authorizationEvidence: {type: array, items: {type: object}}
        revocationEvidence:
          oneOf:
            - {$ref: '#/components/schemas/RevocationEvidence'}
            - {type: 'null'}
        justifications: {type: array, items: {type: object}}

    PolicyMaterializationRequest:
      type: object
      additionalProperties: false
      properties:
        policyRuleRefs:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/StableId'}

    AuthorityEvidence:
      type: object
      required: [principalRef, action, scopeKind, evaluatedAt]
      properties:
        principalRef: {type: string}
        action: {type: string}
        scopeKind: {type: string, enum: [SYSTEM, ORGANIZATION, ORGANIZATIONAL_UNIT]}
        scopeRef:
          oneOf:
            - {$ref: '#/components/schemas/StableId'}
            - {type: 'null'}
        evaluatedAt: {$ref: '#/components/schemas/Timestamp'}
        evidence: {type: object}

    PolicyMaterializationRow:
      type: object
      additionalProperties: false
      required:
        - policyRuleRef
        - technicalStatus
        - sourceDeploymentRef
        - destinationDeploymentRef
        - interactionRevisionRef
        - sourceResourceRef
        - sourceResourceName
        - sourceEndpointRef
        - sourceAddress
        - destinationResourceRef
        - destinationResourceName
        - destinationEndpointRef
        - destinationAddress
        - ipProtocol
        - sourcePorts
        - destinationPorts
      properties:
        policyRuleRef: {$ref: '#/components/schemas/StableId'}
        technicalStatus: {type: string, enum: [READY, INCOMPLETE]}
        sourceDeploymentRef: {$ref: '#/components/schemas/StableId'}
        destinationDeploymentRef: {$ref: '#/components/schemas/StableId'}
        interactionRevisionRef: {$ref: '#/components/schemas/StableId'}
        sourceResourceRef: {$ref: '#/components/schemas/StableId'}
        sourceResourceName: {type: string, minLength: 1}
        sourceEndpointRef:
          oneOf:
            - {$ref: '#/components/schemas/StableId'}
            - {type: 'null'}
        sourceAddress:
          oneOf:
            - {type: string, minLength: 1}
            - {type: 'null'}
        destinationResourceRef: {$ref: '#/components/schemas/StableId'}
        destinationResourceName: {type: string, minLength: 1}
        destinationEndpointRef:
          oneOf:
            - {$ref: '#/components/schemas/StableId'}
            - {type: 'null'}
        destinationAddress:
          oneOf:
            - {type: string, minLength: 1}
            - {type: 'null'}
        ipProtocol: {type: integer, minimum: 0, maximum: 255}
        sourcePorts:
          type: array
          items: {$ref: '#/components/schemas/MaterializedPortRange'}
        destinationPorts:
          type: array
          items: {$ref: '#/components/schemas/MaterializedPortRange'}

    PolicyMaterializationIssue:
      type: object
      additionalProperties: false
      required: [policyRuleRef, reason]
      properties:
        policyRuleRef: {$ref: '#/components/schemas/StableId'}
        reason: {type: string, minLength: 1}

    PolicyMaterializationResult:
      type: object
      required: [status, evaluationAt, selection, exportAuthorityEvidence, ruleProvenance, nonEffective, rows, issues]
      properties:
        status: {type: string, enum: [COMPLETE]}
        evaluationAt: {$ref: '#/components/schemas/Timestamp'}
        selection: {type: object}
        exportAuthorityEvidence: {type: array, items: {$ref: '#/components/schemas/AuthorityEvidence'}}
        ruleProvenance: {type: array, items: {type: object}}
        nonEffective: {type: array, items: {type: object}}
        rows: {type: array, items: {$ref: '#/components/schemas/PolicyMaterializationRow'}}
        issues: {type: array, items: {$ref: '#/components/schemas/PolicyMaterializationIssue'}}
