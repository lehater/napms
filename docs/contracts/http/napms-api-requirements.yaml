version: 3
kind: http-contract-requirements
id: NAPMS-MVP-HTTP-CONTRACT-REQUIREMENTS
status: COMPLETE_CANONICAL_OPENAPI

requirements_ref: docs/requirements/first-mvp-product-requirements.yaml
target_contract_format: OpenAPI
delivery_protocol: HTTP/JSON
contract_rule: One external application API; internal module boundaries are not HTTP boundaries.

operations:
  - GET /v1/resources
  - POST /v1/resources
  - GET /v1/resources/{resourceRef}
  - POST /v1/resources/{resourceRef}/endpoints
  - PUT /v1/resources/{resourceRef}/endpoints/{endpointRef}/address
  - DELETE /v1/resources/{resourceRef}/endpoints/{endpointRef}/address
  - PUT /v1/resources/{resourceRef}/site
  - PUT /v1/resources/{resourceRef}/responsibilities/{role}
  - GET /v1/applications
  - POST /v1/applications
  - GET /v1/applications/{applicationRef}
  - POST /v1/applications/{applicationRef}/components
  - PUT /v1/applications/{applicationRef}/components/{componentRef}
  - POST /v1/interactions
  - POST /v1/interactions/{interactionRef}/revisions
  - GET /v1/deployments
  - POST /v1/deployments
  - GET /v1/processes
  - POST /v1/processes
  - PUT /v1/processes/{processRef}/criticality
  - POST /v1/processes/{processRef}/needs
  - PUT /v1/processes/{processRef}/needs/{needRef}/status
  - GET /v1/access-requests
  - POST /v1/access-requests
  - POST /v1/access-requests/{requestRef}/decision
  - GET /v1/policy-rules
  - PUT /v1/policy-rules/{policyRuleRef}/operational-state
  - POST /v1/policy-rules/{policyRuleRef}/justifications
  - GET /v1/policy-rules/{policyRuleRef}
  - POST /v1/policy-materializations

rules:
  - Authentication is OIDC Bearer token only; request bodies never contain trusted actor permission or authority fields.
  - access.request is admitted from effective scoped AuthorityGrants for every source/destination Resource AuthorityScopeRef at server-owned admissionAt.
  - policy.export is admitted from effective scoped AuthorityGrants for every selected Resource AuthorityScopeRef at database-owned evaluationAt.
  - Cross-Application Interaction is allowed when referenced Components and traffic semantics are valid.
  - Idempotent state-creating POST operations require Idempotency-Key; replay returns exact persisted original status/body/Location/ETag before NEW-command If-Match evaluation.
  - Aggregate mutations requiring optimistic concurrency use If-Match and return current ETag.
  - DENIED AccessRequest decision creates no PolicyRule.
  - PolicyRule operational state supports ACTIVE or INACTIVE plus optional half-open EffectiveWindow.
  - Policy materialization accepts all Rules or an explicit non-empty unique Rule subset.
  - COMPLETE and UNRESOLVED are HTTP 200 application results; dependency inability is 503 before response commitment.
  - Export response is self-contained with ExportAuthorityEvidence and per-Rule authorization/business provenance.
  - Missing technical realization for a selected non-effective Rule does not make export incomplete.
  - Collection/read projections are minimal task projections; they do not imply search, filtering, sorting, pagination, bulk edit or delete semantics.
  - GET /v1/resources/{resourceRef} returns the accepted Resource detail read model: immutable AuthorityScopeRef, current endpoint/site/responsibility facts and explanatory address/site/responsibility history.
  - GET /v1/applications/{applicationRef} returns Application identity, Components and Interactions with latest immutable revision traffic sufficient for Application/Component/Interaction authoring.
  - GET /v1/processes returns Business Processes with current Connectivity Needs; Need status remains ACTIVE or RETIRED and is business justification only.
  - GET /v1/access-requests exposes immutable access subjects and final ALLOWED/DENIED outcome when present.
  - GET /v1/policy-rules and GET /v1/policy-rules/{policyRuleRef} expose exact AccessSubject, operational state/window and detail provenance required by the UI.
  - Resource AuthorityScopeRef is never represented as a temporal affiliation.
  - Endpoint address clear, Site replace/clear and OWNER/ADMINISTRATOR replace/clear are public first-MVP Resource curation operations.

transport_decisions:
  security_scheme: HTTP bearer JWT security scheme named OIDCBearer.
  unauthenticated: 401
  authorization_denied: 403
  stale_or_idempotency_conflict: 409
  validation_or_reference_rejection: 422
  dependency_unavailable: 503
  payload_too_large: 413

canonical_openapi_target: docs/contracts/http/napms.openapi.yaml
openapi_status: COMPLETE

compatibility_policy:
  current_major: v1
  rules:
    - Existing accepted v1 operation semantics and field meaning may not be silently redefined.
    - Adding optional representation fields is compatible only when existing consumers can ignore them without semantic loss.
    - Removing/renaming required fields or operations, changing identifier/time/error semantics, or weakening authorization/provenance is breaking and requires explicit interface/version revalidation.
    - Diagnostic message text is not a compatibility contract unless separately declared.
