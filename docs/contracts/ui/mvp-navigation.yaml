version: 1
kind: ui-navigation-model
id: NAPMS-MVP-UI-NAVIGATION
status: CURRENT

purpose: Define the first-MVP browser navigation/workspace model for all accepted user-facing product subjects.

workspaces:
  - {id: RESOURCE-CATALOGUE, responsibility: Locate/select Resources and start Resource authoring.}
  - {id: RESOURCE-DETAIL, responsibility: Inspect and author one Resource current state and history.}
  - {id: APPLICATION-CATALOGUE, responsibility: Locate/select reusable Applications.}
  - {id: APPLICATION-DETAIL, responsibility: Author one Application with Components and directed Interactions.}
  - {id: DEPLOYMENTS, responsibility: Locate/create Component deployments and open one Deployment.}
  - {id: DEPLOYMENT-DETAIL, responsibility: Inspect one ComponentDeployment and its Resource realization.}
  - {id: BUSINESS-CONNECTIVITY, responsibility: Manage Business Processes and Connectivity Needs independently from permission.}
  - {id: ACCESS-REQUESTS, responsibility: Submit connectivity requests and inspect/record permission outcomes allowed by authority.}
  - {id: POLICY-RULES, responsibility: Inspect authoritative desired-access rules and change supported operational state.}
  - {id: POLICY-EXPORT, responsibility: Select effective policy scope, execute normalized export and inspect completeness diagnostics.}

routes:
  - {path: /resources, workspace: RESOURCE-CATALOGUE, parent: {state: not-applicable, rationale: top-level-resource-workspace}, direct_link: canonical}
  - {path: /resources/new, workspace: RESOURCE-CATALOGUE, mode: create, parent: navigation:resource-catalogue, direct_link: canonical, success: navigation:resource-detail, cancel: navigation:resource-catalogue}
  - {path: /resources/:resourceRef, workspace: RESOURCE-DETAIL, identity: ResourceId, parent: navigation:resource-catalogue, direct_link: canonical}
  - {path: /applications, workspace: APPLICATION-CATALOGUE, parent: {state: not-applicable, rationale: top-level-application-workspace}, direct_link: canonical}
  - {path: /applications/new, workspace: APPLICATION-CATALOGUE, mode: create, parent: navigation:application-catalogue, direct_link: canonical, success: navigation:application-detail, cancel: navigation:application-catalogue}
  - {path: /applications/:applicationRef, workspace: APPLICATION-DETAIL, identity: ApplicationId, parent: navigation:application-catalogue, direct_link: canonical}
  - {path: /applications/:applicationRef/components/new, workspace: APPLICATION-DETAIL, identity: ApplicationId, mode: create-component, parent: navigation:application-detail, direct_link: canonical, success: navigation:application-detail, cancel: navigation:application-detail}
  - {path: /interactions/new, workspace: APPLICATION-DETAIL, mode: create-interaction, parent: navigation:application-catalogue, direct_link: canonical, success: navigation:application-detail, cancel: navigation:application-catalogue}
  - {path: /interactions/:interactionRef/revisions/new, workspace: APPLICATION-DETAIL, identity: InteractionId, mode: publish-revision, parent: navigation:application-detail, direct_link: canonical, success: navigation:application-detail, cancel: navigation:application-detail}
  - {path: /deployments, workspace: DEPLOYMENTS, parent: {state: not-applicable, rationale: top-level-deployment-workspace}, direct_link: canonical}
  - {path: /deployments/new, workspace: DEPLOYMENTS, mode: create, parent: navigation:deployments, direct_link: canonical, success: navigation:deployment-detail, cancel: navigation:deployments}
  - {path: /deployments/:deploymentRef, workspace: DEPLOYMENT-DETAIL, identity: ComponentDeploymentId, parent: navigation:deployments, direct_link: canonical}
  - {path: /business-processes, workspace: BUSINESS-CONNECTIVITY, parent: {state: not-applicable, rationale: top-level-business-connectivity-workspace}, direct_link: canonical}
  - {path: /business-processes/new, workspace: BUSINESS-CONNECTIVITY, mode: create-process, parent: navigation:business-connectivity, direct_link: canonical, success: navigation:business-process-detail, cancel: navigation:business-connectivity}
  - {path: /business-processes/:processRef, workspace: BUSINESS-CONNECTIVITY, identity: BusinessProcessId, parent: navigation:business-connectivity, direct_link: canonical}
  - {path: /access-requests, workspace: ACCESS-REQUESTS, parent: {state: not-applicable, rationale: top-level-access-request-workspace}, direct_link: canonical}
  - {path: /access-requests/new, workspace: ACCESS-REQUESTS, mode: create, parent: navigation:access-requests, direct_link: canonical, success: navigation:access-request-detail, cancel: navigation:access-requests}
  - {path: /access-requests/:requestRef/decision, workspace: ACCESS-REQUESTS, identity: AccessRequestId, mode: decision, parent: navigation:access-requests, direct_link: canonical, success: navigation:access-request-detail, cancel: navigation:access-requests}
  - {path: /policy-rules, workspace: POLICY-RULES, parent: {state: not-applicable, rationale: top-level-policy-rule-workspace}, direct_link: canonical}
  - {path: /policy-rules/:policyRuleRef, workspace: POLICY-RULES, identity: PolicyRuleId, parent: navigation:policy-rules, direct_link: canonical}
  - {path: /policy-materializations/new, workspace: POLICY-EXPORT, mode: export, parent: navigation:policy-rules, direct_link: canonical, success: navigation:policy-export-result, cancel: navigation:policy-rules}
transitions:
  - {from: RESOURCE-CATALOGUE, action: select-resource, to: RESOURCE-DETAIL, identity: ResourceId}
  - {from: APPLICATION-CATALOGUE, action: select-application, to: APPLICATION-DETAIL, identity: ApplicationId}
  - {from: APPLICATION-DETAIL, action: manage-components, to: APPLICATION-DETAIL, local_state: components}
  - {from: APPLICATION-DETAIL, action: manage-interactions, to: APPLICATION-DETAIL, local_state: interactions}
  - {from: DEPLOYMENTS, action: select-deployment, to: DEPLOYMENT-DETAIL, identity: ComponentDeploymentId}
  - {from: DEPLOYMENTS, action: create-deployment, to: DEPLOYMENT-DETAIL, identity: ComponentDeploymentId}
  - {from: DEPLOYMENT-DETAIL, action: return-to-catalogue, to: DEPLOYMENTS}
  - {from: BUSINESS-CONNECTIVITY, action: create-or-select-need, to: BUSINESS-CONNECTIVITY, identity: ConnectivityNeedId}
  - {from: ACCESS-REQUESTS, action: submit-request, to: ACCESS-REQUESTS, identity: AccessRequestId}
  - {from: ACCESS-REQUESTS, action: inspect-resulting-rule, to: POLICY-RULES, identity: PolicyRuleId}
  - {from: POLICY-RULES, action: export-effective-policy, to: POLICY-EXPORT}
  - {from: RESOURCE-DETAIL, action: open-history, to: RESOURCE-DETAIL, local_state: history-open}

journeys:
  - id: RESOURCE-MANAGEMENT
    subject: Resource management
    steps:
      - Locate/select a Resource and inspect current facts.
      - Create or change accepted Resource facts through admitted actions.
      - Inspect ended/replaced facts with validity and provenance.
  - id: APPLICATION-MANAGEMENT
    subject: Application management
    steps:
      - Locate or create a reusable Application description.
      - Inspect identity and communication structure independently from deployment realization.
  - id: COMPONENT-MANAGEMENT
    subject: Component management
    steps:
      - Open one Application description.
      - Add/edit Component participants without treating them as network devices.
  - id: INTERACTION-MANAGEMENT
    subject: Interaction management
    steps:
      - Create an independently meaningful directed Interaction between valid Components.
      - Capture its complete minimal traffic semantics and preserve distinct reasons as distinct Interactions.
  - id: DEPLOYMENT-MANAGEMENT
    subject: Deployment management
    steps:
      - Select a Component and Resource.
      - Create a ComponentDeployment independent from the Resource current address.
      - Locate the Deployment in the catalogue and inspect its dedicated detail view.
  - id: BUSINESS-CONNECTIVITY
    subject: Business process and connectivity need
    steps:
      - Create/inspect a Business Process and organizational responsibility.
      - Create/retire Connectivity Needs linking Process, Interaction and participant perspective.
      - Keep business justification distinct from permission.
  - id: ACCESS-REQUEST
    subject: Access request
    steps:
      - Select an eligible Connectivity Need/deployment subject.
      - Submit only when effective request authority is confirmed by the backend.
      - Inspect immutable request subject and permission outcome without treating UI state as authority.
  - id: POLICY-RULE
    subject: Policy rule
    steps:
      - Inspect authoritative desired-access identity created only from Allowed permission.
      - Change supported Active/Inactive state while preserving history and decision provenance.
  - id: POLICY-EXPORT
    subject: Policy export
    steps:
      - Select all current desired policy or an explicit domain-policy subset.
      - Execute export only when effective export authority is confirmed by the backend.
      - Distinguish complete success from unresolved/degraded output and expose provenance/evaluation time.

rules:
  - Browser navigation is route-driven and canonical route paths carry stable product identifiers, never database-row identities.
  - Nested route context is presented as breadcrumbs derived from the canonical workspace hierarchy; ancestor crumbs navigate to canonical parent workspaces and the current crumb is not a navigation link.
  - Breadcrumb hierarchy expresses conceptual workspace/route containment, not browser visit history, so direct deep links render the same navigation context as in-app transitions.
  - Create/edit modes retain a deterministic parent navigation target; cancellation returns to that parent without implying domain rollback.
  - Loading, empty, not-found, rejected, conflict and technical-error states remain distinct.
  - Frontend navigation/actions never establish domain truth or security authority.
  - HTTP representation remains owned by canonical HTTP/OpenAPI contracts.
