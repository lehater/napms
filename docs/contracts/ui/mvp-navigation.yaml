version: 2
kind: ui-navigation-model
id: NAPMS-MVP-UI-NAVIGATION
status: CURRENT

purpose: Define the first-MVP browser navigation/workspace model for all accepted user-facing product subjects after Organization/Authority/Access lifecycle revalidation.

workspaces:
  - {id: ORGANIZATION-STRUCTURE, responsibility: Inspect the Organization/OrganizationalUnit hierarchy and perform supported Unit create reparent and retirement administration.}
  - {id: RESOURCE-CATALOGUE, responsibility: Locate/select Resources and start Resource authoring using current OrganizationalUnit ownership.}
  - {id: RESOURCE-DETAIL, responsibility: Inspect and author one Resource current state including organizational owner and history.}
  - {id: APPLICATION-CATALOGUE, responsibility: Locate/select reusable Applications.}
  - {id: APPLICATION-DETAIL, responsibility: Author one Application with Components and directed Interactions.}
  - {id: DEPLOYMENTS, responsibility: Locate/create Component deployments and open one Deployment.}
  - {id: DEPLOYMENT-DETAIL, responsibility: Inspect one ComponentDeployment and its Resource realization.}
  - {id: BUSINESS-CONNECTIVITY, responsibility: Manage Business Processes and Connectivity Needs independently from permission.}
  - {id: APPROVAL-POLICY, responsibility: Inspect current Organization approval policy and publish a new immutable revision for future requests.}
  - {id: ACCESS-REQUESTS, responsibility: Submit connectivity requests, inspect immutable ApprovalBasis and approval progress, take currently authorized side decisions, cancel pending requests and inspect terminal outcomes.}
  - {id: POLICY-RULES, responsibility: Inspect current and historical authorization episodes and revoke a current episode when authorized for either participating administrative side.}
  - {id: POLICY-EXPORT, responsibility: Select current effective policy scope, execute normalized export and inspect row-level completeness diagnostics.}

routes:
  - {path: /organization, workspace: ORGANIZATION-STRUCTURE}
  - {path: /organization/units/:organizationalUnitRef, workspace: ORGANIZATION-STRUCTURE, identity: OrganizationalUnitId}
  - {path: /resources, workspace: RESOURCE-CATALOGUE}
  - {path: /resources/new, workspace: RESOURCE-CATALOGUE, mode: create}
  - {path: /resources/:resourceRef, workspace: RESOURCE-DETAIL, identity: ResourceId}
  - {path: /applications, workspace: APPLICATION-CATALOGUE}
  - {path: /applications/new, workspace: APPLICATION-CATALOGUE, mode: create}
  - {path: /applications/:applicationRef, workspace: APPLICATION-DETAIL, identity: ApplicationId}
  - {path: /applications/:applicationRef/components/new, workspace: APPLICATION-DETAIL, identity: ApplicationId, mode: create-component}
  - {path: /interactions/new, workspace: APPLICATION-DETAIL, mode: create-interaction}
  - {path: /interactions/:interactionRef/revisions/new, workspace: APPLICATION-DETAIL, identity: InteractionId, mode: publish-revision}
  - {path: /deployments, workspace: DEPLOYMENTS}
  - {path: /deployments/new, workspace: DEPLOYMENTS, mode: create}
  - {path: /deployments/:deploymentRef, workspace: DEPLOYMENT-DETAIL, identity: ComponentDeploymentId}
  - {path: /business-processes, workspace: BUSINESS-CONNECTIVITY}
  - {path: /business-processes/new, workspace: BUSINESS-CONNECTIVITY, mode: create-process}
  - {path: /business-processes/:processRef, workspace: BUSINESS-CONNECTIVITY, identity: BusinessProcessId}
  - {path: /approval-policy, workspace: APPROVAL-POLICY}
  - {path: /access-requests, workspace: ACCESS-REQUESTS}
  - {path: /access-requests/new, workspace: ACCESS-REQUESTS, mode: create}
  - {path: /access-requests/:requestRef, workspace: ACCESS-REQUESTS, identity: AccessRequestId, mode: detail}
  - {path: /policy-rules, workspace: POLICY-RULES}
  - {path: /policy-rules/:policyRuleRef, workspace: POLICY-RULES, identity: PolicyRuleId}
  - {path: /policy-materializations/new, workspace: POLICY-EXPORT}

transitions:
  - {from: ORGANIZATION-STRUCTURE, action: select-unit, to: ORGANIZATION-STRUCTURE, identity: OrganizationalUnitId}
  - {from: RESOURCE-CATALOGUE, action: select-resource, to: RESOURCE-DETAIL, identity: ResourceId}
  - {from: RESOURCE-DETAIL, action: manage-organization, to: ORGANIZATION-STRUCTURE}
  - {from: APPLICATION-CATALOGUE, action: select-application, to: APPLICATION-DETAIL, identity: ApplicationId}
  - {from: APPLICATION-DETAIL, action: manage-components, to: APPLICATION-DETAIL, local_state: components}
  - {from: APPLICATION-DETAIL, action: manage-interactions, to: APPLICATION-DETAIL, local_state: interactions}
  - {from: DEPLOYMENTS, action: select-deployment, to: DEPLOYMENT-DETAIL, identity: ComponentDeploymentId}
  - {from: DEPLOYMENTS, action: create-deployment, to: DEPLOYMENT-DETAIL, identity: ComponentDeploymentId}
  - {from: DEPLOYMENT-DETAIL, action: return-to-catalogue, to: DEPLOYMENTS}
  - {from: BUSINESS-CONNECTIVITY, action: create-or-select-need, to: BUSINESS-CONNECTIVITY, identity: ConnectivityNeedId}
  - {from: APPROVAL-POLICY, action: publish-revision, to: APPROVAL-POLICY}
  - {from: ACCESS-REQUESTS, action: submit-request, to: ACCESS-REQUESTS, identity: AccessRequestId}
  - {from: ACCESS-REQUESTS, action: open-request, to: ACCESS-REQUESTS, identity: AccessRequestId}
  - {from: ACCESS-REQUESTS, action: inspect-resulting-rule, to: POLICY-RULES, identity: PolicyRuleId}
  - {from: POLICY-RULES, action: export-effective-policy, to: POLICY-EXPORT}
  - {from: RESOURCE-DETAIL, action: open-history, to: RESOURCE-DETAIL, local_state: history-open}

journeys:
  - id: RESOURCE-MANAGEMENT
    subject: Resource management
    steps:
      - Inspect the Organization/OrganizationalUnit hierarchy needed for administrative ownership.
      - Create/reparent/retire Units through supported administration while preserving identity/history.
      - Locate/select a Resource and inspect its current OrganizationalUnit owner plus current facts.
      - Create a Resource with one current owner or move ownership to another ACTIVE Unit in the same Organization without changing Resource identity.
      - Inspect prior ownership and ended/replaced technical/descriptive facts with validity and provenance.
  - id: APPLICATION-MANAGEMENT
    subject: Application management
    steps:
      - Locate or create a reusable Application description.
      - Inspect identity and communication structure independently from deployment realization.
  - id: COMPONENT-MANAGEMENT
    subject: Component management
    steps:
      - Open one Application description.
      - Add/edit Component participants without treating them as network devices.
  - id: INTERACTION-MANAGEMENT
    subject: Interaction management
    steps:
      - Create an independently meaningful directed Interaction between valid Components.
      - Capture its complete minimal traffic semantics and preserve distinct reasons as distinct Interactions.
  - id: DEPLOYMENT-MANAGEMENT
    subject: Deployment management
    steps:
      - Select a Component and Resource.
      - Create a ComponentDeployment independent from the Resource current address.
      - Locate the Deployment in the catalogue and inspect its dedicated detail view.
  - id: BUSINESS-CONNECTIVITY
    subject: Business process and connectivity need
    steps:
      - Create/inspect a Business Process and organizational responsibility.
      - Create/retire Connectivity Needs linking Process, Interaction and participant perspective.
      - Keep business justification distinct from permission.
  - id: ACCESS-REQUEST
    subject: Access request
    steps:
      - Inspect/publish Organization ApprovalPolicy revision when administrative policy changes; existing requests retain their submitted ApprovalBasis.
      - Select an eligible exact connectivity subject and submit only when current source-side request authority is confirmed by the backend.
      - Inspect immutable ApprovalBasis, required sides and approval progress without treating UI state as authority.
      - If currently authorized for a required side, approve or deny that obligation; each action is server-authorized at action time.
      - As requester, cancel while PENDING when appropriate.
      - Inspect terminal ALLOWED/DENIED/CANCELLED/EXPIRED/INVALIDATED outcome; terminal requests never reopen.
  - id: POLICY-RULE
    subject: Policy rule
    steps:
      - Inspect one authorization episode created by an ALLOWED request and distinguish CURRENT from REVOKED history.
      - Revoke a CURRENT episode when the backend confirms policy.revoke authority for either participating administrative side.
      - Never reactivate a revoked episode; regrant begins a new Access Request.
  - id: POLICY-EXPORT
    subject: Policy export
    steps:
      - Select all current effective policy or an explicit current authorization-episode subset.
      - Execute export only when current export authority is confirmed by the backend for every selected applicable scope.
      - Inspect one COMPLETE result in which missing addresses appear as row-level INCOMPLETE diagnostics rather than global unresolved policy.

rules:
  - Browser navigation is route-driven and canonical route paths carry stable product identifiers, never database-row identities.
  - Loading, empty, not-found, rejected, conflict and technical-error states remain distinct.
  - Frontend navigation/actions never establish domain truth or security authority.
  - Historical authorization/request/organizational facts remain inspectable and are never presented as editable current state.
  - HTTP representation remains owned by canonical HTTP/OpenAPI contracts.
