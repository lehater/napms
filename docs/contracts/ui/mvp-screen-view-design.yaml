version: 1
kind: screen-view-design
id: NAPMS-MVP-SCREEN-VIEW-DESIGN
status: CURRENT
inherits: NAPMS-MVP-PRESENTATION-SYSTEM

purpose: >-
  Define concrete first-MVP composition for every canonical NAPMS browser
  workspace while inheriting shared presentation decisions from
  NAPMS-MVP-PRESENTATION-SYSTEM.

basis:
  human_interface: docs/contracts/ui/mvp-human-interface.yaml
  navigation: docs/contracts/ui/mvp-navigation.yaml
  presentation_system: docs/contracts/ui/mvp-presentation-system.yaml
  resource_detail: docs/contracts/ui/resource-detail.yaml
  http: docs/contracts/http/napms.openapi.yaml

composition_contract:
  rule: >-
    Every screen declares ordered composition in addition to semantic regions.
    Pattern ids alone are insufficient when nesting/order affects hierarchy or
    accepted presentation intent.
  reference_rule: >-
    Historical references constrain only explicitly adopted presentation facts.
    Unsupported controls or fields are recorded as not-adopted rather than
    recreated as client-only product behavior.
  inherited_entity_collection_default: NAPMS-MVP-PRESENTATION-SYSTEM.entity_collection_default
  migration_gaps:
    - id: entity-catalogue-query-contracts
      applies_to: [ACCESS-REQUESTS, POLICY-RULES]
      gap: >-
        Search/filter/sort and scalable paging semantics are not yet closed end-to-end
        through accepted query contracts for every primary entity collection.
    - id: primary-catalogue-table-adoption
      applies_to: [ACCESS-REQUESTS, POLICY-RULES]
      gap: >-
        Current realization still uses STRUCTURED-LIST for some primary entity
        collections; migrate them to DATA-TABLE unless an explicit override is accepted.

screens:
  - id: RESOURCE-CATALOGUE
    purpose: Locate/select Resources and start supported Resource authoring.
    patterns: [CATALOGUE, FILTER-BAR, DATA-TABLE, EDITOR, TASK-ACTIONS, STATUS]
    regions:
      - {id: context, role: heading-context, priority: primary}
      - {id: query-controls, role: collection-query, pattern: FILTER-BAR, priority: primary, applies_when: list-mode}
      - {id: resources, role: collection, pattern: DATA-TABLE, priority: primary, applies_when: list-mode}
      - {id: create-editor, role: task-editor, pattern: EDITOR, priority: primary, applies_when: create-mode}
      - {id: actions, role: task-actions, priority: primary}
      - {id: feedback, role: operation-status, priority: supporting}
    composition:
      root: catalogue-workspace
      ordered_regions: [context, actions, query-controls, resources, create-editor, feedback]
      modes:
        list: [context, actions, query-controls, resources, feedback]
        create: [context, create-editor, feedback]
      query-controls:
        pattern: FILTER-BAR
        search: {source: query:listResources.search, matches: [displayName, resourceRef]}
        filters:
          - {id: authority-scope-ref, source: query:listResources.authorityScopeRef}
          - {id: site-ref, source: query:listResources.siteRef}
        sort:
          fields: [displayName, resourceRef, authorityScopeRef]
          default: {field: displayName, direction: asc}
        paging: {page: query:listResources.page, page_size: query:listResources.pageSize}
      resources:
        pattern: DATA-TABLE
        columns:
          - {id: display-name, role: primary-identity, sort: displayName}
          - {id: resource-reference, role: technical-identity, sort: resourceRef}
          - {id: authority-scope, role: distinguishing-attribute, sort: authorityScopeRef}
          - {id: site, role: current-fact}
          - {id: endpoints, role: current-fact-summary}
          - {id: responsibilities, role: current-fact-summary}
        row_action: open-resource
      create-editor:
        pattern: EDITOR
        fields:
          - {id: display-name, source: request:createResource.displayName, required: true}
          - {id: authority-scope-ref, source: request:createResource.authorityScopeRef, required: true}
          - {id: site-ref, source: request:createResource.siteRef, required: false}
        submit_action: create-resource
    reference_adaptation:
      sources: [RESOURCE-CATALOGUE-CONCEPT, MAIN-WEBUI-PRESENTATION]
      adopted:
        - dark fixed-width desktop navigation and full-width operational workspace
        - compact hierarchy and dense table visual language
        - human-readable primary identity with technical reference subordinate
        - backend-backed search, accepted attribute filters, sorting and paging
      not_adopted:
        - {reference_feature: selection-and-bulk-actions, reason: no accepted First-MVP bulk action semantics}
        - {reference_feature: Resource-type-filter, reason: no accepted Resource type concept}
        - {reference_feature: New-Resource-modal, reason: current First-MVP navigation uses the accepted authoring route/state}
    primary_action_role: create-resource
    exits:
      - select Resource -> RESOURCE-DETAIL
    states: [loading, loaded, empty, editing, submitting, validation-rejected, authorization-rejected, technical-error]
    semantic_contract:
      reads:
        - id: catalogue
          operation_id: listResources
          projection: ResourceCataloguePage
          query:
            search: {source: local:query.search, semantics: accepted-text-search}
            authorityScopeRef: {source: local:query.filters.authority-scope-ref, semantics: exact-attribute-filter}
            siteRef: {source: local:query.filters.site-ref, semantics: exact-attribute-filter}
            sortBy: {source: local:query.sort.field, accepted: [displayName, resourceRef, authorityScopeRef]}
            sortDirection: {source: local:query.sort.direction, accepted: [asc, desc]}
            page: {source: local:query.page, minimum: 1}
            pageSize: {source: local:query.page-size, default: 25, maximum: 100}
      commands:
        - {id: create-resource, operation_id: createResource}
      view_model:
        id: ResourceCatalogueScreenModel
        fields:
          - {id: resources, source: read:catalogue.items}
          - {id: total, source: read:catalogue.total}
          - {id: page, source: read:catalogue.page}
          - {id: page_size, source: read:catalogue.pageSize}
          - {id: display_name, source: read:catalogue.items.displayName}
          - {id: resource_ref, source: read:catalogue.items.resourceRef}
          - {id: authority_scope_ref, source: read:catalogue.items.authorityScopeRef}
          - {id: current, source: read:catalogue.items.current}
      capabilities:
        allowed:
          - {id: inspect-catalogue, backed_by: read:catalogue}
          - {id: search, backed_by: read:catalogue}
          - {id: filter, backed_by: read:catalogue}
          - {id: sort, backed_by: read:catalogue}
          - {id: pagination, backed_by: read:catalogue}
          - {id: open-resource, backed_by: navigation:resource-detail}
          - {id: create-resource, backed_by: command:create-resource}
        excluded: [bulk-operation, edit-item, delete-item]
      pattern_mapping:
        - {pattern: CATALOGUE, feature_bindings: {open-item: open-resource, create-item: create-resource}}
        - {pattern: FILTER-BAR, feature_bindings: {search: search, filters: filter, sort: sort, clear: filter}}
        - {pattern: DATA-TABLE, feature_bindings: {open-row: open-resource, sort: sort, paging: pagination}}
        - {pattern: EDITOR, feature_bindings: {}}
        - {pattern: TASK-ACTIONS, feature_bindings: {primary: create-resource}}
        - {pattern: STATUS, feature_bindings: {}}
      state_mapping:
        loading: read:catalogue.pending
        loaded: read:catalogue.200
        empty: read:catalogue.200
        editing: local:create-resource-form
        submitting: command:create-resource.pending
        validation-rejected: command:create-resource.422
        authorization-rejected: [read:catalogue.401, read:catalogue.403, command:create-resource.401, command:create-resource.403]
        conflict: command:create-resource.409
        technical-error: [read:catalogue.failure, command:create-resource.failure]
      verification:
        contract: [operation:listResources-query-parameters, operation:createResource]
        semantic: [resource-catalogue-query-capability-and-state-closure]
        rendered: [resource-catalogue-filter-table-density-reference-conformance]
    responsive:
      - collection preserves Resource identity, current distinguishing facts and open action
      - query controls reflow without losing active state or clear action
      - table may become labeled records while preserving column labels and actions
    overrides: []

  - id: RESOURCE-DETAIL
    purpose: Inspect and author one Resource current state and inspect history.
    patterns: [DETAIL, EDITOR, DISCLOSURE, TASK-ACTIONS, STATUS]
    source_contract: docs/contracts/ui/resource-detail.yaml
    regions:
      - {id: identity-context, role: heading-context, priority: primary}
      - {id: current-facts, role: primary-content, priority: primary}
      - {id: actions, role: task-actions, priority: primary}
      - {id: history, role: secondary-content, pattern: DISCLOSURE, priority: secondary}
      - {id: feedback, role: operation-status, priority: supporting}
    composition:
      root: detail-workspace
      ordered_regions: [identity-context, current-facts, actions, history, feedback]
      current-facts:
        groups: [site, endpoints, responsibilities]
        interaction: contextual-editor
      history:
        pattern: DISCLOSURE
        priority: secondary
    reference_adaptation:
      sources: [RESOURCE-DETAIL-CONCEPT, MAIN-WEBUI-PRESENTATION]
      adopted:
        - full-width detail workspace
        - current facts before temporal history/provenance
        - secondary history remains directly inspectable
      not_adopted:
        - {reference_feature: legacy-detail-fields, reason: modern ResourceView and Resource contract remain semantic authority}
        - {reference_feature: legacy-mutation-shapes, reason: modern HTTP/current-state operations remain semantic authority}
    states: [loading, loaded, empty-current, not-found, submitting, validation-rejected, authorization-rejected, conflict, technical-error]
    semantic_contract:
      reads:
        - {id: detail, operation_id: getResource, projection: ResourceView}
      commands:
        - {id: add-endpoint, operation_id: addResourceEndpoint}
        - {id: set-address, operation_id: setEndpointAddress}
        - {id: clear-address, operation_id: clearEndpointAddress}
        - {id: set-site, operation_id: setResourceSite}
        - {id: set-responsibility, operation_id: setResourceResponsibility}
      view_model:
        id: ResourceDetailScreenModel
        fields:
          - {id: identity, source: read:detail.resourceRef}
          - {id: current, source: read:detail.current}
          - {id: history, source: read:detail.history}
          - {id: version, source: read:detail.version}
      capabilities:
        allowed:
          - {id: inspect-current, backed_by: read:detail}
          - {id: inspect-history, backed_by: read:detail}
          - {id: edit-current, backed_by: local:resource-current-editors}
        excluded: [delete-resource, bulk-operation]
      pattern_mapping:
        - {pattern: DETAIL, feature_bindings: {show-primary: inspect-current, show-secondary: inspect-history}}
        - {pattern: EDITOR, feature_bindings: {}}
        - {pattern: DISCLOSURE, feature_bindings: {}}
        - {pattern: TASK-ACTIONS, feature_bindings: {}}
        - {pattern: STATUS, feature_bindings: {}}
      state_mapping:
        loading: read:detail.pending
        loaded: read:detail.200
        empty-current: read:detail.200
        not-found: read:detail.404
        submitting: [command:add-endpoint.pending, command:set-address.pending, command:clear-address.pending, command:set-site.pending, command:set-responsibility.pending]
        validation-rejected: [command:set-address.422, command:set-site.422, command:set-responsibility.422]
        authorization-rejected: [read:detail.401, read:detail.403, command:add-endpoint.401, command:add-endpoint.403, command:set-address.401, command:set-address.403, command:clear-address.401, command:clear-address.403, command:set-site.401, command:set-site.403, command:set-responsibility.401, command:set-responsibility.403]
        conflict: [command:add-endpoint.409, command:set-address.409, command:clear-address.409, command:set-site.409, command:set-responsibility.409]
        technical-error: [read:detail.failure, command:add-endpoint.failure, command:set-address.failure, command:clear-address.failure, command:set-site.failure, command:set-responsibility.failure]
      verification:
        contract: [operation:getResource, operation:addResourceEndpoint, operation:setEndpointAddress, operation:clearEndpointAddress, operation:setResourceSite, operation:setResourceResponsibility]
        semantic: [resource-detail-current-history-command-state-closure]
        rendered: [resource-detail-reference-conformance]
    responsive:
      - current facts remain before historical facts in reading order
      - actions remain available with their affected fact group
      - history remains secondary but directly discoverable
    overrides: []

  - id: APPLICATION-CATALOGUE
    purpose: Locate/select reusable Applications and start supported Application creation.
    patterns: [CATALOGUE, FILTER-BAR, DATA-TABLE, EDITOR, TASK-ACTIONS, STATUS]
    regions:
      - {id: context, role: heading-context, priority: primary}
      - {id: query-controls, role: collection-query, pattern: FILTER-BAR, priority: primary, applies_when: list-mode}
      - {id: applications, role: collection, pattern: DATA-TABLE, priority: primary, applies_when: list-mode}
      - {id: create-editor, role: task-editor, pattern: EDITOR, priority: primary, applies_when: create-mode}
      - {id: actions, role: task-actions, priority: primary}
      - {id: feedback, role: operation-status, priority: supporting}
    composition:
      root: catalogue-workspace
      ordered_regions: [context, actions, query-controls, applications, create-editor, feedback]
      modes:
        list: [context, actions, query-controls, applications, feedback]
        create: [context, create-editor, feedback]
      query-controls:
        pattern: FILTER-BAR
        search: {source: query:listApplications.search, matches: [name, applicationRef]}
        filters:
          - {id: component-ref, source: query:listApplications.componentRef}
        sort:
          fields: [name, applicationRef]
          default: {field: name, direction: asc}
        paging: {page: query:listApplications.page, page_size: query:listApplications.pageSize}
      applications:
        pattern: DATA-TABLE
        columns:
          - {id: name, role: primary-identity, sort: name}
          - {id: application-reference, role: technical-identity, sort: applicationRef}
          - {id: components, role: child-summary}
        row_action: open-application
      create-editor:
        pattern: EDITOR
        fields:
          - {id: name, source: request:createApplication.name, required: true}
        submit_action: create-application
    primary_action_role: create-application
    exits:
      - select Application -> APPLICATION-DETAIL
    states: [loading, loaded, empty, editing, submitting, validation-rejected, authorization-rejected, conflict, technical-error]
    semantic_contract:
      reads:
        - id: catalogue
          operation_id: listApplications
          projection: ApplicationCataloguePage
          query:
            search: {source: local:query.search, semantics: accepted-text-search}
            componentRef: {source: local:query.filters.component-ref, semantics: exact-child-identity-filter}
            sortBy: {source: local:query.sort.field, accepted: [name, applicationRef]}
            sortDirection: {source: local:query.sort.direction, accepted: [asc, desc]}
            page: {source: local:query.page, minimum: 1}
            pageSize: {source: local:query.page-size, default: 25, maximum: 100}
      commands:
        - {id: create-application, operation_id: createApplication}
      view_model:
        id: ApplicationCatalogueScreenModel
        fields:
          - {id: applications, source: read:catalogue.items}
          - {id: total, source: read:catalogue.total}
          - {id: page, source: read:catalogue.page}
          - {id: page_size, source: read:catalogue.pageSize}
          - {id: application_ref, source: read:catalogue.items.applicationRef}
          - {id: name, source: read:catalogue.items.name}
          - {id: components, source: read:catalogue.items.components}
      capabilities:
        allowed:
          - {id: inspect-catalogue, backed_by: read:catalogue}
          - {id: search, backed_by: read:catalogue}
          - {id: filter, backed_by: read:catalogue}
          - {id: sort, backed_by: read:catalogue}
          - {id: pagination, backed_by: read:catalogue}
          - {id: open-application, backed_by: navigation:application-detail}
          - {id: create-application, backed_by: command:create-application}
        excluded: [bulk-operation, edit-item, delete-item]
      pattern_mapping:
        - {pattern: CATALOGUE, feature_bindings: {open-item: open-application, create-item: create-application}}
        - {pattern: FILTER-BAR, feature_bindings: {search: search, filters: filter, sort: sort, clear: filter}}
        - {pattern: DATA-TABLE, feature_bindings: {open-row: open-application, sort: sort, paging: pagination}}
        - {pattern: EDITOR, feature_bindings: {}}
        - {pattern: TASK-ACTIONS, feature_bindings: {primary: create-application}}
        - {pattern: STATUS, feature_bindings: {}}
      state_mapping:
        loading: read:catalogue.pending
        loaded: read:catalogue.200
        empty: read:catalogue.200
        editing: local:create-application-form
        submitting: command:create-application.pending
        validation-rejected: command:create-application.422
        authorization-rejected: [read:catalogue.401, read:catalogue.403, command:create-application.401, command:create-application.403]
        conflict: command:create-application.409
        technical-error: [read:catalogue.failure, command:create-application.failure]
      verification:
        contract: [operation:listApplications-query-parameters, operation:createApplication]
        semantic: [application-catalogue-query-capability-and-state-closure]
        rendered: [application-catalogue-filter-table-density-conformance]
    responsive:
      - application records preserve stable identity, component summary and open action
      - query controls reflow without losing active state or clear action
      - table may become labeled records while preserving labels and actions
    overrides: []

  - id: APPLICATION-DETAIL
    purpose: Author one reusable Application together with Components and directed Interactions.
    patterns: [DETAIL, EDITOR, STRUCTURED-LIST, DATA-TABLE, TASK-ACTIONS, STATUS]
    regions:
      - {id: application-context, role: heading-context, priority: primary}
      - {id: application-facts, role: primary-content, priority: primary}
      - {id: components, role: primary-content, pattern: STRUCTURED-LIST, priority: primary}
      - {id: interactions, role: primary-content, pattern: DATA-TABLE, priority: primary}
      - {id: actions, role: task-actions, priority: primary}
      - {id: feedback, role: operation-status, priority: supporting}
    composition:
      root: detail-workspace
      ordered_regions: [application-context, application-facts, components, interactions, actions, feedback]
      components: {pattern: STRUCTURED-LIST}
      interactions: {pattern: DATA-TABLE}
    action_hierarchy:
      application: edit-application
      components: add-or-edit-component
      interactions: add-or-edit-interaction
    states: [loading, loaded, empty-components, empty-interactions, submitting, validation-rejected, authorization-rejected, conflict, not-found, technical-error]
    responsive:
      - application context remains first
      - components precede interactions in reading order
      - interaction table may become labeled records while preserving source/target/reason/traffic distinctions and actions
    overrides: []

  - id: DEPLOYMENTS
    purpose: Locate/create Component deployments and open dedicated Deployment detail.
    patterns: [CATALOGUE, FILTER-BAR, DATA-TABLE, EDITOR, TASK-ACTIONS, STATUS]
    regions:
      - {id: context, role: heading-context, priority: primary}
      - {id: query-controls, role: collection-query, pattern: FILTER-BAR, priority: primary, applies_when: list-mode}
      - {id: deployments, role: collection, pattern: DATA-TABLE, priority: primary, applies_when: list-mode}
      - {id: create-editor, role: task-editor, pattern: EDITOR, priority: primary, applies_when: create-mode}
      - {id: actions, role: task-actions, priority: primary}
      - {id: feedback, role: operation-status, priority: supporting}
    composition:
      root: catalogue-workspace
      ordered_regions: [context, actions, query-controls, deployments, create-editor, feedback]
      modes:
        list: [context, actions, query-controls, deployments, feedback]
        create: [context, create-editor, feedback]
      query-controls:
        pattern: FILTER-BAR
        search: {source: query:listDeployments.search, matches: [deploymentRef, componentRef, resourceRef]}
        filters:
          - {id: component-ref, source: query:listDeployments.componentRef}
          - {id: resource-ref, source: query:listDeployments.resourceRef}
        sort:
          fields: [deploymentRef, componentRef, resourceRef]
          default: {field: deploymentRef, direction: asc}
        paging: {page: query:listDeployments.page, page_size: query:listDeployments.pageSize}
      deployments:
        pattern: DATA-TABLE
        columns:
          - {id: deployment-reference, role: primary-identity, sort: deploymentRef}
          - {id: component-reference, role: distinguishing-attribute, sort: componentRef}
          - {id: resource-reference, role: distinguishing-attribute, sort: resourceRef}
        row_action: open-deployment
      create-editor:
        pattern: EDITOR
        fields:
          - {id: component-ref, source: request:createDeployment.componentRef, required: true}
          - {id: resource-ref, source: request:createDeployment.resourceRef, required: true}
        submit_action: create-deployment
    primary_action_role: create-deployment
    exits:
      - select Deployment -> DEPLOYMENT-DETAIL
      - create Deployment -> DEPLOYMENT-DETAIL
    states: [loading, loaded, empty, editing, submitting, validation-rejected, authorization-rejected, technical-error]
    semantic_contract:
      reads:
        - id: catalogue
          operation_id: listDeployments
          projection: DeploymentCataloguePage
          query:
            search: {source: local:query.search, semantics: accepted-text-search}
            componentRef: {source: local:query.filters.component-ref, semantics: exact-attribute-filter}
            resourceRef: {source: local:query.filters.resource-ref, semantics: exact-attribute-filter}
            sortBy: {source: local:query.sort.field, accepted: [deploymentRef, componentRef, resourceRef]}
            sortDirection: {source: local:query.sort.direction, accepted: [asc, desc]}
            page: {source: local:query.page, minimum: 1}
            pageSize: {source: local:query.page-size, default: 25, maximum: 100}
      commands:
        - {id: create-deployment, operation_id: createDeployment}
      view_model:
        id: DeploymentScreenModel
        fields:
          - {id: deployments, source: read:catalogue.items}
          - {id: total, source: read:catalogue.total}
          - {id: page, source: read:catalogue.page}
          - {id: page_size, source: read:catalogue.pageSize}
          - {id: deployment_ref, source: read:catalogue.items.deploymentRef}
          - {id: component_ref, source: read:catalogue.items.componentRef}
          - {id: resource_ref, source: read:catalogue.items.resourceRef}
      capabilities:
        allowed:
          - {id: inspect-catalogue, backed_by: read:catalogue}
          - {id: search, backed_by: read:catalogue}
          - {id: filter, backed_by: read:catalogue}
          - {id: sort, backed_by: read:catalogue}
          - {id: pagination, backed_by: read:catalogue}
          - {id: open-deployment, backed_by: navigation:deployment-detail}
          - {id: create-deployment, backed_by: command:create-deployment}
        excluded: [bulk-operation, edit-item, delete-item]
      pattern_mapping:
        - {pattern: CATALOGUE, feature_bindings: {open-item: open-deployment, create-item: create-deployment}}
        - {pattern: FILTER-BAR, feature_bindings: {search: search, filters: filter, sort: sort, clear: filter}}
        - {pattern: DATA-TABLE, feature_bindings: {open-row: open-deployment, sort: sort, paging: pagination}}
        - {pattern: EDITOR, feature_bindings: {}}
        - {pattern: TASK-ACTIONS, feature_bindings: {primary: create-deployment}}
        - {pattern: STATUS, feature_bindings: {}}
      state_mapping:
        loading: read:catalogue.pending
        loaded: read:catalogue.200
        empty: read:catalogue.200
        editing: local:create-deployment-form
        submitting: command:create-deployment.pending
        validation-rejected: command:create-deployment.422
        authorization-rejected: [read:catalogue.401, read:catalogue.403, command:create-deployment.401, command:create-deployment.403]
        technical-error: [read:catalogue.failure, command:create-deployment.failure]
      verification:
        contract: [operation:listDeployments-query-parameters, operation:createDeployment]
        semantic: [deployment-catalogue-query-capability-and-state-closure]
        rendered: [deployment-catalogue-filter-table-conformance]
    responsive:
      - Deployment, Component and Resource identities remain explicit when the table reflows
      - query controls reflow without losing active state or clear action
    overrides: []

  - id: DEPLOYMENT-DETAIL
    purpose: Inspect one ComponentDeployment and the Resource realization it references.
    patterns: [DETAIL, STATUS]
    regions:
      - {id: identity-context, role: heading-context, priority: primary}
      - {id: realization, role: primary-content, priority: primary}
      - {id: feedback, role: operation-status, priority: supporting}
    composition:
      root: detail-workspace
      ordered_regions: [identity-context, realization, feedback]
    states: [loading, loaded, not-found, authorization-rejected, technical-error]
    semantic_contract:
      reads:
        - {id: detail, operation_id: getDeployment, projection: DeploymentView}
      commands: []
      view_model:
        id: DeploymentDetailScreenModel
        fields:
          - {id: deployment_ref, source: read:detail.deploymentRef}
          - {id: component_ref, source: read:detail.componentRef}
          - {id: resource_ref, source: read:detail.resourceRef}
      capabilities:
        allowed:
          - {id: inspect-deployment, backed_by: read:detail}
          - {id: return-to-catalogue, backed_by: navigation:deployments}
        excluded: [edit-deployment, delete-deployment, bulk-operation]
      pattern_mapping:
        - {pattern: DETAIL, feature_bindings: {show-primary: inspect-deployment}}
        - {pattern: STATUS, feature_bindings: {}}
      state_mapping:
        loading: read:detail.pending
        loaded: read:detail.200
        not-found: read:detail.404
        authorization-rejected: [read:detail.401, read:detail.403]
        technical-error: read:detail.failure
      verification:
        contract: [operation:getDeployment]
        semantic: [deployment-detail-read-state-closure]
        rendered: [deployment-detail-reference-conformance]
    responsive:
      - Component and Resource identities remain separately labeled
      - technical Deployment identity remains inspectable after reflow
    overrides: []

  - id: BUSINESS-CONNECTIVITY
    purpose: Locate/create Business Processes, inspect one Process, and manage its Connectivity Needs without conflating justification with permission.
    patterns: [CATALOGUE, FILTER-BAR, DATA-TABLE, DETAIL, EDITOR, STRUCTURED-LIST, TASK-ACTIONS, STATUS]
    regions:
      - {id: context, role: heading-context, priority: primary}
      - {id: query-controls, role: collection-query, pattern: FILTER-BAR, priority: primary, applies_when: list-mode}
      - {id: business-processes, role: collection, pattern: DATA-TABLE, priority: primary, applies_when: list-mode}
      - {id: process-detail, role: primary-content, pattern: DETAIL, priority: primary, applies_when: detail-mode}
      - {id: connectivity-needs, role: nested-relationship-collection, pattern: STRUCTURED-LIST, priority: primary, applies_when: detail-mode}
      - {id: editors, role: task-editor, pattern: EDITOR, priority: primary, applies_when: [create-mode, detail-mode]}
      - {id: actions, role: task-actions, priority: primary}
      - {id: feedback, role: operation-status, priority: supporting}
    composition:
      root: business-connectivity-workspace
      ordered_regions: [context, actions, query-controls, business-processes, process-detail, connectivity-needs, editors, feedback]
      modes:
        list: [context, actions, query-controls, business-processes, feedback]
        create: [context, editors, feedback]
        detail: [context, process-detail, connectivity-needs, editors, feedback]
      query-controls:
        pattern: FILTER-BAR
        search: {source: query:listBusinessProcesses.search, matches: [name, processRef]}
        filters:
          - {id: criticality-label, source: query:listBusinessProcesses.criticalityLabel}
          - {id: organization-reference, source: query:listBusinessProcesses.organizationExternalReference}
        sort:
          fields: [name, processRef, criticalityLabel]
          default: {field: name, direction: asc}
        paging: {page: query:listBusinessProcesses.page, page_size: query:listBusinessProcesses.pageSize}
      business-processes:
        pattern: DATA-TABLE
        columns:
          - {id: name, role: primary-identity, sort: name}
          - {id: criticality, role: distinguishing-attribute, sort: criticalityLabel}
          - {id: responsible-organization, role: distinguishing-attribute}
          - {id: process-reference, role: technical-identity, sort: processRef}
        row_action: open-business-process
      connectivity-needs:
        pattern: STRUCTURED-LIST
        role: nested-process-relationships
        row_action: retire-connectivity-need
    primary_action_role: create-business-process
    action_hierarchy:
      business_process: edit-business-process
      connectivity_need: manage-connectivity-need
    exits:
      - select Business Process -> BUSINESS-CONNECTIVITY detail route
      - create Business Process -> BUSINESS-CONNECTIVITY detail route
    states: [loading, loaded, empty, editing, submitting, validation-rejected, authorization-rejected, conflict, not-found, technical-error]
    semantic_contract:
      reads:
        - id: catalogue
          operation_id: listBusinessProcesses
          projection: BusinessProcessCataloguePage
          query:
            search: {source: local:query.search, semantics: accepted-text-search}
            criticalityLabel: {source: local:query.filters.criticality-label, semantics: exact-attribute-filter}
            organizationExternalReference: {source: local:query.filters.organization-reference, semantics: exact-attribute-filter}
            sortBy: {source: local:query.sort.field, accepted: [name, processRef, criticalityLabel]}
            sortDirection: {source: local:query.sort.direction, accepted: [asc, desc]}
            page: {source: local:query.page, minimum: 1}
            pageSize: {source: local:query.page-size, default: 25, maximum: 100}
        - {id: detail, operation_id: getBusinessProcess, projection: BusinessProcessView}
      commands:
        - {id: create-business-process, operation_id: createBusinessProcess}
        - {id: set-responsible-organization, operation_id: setProcessResponsibleOrganization}
        - {id: set-criticality, operation_id: setProcessCriticality}
        - {id: declare-connectivity-need, operation_id: declareConnectivityNeed}
        - {id: retire-connectivity-need, operation_id: retireConnectivityNeed}
      view_model:
        id: BusinessConnectivityScreenModel
        fields:
          - {id: processes, source: read:catalogue.items}
          - {id: total, source: read:catalogue.total}
          - {id: page, source: read:catalogue.page}
          - {id: page_size, source: read:catalogue.pageSize}
          - {id: process_ref, source: read:detail.processRef}
          - {id: name, source: read:detail.name}
          - {id: description, source: read:detail.description}
          - {id: criticality_label, source: read:detail.criticalityLabel}
          - {id: organization_external_reference, source: read:detail.organizationExternalReference}
          - {id: organization_display_name, source: read:detail.organizationDisplayName}
          - {id: version, source: read:detail.version}
          - {id: needs, source: read:detail.needs}
      capabilities:
        allowed:
          - {id: inspect-catalogue, backed_by: read:catalogue}
          - {id: search, backed_by: read:catalogue}
          - {id: filter, backed_by: read:catalogue}
          - {id: sort, backed_by: read:catalogue}
          - {id: pagination, backed_by: read:catalogue}
          - {id: open-business-process, backed_by: navigation:business-process-detail}
          - {id: create-business-process, backed_by: command:create-business-process}
          - {id: inspect-business-process, backed_by: read:detail}
          - {id: edit-business-process, backed_by: command:set-responsible-organization}
          - {id: set-criticality, backed_by: command:set-criticality}
          - {id: manage-connectivity-need, backed_by: command:declare-connectivity-need}
          - {id: retire-connectivity-need, backed_by: command:retire-connectivity-need}
        excluded: [bulk-operation, inline-edit-business-process, permission-outcome-edit]
      pattern_mapping:
        - {pattern: CATALOGUE, feature_bindings: {open-item: open-business-process, create-item: create-business-process}}
        - {pattern: FILTER-BAR, feature_bindings: {search: search, filters: filter, sort: sort, clear: filter}}
        - {pattern: DATA-TABLE, feature_bindings: {open-row: open-business-process, sort: sort, paging: pagination}}
        - {pattern: DETAIL, feature_bindings: {show-primary: inspect-business-process}}
        - {pattern: EDITOR, feature_bindings: {}}
        - {pattern: STRUCTURED-LIST, feature_bindings: {row-action: retire-connectivity-need}}
        - {pattern: TASK-ACTIONS, feature_bindings: {primary: create-business-process}}
        - {pattern: STATUS, feature_bindings: {}}
      state_mapping:
        loading: [read:catalogue.pending, read:detail.pending]
        loaded: [read:catalogue.200, read:detail.200]
        empty: read:catalogue.200
        editing: local:business-connectivity-editor
        submitting: [command:create-business-process.pending, command:set-responsible-organization.pending, command:set-criticality.pending, command:declare-connectivity-need.pending, command:retire-connectivity-need.pending]
        validation-rejected: [command:create-business-process.422, command:set-responsible-organization.422, command:set-criticality.422, command:declare-connectivity-need.422, command:retire-connectivity-need.422]
        authorization-rejected: [read:catalogue.401, read:catalogue.403, read:detail.401, read:detail.403, command:create-business-process.401, command:create-business-process.403, command:set-responsible-organization.401, command:set-responsible-organization.403, command:set-criticality.401, command:set-criticality.403, command:declare-connectivity-need.401, command:declare-connectivity-need.403, command:retire-connectivity-need.401, command:retire-connectivity-need.403]
        conflict: [command:set-responsible-organization.409, command:set-criticality.409, command:declare-connectivity-need.409, command:retire-connectivity-need.409]
        not-found: read:detail.404
        technical-error: [read:catalogue.failure, read:detail.failure, command:create-business-process.failure, command:set-responsible-organization.failure, command:set-criticality.failure, command:declare-connectivity-need.failure, command:retire-connectivity-need.failure]
      verification:
        contract: [operation:listBusinessProcesses-query-parameters, operation:getBusinessProcess, operation:createBusinessProcess, operation:setProcessResponsibleOrganization, operation:setProcessCriticality, operation:declareConnectivityNeed, operation:retireConnectivityNeed]
        semantic: [business-process-catalogue-query-capability-and-state-closure, connectivity-need-remains-nested-business-justification]
        rendered: [business-process-filter-table-detail-conformance]
    responsive:
      - Business Process identity and accepted distinguishing attributes remain visible when the catalogue reflows
      - query controls reflow without losing active state or clear action
      - Connectivity Needs remain labeled nested records inside the selected Business Process detail
    overrides: []

  - id: ACCESS-REQUESTS
    purpose: Submit connectivity requests and inspect immutable permission outcomes under backend-confirmed authority.
    patterns: [CATALOGUE, DETAIL, EDITOR, STRUCTURED-LIST, OUTCOME, TASK-ACTIONS, STATUS]
    regions:
      - {id: context, role: heading-context, priority: primary}
      - {id: requests, role: collection, priority: primary}
      - {id: request-composer, role: task-editor, priority: primary}
      - {id: selected-outcome, role: authoritative-outcome, pattern: OUTCOME, priority: primary}
      - {id: actions, role: task-actions, priority: primary}
      - {id: feedback, role: operation-status, priority: supporting}
    composition:
      root: request-outcome-workspace
      ordered_regions: [context, actions, requests, request-composer, selected-outcome, feedback]
      selected-outcome: {pattern: OUTCOME}
    primary_action_role: submit-request
    authority_rule: Visible/enabled controls never establish request authority; backend admission is authoritative.
    states: [loading, loaded, empty, submitting, validation-rejected, authorization-rejected, conflict, outcome-allowed, outcome-not-allowed, technical-error]
    responsive:
      - request composer and outcome become sequential regions
      - immutable request subject and permission outcome remain jointly inspectable
    overrides: []

  - id: POLICY-RULES
    purpose: Inspect authoritative desired-access rules and change supported Active/Inactive operational state.
    patterns: [CATALOGUE, DETAIL, STRUCTURED-LIST, OUTCOME, TASK-ACTIONS, STATUS]
    regions:
      - {id: context, role: heading-context, priority: primary}
      - {id: rules, role: collection, priority: primary}
      - {id: selected-rule, role: authoritative-detail, priority: primary}
      - {id: provenance-history, role: secondary-content, priority: secondary}
      - {id: actions, role: task-actions, priority: primary}
      - {id: feedback, role: operation-status, priority: supporting}
    composition:
      root: rule-workspace
      ordered_regions: [context, actions, rules, selected-rule, provenance-history, feedback]
    primary_action_role: change-supported-operational-state
    states: [loading, loaded, empty, submitting, authorization-rejected, conflict, not-found, technical-error]
    responsive:
      - selected rule identity/state stays before provenance/history
      - rule list may become labeled records
    overrides: []

  - id: POLICY-EXPORT
    purpose: Select effective policy scope, execute normalized export and inspect completeness diagnostics.
    patterns: [SCOPE-SELECTOR, OUTCOME, TASK-ACTIONS, STATUS]
    regions:
      - {id: context, role: heading-context, priority: primary}
      - {id: scope, role: operation-input, pattern: SCOPE-SELECTOR, priority: primary}
      - {id: actions, role: task-actions, priority: primary}
      - {id: export-result, role: authoritative-outcome, pattern: OUTCOME, priority: primary}
      - {id: diagnostics, role: secondary-content, priority: primary}
      - {id: provenance, role: secondary-content, priority: secondary}
      - {id: feedback, role: operation-status, priority: supporting}
    composition:
      root: operation-outcome-workspace
      ordered_regions: [context, scope, actions, export-result, diagnostics, provenance, feedback]
      export-result: {pattern: OUTCOME}
    primary_action_role: execute-export
    authority_rule: Visible/enabled controls never establish export authority; backend admission is authoritative.
    states: [editing, submitting, complete-success, unresolved-or-degraded, validation-rejected, authorization-rejected, technical-error]
    semantic_contract:
      reads: []
      commands:
        - {id: materialize-policy, operation_id: materializeCurrentPolicy, projection: PolicyMaterializationResult}
      view_model:
        id: PolicyExportScreenModel
        fields:
          - {id: result, source: command:materialize-policy}
          - {id: status, source: command:materialize-policy.status}
          - {id: provenance, source: command:materialize-policy.ruleProvenance}
          - {id: issues, source: command:materialize-policy.issues}
      capabilities:
        allowed:
          - {id: select-scope, backed_by: local:policy-scope-selection}
          - {id: execute-export, backed_by: command:materialize-policy}
          - {id: inspect-outcome, backed_by: command:materialize-policy}
        excluded: [search, filter, sort, bulk-edit, implicit-success-on-unresolved]
      pattern_mapping:
        - {pattern: SCOPE-SELECTOR, feature_bindings: {}}
        - {pattern: OUTCOME, feature_bindings: {summary: inspect-outcome, details: inspect-outcome, provenance: inspect-outcome}}
        - {pattern: TASK-ACTIONS, feature_bindings: {primary: execute-export}}
        - {pattern: STATUS, feature_bindings: {}}
      state_mapping:
        editing: local:policy-scope-selection
        submitting: command:materialize-policy.pending
        complete-success: command:materialize-policy.200-COMPLETE
        unresolved-or-degraded: command:materialize-policy.200-UNRESOLVED
        validation-rejected: command:materialize-policy.422
        authorization-rejected: [command:materialize-policy.401, command:materialize-policy.403]
        technical-error: command:materialize-policy.failure
      verification:
        contract: [operation:materializeCurrentPolicy]
        semantic: [policy-export-complete-vs-unresolved-state-closure]
        rendered: [policy-export-outcome-conformance]
    responsive:
      - scope and execute action remain visible before result
      - completeness diagnostics remain distinct from technical failure
      - provenance remains inspectable after reflow
    overrides: []

global_rules:
  - every screen inherits NAPMS-MVP-PRESENTATION-SYSTEM;
  - no screen redefines common visual/presentation rules locally without an explicit justified override;
  - required data and actions remain traceable to accepted Human Interface and HTTP/application contracts;
  - responsive transformations preserve semantic labels, distinctions and action availability;
  - screen composition does not create domain or authorization semantics;
  - optional catalogue controls exist only when accepted machine/application semantics support them.

coverage:
  required_workspaces:
    - RESOURCE-CATALOGUE
    - RESOURCE-DETAIL
    - APPLICATION-CATALOGUE
    - APPLICATION-DETAIL
    - DEPLOYMENTS
    - DEPLOYMENT-DETAIL
    - BUSINESS-CONNECTIVITY
    - ACCESS-REQUESTS
    - POLICY-RULES
    - POLICY-EXPORT
  semantic_contract_pilot: [RESOURCE-CATALOGUE, RESOURCE-DETAIL, APPLICATION-CATALOGUE, DEPLOYMENTS, DEPLOYMENT-DETAIL, BUSINESS-CONNECTIVITY, POLICY-EXPORT]
  rule: FRONTEND-IMPLEMENTATION is not presentation-complete unless every required workspace has explicit composition and inherits the shared Presentation System; pilot screens additionally require machine-checked semantic closure.
