version: 1
kind: screen-view-design
id: NAPMS-MVP-SCREEN-VIEW-DESIGN
status: CURRENT
inherits: NAPMS-MVP-PRESENTATION-SYSTEM

purpose: >-
  Define concrete first-MVP composition for every canonical NAPMS browser
  workspace while inheriting shared presentation decisions from
  NAPMS-MVP-PRESENTATION-SYSTEM.

basis:
  human_interface: docs/contracts/ui/mvp-human-interface.yaml
  navigation: docs/contracts/ui/mvp-navigation.yaml
  presentation_system: docs/contracts/ui/mvp-presentation-system.yaml
  resource_detail: docs/contracts/ui/resource-detail.yaml
  http: docs/contracts/http/napms.openapi.yaml

composition_contract:
  rule: >-
    Every screen declares ordered composition in addition to semantic regions.
    Pattern ids alone are insufficient when nesting/order affects hierarchy or
    accepted presentation intent.
  reference_rule: >-
    Historical references constrain only explicitly adopted presentation facts.
    Unsupported controls or fields are recorded as not-adopted rather than
    recreated as client-only product behavior.
  inherited_entity_collection_default: NAPMS-MVP-PRESENTATION-SYSTEM.entity_collection_default
  migration_gaps:
    - id: entity-catalogue-query-contracts
      applies_to: [RESOURCE-CATALOGUE, APPLICATION-CATALOGUE, DEPLOYMENTS, BUSINESS-CONNECTIVITY, ACCESS-REQUESTS, POLICY-RULES]
      gap: >-
        Search/filter/sort and scalable paging semantics are not yet closed end-to-end
        through accepted query contracts for every primary entity collection.
    - id: primary-catalogue-table-adoption
      applies_to: [APPLICATION-CATALOGUE, DEPLOYMENTS, BUSINESS-CONNECTIVITY, ACCESS-REQUESTS, POLICY-RULES]
      gap: >-
        Current realization still uses STRUCTURED-LIST for some primary entity
        collections; migrate them to DATA-TABLE unless an explicit override is accepted.
    - id: deployment-detail-drilldown
      applies_to: [DEPLOYMENTS]
      gap: >-
        Deployment selection does not yet open a dedicated entity detail view.

screens:
  - id: RESOURCE-CATALOGUE
    purpose: Locate/select Resources and start supported Resource authoring.
    patterns: [CATALOGUE, DATA-TABLE, EDITOR, TASK-ACTIONS, STATUS]
    regions:
      - {id: context, role: heading-context, priority: primary}
      - {id: resources, role: collection, pattern: DATA-TABLE, priority: primary, applies_when: list-mode}
      - {id: create-editor, role: task-editor, pattern: EDITOR, priority: primary, applies_when: create-mode}
      - {id: actions, role: task-actions, priority: primary}
      - {id: feedback, role: operation-status, priority: supporting}
    composition:
      root: catalogue-workspace
      ordered_regions: [context, actions, resources, create-editor, feedback]
      modes:
        list: [context, actions, resources, feedback]
        create: [context, create-editor, feedback]
      resources:
        pattern: DATA-TABLE
        columns:
          - {id: display-name, role: primary-identity}
          - {id: resource-reference, role: technical-identity}
          - {id: site, role: current-fact}
          - {id: endpoints, role: current-fact-summary}
          - {id: responsibilities, role: current-fact-summary}
        row_action: open-resource
      create-editor:
        pattern: EDITOR
        fields:
          - {id: display-name, source: request:createResource.displayName, required: true}
          - {id: authority-scope-ref, source: request:createResource.authorityScopeRef, required: true}
          - {id: site-ref, source: request:createResource.siteRef, required: false}
        submit_action: create-resource
    reference_adaptation:
      sources: [RESOURCE-CATALOGUE-CONCEPT, MAIN-WEBUI-PRESENTATION]
      adopted:
        - dark fixed-width desktop navigation and full-width operational workspace
        - compact hierarchy and dense table visual language
        - human-readable primary identity with technical reference subordinate
      not_adopted:
        - {reference_feature: search, reason: listResources has no accepted search contract}
        - {reference_feature: filters-and-quick-filters, reason: no accepted First-MVP filtering contract}
        - {reference_feature: sorting, reason: no accepted First-MVP ordering contract}
        - {reference_feature: pagination-and-page-size, reason: no accepted First-MVP paging contract}
        - {reference_feature: selection-and-bulk-actions, reason: no accepted First-MVP bulk action semantics}
        - {reference_feature: Resource-type-filter, reason: no accepted Resource type concept}
        - {reference_feature: New-Resource-modal, reason: current First-MVP navigation uses the accepted authoring route/state}
    primary_action_role: create-resource
    exits:
      - select Resource -> RESOURCE-DETAIL
    states: [loading, loaded, empty, editing, submitting, validation-rejected, authorization-rejected, conflict, technical-error]
    semantic_contract:
      reads:
        - {id: catalogue, operation_id: listResources, projection: "ResourceView[]"}
      commands:
        - {id: create-resource, operation_id: createResource}
      view_model:
        id: ResourceCatalogueScreenModel
        fields:
          - {id: resources, source: read:catalogue}
          - {id: display_name, source: read:catalogue.displayName}
          - {id: resource_ref, source: read:catalogue.resourceRef}
          - {id: current, source: read:catalogue.current}
      capabilities:
        allowed:
          - {id: inspect-catalogue, backed_by: read:catalogue}
          - {id: open-resource, backed_by: navigation:resource-detail}
          - {id: create-resource, backed_by: command:create-resource}
        excluded: [search, filter, sort, pagination, bulk-operation, edit-item, delete-item]
      pattern_mapping:
        - {pattern: CATALOGUE, feature_bindings: {open-item: open-resource, create-item: create-resource}}
        - {pattern: DATA-TABLE, feature_bindings: {}}
        - {pattern: EDITOR, feature_bindings: {}}
        - {pattern: TASK-ACTIONS, feature_bindings: {primary: create-resource}}
        - {pattern: STATUS, feature_bindings: {}}
      state_mapping:
        loading: read:catalogue.pending
        loaded: read:catalogue.200
        empty: read:catalogue.200
        editing: local:create-resource-form
        submitting: command:create-resource.pending
        validation-rejected: command:create-resource.422
        authorization-rejected: [read:catalogue.401, read:catalogue.403, command:create-resource.401, command:create-resource.403]
        conflict: command:create-resource.409
        technical-error: [read:catalogue.failure, command:create-resource.failure]
      verification:
        contract: [operation:listResources, operation:createResource]
        semantic: [resource-catalogue-capability-and-state-closure]
        rendered: [resource-catalogue-reference-conformance]
    responsive:
      - collection preserves Resource identity, current distinguishing facts and open action
      - table may become labeled records while preserving column labels and actions
    overrides: []

  - id: RESOURCE-DETAIL
    purpose: Inspect and author one Resource current state and inspect history.
    patterns: [DETAIL, EDITOR, DISCLOSURE, TASK-ACTIONS, STATUS]
    source_contract: docs/contracts/ui/resource-detail.yaml
    regions:
      - {id: identity-context, role: heading-context, priority: primary}
      - {id: current-facts, role: primary-content, priority: primary}
      - {id: actions, role: task-actions, priority: primary}
      - {id: history, role: secondary-content, pattern: DISCLOSURE, priority: secondary}
      - {id: feedback, role: operation-status, priority: supporting}
    composition:
      root: detail-workspace
      ordered_regions: [identity-context, current-facts, actions, history, feedback]
      current-facts:
        groups: [site, endpoints, responsibilities]
        interaction: contextual-editor
      history:
        pattern: DISCLOSURE
        priority: secondary
    reference_adaptation:
      sources: [RESOURCE-DETAIL-CONCEPT, MAIN-WEBUI-PRESENTATION]
      adopted:
        - full-width detail workspace
        - current facts before temporal history/provenance
        - secondary history remains directly inspectable
      not_adopted:
        - {reference_feature: legacy-detail-fields, reason: modern ResourceView and Resource contract remain semantic authority}
        - {reference_feature: legacy-mutation-shapes, reason: modern HTTP/current-state operations remain semantic authority}
    states: [loading, loaded, empty-current, not-found, submitting, validation-rejected, authorization-rejected, conflict, technical-error]
    semantic_contract:
      reads:
        - {id: detail, operation_id: getResource, projection: ResourceView}
      commands:
        - {id: add-endpoint, operation_id: addResourceEndpoint}
        - {id: set-address, operation_id: setEndpointAddress}
        - {id: clear-address, operation_id: clearEndpointAddress}
        - {id: set-site, operation_id: setResourceSite}
        - {id: set-responsibility, operation_id: setResourceResponsibility}
      view_model:
        id: ResourceDetailScreenModel
        fields:
          - {id: identity, source: read:detail.resourceRef}
          - {id: current, source: read:detail.current}
          - {id: history, source: read:detail.history}
          - {id: version, source: read:detail.version}
      capabilities:
        allowed:
          - {id: inspect-current, backed_by: read:detail}
          - {id: inspect-history, backed_by: read:detail}
          - {id: edit-current, backed_by: local:resource-current-editors}
        excluded: [delete-resource, bulk-operation]
      pattern_mapping:
        - {pattern: DETAIL, feature_bindings: {show-primary: inspect-current, show-secondary: inspect-history}}
        - {pattern: EDITOR, feature_bindings: {}}
        - {pattern: DISCLOSURE, feature_bindings: {}}
        - {pattern: TASK-ACTIONS, feature_bindings: {}}
        - {pattern: STATUS, feature_bindings: {}}
      state_mapping:
        loading: read:detail.pending
        loaded: read:detail.200
        empty-current: read:detail.200
        not-found: read:detail.404
        submitting: [command:add-endpoint.pending, command:set-address.pending, command:clear-address.pending, command:set-site.pending, command:set-responsibility.pending]
        validation-rejected: [command:set-address.422, command:set-site.422, command:set-responsibility.422]
        authorization-rejected: [read:detail.401, read:detail.403, command:add-endpoint.401, command:add-endpoint.403, command:set-address.401, command:set-address.403, command:clear-address.401, command:clear-address.403, command:set-site.401, command:set-site.403, command:set-responsibility.401, command:set-responsibility.403]
        conflict: [command:add-endpoint.409, command:set-address.409, command:clear-address.409, command:set-site.409, command:set-responsibility.409]
        technical-error: [read:detail.failure, command:add-endpoint.failure, command:set-address.failure, command:clear-address.failure, command:set-site.failure, command:set-responsibility.failure]
      verification:
        contract: [operation:getResource, operation:addResourceEndpoint, operation:setEndpointAddress, operation:clearEndpointAddress, operation:setResourceSite, operation:setResourceResponsibility]
        semantic: [resource-detail-current-history-command-state-closure]
        rendered: [resource-detail-reference-conformance]
    responsive:
      - current facts remain before historical facts in reading order
      - actions remain available with their affected fact group
      - history remains secondary but directly discoverable
    overrides: []

  - id: APPLICATION-CATALOGUE
    purpose: Locate/select reusable Applications and start supported Application creation.
    patterns: [CATALOGUE, STRUCTURED-LIST, EDITOR, TASK-ACTIONS, STATUS]
    regions:
      - {id: context, role: heading-context, priority: primary}
      - {id: applications, role: collection, pattern: STRUCTURED-LIST, priority: primary, applies_when: list-mode}
      - {id: create-editor, role: task-editor, pattern: EDITOR, priority: primary, applies_when: create-mode}
      - {id: actions, role: task-actions, priority: primary}
      - {id: feedback, role: operation-status, priority: supporting}
    composition:
      root: catalogue-workspace
      ordered_regions: [context, actions, applications, create-editor, feedback]
      modes:
        list: [context, actions, applications, feedback]
        create: [context, create-editor, feedback]
      applications: {pattern: STRUCTURED-LIST, row_action: open-application}
      create-editor:
        pattern: EDITOR
        fields:
          - {id: name, source: request:createApplication.name, required: true}
        submit_action: create-application
    primary_action_role: create-application
    exits:
      - select Application -> APPLICATION-DETAIL
    states: [loading, loaded, empty, editing, submitting, validation-rejected, authorization-rejected, conflict, technical-error]
    responsive:
      - application records preserve stable identity and open action
      - collection may transform to labeled records
    overrides: []

  - id: APPLICATION-DETAIL
    purpose: Author one reusable Application together with Components and directed Interactions.
    patterns: [DETAIL, EDITOR, STRUCTURED-LIST, DATA-TABLE, TASK-ACTIONS, STATUS]
    regions:
      - {id: application-context, role: heading-context, priority: primary}
      - {id: application-facts, role: primary-content, priority: primary}
      - {id: components, role: primary-content, pattern: STRUCTURED-LIST, priority: primary}
      - {id: interactions, role: primary-content, pattern: DATA-TABLE, priority: primary}
      - {id: actions, role: task-actions, priority: primary}
      - {id: feedback, role: operation-status, priority: supporting}
    composition:
      root: detail-workspace
      ordered_regions: [application-context, application-facts, components, interactions, actions, feedback]
      components: {pattern: STRUCTURED-LIST}
      interactions: {pattern: DATA-TABLE}
    action_hierarchy:
      application: edit-application
      components: add-or-edit-component
      interactions: add-or-edit-interaction
    states: [loading, loaded, empty-components, empty-interactions, submitting, validation-rejected, authorization-rejected, conflict, not-found, technical-error]
    responsive:
      - application context remains first
      - components precede interactions in reading order
      - interaction table may become labeled records while preserving source/target/reason/traffic distinctions and actions
    overrides: []

  - id: DEPLOYMENTS
    purpose: Locate/create Component deployments and inspect their Resource realization.
    patterns: [CATALOGUE, DETAIL, EDITOR, STRUCTURED-LIST, TASK-ACTIONS, STATUS]
    regions:
      - {id: context, role: heading-context, priority: primary}
      - {id: deployments, role: collection, priority: primary}
      - {id: selected-deployment, role: detail-editor, priority: primary}
      - {id: actions, role: task-actions, priority: primary}
      - {id: feedback, role: operation-status, priority: supporting}
    composition:
      root: split-collection-detail-workspace
      ordered_regions: [context, actions, deployments, selected-deployment, feedback]
    primary_action_role: create-deployment
    states: [loading, loaded, empty, submitting, validation-rejected, authorization-rejected, conflict, not-found, technical-error]
    responsive:
      - collection and selected detail stack with collection first
      - Component and Resource identities remain explicit and distinct
    overrides: []

  - id: BUSINESS-CONNECTIVITY
    purpose: Manage Business Processes and Connectivity Needs while preserving business justification independently from permission.
    patterns: [CATALOGUE, DETAIL, EDITOR, STRUCTURED-LIST, TASK-ACTIONS, STATUS]
    regions:
      - {id: context, role: heading-context, priority: primary}
      - {id: business-processes, role: collection-detail, priority: primary}
      - {id: connectivity-needs, role: collection-detail, priority: primary}
      - {id: actions, role: task-actions, priority: primary}
      - {id: feedback, role: operation-status, priority: supporting}
    composition:
      root: relationship-workspace
      ordered_regions: [context, actions, business-processes, connectivity-needs, feedback]
    action_hierarchy:
      business_process: create-or-edit-business-process
      connectivity_need: create-or-retire-connectivity-need
    states: [loading, loaded, empty, submitting, validation-rejected, authorization-rejected, conflict, technical-error]
    responsive:
      - Business Process context precedes related Connectivity Need composition
      - relationship labels remain visible when collections stack
    overrides: []

  - id: ACCESS-REQUESTS
    purpose: Submit connectivity requests and inspect immutable permission outcomes under backend-confirmed authority.
    patterns: [CATALOGUE, DETAIL, EDITOR, STRUCTURED-LIST, OUTCOME, TASK-ACTIONS, STATUS]
    regions:
      - {id: context, role: heading-context, priority: primary}
      - {id: requests, role: collection, priority: primary}
      - {id: request-composer, role: task-editor, priority: primary}
      - {id: selected-outcome, role: authoritative-outcome, pattern: OUTCOME, priority: primary}
      - {id: actions, role: task-actions, priority: primary}
      - {id: feedback, role: operation-status, priority: supporting}
    composition:
      root: request-outcome-workspace
      ordered_regions: [context, actions, requests, request-composer, selected-outcome, feedback]
      selected-outcome: {pattern: OUTCOME}
    primary_action_role: submit-request
    authority_rule: Visible/enabled controls never establish request authority; backend admission is authoritative.
    states: [loading, loaded, empty, submitting, validation-rejected, authorization-rejected, conflict, outcome-allowed, outcome-not-allowed, technical-error]
    responsive:
      - request composer and outcome become sequential regions
      - immutable request subject and permission outcome remain jointly inspectable
    overrides: []

  - id: POLICY-RULES
    purpose: Inspect authoritative desired-access rules and change supported Active/Inactive operational state.
    patterns: [CATALOGUE, DETAIL, STRUCTURED-LIST, OUTCOME, TASK-ACTIONS, STATUS]
    regions:
      - {id: context, role: heading-context, priority: primary}
      - {id: rules, role: collection, priority: primary}
      - {id: selected-rule, role: authoritative-detail, priority: primary}
      - {id: provenance-history, role: secondary-content, priority: secondary}
      - {id: actions, role: task-actions, priority: primary}
      - {id: feedback, role: operation-status, priority: supporting}
    composition:
      root: rule-workspace
      ordered_regions: [context, actions, rules, selected-rule, provenance-history, feedback]
    primary_action_role: change-supported-operational-state
    states: [loading, loaded, empty, submitting, authorization-rejected, conflict, not-found, technical-error]
    responsive:
      - selected rule identity/state stays before provenance/history
      - rule list may become labeled records
    overrides: []

  - id: POLICY-EXPORT
    purpose: Select effective policy scope, execute normalized export and inspect completeness diagnostics.
    patterns: [SCOPE-SELECTOR, OUTCOME, TASK-ACTIONS, STATUS]
    regions:
      - {id: context, role: heading-context, priority: primary}
      - {id: scope, role: operation-input, pattern: SCOPE-SELECTOR, priority: primary}
      - {id: actions, role: task-actions, priority: primary}
      - {id: export-result, role: authoritative-outcome, pattern: OUTCOME, priority: primary}
      - {id: diagnostics, role: secondary-content, priority: primary}
      - {id: provenance, role: secondary-content, priority: secondary}
      - {id: feedback, role: operation-status, priority: supporting}
    composition:
      root: operation-outcome-workspace
      ordered_regions: [context, scope, actions, export-result, diagnostics, provenance, feedback]
      export-result: {pattern: OUTCOME}
    primary_action_role: execute-export
    authority_rule: Visible/enabled controls never establish export authority; backend admission is authoritative.
    states: [editing, submitting, complete-success, unresolved-or-degraded, validation-rejected, authorization-rejected, technical-error]
    semantic_contract:
      reads: []
      commands:
        - {id: materialize-policy, operation_id: materializeCurrentPolicy, projection: PolicyMaterializationResult}
      view_model:
        id: PolicyExportScreenModel
        fields:
          - {id: result, source: command:materialize-policy}
          - {id: status, source: command:materialize-policy.status}
          - {id: provenance, source: command:materialize-policy.ruleProvenance}
          - {id: issues, source: command:materialize-policy.issues}
      capabilities:
        allowed:
          - {id: select-scope, backed_by: local:policy-scope-selection}
          - {id: execute-export, backed_by: command:materialize-policy}
          - {id: inspect-outcome, backed_by: command:materialize-policy}
        excluded: [search, filter, sort, bulk-edit, implicit-success-on-unresolved]
      pattern_mapping:
        - {pattern: SCOPE-SELECTOR, feature_bindings: {}}
        - {pattern: OUTCOME, feature_bindings: {summary: inspect-outcome, details: inspect-outcome, provenance: inspect-outcome}}
        - {pattern: TASK-ACTIONS, feature_bindings: {primary: execute-export}}
        - {pattern: STATUS, feature_bindings: {}}
      state_mapping:
        editing: local:policy-scope-selection
        submitting: command:materialize-policy.pending
        complete-success: command:materialize-policy.200-COMPLETE
        unresolved-or-degraded: command:materialize-policy.200-UNRESOLVED
        validation-rejected: command:materialize-policy.422
        authorization-rejected: [command:materialize-policy.401, command:materialize-policy.403]
        technical-error: command:materialize-policy.failure
      verification:
        contract: [operation:materializeCurrentPolicy]
        semantic: [policy-export-complete-vs-unresolved-state-closure]
        rendered: [policy-export-outcome-conformance]
    responsive:
      - scope and execute action remain visible before result
      - completeness diagnostics remain distinct from technical failure
      - provenance remains inspectable after reflow
    overrides: []

global_rules:
  - every screen inherits NAPMS-MVP-PRESENTATION-SYSTEM;
  - no screen redefines common visual/presentation rules locally without an explicit justified override;
  - required data and actions remain traceable to accepted Human Interface and HTTP/application contracts;
  - responsive transformations preserve semantic labels, distinctions and action availability;
  - screen composition does not create domain or authorization semantics;
  - optional catalogue controls exist only when accepted machine/application semantics support them.

coverage:
  required_workspaces:
    - RESOURCE-CATALOGUE
    - RESOURCE-DETAIL
    - APPLICATION-CATALOGUE
    - APPLICATION-DETAIL
    - DEPLOYMENTS
    - BUSINESS-CONNECTIVITY
    - ACCESS-REQUESTS
    - POLICY-RULES
    - POLICY-EXPORT
  semantic_contract_pilot: [RESOURCE-CATALOGUE, RESOURCE-DETAIL, POLICY-EXPORT]
  rule: FRONTEND-IMPLEMENTATION is not presentation-complete unless every required workspace has explicit composition and inherits the shared Presentation System; pilot screens additionally require machine-checked semantic closure.
