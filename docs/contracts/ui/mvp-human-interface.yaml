version: 1
kind: human-interface-design
id: NAPMS-MVP-HUMAN-INTERFACE
status: CURRENT

purpose: Define the accepted first-MVP browser interaction contract for every user-facing subject derived from accepted product scope.

basis:
  requirements: docs/requirements/first-mvp-product-requirements.yaml
  subject_obligations: docs/harness/coverage/frontend-subject-obligations-v1.yaml
  navigation: docs/contracts/ui/mvp-navigation.yaml
  resource_detail: docs/contracts/ui/resource-detail.yaml
  http: docs/contracts/http/napms.openapi.yaml

principles:
  - Frontend controls never establish domain truth or security authority.
  - Stable product identifiers are used for navigation; database-row identities are never user contracts.
  - State-changing actions expose outcome and refresh authoritative server state.
  - Loading, empty, not-found, rejected, conflict and technical-error states are visibly distinct.
  - Historical/provenance information required to explain current state remains inspectable.
  - Relationship authoring prefers recognition over identifier recall: accepted human-readable candidate labels are primary while stable identifiers remain submitted reference values.

accessibility:
  - Required information and state distinctions are conveyed by semantic text/structure, not color alone.
  - All required actions are keyboard reachable with visible focus.
  - Validation/error/status feedback is associated with the affected operation or field.

responsiveness:
  - Required facts, primary actions and failure/retry states remain available at ordinary desktop and narrower browser widths.
  - Exact breakpoints remain implementation decisions.

internationalization:
  state: NOT_APPLICABLE
  rationale: No multilingual/localization requirement is accepted for first MVP.
  reopening_condition: A product requirement introduces multiple locales or localized formatting/content.

development_authentication:
  applicability: NAPMS_ENVIRONMENT=local-dev only
  purpose: Gate the product shell until the developer has acquired the accepted bearer identity.
  credentials: {login: admin, password: admin}
  interaction:
    inputs: [login, password]
    success: Acquire the local OIDC-backed bearer token and enter the originally requested product route.
    rejection: Remain on the sign-in view with generic invalid-credentials feedback.
    dependency_failure: Remain on the sign-in view with retryable technical-failure feedback.
  boundary: The sign-in view bootstraps development identity only; it never determines permissions or scoped authority.

subjects:
  - subject: Resource management
    journeys: [RESOURCE-MANAGEMENT]
    primary_workspaces: [RESOURCE-CATALOGUE, RESOURCE-DETAIL]
  - subject: Application management
    journeys: [APPLICATION-MANAGEMENT]
    primary_workspaces: [APPLICATION-CATALOGUE, APPLICATION-DETAIL]
  - subject: Component management
    journeys: [COMPONENT-MANAGEMENT]
    primary_workspaces: [APPLICATION-DETAIL]
  - subject: Interaction management
    journeys: [INTERACTION-MANAGEMENT]
    primary_workspaces: [APPLICATION-DETAIL]
  - subject: Deployment management
    journeys: [DEPLOYMENT-MANAGEMENT]
    primary_workspaces: [DEPLOYMENTS, DEPLOYMENT-DETAIL]
  - subject: Business process and connectivity need
    journeys: [BUSINESS-CONNECTIVITY]
    primary_workspaces: [BUSINESS-CONNECTIVITY]
  - subject: Access request
    journeys: [ACCESS-REQUEST]
    primary_workspaces: [ACCESS-REQUESTS]
    authority_rule: Backend-confirmed effective request authority controls admission; hidden/disabled controls are presentation only.
  - subject: Policy rule
    journeys: [POLICY-RULE]
    primary_workspaces: [POLICY-RULES]
  - subject: Policy export
    journeys: [POLICY-EXPORT]
    primary_workspaces: [POLICY-EXPORT]
    authority_rule: Backend-confirmed read/export authority controls admission.

error_contract:
  - not-found is distinct from technical failure;
  - validation/security rejection is distinct from retryable dependency failure;
  - stale/current concurrency outcome is never rendered as silent success;
  - incomplete export is never presented as complete success.

scope_rule: A first-MVP subject listed in the canonical subject-obligation contract must have an explicit journey/workspace contract here before FRONTEND-IMPLEMENTATION can be complete.
