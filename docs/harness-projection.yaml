questions:
  - id: Q-ACCESS-REVOCATION-AUTHORITY-SIDE
    authority: DOMAIN-USE-CASE-DESIGN
    text: For a current PolicyRule authorization episode spanning source and destination administrative sides, which side authority is sufficient for policy.revoke: either participating side independently, source only, destination only, or all participating sides together?
    blocks: [AP-ACCESS-USE-CASES]
