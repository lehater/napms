version: 3
kind: module-contract-design
id: NAPMS-FIRST-MVP-MODULE-CONTRACTS
status: CURRENT

purpose: Define explicit in-process contracts required to realize the corrected first-MVP design without table coupling or internal HTTP.

contracts:
  Resource Catalogue: [RegisterResource, AddEndpoint, SetEndpointAddress, ClearEndpointAddress, SetSite, SetResponsibility, ResolveResource, ReadResourceDetail, ResolveAuthorityScope, CurrentEndpointAddresses]
  Application Communication Catalogue: [CreateApplication, AddComponent, CreateInteraction, PublishInteractionRevision, ResolveComponent, ResolveInteraction, ResolveInteractionRevision]
  Application Deployment: [RegisterComponentDeployment, ResolveComponentDeployment, ReadComponentDeployment]
  Business Connectivity: [RegisterBusinessProcess, SetResponsibleOrganization, SetCriticalityLabel, DeclareNeed, RetireNeed, LockAndResolveCurrentNeed, ResolveNeedCurrentOrHistory]
  Access Policy: [SubmitAccessRequest, RecordPermissionDecision, SetPolicyRuleOperationalState, AttachPolicyRuleJustification, ReadPolicyRule, PageCurrentPolicyRules]
  Authority Management: [RequireScopedAuthority]
  Policy Materialization: [MaterializeCurrentPolicy]

rules:
  - Tables are private persistence of owners and never module integration contracts.
  - Internal HTTP is forbidden between modules in the modular monolith.
  - Resource Catalogue owns Resource AuthorityScopeRef and Endpoint/address truth.
  - Authority Management evaluates authenticated grants but never manufactures Resource scope.
  - Business Connectivity owns Need currentness; Access Policy may validate or associate Need but does not copy currentness.
  - Access Policy owns AccessRequest PolicyRule evidence and operational history.
  - Policy Materialization uses owner read ports in one shared snapshot and writes no peer truth.
  - Missing owner semantics must be routed to that owner instead of invented in a consumer.

resource_catalogue_query_contracts:
  ResolveResource:
    output: [resourceRef, displayName, authorityScopeRef, siteRef, current responsibilities, endpointCount]
  ReadResourceDetail:
    purpose: Supply the complete current-and-history Resource read model required by the accepted Resource workspace without leaking persistence representation.
    output:
      identity: [resourceRef, displayName, authorityScopeRef, version]
      current:
        - endpoints with stable endpointRef and zero-or-one current AddressRealization
        - zero-or-one current siteRef
        - zero-or-one current OWNER responsibility
        - zero-or-one current ADMINISTRATOR responsibility
      history:
        - ended/replaced endpoint AddressRealization facts with validity interval and provenance
        - ended/replaced SiteAssignment facts with validity interval and provenance
        - ended/replaced ResourceResponsibility facts with role validity interval and provenance
    invariants:
      - AuthorityScopeRef is immutable Resource identity context and is not a historical affiliation.
      - Empty current Site/responsibility/address is explicit and does not erase history.
  CurrentEndpointAddresses:
    output: all current addressed Endpoints for one Resource with EndpointRef AddressRealization effectiveFrom changedBySubject

application_communication_query_contracts:
  ResolveComponent:
    input: [ComponentRef]
    output: [componentRef, name]
    invariant: Component name remains Application Communication Catalogue owner truth and is exposed read-only for relationship presentation.
  ResolveInteraction:
    input: [InteractionRef]
    output: [interactionRef, sourceComponentRef, destinationComponentRef, purpose, version]
    invariant: Resolution exposes owner truth required to validate participantComponentRef without peer-table access.
  ResolveInteractionRevision:
    input: [InteractionRevisionRef]
    output: immutable InteractionRevision with canonical TrafficClauses and owning Interaction identity.

application_deployment_query_contracts:
  ReadComponentDeployment:
    input: [ComponentDeployment]
    output: [deploymentRef, componentRef, componentName, resourceRef, resourceDisplayName]
    composition:
      - deploymentRef/componentRef/resourceRef come from Application Deployment owner truth;
      - componentName is resolved from Application Communication Catalogue ResolveComponent at read time;
      - resourceDisplayName is resolved from Resource Catalogue ResolveResource at read time.
    invariants:
      - human-readable labels never replace stable cross-owner references;
      - peer labels are not persisted or treated as Application Deployment domain truth.

authority_contract:
  RequireScopedAuthority:
    input: [Principal, action, distinct AuthorityScopeRefs, evaluatedAt]
    output: exact immutable authority evidence for each required scope or FORBIDDEN

basis_refs: [FIRST-MVP-JOURNEY, SYSTEM-RULES, STRATEGIC-RELATIONSHIPS]
