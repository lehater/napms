version: 4
kind: physical-persistence-model
id: NAPMS-MVP-PERSISTENCE
status: CURRENT

database: PostgreSQL
ownership_rule: One physical database; every table has one module/technical owner. No cross-owner database foreign keys.
cross_owner_reference_rule: Cross-owner refs are opaque values validated through owner contracts.

schemas:
  organization_structure:
    tables:
      organization:
        columns:
          - {name: organization_ref, type: uuid, nullable: false, primary_key: true}
          - {name: display_name, type: text, nullable: false}
          - {name: lifecycle_state, type: text, nullable: false}
          - {name: version, type: bigint, nullable: false}
          - {name: created_at, type: timestamptz, nullable: false}
          - {name: retired_at, type: timestamptz, nullable: true}
        indexes: []
        checks:
          - {name: ck_organization_lifecycle, expression: "lifecycle_state IN ('ACTIVE','RETIRED')"}
      organizational_unit:
        columns:
          - {name: organizational_unit_ref, type: uuid, nullable: false, primary_key: true}
          - {name: organization_ref, type: uuid, nullable: false}
          - {name: parent_unit_ref, type: uuid, nullable: true}
          - {name: display_name, type: text, nullable: false}
          - {name: lifecycle_state, type: text, nullable: false}
          - {name: version, type: bigint, nullable: false}
          - {name: created_at, type: timestamptz, nullable: false}
          - {name: retired_at, type: timestamptz, nullable: true}
        local_foreign_keys:
          - {columns: [organization_ref], references: organization_structure.organization, target_columns: [organization_ref], on_delete: restrict}
          - {columns: [parent_unit_ref], references: organization_structure.organizational_unit, target_columns: [organizational_unit_ref], on_delete: restrict}
        indexes:
          - {name: ix_unit_organization_parent, unique: false, columns: [organization_ref, parent_unit_ref]}
        checks:
          - {name: ck_unit_lifecycle, expression: "lifecycle_state IN ('ACTIVE','RETIRED')"}
      organizational_unit_parent_history:
        columns:
          - {name: history_ref, type: uuid, nullable: false, primary_key: true}
          - {name: organizational_unit_ref, type: uuid, nullable: false}
          - {name: parent_unit_ref, type: uuid, nullable: true}
          - {name: effective_from, type: timestamptz, nullable: false}
          - {name: effective_to, type: timestamptz, nullable: true}
          - {name: changed_by_actor_ref, type: text, nullable: false}
        local_foreign_keys:
          - {columns: [organizational_unit_ref], references: organization_structure.organizational_unit, target_columns: [organizational_unit_ref], on_delete: restrict}
          - {columns: [parent_unit_ref], references: organization_structure.organizational_unit, target_columns: [organizational_unit_ref], on_delete: restrict}
        indexes:
          - {name: uq_unit_current_parent_fact, unique: true, columns: [organizational_unit_ref], where: effective_to IS NULL}
        checks: []

  resource_catalogue:
    tables:
      resource:
        columns:
          - {name: resource_ref, type: uuid, nullable: false, primary_key: true}
          - {name: display_name, type: text, nullable: false}
          - {name: organizational_unit_ref, type: uuid, nullable: false, external_owner: organization_structure}
          - {name: version, type: bigint, nullable: false}
          - {name: created_at, type: timestamptz, nullable: false}
        indexes:
          - {name: ix_resource_current_owner, unique: false, columns: [organizational_unit_ref]}
        checks: []
      resource_ownership_history:
        columns:
          - {name: history_ref, type: uuid, nullable: false, primary_key: true}
          - {name: resource_ref, type: uuid, nullable: false}
          - {name: organizational_unit_ref, type: uuid, nullable: false, external_owner: organization_structure}
          - {name: effective_from, type: timestamptz, nullable: false}
          - {name: effective_to, type: timestamptz, nullable: true}
          - {name: changed_by_actor_ref, type: text, nullable: false}
        local_foreign_keys:
          - {columns: [resource_ref], references: resource_catalogue.resource, target_columns: [resource_ref], on_delete: restrict}
        indexes:
          - {name: uq_resource_current_owner_fact, unique: true, columns: [resource_ref], where: effective_to IS NULL}
        checks: []
      site:
        columns:
          - {name: site_ref, type: uuid, nullable: false, primary_key: true}
          - {name: name, type: text, nullable: false}
          - {name: description, type: text, nullable: true}
        indexes: []
        checks: []
      responsibility_group:
        columns:
          - {name: group_ref, type: uuid, nullable: false, primary_key: true}
          - {name: display_name, type: text, nullable: false}
          - {name: external_reference, type: text, nullable: true}
        indexes: []
        checks: []
      resource_site_history:
        columns:
          - {name: history_ref, type: uuid, nullable: false, primary_key: true}
          - {name: resource_ref, type: uuid, nullable: false}
          - {name: site_ref, type: uuid, nullable: true}
          - {name: effective_from, type: timestamptz, nullable: false}
          - {name: effective_to, type: timestamptz, nullable: true}
          - {name: changed_by_subject, type: text, nullable: false}
        local_foreign_keys:
          - {columns: [resource_ref], references: resource_catalogue.resource, target_columns: [resource_ref], on_delete: restrict}
          - {columns: [site_ref], references: resource_catalogue.site, target_columns: [site_ref], on_delete: restrict}
        indexes:
          - {name: uq_resource_current_site, unique: true, columns: [resource_ref], where: effective_to IS NULL}
        checks: []
      resource_endpoint:
        columns:
          - {name: endpoint_ref, type: uuid, nullable: false, primary_key: true}
          - {name: resource_ref, type: uuid, nullable: false}
          - {name: created_at, type: timestamptz, nullable: false}
        local_foreign_keys:
          - {columns: [resource_ref], references: resource_catalogue.resource, target_columns: [resource_ref], on_delete: restrict}
        indexes: []
        checks: []
      resource_endpoint_address_history:
        columns:
          - {name: address_fact_ref, type: uuid, nullable: false, primary_key: true}
          - {name: endpoint_ref, type: uuid, nullable: false}
          - {name: address_kind, type: text, nullable: false}
          - {name: address_value, type: text, nullable: false}
          - {name: effective_from, type: timestamptz, nullable: false}
          - {name: effective_to, type: timestamptz, nullable: true}
          - {name: changed_by_subject, type: text, nullable: false}
        local_foreign_keys:
          - {columns: [endpoint_ref], references: resource_catalogue.resource_endpoint, target_columns: [endpoint_ref], on_delete: restrict}
        indexes:
          - {name: uq_endpoint_current_address, unique: true, columns: [endpoint_ref], where: effective_to IS NULL}
        checks:
          - {name: ck_endpoint_address_kind, expression: "address_kind IN ('HOST','PREFIX')"}
      resource_responsibility_history:
        columns:
          - {name: assignment_ref, type: uuid, nullable: false, primary_key: true}
          - {name: resource_ref, type: uuid, nullable: false}
          - {name: role, type: text, nullable: false}
          - {name: group_ref, type: uuid, nullable: false}
          - {name: effective_from, type: timestamptz, nullable: false}
          - {name: effective_to, type: timestamptz, nullable: true}
          - {name: changed_by_subject, type: text, nullable: false}
        local_foreign_keys:
          - {columns: [resource_ref], references: resource_catalogue.resource, target_columns: [resource_ref], on_delete: restrict}
          - {columns: [group_ref], references: resource_catalogue.responsibility_group, target_columns: [group_ref], on_delete: restrict}
        indexes:
          - {name: uq_resource_current_responsibility, unique: true, columns: [resource_ref, role], where: effective_to IS NULL}
        checks:
          - {name: ck_resource_responsibility_role, expression: "role IN ('OWNER','ADMINISTRATOR')"}

  application_communication_catalogue:
    tables:
      application:
        columns:
          - {name: application_ref, type: uuid, nullable: false, primary_key: true}
          - {name: name, type: text, nullable: false}
          - {name: version, type: bigint, nullable: false}
          - {name: created_at, type: timestamptz, nullable: false}
        indexes: []
        checks: []
      component:
        columns:
          - {name: component_ref, type: uuid, nullable: false, primary_key: true}
          - {name: application_ref, type: uuid, nullable: false}
          - {name: name, type: text, nullable: false}
          - {name: created_at, type: timestamptz, nullable: false}
        local_foreign_keys:
          - {columns: [application_ref], references: application_communication_catalogue.application, target_columns: [application_ref], on_delete: restrict}
        indexes: []
        checks: []
      interaction:
        columns:
          - {name: interaction_ref, type: uuid, nullable: false, primary_key: true}
          - {name: source_component_ref, type: uuid, nullable: false}
          - {name: destination_component_ref, type: uuid, nullable: false}
          - {name: purpose, type: text, nullable: true}
          - {name: version, type: bigint, nullable: false}
          - {name: created_at, type: timestamptz, nullable: false}
        local_foreign_keys:
          - {columns: [source_component_ref], references: application_communication_catalogue.component, target_columns: [component_ref], on_delete: restrict}
          - {columns: [destination_component_ref], references: application_communication_catalogue.component, target_columns: [component_ref], on_delete: restrict}
        indexes:
          - {name: ix_interaction_pair, unique: false, columns: [source_component_ref, destination_component_ref]}
        checks: []
      interaction_revision:
        columns:
          - {name: revision_ref, type: uuid, nullable: false, primary_key: true}
          - {name: interaction_ref, type: uuid, nullable: false}
          - {name: revision_no, type: bigint, nullable: false}
          - {name: created_at, type: timestamptz, nullable: false}
          - {name: created_by_subject, type: text, nullable: false}
        local_foreign_keys:
          - {columns: [interaction_ref], references: application_communication_catalogue.interaction, target_columns: [interaction_ref], on_delete: restrict}
        indexes:
          - {name: uq_interaction_revision_no, unique: true, columns: [interaction_ref, revision_no]}
        checks: []
      interaction_traffic_clause:
        columns:
          - {name: clause_ref, type: uuid, nullable: false, primary_key: true}
          - {name: revision_ref, type: uuid, nullable: false}
          - {name: clause_ordinal, type: integer, nullable: false}
          - {name: ip_protocol, type: integer, nullable: false}
        local_foreign_keys:
          - {columns: [revision_ref], references: application_communication_catalogue.interaction_revision, target_columns: [revision_ref], on_delete: restrict}
        indexes:
          - {name: uq_revision_clause_ordinal, unique: true, columns: [revision_ref, clause_ordinal]}
        checks:
          - {name: ck_ip_protocol, expression: "ip_protocol BETWEEN 0 AND 255"}
      interaction_port_range:
        columns:
          - {name: range_ref, type: uuid, nullable: false, primary_key: true}
          - {name: clause_ref, type: uuid, nullable: false}
          - {name: direction, type: text, nullable: false}
          - {name: range_ordinal, type: integer, nullable: false}
          - {name: port_from, type: integer, nullable: false}
          - {name: port_to, type: integer, nullable: false}
        local_foreign_keys:
          - {columns: [clause_ref], references: application_communication_catalogue.interaction_traffic_clause, target_columns: [clause_ref], on_delete: restrict}
        indexes:
          - {name: uq_clause_direction_range, unique: true, columns: [clause_ref, direction, range_ordinal]}
        checks:
          - {name: ck_port_direction, expression: "direction IN ('SOURCE','DESTINATION')"}
          - {name: ck_port_bounds, expression: "port_from BETWEEN 0 AND 65535 AND port_to BETWEEN port_from AND 65535"}

  application_deployment:
    tables:
      component_deployment:
        columns:
          - {name: deployment_ref, type: uuid, nullable: false, primary_key: true}
          - {name: component_ref, type: uuid, nullable: false, external_owner: application_communication_catalogue}
          - {name: resource_ref, type: uuid, nullable: false, external_owner: resource_catalogue}
          - {name: created_at, type: timestamptz, nullable: false}
        indexes: []
        checks: []

  business_connectivity:
    tables:
      business_process:
        columns:
          - {name: process_ref, type: uuid, nullable: false, primary_key: true}
          - {name: name, type: text, nullable: false}
          - {name: description, type: text, nullable: true}
          - {name: organization_external_reference, type: text, nullable: true}
          - {name: organization_display_name, type: text, nullable: true}
          - {name: criticality_label, type: text, nullable: true}
          - {name: version, type: bigint, nullable: false}
          - {name: created_at, type: timestamptz, nullable: false}
        indexes: []
        checks: []
      connectivity_need:
        columns:
          - {name: need_ref, type: uuid, nullable: false, primary_key: true}
          - {name: process_ref, type: uuid, nullable: false}
          - {name: interaction_ref, type: uuid, nullable: false, external_owner: application_communication_catalogue}
          - {name: participant_component_ref, type: uuid, nullable: false, external_owner: application_communication_catalogue}
          - {name: business_basis, type: text, nullable: false}
          - {name: status, type: text, nullable: false}
          - {name: created_at, type: timestamptz, nullable: false}
          - {name: created_by_subject, type: text, nullable: false}
          - {name: retired_at, type: timestamptz, nullable: true}
        local_foreign_keys:
          - {columns: [process_ref], references: business_connectivity.business_process, target_columns: [process_ref], on_delete: restrict}
        indexes:
          - {name: ix_need_interaction, unique: false, columns: [interaction_ref]}
        checks:
          - {name: ck_need_status, expression: "status IN ('ACTIVE','RETIRED')"}

  authority_management:
    tables:
      role:
        columns:
          - {name: role_ref, type: uuid, nullable: false, primary_key: true}
          - {name: name, type: text, nullable: false}
          - {name: lifecycle_state, type: text, nullable: false}
          - {name: version, type: bigint, nullable: false}
          - {name: created_at, type: timestamptz, nullable: false}
          - {name: retired_at, type: timestamptz, nullable: true}
        indexes: []
        checks:
          - {name: ck_role_lifecycle, expression: "lifecycle_state IN ('ACTIVE','RETIRED')"}
      role_action:
        columns:
          - {name: role_action_ref, type: uuid, nullable: false, primary_key: true}
          - {name: role_ref, type: uuid, nullable: false}
          - {name: action, type: text, nullable: false}
        local_foreign_keys:
          - {columns: [role_ref], references: authority_management.role, target_columns: [role_ref], on_delete: restrict}
        indexes:
          - {name: uq_role_action, unique: true, columns: [role_ref, action]}
        checks: []
      role_assignment:
        columns:
          - {name: assignment_ref, type: uuid, nullable: false, primary_key: true}
          - {name: principal_kind, type: text, nullable: false}
          - {name: principal_ref, type: text, nullable: false}
          - {name: role_ref, type: uuid, nullable: false}
          - {name: scope_kind, type: text, nullable: false}
          - {name: scope_ref, type: uuid, nullable: true, external_owner: organization_structure}
          - {name: effect, type: text, nullable: false}
          - {name: effective_from, type: timestamptz, nullable: true}
          - {name: effective_until, type: timestamptz, nullable: true}
          - {name: version, type: bigint, nullable: false}
          - {name: created_at, type: timestamptz, nullable: false}
        local_foreign_keys:
          - {columns: [role_ref], references: authority_management.role, target_columns: [role_ref], on_delete: restrict}
        indexes:
          - {name: ix_assignment_principal, unique: false, columns: [principal_kind, principal_ref]}
          - {name: ix_assignment_scope, unique: false, columns: [scope_kind, scope_ref]}
        checks:
          - {name: ck_assignment_principal_kind, expression: "principal_kind IN ('ACTOR','GROUP')"}
          - {name: ck_assignment_scope_kind, expression: "scope_kind IN ('SYSTEM','ORGANIZATION','ORGANIZATIONAL_UNIT')"}
          - {name: ck_assignment_scope_ref, expression: "(scope_kind = 'SYSTEM' AND scope_ref IS NULL) OR (scope_kind <> 'SYSTEM' AND scope_ref IS NOT NULL)"}
          - {name: ck_assignment_effect, expression: "effect IN ('ALLOW','DENY')"}
          - {name: ck_assignment_window, expression: "effective_until IS NULL OR effective_from IS NULL OR effective_until > effective_from"}

  access_policy:
    tables:
      approval_policy:
        columns:
          - {name: policy_ref, type: uuid, nullable: false, primary_key: true}
          - {name: organization_ref, type: uuid, nullable: false, external_owner: organization_structure}
          - {name: current_revision_ref, type: uuid, nullable: true}
          - {name: version, type: bigint, nullable: false}
          - {name: created_at, type: timestamptz, nullable: false}
        indexes:
          - {name: uq_approval_policy_organization, unique: true, columns: [organization_ref]}
        checks: []
      approval_policy_revision:
        columns:
          - {name: revision_ref, type: uuid, nullable: false, primary_key: true}
          - {name: policy_ref, type: uuid, nullable: false}
          - {name: revision_no, type: bigint, nullable: false}
          - {name: self_approval_allowed, type: boolean, nullable: false}
          - {name: request_ttl_seconds, type: bigint, nullable: true}
          - {name: published_at, type: timestamptz, nullable: false}
          - {name: published_by_actor_ref, type: text, nullable: false}
        local_foreign_keys:
          - {columns: [policy_ref], references: access_policy.approval_policy, target_columns: [policy_ref], on_delete: restrict}
        indexes:
          - {name: uq_approval_policy_revision_no, unique: true, columns: [policy_ref, revision_no]}
        checks:
          - {name: ck_approval_request_ttl, expression: "request_ttl_seconds IS NULL OR request_ttl_seconds > 0"}
      authority_evidence:
        columns:
          - {name: evidence_ref, type: uuid, nullable: false, primary_key: true}
          - {name: principal_ref, type: text, nullable: false}
          - {name: action, type: text, nullable: false}
          - {name: scope_kind, type: text, nullable: false}
          - {name: scope_ref, type: uuid, nullable: true, external_owner: organization_structure}
          - {name: evaluated_at, type: timestamptz, nullable: false}
          - {name: decision, type: text, nullable: false}
          - {name: evidence_json, type: jsonb, nullable: false}
        indexes: []
        checks:
          - {name: ck_authority_evidence_decision, expression: "decision = 'ALLOW'"}
          - {name: ck_authority_evidence_scope, expression: "(scope_kind = 'SYSTEM' AND scope_ref IS NULL) OR (scope_kind IN ('ORGANIZATION','ORGANIZATIONAL_UNIT') AND scope_ref IS NOT NULL)"}
      access_request:
        columns:
          - {name: request_ref, type: uuid, nullable: false, primary_key: true}
          - {name: source_deployment_ref, type: uuid, nullable: false, external_owner: application_deployment}
          - {name: destination_deployment_ref, type: uuid, nullable: false, external_owner: application_deployment}
          - {name: interaction_revision_ref, type: uuid, nullable: false, external_owner: application_communication_catalogue}
          - {name: initial_need_ref, type: uuid, nullable: false, external_owner: business_connectivity}
          - {name: validated_business_process_version, type: bigint, nullable: false}
          - {name: submitter_actor_ref, type: text, nullable: false}
          - {name: submitted_at, type: timestamptz, nullable: false}
          - {name: expires_at, type: timestamptz, nullable: true}
          - {name: status, type: text, nullable: false}
          - {name: terminal_reason, type: text, nullable: true}
          - {name: terminal_actor_ref, type: text, nullable: true}
          - {name: terminal_at, type: timestamptz, nullable: true}
          - {name: submission_authority_evidence_ref, type: uuid, nullable: false}
          - {name: version, type: bigint, nullable: false}
        local_foreign_keys:
          - {columns: [submission_authority_evidence_ref], references: access_policy.authority_evidence, target_columns: [evidence_ref], on_delete: restrict}
        indexes:
          - {name: uq_pending_access_subject, unique: true, columns: [source_deployment_ref, destination_deployment_ref, interaction_revision_ref], where: "status = 'PENDING'"}
        checks:
          - {name: ck_request_status, expression: "status IN ('PENDING','ALLOWED','DENIED','CANCELLED','EXPIRED','INVALIDATED')"}
      access_request_approval_basis_side:
        columns:
          - {name: basis_side_ref, type: uuid, nullable: false, primary_key: true}
          - {name: request_ref, type: uuid, nullable: false}
          - {name: approval_policy_revision_ref, type: uuid, nullable: false}
          - {name: scope_kind, type: text, nullable: false}
          - {name: scope_ref, type: uuid, nullable: false, external_owner: organization_structure}
          - {name: covers_source, type: boolean, nullable: false}
          - {name: covers_destination, type: boolean, nullable: false}
        local_foreign_keys:
          - {columns: [request_ref], references: access_policy.access_request, target_columns: [request_ref], on_delete: restrict}
          - {columns: [approval_policy_revision_ref], references: access_policy.approval_policy_revision, target_columns: [revision_ref], on_delete: restrict}
        indexes:
          - {name: uq_request_approval_side_scope, unique: true, columns: [request_ref, scope_kind, scope_ref]}
        checks:
          - {name: ck_approval_side_scope_kind, expression: "scope_kind IN ('ORGANIZATION','ORGANIZATIONAL_UNIT')"}
          - {name: ck_approval_side_coverage, expression: "covers_source OR covers_destination"}
      access_request_approval_obligation:
        columns:
          - {name: obligation_ref, type: uuid, nullable: false, primary_key: true}
          - {name: request_ref, type: uuid, nullable: false}
          - {name: basis_side_ref, type: uuid, nullable: false}
          - {name: status, type: text, nullable: false}
        local_foreign_keys:
          - {columns: [request_ref], references: access_policy.access_request, target_columns: [request_ref], on_delete: restrict}
          - {columns: [basis_side_ref], references: access_policy.access_request_approval_basis_side, target_columns: [basis_side_ref], on_delete: restrict}
        indexes:
          - {name: uq_request_approval_obligation_side, unique: true, columns: [request_ref, basis_side_ref]}
        checks:
          - {name: ck_approval_obligation_status, expression: "status IN ('PENDING','APPROVED','DENIED')"}
      access_request_approval_decision:
        columns:
          - {name: decision_ref, type: uuid, nullable: false, primary_key: true}
          - {name: request_ref, type: uuid, nullable: false}
          - {name: obligation_ref, type: uuid, nullable: false}
          - {name: result, type: text, nullable: false}
          - {name: decided_by_actor_ref, type: text, nullable: false}
          - {name: decided_at, type: timestamptz, nullable: false}
          - {name: authority_evidence_ref, type: uuid, nullable: false}
        local_foreign_keys:
          - {columns: [request_ref], references: access_policy.access_request, target_columns: [request_ref], on_delete: restrict}
          - {columns: [obligation_ref], references: access_policy.access_request_approval_obligation, target_columns: [obligation_ref], on_delete: restrict}
          - {columns: [authority_evidence_ref], references: access_policy.authority_evidence, target_columns: [evidence_ref], on_delete: restrict}
        indexes:
          - {name: uq_approval_decision_obligation, unique: true, columns: [obligation_ref]}
        checks:
          - {name: ck_approval_decision_result, expression: "result IN ('APPROVED','DENIED')"}
      policy_rule:
        columns:
          - {name: rule_ref, type: uuid, nullable: false, primary_key: true}
          - {name: access_request_ref, type: uuid, nullable: false}
          - {name: source_deployment_ref, type: uuid, nullable: false, external_owner: application_deployment}
          - {name: destination_deployment_ref, type: uuid, nullable: false, external_owner: application_deployment}
