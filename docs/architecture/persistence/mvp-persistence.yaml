          - {name: uq_current_policy_rule_access_subject, unique: true, columns: [source_deployment_ref, destination_deployment_ref, interaction_revision_ref], where: revoked_at IS NULL}
        checks:
          - {name: ck_policy_rule_window, expression: "effective_until IS NULL OR effective_from IS NULL OR effective_until > effective_from"}
      policy_rule_authorization_evidence:
        columns:
