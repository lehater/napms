transaction_rules:
  - ordinary owner writes use READ COMMITTED and owner optimistic versioning where declared
  - AccessRequest submission and justification attachment use Business Connectivity owner-provided current-Need lock held through Access Policy commit; exact-PENDING uniqueness and immutable ApprovalBasis commit with the request
  - approval decision plus current AuthorityEvidence and request version commit atomically
  - ALLOWED finalization plus a new PolicyRule episode and current-authorization uniqueness commit atomically
  - PolicyRule revocation plus RevocationEvidence commit atomically; a revoked episode is never reactivated
  - policy materialization uses read-only REPEATABLE READ; first statement transaction_timestamp() is evaluationAt for the whole preflight and emit
  - no automatic mutation retry
  - no cross-owner database foreign keys

migration_rules:
  - explicit migrate mode only applies DDL
  - migrate uses exclusive PostgreSQL advisory lock
  - applied migration ids and immutable checksums are verified
  - serve applies no DDL and refuses schema mismatch

physical_detail_status: COMPLETE_FOR_FIRST_MVP
erd_status: GENERATED_FROM_THIS_MODEL
erd_projection: docs-generated/architecture/mvp-persistence-erd.puml

data_classification:
  security_sensitive:
    - authenticated ActorRef/GroupRef identifiers, Role/RoleAssignment truth and authority evidence
    - permission/decision provenance
    - desired-access and exported policy data that reveals protected connectivity intent
  internal_domain:
    - Organization/OrganizationalUnit/Resource/Application/Component/Deployment/Business Process and current/history facts
  operational:
    - idempotency response records and migration metadata
  prohibited_persistence:
    - bearer tokens
    - database credentials
    - private signing material
  rule: Classification constrains exposure/logging/protection but does not invent external privacy or retention obligations.
