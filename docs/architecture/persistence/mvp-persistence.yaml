version: 3
kind: physical-persistence-model
id: NAPMS-MVP-PERSISTENCE
status: CURRENT

database: PostgreSQL
ownership_rule: One physical database; every table has one module/technical owner. No cross-owner database foreign keys.
cross_owner_reference_rule: Cross-owner refs are opaque values validated through owner contracts.

schemas:
  resource_catalogue:
    tables:
      resource:
        columns:
          - {name: resource_ref, type: uuid, nullable: false, primary_key: true}
          - {name: display_name, type: text, nullable: false}
          - {name: authority_scope_ref, type: text, nullable: false}
          - {name: version, type: bigint, nullable: false}
          - {name: created_at, type: timestamptz, nullable: false}
        indexes: []
        checks: []
      site:
        columns:
          - {name: site_ref, type: uuid, nullable: false, primary_key: true}
          - {name: name, type: text, nullable: false}
          - {name: description, type: text, nullable: true}
        indexes: []
        checks: []
      responsibility_group:
        columns:
          - {name: group_ref, type: uuid, nullable: false, primary_key: true}
          - {name: display_name, type: text, nullable: false}
          - {name: external_reference, type: text, nullable: true}
        indexes: []
        checks: []
      resource_site_history:
        columns:
          - {name: history_ref, type: uuid, nullable: false, primary_key: true}
          - {name: resource_ref, type: uuid, nullable: false}
          - {name: site_ref, type: uuid, nullable: true}
          - {name: effective_from, type: timestamptz, nullable: false}
          - {name: effective_to, type: timestamptz, nullable: true}
          - {name: changed_by_subject, type: text, nullable: false}
        local_foreign_keys:
          - {columns: [resource_ref], references: resource_catalogue.resource, target_columns: [resource_ref], on_delete: restrict}
          - {columns: [site_ref], references: resource_catalogue.site, target_columns: [site_ref], on_delete: restrict}
        indexes:
          - {name: uq_resource_current_site, unique: true, columns: [resource_ref], where: effective_to IS NULL}
        checks: []
      resource_endpoint:
        columns:
          - {name: endpoint_ref, type: uuid, nullable: false, primary_key: true}
          - {name: resource_ref, type: uuid, nullable: false}
          - {name: created_at, type: timestamptz, nullable: false}
        local_foreign_keys:
          - {columns: [resource_ref], references: resource_catalogue.resource, target_columns: [resource_ref], on_delete: restrict}
        indexes: []
        checks: []
      resource_endpoint_address_history:
        columns:
          - {name: address_fact_ref, type: uuid, nullable: false, primary_key: true}
          - {name: endpoint_ref, type: uuid, nullable: false}
          - {name: address_kind, type: text, nullable: false}
          - {name: address_value, type: text, nullable: false}
          - {name: effective_from, type: timestamptz, nullable: false}
          - {name: effective_to, type: timestamptz, nullable: true}
          - {name: changed_by_subject, type: text, nullable: false}
        local_foreign_keys:
          - {columns: [endpoint_ref], references: resource_catalogue.resource_endpoint, target_columns: [endpoint_ref], on_delete: restrict}
        indexes:
          - {name: uq_endpoint_current_address, unique: true, columns: [endpoint_ref], where: effective_to IS NULL}
        checks:
          - {name: ck_endpoint_address_kind, expression: "address_kind IN ('HOST','PREFIX')"}
      resource_responsibility_history:
        columns:
          - {name: assignment_ref, type: uuid, nullable: false, primary_key: true}
          - {name: resource_ref, type: uuid, nullable: false}
          - {name: role, type: text, nullable: false}
          - {name: group_ref, type: uuid, nullable: false}
          - {name: effective_from, type: timestamptz, nullable: false}
          - {name: effective_to, type: timestamptz, nullable: true}
          - {name: changed_by_subject, type: text, nullable: false}
        local_foreign_keys:
          - {columns: [resource_ref], references: resource_catalogue.resource, target_columns: [resource_ref], on_delete: restrict}
          - {columns: [group_ref], references: resource_catalogue.responsibility_group, target_columns: [group_ref], on_delete: restrict}
        indexes:
          - {name: uq_resource_current_responsibility, unique: true, columns: [resource_ref, role], where: effective_to IS NULL}
        checks:
          - {name: ck_resource_responsibility_role, expression: "role IN ('OWNER','ADMINISTRATOR')"}

  application_communication_catalogue:
    tables:
      application:
        columns:
          - {name: application_ref, type: uuid, nullable: false, primary_key: true}
          - {name: name, type: text, nullable: false}
          - {name: version, type: bigint, nullable: false}
          - {name: created_at, type: timestamptz, nullable: false}
        indexes: []
        checks: []
      component:
        columns:
          - {name: component_ref, type: uuid, nullable: false, primary_key: true}
          - {name: application_ref, type: uuid, nullable: false}
          - {name: name, type: text, nullable: false}
          - {name: created_at, type: timestamptz, nullable: false}
        local_foreign_keys:
          - {columns: [application_ref], references: application_communication_catalogue.application, target_columns: [application_ref], on_delete: restrict}
        indexes: []
        checks: []
      interaction:
        columns:
          - {name: interaction_ref, type: uuid, nullable: false, primary_key: true}
          - {name: source_component_ref, type: uuid, nullable: false}
          - {name: destination_component_ref, type: uuid, nullable: false}
          - {name: purpose, type: text, nullable: true}
          - {name: version, type: bigint, nullable: false}
          - {name: created_at, type: timestamptz, nullable: false}
        local_foreign_keys:
          - {columns: [source_component_ref], references: application_communication_catalogue.component, target_columns: [component_ref], on_delete: restrict}
          - {columns: [destination_component_ref], references: application_communication_catalogue.component, target_columns: [component_ref], on_delete: restrict}
        indexes:
          - {name: ix_interaction_pair, unique: false, columns: [source_component_ref, destination_component_ref]}
        checks: []
      interaction_revision:
        columns:
          - {name: revision_ref, type: uuid, nullable: false, primary_key: true}
          - {name: interaction_ref, type: uuid, nullable: false}
          - {name: revision_no, type: bigint, nullable: false}
          - {name: created_at, type: timestamptz, nullable: false}
          - {name: created_by_subject, type: text, nullable: false}
        local_foreign_keys:
          - {columns: [interaction_ref], references: application_communication_catalogue.interaction, target_columns: [interaction_ref], on_delete: restrict}
        indexes:
          - {name: uq_interaction_revision_no, unique: true, columns: [interaction_ref, revision_no]}
        checks: []
      interaction_traffic_clause:
        columns:
          - {name: clause_ref, type: uuid, nullable: false, primary_key: true}
          - {name: revision_ref, type: uuid, nullable: false}
          - {name: clause_ordinal, type: integer, nullable: false}
          - {name: ip_protocol, type: integer, nullable: false}
        local_foreign_keys:
          - {columns: [revision_ref], references: application_communication_catalogue.interaction_revision, target_columns: [revision_ref], on_delete: restrict}
        indexes:
          - {name: uq_revision_clause_ordinal, unique: true, columns: [revision_ref, clause_ordinal]}
        checks:
          - {name: ck_ip_protocol, expression: "ip_protocol BETWEEN 0 AND 255"}
      interaction_port_range:
        columns:
          - {name: range_ref, type: uuid, nullable: false, primary_key: true}
          - {name: clause_ref, type: uuid, nullable: false}
          - {name: direction, type: text, nullable: false}
          - {name: range_ordinal, type: integer, nullable: false}
          - {name: port_from, type: integer, nullable: false}
          - {name: port_to, type: integer, nullable: false}
        local_foreign_keys:
          - {columns: [clause_ref], references: application_communication_catalogue.interaction_traffic_clause, target_columns: [clause_ref], on_delete: restrict}
        indexes:
          - {name: uq_clause_direction_range, unique: true, columns: [clause_ref, direction, range_ordinal]}
        checks:
          - {name: ck_port_direction, expression: "direction IN ('SOURCE','DESTINATION')"}
          - {name: ck_port_bounds, expression: "port_from BETWEEN 0 AND 65535 AND port_to BETWEEN port_from AND 65535"}

  application_deployment:
    tables:
      component_deployment:
        columns:
          - {name: deployment_ref, type: uuid, nullable: false, primary_key: true}
          - {name: component_ref, type: uuid, nullable: false, external_owner: application_communication_catalogue}
          - {name: resource_ref, type: uuid, nullable: false, external_owner: resource_catalogue}
          - {name: created_at, type: timestamptz, nullable: false}
        indexes: []
        checks: []

  business_connectivity:
    tables:
      business_process:
        columns:
          - {name: process_ref, type: uuid, nullable: false, primary_key: true}
          - {name: name, type: text, nullable: false}
          - {name: description, type: text, nullable: true}
          - {name: organization_external_reference, type: text, nullable: true}
          - {name: organization_display_name, type: text, nullable: true}
          - {name: criticality_label, type: text, nullable: true}
          - {name: version, type: bigint, nullable: false}
          - {name: created_at, type: timestamptz, nullable: false}
        indexes: []
        checks: []
      connectivity_need:
        columns:
          - {name: need_ref, type: uuid, nullable: false, primary_key: true}
          - {name: process_ref, type: uuid, nullable: false}
          - {name: interaction_ref, type: uuid, nullable: false, external_owner: application_communication_catalogue}
          - {name: participant_component_ref, type: uuid, nullable: false, external_owner: application_communication_catalogue}
          - {name: business_basis, type: text, nullable: false}
          - {name: status, type: text, nullable: false}
          - {name: created_at, type: timestamptz, nullable: false}
          - {name: created_by_subject, type: text, nullable: false}
          - {name: retired_at, type: timestamptz, nullable: true}
        local_foreign_keys:
          - {columns: [process_ref], references: business_connectivity.business_process, target_columns: [process_ref], on_delete: restrict}
        indexes:
          - {name: ix_need_interaction, unique: false, columns: [interaction_ref]}
        checks:
          - {name: ck_need_status, expression: "status IN ('ACTIVE','RETIRED')"}

  access_policy:
    tables:
      access_request:
        columns:
          - {name: request_ref, type: uuid, nullable: false, primary_key: true}
          - {name: source_deployment_ref, type: uuid, nullable: false, external_owner: application_deployment}
          - {name: destination_deployment_ref, type: uuid, nullable: false, external_owner: application_deployment}
          - {name: interaction_revision_ref, type: uuid, nullable: false, external_owner: application_communication_catalogue}
          - {name: initial_need_ref, type: uuid, nullable: false, external_owner: business_connectivity}
          - {name: validated_business_process_version, type: bigint, nullable: false}
          - {name: submitter_subject, type: text, nullable: false}
          - {name: submitted_at, type: timestamptz, nullable: false}
          - {name: decision_result, type: text, nullable: true}
          - {name: external_decision_ref, type: text, nullable: true}
          - {name: decided_by_subject, type: text, nullable: true}
          - {name: decided_at, type: timestamptz, nullable: true}
          - {name: version, type: bigint, nullable: false}
        indexes: []
        checks:
          - {name: ck_request_decision, expression: "decision_result IS NULL OR decision_result IN ('ALLOWED','DENIED')"}
      access_request_authority_evidence:
        columns:
          - {name: evidence_ref, type: uuid, nullable: false, primary_key: true}
          - {name: request_ref, type: uuid, nullable: false}
          - {name: scope_ref, type: text, nullable: false}
          - {name: action, type: text, nullable: false}
          - {name: grant_effective_from, type: timestamptz, nullable: true}
          - {name: grant_effective_until, type: timestamptz, nullable: true}
          - {name: evaluated_at, type: timestamptz, nullable: false}
        local_foreign_keys:
          - {columns: [request_ref], references: access_policy.access_request, target_columns: [request_ref], on_delete: restrict}
        indexes:
          - {name: uq_request_authority_scope, unique: true, columns: [request_ref, scope_ref, action]}
        checks:
          - {name: ck_request_authority_action, expression: "action = 'access.request'"}
      policy_rule:
        columns:
          - {name: rule_ref, type: uuid, nullable: false, primary_key: true}
          - {name: source_deployment_ref, type: uuid, nullable: false, external_owner: application_deployment}
          - {name: destination_deployment_ref, type: uuid, nullable: false, external_owner: application_deployment}
          - {name: interaction_revision_ref, type: uuid, nullable: false, external_owner: application_communication_catalogue}
          - {name: effect_state, type: text, nullable: false}
          - {name: effective_from, type: timestamptz, nullable: true}
          - {name: effective_until, type: timestamptz, nullable: true}
          - {name: version, type: bigint, nullable: false}
          - {name: created_at, type: timestamptz, nullable: false}
        indexes:
          - {name: uq_policy_rule_access_subject, unique: true, columns: [source_deployment_ref, destination_deployment_ref, interaction_revision_ref]}
        checks:
          - {name: ck_rule_effect_state, expression: "effect_state IN ('ACTIVE','INACTIVE')"}
      policy_rule_authorization_evidence:
        columns:
          - {name: evidence_ref, type: uuid, nullable: false, primary_key: true}
          - {name: rule_ref, type: uuid, nullable: false}
          - {name: access_request_ref, type: uuid, nullable: false}
          - {name: external_decision_ref, type: text, nullable: true}
          - {name: decided_by_subject, type: text, nullable: false}
          - {name: decided_at, type: timestamptz, nullable: false}
        local_foreign_keys:
          - {columns: [rule_ref], references: access_policy.policy_rule, target_columns: [rule_ref], on_delete: restrict}
          - {columns: [access_request_ref], references: access_policy.access_request, target_columns: [request_ref], on_delete: restrict}
        indexes:
          - {name: uq_authorization_request, unique: true, columns: [access_request_ref]}
        checks: []
      policy_rule_justification:
        columns:
          - {name: association_ref, type: uuid, nullable: false, primary_key: true}
          - {name: rule_ref, type: uuid, nullable: false}
          - {name: need_ref, type: uuid, nullable: false, external_owner: business_connectivity}
          - {name: attached_at, type: timestamptz, nullable: false}
          - {name: attached_by_subject, type: text, nullable: false}
          - {name: source_access_request_ref, type: uuid, nullable: true}
        local_foreign_keys:
          - {columns: [rule_ref], references: access_policy.policy_rule, target_columns: [rule_ref], on_delete: restrict}
        indexes:
          - {name: uq_rule_need_justification, unique: true, columns: [rule_ref, need_ref]}
        checks: []
      policy_rule_operational_history:
        columns:
          - {name: history_ref, type: uuid, nullable: false, primary_key: true}
          - {name: rule_ref, type: uuid, nullable: false}
          - {name: rule_version, type: bigint, nullable: false}
          - {name: effect_state, type: text, nullable: false}
          - {name: effective_from, type: timestamptz, nullable: true}
          - {name: effective_until, type: timestamptz, nullable: true}
          - {name: changed_by_subject, type: text, nullable: false}
          - {name: changed_at, type: timestamptz, nullable: false}
        local_foreign_keys:
          - {columns: [rule_ref], references: access_policy.policy_rule, target_columns: [rule_ref], on_delete: restrict}
        indexes:
          - {name: uq_rule_operational_version, unique: true, columns: [rule_ref, rule_version]}
        checks: []

  application_edge:
    tables:
      idempotency_record:
        columns:
          - {name: record_ref, type: uuid, nullable: false, primary_key: true}
          - {name: principal_subject, type: text, nullable: false}
          - {name: http_method, type: text, nullable: false}
          - {name: route_template, type: text, nullable: false}
          - {name: target_key, type: text, nullable: false}
          - {name: idempotency_key, type: text, nullable: false}
          - {name: request_fingerprint, type: text, nullable: false}
          - {name: response_status, type: integer, nullable: false}
          - {name: response_body_json_bytes, type: bytea, nullable: false}
          - {name: location, type: text, nullable: true}
          - {name: response_etag, type: text, nullable: true}
          - {name: committed_at, type: timestamptz, nullable: false}
        indexes:
          - {name: uq_idempotency_scope, unique: true, columns: [principal_subject, http_method, route_template, target_key, idempotency_key]}
        checks: []

transaction_rules:
  - ordinary owner writes use READ COMMITTED and owner optimistic versioning where declared
  - AccessRequest submission and justification attachment use Business Connectivity owner-provided current-Need lock held through Access Policy commit
  - policy materialization uses read-only REPEATABLE READ; first statement transaction_timestamp() is evaluationAt for the whole preflight and emit
  - no automatic mutation retry
  - no cross-owner database foreign keys

migration_rules:
  - explicit migrate mode only applies DDL
  - migrate uses exclusive PostgreSQL advisory lock
  - applied migration ids and immutable checksums are verified
  - serve applies no DDL and refuses schema mismatch

physical_detail_status: COMPLETE_FOR_FIRST_MVP
erd_status: GENERATED_FROM_THIS_MODEL
erd_projection: docs-generated/architecture/mvp-persistence-erd.puml

data_classification:
  security_sensitive:
    - authenticated subject identifiers and scoped authority evidence
    - permission/decision provenance
    - desired-access and exported policy data that reveals protected connectivity intent
  internal_domain:
    - Resource/Application/Component/Deployment/Business Process and current/history facts
  operational:
    - idempotency response records and migration metadata
  prohibited_persistence:
    - bearer tokens
    - database credentials
    - private signing material
  rule: Classification constrains exposure/logging/protection but does not invent external privacy or retention obligations.
