version: 3
kind: threat-model
id: NAPMS-MVP-THREAT-MODEL
status: CURRENT
scope: OIDC HTTP modular-monolith PostgreSQL and vendor-neutral policy materialization.
method: STRIDE-oriented design review

threats:
  - {id: TM-SPOOF-001, category: Spoofing, concern: Caller forges actor permissions or authority., control: Only validated bearer JWT establishes Principal permissions and AuthorityGrants; caller or forwarded overrides are ignored.}
  - {id: TM-AUTHZ-002, category: Elevation-of-Privilege, concern: One valid scope grant is reused for other Resource scopes., control: Request and export require matching effective grant for every distinct relevant AuthorityScopeRef.}
  - {id: TM-METADATA-003, category: Elevation-of-Privilege, concern: Site owner administrator Process or Need metadata is treated as authority., control: Those facts explicitly never create AuthorityGrants or AuthorityScopeRef.}
  - {id: TM-PERM-004, category: Tampering, concern: DENIED request creates desired access or old decision silently applies to changed traffic., control: DENIED creates no Rule; AccessSubject includes exact immutable InteractionRevision.}
  - {id: TM-PROV-005, category: Repudiation, concern: Request export authority or permission provenance is lost., control: RequestAuthorityEvidence AuthorizationEvidence and ExportAuthorityEvidence preserve actor scope time and decision provenance.}
  - {id: TM-EXPORT-006, category: Information-Disclosure, concern: Export subset exposes Rules outside actor scope., control: All selected Resource scopes are authorized before materialization result exposure.}
  - {id: TM-OIDC-007, category: Spoofing, concern: Algorithm confusion stale keys or downgrade issuer/JWKS transport., control: Asymmetric allow-list kid exact issuer audience time validation HTTPS-only discovery/JWKS and deterministic max-stale policy.}
  - {id: TM-DOS-008, category: Denial-of-Service, concern: Large export or dependency failure yields partial successful artifact., control: Request-body bound bounded/chunked traversal preflight before HTTP 200 and truncated stream is not a valid artifact.}

deferred_nonblocking:
  - production infrastructure hardening beyond the accepted application and deployment boundary

vulnerability_management:
  - Runtime and build dependencies used by the accepted backend are version-locked by the implementation baseline.
  - Material known advisories affecting the accepted OIDC, HTTP, PostgreSQL or serialization trust boundary are reviewed before release/update.
  - A material unresolved advisory that invalidates an accepted control becomes a Security Question or blocks release; no universal CVSS threshold is invented.

secure_development:
  - Security-sensitive changes preserve fail-closed OIDC validation, scoped authorization, trusted-time boundaries and secret-redaction rules.
  - Caller-controlled identity, permission, authority or provenance is never accepted as trusted input.
  - Security controls are verified through executable API/security evidence rather than assumed from framework defaults.
  - Dependency/framework changes that alter the trust boundary require threat-model revalidation.
