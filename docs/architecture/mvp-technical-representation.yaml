version: 4
kind: shared-technical-conventions
id: NAPMS-MVP-TECHNICAL-REPRESENTATION
status: CURRENT

scope: Shared external/interface representation conventions for the corrected backend MVP.

decisions:
  - id: TECH-ID-UUID
    choice: Stable owner identifiers are opaque UUID strings at external serialization boundaries.
    rationale: Preserve owner-defined identity without embedding mutable business meaning.

  - id: TECH-TIME-RFC3339
    choice: External timestamps are RFC 3339 date-time values.
    rationale: Authority evidence, effective windows, history and evaluationAt require portable instants.

  - id: TECH-ADDRESS-REALIZATION
    choice: AddressRealization is kind HOST or PREFIX plus canonical textual value.
    rationale: Preserve Host/Prefix distinction and exact IPv4/IPv6 semantics; Prefix is never silently expanded or masked.

  - id: TECH-TRAFFIC
    choice: TrafficClause uses numeric ipProtocol 0..255 and canonical source/destination PortRange arrays; only TCP 6 and UDP 17 may have ports.
    rationale: Avoid protocol-name ambiguity and preserve exact normalized traffic semantics.

  - id: TECH-ETAG
    choice: Mutable aggregate optimistic versions are exposed as ETag and consumed through If-Match where the API contract requires concurrency control.
    rationale: Keep aggregate concurrency explicit at the boundary.

  - id: TECH-IDEMPOTENCY
    choice: Idempotent state-creating commands use Idempotency-Key and exact persisted response replay scoped by principal method route normalized target and key.
    rationale: Retry must not reconstruct responses from later mutable state or duplicate authoritative mutations.

  - id: TECH-PROVENANCE
    choice: Provenance is explicit typed fields owned by the relevant semantic contract; no generic caller-writable provenance blob is canonical.
    rationale: Preserve request authority, permission, business and technical explainability without ambiguous generic metadata.

ownership_boundary:
  application_interaction_choices: SYSTEM-ARCHITECTURE
  http_specific_choices: INTERFACE-DESIGN
  persistence_specific_choices: DATA-DESIGN
