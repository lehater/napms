version: 3
kind: application-architecture-rules
id: NAPMS-MVP-SYSTEM-RULES
status: CURRENT

requirements_ref: docs/requirements/first-mvp-product-requirements.yaml
architecture_driver_closure_ref: docs/requirements/first-mvp-architecture-driver-closure.yaml
structural_model_ref: docs/architecture/structurizr/workspace.dsl

architecture_goal: Realize the accepted backend MVP as one modular-monolith process plus PostgreSQL and external OIDC, preserving owner boundaries and complete policy materialization.

application_boundary_rules:
  design_rule: One HTTP/JSON application boundary orchestrates owner modules; internal Bounded Context interaction is in-process through explicit contracts.
  required_capabilities:
    - manage Resource Site responsibility AuthorityScopeRef Endpoints and address realization
    - manage reusable Applications Components Interactions and immutable InteractionRevisions
    - create ComponentDeployments
    - manage BusinessProcess criticality and participant-attributed ConnectivityNeeds
    - submit AccessRequests and record final ALLOWED or DENIED decisions
    - manage PolicyRule Active/Inactive EffectiveWindow and additional Need justification
    - materialize all current policy or explicit Rule subset with scoped export admission
  error_rule: Missing current Resource address remains explicit as an INCOMPLETE enriched export row; missing durable owner truth or dependency failure is not a successful materialization.

interaction_rules:
  - Owner modules interact in-process through public application/read ports; HTTP and database tables are not internal integration boundaries.
  - Cross-owner references are opaque owner-defined identities; consumers do not duplicate peer mutable truth.
  - AccessRequest submission validates current Need under an owner-provided lock, resolves the source Resource AuthorityScopeRef and requires access.request authority only for that source scope; destination scope is not request-admission authority.
  - DENIED finalization mutates only AccessRequest and creates no PolicyRule.
  - ALLOWED finalization atomically resolves or creates one Rule per AccessSubject and appends authorization and justification evidence.
  - Policy materialization is read-only composition and owns no domain truth.
  - Materialization uses one read-only REPEATABLE READ snapshot and database transaction_timestamp() as evaluationAt.
  - Export authority for every distinct selected Resource scope is evaluated at the same evaluationAt before result exposure.
  - Preflight validates selected Rule references, durable deployment/revision/Resource truth and export authority before HTTP 200 commitment; ordinary missing current Resource address is represented inside the enriched COMPLETE result as row-level INCOMPLETE data. Post-commit stream failure is not a valid export artifact.

consistency:
  local: Aggregate invariants are transactional in the owning module.
  request_submission: Business Connectivity current-Need validation lock is held through Access Policy request commit; Access Policy does not write peer state.
  allowed_finalization: AccessRequest finalization PolicyRule resolve/create AuthorizationEvidence initial justification and idempotency result commit atomically.
  export: One shared read snapshot covers selection authority evaluation effectiveness provenance and technical realization.

deployment:
  baseline: One stateless backend binary with explicit migrate and serve modes, PostgreSQL, external HTTPS OIDC issuer and trusted ingress terminating external TLS.
  migration_rule: migrate serializes with PostgreSQL advisory lock and immutable migration checksums; serve never runs DDL and verifies exact schema before listen.
  asynchronous_messaging: NOT_APPLICABLE
  scale_rationale: First MVP validates the complete idea for one organization at proof-of-concept scale (primarily one developer; approximately five to ten concurrent users if shared). Future production scale and heavy asynchronous jobs explicitly reopen architecture.

excluded_from_mvp_runtime:
  - provider-specific rendering
  - firewall/provider mutation
  - configured-state reconciliation
  - historical policy export
  - distributed services

reliability_contract:
  availability:
    target: No numeric availability target is required for first MVP.
    behavior: Service availability depends on the single application process plus required PostgreSQL/OIDC dependencies; dependency inability is a technical failure, never a successful domain outcome.
  durability:
    behavior: A mutation is acknowledged only after its owning PostgreSQL transaction commits; unknown commit outcome is never reported as confirmed success.
  recovery:
    process: Application-process recovery is restart using committed PostgreSQL state and exact schema verification.
    dependency: Transient database/OIDC inability may recover on restart or subsequent request without rewriting accepted domain state.
    disaster_recovery: No RPO/RTO or automatic failover/backup product requirement is invented for first MVP; such a requirement reopens System/Operability/Data design.
