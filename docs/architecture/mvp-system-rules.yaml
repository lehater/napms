version: 2
kind: application-architecture-rules
id: NAPMS-MVP-SYSTEM-RULES
status: PILOT_CURRENT

structural_model_ref: docs/architecture/structurizr/workspace.dsl
module_contracts_ref: docs/architecture/mvp-module-contracts.yaml
persistence_model_ref: docs/architecture/persistence/mvp-persistence.yaml
http_contract_requirements_ref: docs/contracts/http/napms-api-requirements.yaml

architecture_goal: Realize the complete accepted MVP journey on one frontend plus modular-monolith backend baseline, making application-boundary and module-coordination choices once rather than independently per Bounded Context.

application_boundary_rules:
  design_rule: API operations are organized around MVP use cases and resources exposed by the application boundary; they are not one network API per Bounded Context.
  required_capabilities:
    - manage Resources and AddressSpace
    - manage Application/Components/Interactions and traffic revisions
    - manage ComponentDeployments
    - manage BusinessProcess/ConnectivityNeed
    - submit and decide RuleChange
    - view complete current vendor-neutral policy table
    - download same result as CSV
  error_rule: Domain rejection and Unresolved materialization are explicit application outcomes; missing materialization input is never represented as a silently partial successful export.

interaction_rules:
  - Backend domain modules interact in-process through explicit module/application interfaces; HTTP is not an internal Bounded Context boundary.
  - Cross-module references use owner-defined identities and resolved semantics; consuming modules do not duplicate another module's mutable truth.
  - Policy export composition is read/orchestration logic and must not become an alternate owner of Resource, ACC, Deployment, Connectivity or Policy state.
  - Access Policy acceptance validates exact deployment endpoints, exact immutable ACC revision and required current ConnectivityNeed basis through explicit module contracts before committing its owned transition.
  - Failure to resolve required materialization input propagates as Unresolved; the composition must not silently omit rows.

consistency:
  local: Aggregate invariants are enforced transactionally inside the owning module.
  cross_module: Cross-context validation uses explicit orchestration/contracts; do not manufacture distributed-service semantics inside the monolith.
  policy_acceptance: Formal Access Policy state transition is owned and committed by Access Policy after prerequisite semantic validation and protected-action admission.
  export: Read composition may span modules; it returns Success with a complete result or Unresolved with explicit causes.

integration_boundary:
  asynchronous_messaging: NOT_APPLICABLE
  asynchronous_messaging_reason: No asynchronous messaging boundary is introduced for the first-MVP modular monolith.
  external_runtime_integrations_not_required: [provider/device integration, evidence source, enforcement runtime]
  evolution_rule: Module contracts and ownership boundaries permit later extraction/integration only if a future quality/runtime need justifies it; extraction is not an MVP design goal.

architecture_questions_remaining: []
