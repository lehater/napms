version: 3
kind: observability-requirements
id: NAPMS-MVP-OBSERVABILITY
status: CURRENT
scope: Diagnostic evidence needed to operate the corrected backend MVP.

requirements:
  - {id: OBS-REQ-001, requirement: Every HTTP request has correlationId propagated through application and database work.}
  - {id: OBS-AUTH-002, requirement: Authorization denial records operation and required permission or safe scopeRef without bearer contents.}
  - {id: OBS-POLICY-003, requirement: Materialization completion records COMPLETE or UNRESOLVED evaluationAt selected-rule count row count unresolved count and duration only after a syntactically complete result.}
  - {id: OBS-OIDC-004, requirement: OIDC refresh success failure and unusable-key dependency state are distinguishable without logging tokens or keys.}
  - {id: OBS-DB-005, requirement: Database timeout unavailable and migration or schema failure are distinguishable from domain rejection.}
  - {id: OBS-SECRET-006, requirement: Tokens database DSN or password and secret material are never logged.}

not_required:
  - Distributed tracing backend.
  - Numeric production SLOs dashboards or alert thresholds because numeric latency throughput availability and scale targets are explicitly NOT_REQUIRED for first MVP.

configuration_contract:
  rule: Required runtime configuration is resolved deterministically at startup; invalid or incomplete security/database/OIDC configuration fails before serving requests.
  material_inputs: [database connectivity, OIDC issuer/discovery/JWKS policy, listener/runtime settings required by accepted deployment]
  runtime_reload: NOT_REQUIRED

health_readiness:
  readiness: Ready only after required configuration is valid, database schema/connectivity checks pass and OIDC validation dependencies can satisfy the accepted startup/dependency policy.
  liveness: Process/listener running; liveness does not claim downstream dependency readiness.
  dependency_visibility: Database and OIDC dependency inability remain distinguishable from domain rejection.

incident_contract:
  first_mvp: No paging/on-call workflow is created by this design.
  behavior:
    - Fail closed for invalid startup/security/schema state.
    - Surface technical dependency failure distinctly from accepted application outcomes.
    - Preserve safe correlation and diagnostic evidence sufficient to identify the failing boundary.
    - Recovery after corrected configuration/dependency state is by restart or a subsequent request according to the owning dependency semantics.

signal_applicability:
  dedicated_metrics: NOT_REQUIRED
  distributed_tracing: NOT_REQUIRED
  alerting: NOT_REQUIRED
  rationale: No accepted SLI/SLO, monitoring or paging consumer requires these signals for first MVP; reopen when such a consumer or numeric objective is accepted.
