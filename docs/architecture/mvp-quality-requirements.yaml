version: 3
kind: quality-requirements
id: NAPMS-MVP-QUALITY-REQUIREMENTS
status: CURRENT
scope: Architecture-significant first-MVP constraints. Numeric latency throughput availability and scale targets are explicitly NOT_REQUIRED, not unknown.

scenarios:
  - id: QR-CORRECTNESS-001
    characteristic: functional-suitability
    requirement: COMPLETE export is coherent for one evaluationAt and contains all required selected-Rule provenance plus all technical rows for selected effective Rules; unresolved required effective realization cannot be silently omitted.
    evidence_refs: [FIRST-MVP-REQUIREMENTS, FIRST-MVP-JOURNEY, SYSTEM-RULES]
  - id: QR-AUTHORITY-001
    characteristic: security
    requirement: Access request and policy export fail closed unless the actor has effective scoped authority for every relevant Resource AuthorityScopeRef at the server-owned admission or evaluation time.
    evidence_refs: [FIRST-MVP-REQUIREMENTS, SECURITY-ARCHITECTURE]
  - id: QR-INTEGRITY-001
    characteristic: reliability
    requirement: Owner writes are transactional with declared optimistic concurrency; unknown mutation outcome is never represented as confirmed success.
    evidence_refs: [SYSTEM-RULES, PERSISTENCE]
  - id: QR-SNAPSHOT-001
    characteristic: consistency
    requirement: Policy materialization uses one read-only REPEATABLE READ snapshot and one database-owned evaluationAt through preflight and emission.
    evidence_refs: [SYSTEM-RULES, PERSISTENCE]
  - id: QR-MAINTAINABILITY-001
    characteristic: maintainability
    requirement: Owner boundaries remain explicit and no cross-owner database foreign keys or internal HTTP are introduced.
    evidence_refs: [MODULE-CONTRACTS, PERSISTENCE]

not_required_numeric_targets:
  latency: NOT_REQUIRED
  throughput: NOT_REQUIRED
  availability: NOT_REQUIRED
  scale: NOT_REQUIRED

coverage_decisions:
  performance:
    latency: Numeric latency target is NOT_REQUIRED for first MVP; no hidden numeric acceptance threshold may be invented.
    throughput: Numeric throughput target is NOT_REQUIRED for first MVP; no hidden numeric acceptance threshold may be invented.
    capacity: No numeric capacity target is accepted. Requests/exports must remain bounded by accepted HTTP and materialization constraints; evidence requiring a concrete capacity reopens Quality Design.
    resource_efficiency: Materialization must use bounded/chunked traversal and must not require an unbounded in-memory copy of the complete policy result before emission.
  maintainability:
    modularity: Owner/module boundaries and no internal HTTP/cross-owner table coupling remain mandatory.
    analysability: Failure, owner and boundary distinctions must remain diagnosable through explicit contracts and operability evidence.
    modifiability: A change local to one owner must not require changing unrelated owner internals when public contracts remain stable.
    testability: Domain/module contracts must permit verification at owner, integration and API levels without requiring unrelated infrastructure.
