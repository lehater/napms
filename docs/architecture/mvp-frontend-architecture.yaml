version: 1
kind: frontend-architecture
id: NAPMS-MVP-FRONTEND-ARCHITECTURE
status: CURRENT

purpose: Realize the accepted first-MVP human-interface contracts as one browser frontend over the canonical HTTP API without duplicating product/domain/security authority.

basis:
  human_interface: docs/contracts/ui/mvp-human-interface.yaml
  presentation_system: docs/contracts/ui/mvp-presentation-system.yaml
  screen_view_design: docs/contracts/ui/mvp-screen-view-design.yaml
  http: docs/contracts/http/napms.openapi.yaml
  security: docs/architecture/mvp-security-architecture.yaml
  quality: docs/architecture/mvp-quality-requirements.yaml

structure:
  runtime: browser application delivered by the existing application deployment boundary
  integration: HTTP/JSON only through the canonical OpenAPI application API
  ownership:
    server: product/domain truth, authorization, persistence, authoritative validation
    frontend: navigation, transient interaction state, presentation mapping, local form state
  forbidden:
    - direct database access
    - domain-rule reimplementation as frontend authority
    - security authority derived from hidden/disabled controls
    - persistent duplicate canonical domain state

frontend_application:
  transport_boundary: Typed HTTP client operations map canonical OpenAPI requests, responses and error outcomes without owning screen semantics.
  screen_runtime: Feature-local query/command orchestration maps transport projections into provider-neutral Screen Models and owns request lifecycle plus ephemeral interaction state.
  screen_contract: Canonical Screen/View Design remains the authority for screen purpose, states, capabilities, exclusions and presentation-pattern selection.
  presentation_boundary: Feature screens consume project presentation-pattern adapters; concrete provider APIs remain behind the selected provider implementation.
  bff:
    state: NOT_APPLICABLE
    rationale: Current First-MVP HTTP projections already supply the facts needed by browser screens; deterministic frontend mapping is sufficient and no trusted cross-service aggregation, credential mediation or server-side frontend composition is required.
    reopening_conditions:
      - material cross-service aggregation or request chattiness cannot be solved within accepted backend application contracts;
      - frontend-specific orchestration must execute inside a trusted server boundary;
      - server/edge caching or projection shaping becomes an architecture-significant requirement;
      - a stable browser-facing API must insulate the client from independently evolving downstream APIs.

state_model:
  remote_state: Server responses are authoritative snapshots and are refreshed after accepted mutations.
  screen_state: Derived Screen Models plus request lifecycle; this state carries frontend application meaning but no independent domain truth.
  local_state: Form input, disclosure state and other ephemeral interaction state only.
  errors: Preserve accepted not-found, validation, authorization, concurrency and technical-failure distinctions.

security:
  - Bearer/session identity and authorization remain backend-owned.
  - Frontend visibility is convenience, never proof of permission.
  - Untrusted rendered content is escaped/safely rendered.
  - Security-sensitive diagnostics do not expose tokens or protected policy/member facts.

reliability:
  availability: No independent frontend availability target beyond the accepted first-MVP application deployment.
  recovery: Browser/page reload reconstructs transient frontend state from authoritative API state.
  durability: Frontend owns no durable business state.

quality:
  - Preserve feature ownership and avoid a global mutable client data model.
  - Shared presentation rules come from the canonical Presentation System rather than feature-local invention.
  - Screen structure follows canonical Screen/View contracts; architecture does not redefine composition.
  - User-visible state transitions remain testable independent from CSS/framework realization.
