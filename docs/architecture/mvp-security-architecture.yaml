version: 4
kind: security-architecture
id: NAPMS-MVP-SECURITY-ARCHITECTURE
status: CURRENT

purpose: Own OIDC authentication, authenticated external-Group membership evidence, current protected-action authority admission and protection boundaries without putting NAPMS Role/RoleAssignment authority truth into bearer tokens or redefining business permission outcomes.

authentication:
  mechanism: OIDC bearer JWT
  issuer: configured absolute HTTPS issuer
  required_claims: [iss, aud, exp, sub]
  optional_time_claims: [nbf, iat]
  key_contract:
    - signed token only; alg none and all HS algorithms are forbidden
    - alg must be startup-configured allowed asymmetric algorithm
    - kid is required non-empty string
    - discovery issuer must exactly match configured issuer
    - discovery jwks_uri must be absolute HTTPS
    - redirects to non-HTTPS are rejected
  dependency_semantics:
    - cryptographically invalid token with usable validation material -> 401
    - inability to establish validity because required key material is unavailable or too stale -> 503

development_authentication:
  applicability: NAPMS_ENVIRONMENT=local-dev only
  purpose: Bootstrap developer browser access without creating a second product authorization model.
  fixed_credentials: {login: admin, password: admin}
  endpoint:
    method: POST
    path: /dev-auth/login
    canonical_product_openapi: false
  token_source: full-profile short-lived JWT from the deterministic local OIDC issuer
  rules:
    - the endpoint is registered only by local-dev runtime composition and is absent otherwise
    - successful bootstrap returns the same bearer-token shape consumed by the canonical API
    - issued tokens pass through the normal OIDC validation instance-permission and group-membership admission path
    - fixed development credentials are not an accepted non-local or production authentication mechanism
    - returned bearer tokens remain runtime-only browser state and are never logged

browser_credential_lifecycle:
  current_scope: local-development browser access
  acquisition:
    local_dev:
      mechanism: same-origin development sign-in exchanges fixed development credentials for an OIDC-backed bearer JWT
      endpoint: /dev-auth/login
      credentials: {login: admin, password: admin}
  credential_storage:
    location: browser runtime memory only
    persistence: none; reload or tab close clears the browser-held bearer token
  expiry_renewal:
    access_token: short-lived JWT carrying the local issuer exp claim
    refresh: NOT_APPLICABLE for the current local-development slice; no refresh token or silent renewal exists
    recovery: reload the browser and sign in again to acquire a fresh development token
  logout_invalidation:
    explicit_logout: NOT_APPLICABLE for the current local-development slice
    runtime_clear: reload or tab close clears the in-memory browser identity
    server_invalidation: no active revocation channel is required for the local-development token; expiry is authoritative
  rejection_recovery:
    unauthenticated: a 401 remains an authentication rejection; reload returns to the sign-in gate because identity is runtime-only
    forbidden: a 403 remains an authorization rejection and does not replace or broaden the authenticated identity
  non_local:
    state: DEFERRED
    reopening_condition: Before any non-local browser deployment, define accepted OIDC browser acquisition credential storage renewal logout and invalidation semantics; the development login endpoint remains absent.

principal:
  subject: validated non-empty sub mapped to stable ActorRef
  instance_permissions_claim: configured array of coarse application permission strings
  group_membership_claim: configured array of external GroupRef values in the validated access token
  rules:
    - malformed permission or group-membership claim is 401
    - missing claim yields empty corresponding set
    - unknown permissions or GroupRefs grant nothing
    - caller body query and forwarded identity permission group or authority headers never override bearer identity

external_group_membership:
  owner: configured OIDC identity provider
  evidence: validated signed access-token group-membership claim
  evaluation_rule: Every protected action rereads the authenticated request principal and group-membership claim; NAPMS does not cache a previous successful group-derived authority result as standing authority.
  freshness_boundary: Group membership is authoritative as represented by the currently valid access token; a membership change after token issuance is guaranteed to affect NAPMS no later than acquisition of a new token or expiry of the old token.
  failure_rule: Missing malformed or unknown GroupRef evidence contributes no group authority; token-validation uncertainty follows authentication dependency semantics and fails closed.

instance_permissions:
  - resource.read
  - resource.write
  - application.read
  - application.write
  - deployment.read
  - deployment.write
  - business.read
  - business.write
  - access.read
  - policy.read
  - authority.manage
  - organization.manage

scoped_actions: [access.request, access.decide, policy.revoke, policy.export]

authority_source:
  owner: Authority Management
  role_truth: persisted NAPMS Role containing Actions
  assignment_truth: persisted temporal RoleAssignment targeting ActorRef or GroupRef plus ScopeTarget and ALLOW or DENY effect
  scope_truth: Organization Structure plus Resource current OrganizationalUnit ownership
  rule: A bearer token contains identity and external Group membership evidence, not authoritative NAPMS RoleAssignment grants.

scoped_admission:
  access_request:
    scope_source: source Resource current OrganizationalUnit owner resolved to its applicable OrganizationalUnit or Organization ScopeTarget
    time: database-owned admissionAt
    authority: current access.request authority for source side only
    evidence: immutable AuthorityEvidence stored with AccessRequest submission evidence
  approval_decision:
    scope_source: immutable required administrative side from AccessRequest ApprovalBasis
    time: database-owned decisionAt
    authority: current access.decide authority for that side
    evidence: immutable AuthorityEvidence stored with ApprovalDecision
  policy_revoke:
    scope_source: source and destination administrative sides resolved from the PolicyRule exact AccessSubject
    time: database-owned revokedAt
    authority: current policy.revoke authority for either participating side independently; one matching side is sufficient and no authority from the other side is required
    evidence: immutable RevocationEvidence stores actor participating side ScopeTarget evaluatedAt and AuthorityEvidence
  policy_export:
    scope_source: applicable current Organization or OrganizationalUnit ScopeTargets derived from selected PolicyRules' participating Resources
    time: materialization database-owned evaluationAt
    authority: current policy.export authority for every distinct applicable selected scope
    evidence: ExportAuthorityEvidence included in export result
  rule: Authority Management evaluates current Role RoleAssignment hierarchy and token-backed Group membership fail-closed; applicable DENY overrides ALLOW.

non_authority_facts:
  - Resource organizational ownership by itself
  - Resource Site
  - Resource OWNER or ADMINISTRATOR descriptive responsibility
  - BusinessProcess responsible organization or criticality
  - ConnectivityNeed existence

transport:
  external: HTTPS terminated by trusted ingress/reverse proxy
  application_listener: private plaintext inside trusted deployment boundary
  bearer_location: Authorization header only

secrets:
  never_log: [bearer token, database credentials, private signing material]

security_questions_remaining: []
