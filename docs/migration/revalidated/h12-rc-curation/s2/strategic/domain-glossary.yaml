canonical_payload:
  terms:
  - term_id: TERM-RESOURCE
    term: Resource
    definition: An access-relevant catalogue identity independent of whether current realization, scope-affiliation or responsibility facts are present.
    context_ref: {anchor_id: NAPMS-S2-BC-RESOURCE-CATALOGUE}
  - term_id: TERM-ADDRESS-SPACE
    term: AddressSpace
    definition: The MVP Resource realization value; exactly one HostAddress or one Prefix when present. One Resource has at most one effective AddressSpace at one logical time.
    context_ref: {anchor_id: NAPMS-S2-BC-RESOURCE-CATALOGUE}
  - term_id: TERM-RESOURCE-REALIZATION
    term: Resource technical realization
    definition: A time-qualified Resource fact establishing one AddressSpace; replacement changes the effective HostAddress-or-Prefix without changing Resource identity and preserves history.
    context_ref: {anchor_id: NAPMS-S2-BC-RESOURCE-CATALOGUE}
  - term_id: TERM-RESOURCE-SCOPE-AFFILIATION
    term: Resource Scope Affiliation
    definition: A time-qualified Resource Catalogue fact associating a Resource with a Responsibility Scope reference; it does not grant curation authority.
    context_ref: {anchor_id: NAPMS-S2-BC-RESOURCE-CATALOGUE}
  - term_id: TERM-RESOURCE-RESPONSIBILITY
    term: Resource Responsibility
    definition: A Resource Catalogue fact recording operational person/team responsibility or contact roles; it is not mutation permission.
    context_ref: {anchor_id: NAPMS-S2-BC-RESOURCE-CATALOGUE}
  - term_id: TERM-EFFECTIVE-AUTHORITY
    term: Effective Authority
    definition: Authority Management determination of whether an Actor may perform an Action for the applicable scope and time.
    context_ref: {anchor_id: NAPMS-S2-BC-AUTHORITY-MANAGEMENT}
  logical_derivation:
    basis_refs: [{kind: anchor-current, anchor_id: NAPMS-S1-RC-CURATION-BEHAVIOR}, {kind: anchor-current, anchor_id: NAPMS-S2-BC-RESOURCE-CATALOGUE}]
