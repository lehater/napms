    - {kind: anchor-current, anchor_id: NAPMS-S1-RC-CURATION-AUTHORIZATION}
    derivation_kind: synthesis
    rationale: The S1 mutation contract requires an independently owned effective-authority decision and explicitly rejects Resource catalogue facts as permission. Current canonical authority ownership confirms the same model boundary.
