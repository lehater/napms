  scope_id: H12-RC-CURATION-MVP
  product_area: Resource Catalogue curation
  lifecycle_boundary: S2 Strategic domain design
status: ACCEPTED
canonical_payload:
  capabilities:
  - capability_id: CAP-RC-RESOURCE-CURATION
    name: Resource catalogue curation
    business_outcome: Responsible local users can maintain the access-relevant Resource catalogue through supported product workflows for downstream NAPMS access outcomes.
    responsibility: Maintain Resource identity/lifecycle, time-qualified technical realization information, Resource Scope Affiliation and Resource Responsibility/contact facts.
    language_terms: [Resource, technical realization, Resource Scope Affiliation, Resource Responsibility]
    behavior_basis_selectors:
    - {anchor_id: NAPMS-S1-RC-CURATION-BEHAVIOR}
    - {anchor_id: NAPMS-S1-RC-CURATION-INTEGRITY}
  - capability_id: CAP-AM-CURATION-ADMISSION
    name: Catalogue mutation admission
    business_outcome: Protected Resource Catalogue mutations are admitted or denied from effective actor/action/scope authority without treating catalogue facts as permission.
    responsibility: Evaluate Resource Catalogue curation action admission for the authenticated actor, fixed catalogue administrative scope and effective time.
    language_terms: [Actor, Action, Effective Authority, ResponsibilityScopeRef]
    behavior_basis_selectors:
    - {anchor_id: NAPMS-S1-RC-CURATION-AUTHORIZATION}
  clustering:
  - cluster_id: CLUSTER-RC-RESOURCE-CATALOGUE
    capability_ids: [CAP-RC-RESOURCE-CURATION]
    rationale: Resource identity, realization history, scope affiliation and responsibility/contact use one cohesive Resource catalogue language and lifecycle.
    status: accepted
  - cluster_id: CLUSTER-AM-AUTHORITY
    capability_ids: [CAP-AM-CURATION-ADMISSION]
    rationale: Action admission uses an independently reusable authority model whose meaning is distinct from Resource catalogue ownership, responsibility and visibility.
    status: accepted
  logical_derivation:
    basis_refs:
    - {kind: anchor-current, anchor_id: NAPMS-S1-RC-CURATION-BEHAVIOR}
    - {kind: anchor-current, anchor_id: NAPMS-S1-RC-CURATION-AUTHORIZATION}
    - {kind: anchor-current, anchor_id: NAPMS-S1-RC-CURATION-INTEGRITY}
    derivation_kind: synthesis
    rationale: Accepted S1 behavior separates Resource catalogue maintenance from effective action admission; current canonical domain ownership assigns those responsibilities to Resource Catalogue and Authority Management respectively.
    method_rule_ids: [DDD-MR-CAPABILITY-DISCOVERY]
    decision_refs: []
    evidence_refs: []
