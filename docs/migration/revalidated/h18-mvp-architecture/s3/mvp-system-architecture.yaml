anchor_id: NAPMS-S3-FIRST-MVP-SYSTEM-ARCHITECTURE
type_id: software-architecture
owner_stage: S3
scope: {scope_id: H18-FIRST-MVP-ARCHITECTURE, product_area: Complete first MVP journey, lifecycle_boundary: S3 Software Architecture / Solution Design}
status: ACCEPTED
canonical_payload:
  architecture_goal: Realize the complete accepted MVP journey on one frontend plus modular-monolith backend baseline, making system-wide technical choices once rather than independently per Bounded Context.
  system_shape:
    frontend: Single browser application for the complete MVP authoring and policy-export journey.
    backend: Single deployable modular monolith containing domain-aligned modules and an application composition layer.
    persistence: One PostgreSQL database colocating module-owned schemas.
    deployment_units: [frontend, backend, postgresql]
    rule: 'Bounded Context ownership guides backend module boundaries; it does not imply one service, process or network API per context.'
  backend_modules:
    resource_catalogue: {owns: Resource and current AddressSpace application/domain realization, domain_anchor: NAPMS-S2-BC-RESOURCE-CATALOGUE}
    application_communication_catalogue: {owns: 'ApplicationDefinition, Component, Interaction and immutable InteractionContractRevision realization', domain_anchor: NAPMS-S2-BC-APPLICATION-COMMUNICATION-CATALOGUE}
    application_deployment: {owns: ComponentDeployment realization and references to ACC Component and RC Resource, domain_anchor: NAPMS-S2-BC-APPLICATION-DEPLOYMENT}
    business_connectivity: {owns: BusinessProcess and ConnectivityNeed realization, domain_anchor: NAPMS-S2-BC-BUSINESS-CONNECTIVITY}
    access_policy: {owns: 'PolicyRule, RuleChange and current EffectivePolicyRule realization', domain_anchor: NAPMS-S2-BC-ACCESS-POLICY}
    authority_management: {owns: effective actor/action/scope authority and protected-action admission, domain_anchor: NAPMS-S2-BC-AUTHORITY-MANAGEMENT}
    policy_export_composition: {owns: No domain truth; orchestrates reads from owner modules to materialize complete vendor-neutral policy and render table/CSV projections, peer_bounded_context: false}
  frontend_backend_boundary:
    protocol: HTTP
    payload_style: JSON for application commands and queries; CSV for the explicit policy export representation.
    canonical_contract: One OpenAPI contract for the system application API.
    design_rule: API operations are organized around MVP use cases and resources exposed by the application boundary; they are not one network API per Bounded Context.
    required_capabilities: [manage Resources and AddressSpace, manage Application/Components/Interactions and traffic revisions, manage ComponentDeployments, manage BusinessProcess/ConnectivityNeed, submit and decide RuleChange, view complete current vendor-neutral policy table, download same result as CSV]
    error_rule: Domain rejection and Unresolved materialization are explicit application outcomes; missing materialization input is never represented as a silently partial successful export.
  interaction_rules:
    - Backend domain modules interact in-process through explicit module/application interfaces; HTTP is not an internal Bounded Context boundary.
    - Cross-module references use owner-defined identities and resolved semantics; consuming modules do not duplicate another module's mutable truth.
    - Policy export composition is read/orchestration logic and must not become an alternate owner of Resource, ACC, Deployment, Connectivity or Policy state.
    - Access Policy acceptance validates exact deployment endpoints, exact immutable ACC revision and required current ConnectivityNeed basis through explicit module contracts before committing its owned transition.
    - Failure to resolve required materialization input propagates as Unresolved; the composition must not silently omit rows.
  persistence:
    engine: PostgreSQL
    topology: One physical PostgreSQL database for the MVP backend.
    ownership: Each domain module owns its persistence schema/repository contract inside the shared database.
    mutation_rule: No module directly mutates another module's tables or persistence model.
    read_rule: Cross-module semantics are obtained through owner module contracts; composition may combine owner-published read projections without transferring ownership.
    migration_rule: Schema migrations are applied as one backend deployment concern while preserving module ownership in migration organization.
    transaction_rule: Aggregate invariants are transactional inside the owner module; the modular monolith may use one local database transaction where one application use case coordinates owner operations, without redefining semantic ownership.
  authorization:
    identity_boundary: Authenticated actor identity is established by the backend session boundary and is not accepted from caller-supplied actor fields.
    authentication_baseline: Local username/password authentication with server-side session is sufficient for the MVP; no external identity provider is required.
    admission: Protected application use cases ask Authority Management for effective actor/action/scope admission and fail closed when required authority is unknown or ambiguous.
    ownership_rule: Frontend visibility, disabled controls, Resource responsibility, catalogue facts and other domain metadata never substitute for Authority Management admission.
    composition_rule: Application orchestration performs admission before invoking protected owner-module mutation; owner domain semantics remain unchanged by presentation concerns.
  consistency:
    local: Aggregate invariants are enforced transactionally inside the owning module.
    cross_module: Cross-context validation uses explicit orchestration/contracts; do not manufacture distributed-service semantics inside the monolith.
    policy_acceptance: Formal Access Policy state transition is owned and committed by Access Policy after prerequisite semantic validation and protected-action admission.
    export: 'Read composition may span modules; it returns Success with a complete result or Unresolved with explicit causes.'
  deployment:
    baseline: Browser frontend, backend modular monolith and PostgreSQL are the complete MVP runtime topology.
    external_dependencies: No external IdP, provider/device integration, evidence source or enforcement runtime is required for the first MVP journey.
    evolution_rule: Module contracts and ownership boundaries permit later extraction only if a future quality/runtime need justifies it; extraction is not an MVP design goal.
  excluded_from_mvp_runtime: [Network Enforcement Placement, provider-specific rendering, Access Policy Realization, Network Environment Operations, Technical Access Evidence ingestion/recognition]
  architecture_questions_remaining: []
  logical_derivation:
    basis_refs:
      - {kind: anchor-current, anchor_id: NAPMS-S1-FIRST-MVP-POLICY-EXPORT}
      - {kind: anchor-current, anchor_id: NAPMS-S2-FIRST-MVP-JOURNEY-DOMAIN-MODEL}
      - {kind: anchor-current, anchor_id: NAPMS-S2-BC-AUTHORITY-MANAGEMENT}
      - {kind: evidence, path: docs/architecture/current-architecture.md, use: compatible architecture evidence for PostgreSQL and server-session authority boundary}
    derivation_kind: architecture-from-accepted-domain-slice-and-compatible-evidence
    rationale: Apply the roadmap-selected frontend plus modular-monolith baseline once to the whole accepted MVP journey; use the stakeholder-approved HTTP/JSON plus OpenAPI delivery boundary and retain compatible simple local PostgreSQL/session architecture where it does not conflict with accepted target domain ownership.
