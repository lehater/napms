<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">NAPMS Resource History reference</title>
  <desc id="desc">Read-only temporal timeline for Resource realization, scope affiliation and responsibility facts.</desc>
  <defs><style>
    .bg{fill:#f8fafc}.side{fill:#111827}.side2{fill:#1f2937}.card{fill:#fff;stroke:#dce3ec;stroke-width:1}.line{stroke:#e2e8f0;stroke-width:1}.timeline{stroke:#bfdbfe;stroke-width:3}.txt{font-family:Inter,Arial,sans-serif;fill:#172033}.muted{font-family:Inter,Arial,sans-serif;fill:#64748b}.small{font-size:12px}.body{font-size:14px}.label{font-size:11px;font-weight:700;letter-spacing:.7px}.h1{font-size:27px;font-weight:700}.h2{font-size:16px;font-weight:700}.bold{font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.control{fill:#fff;stroke:#cbd5e1}.green{fill:#ecfdf5}.greenText{font-family:Inter,Arial,sans-serif;fill:#047857;font-size:12px;font-weight:700}.nav{font-family:Inter,Arial,sans-serif;fill:#cbd5e1;font-size:14px}.navActive{fill:#fff;font-weight:700}
  </style></defs>
  <rect class="bg" width="1440" height="900"/><rect class="side" width="228" height="900"/>
