<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">NAPMS Resource Catalogue list reference</title>
  <desc id="desc">Dense Resource Catalogue operational table with search, filters, diagnostics and new resource action.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.side{fill:#111827}.side2{fill:#1f2937}.card{fill:#fff;stroke:#dce3ec;stroke-width:1}.line{stroke:#e2e8f0;stroke-width:1}.txt{font-family:Inter,Arial,sans-serif;fill:#172033}.muted{font-family:Inter,Arial,sans-serif;fill:#64748b}.small{font-size:12px}.body{font-size:14px}.label{font-size:11px;font-weight:700;letter-spacing:.7px}.h1{font-size:27px;font-weight:700}.h2{font-size:16px;font-weight:700}.bold{font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.btn{fill:#2563eb}.btnText{font-family:Inter,Arial,sans-serif;fill:#fff;font-size:14px;font-weight:700}.control{fill:#fff;stroke:#cbd5e1}.chip{fill:#eff6ff;stroke:#93c5fd}.chipText{font-family:Inter,Arial,sans-serif;fill:#1d4ed8;font-size:12px;font-weight:700}.green{fill:#ecfdf5}.greenText{font-family:Inter,Arial,sans-serif;fill:#047857;font-size:12px;font-weight:700}.warnText{font-family:Inter,Arial,sans-serif;fill:#b45309;font-size:12px;font-weight:700}.nav{font-family:Inter,Arial,sans-serif;fill:#cbd5e1;font-size:14px}.navActive{fill:#fff;font-weight:700}
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <rect class="side" width="228" height="900"/>
  <text x="28" y="42" class="txt" style="fill:#fff;font-size:19px;font-weight:800">NAPMS</text>
  <text x="28" y="82" class="muted label" style="fill:#64748b">OVERVIEW</text>
  <text x="32" y="116" class="nav">Connectivity</text>
  <text x="32" y="148" class="nav">Checker</text>
  <text x="28" y="196" class="muted label" style="fill:#64748b">CATALOGUES</text>
  <rect x="16" y="212" width="196" height="38" rx="7" class="side2"/>
  <text x="32" y="237" class="nav navActive">Resources</text>
  <text x="32" y="278" class="nav">Applications</text>
  <text x="28" y="326" class="muted label" style="fill:#64748b">POLICY</text>
  <text x="32" y="360" class="nav">Needs</text><text x="32" y="392" class="nav">Decisions</text><text x="32" y="424" class="nav">Rules</text>

  <g transform="translate(266 48)">
    <text x="0" y="0" class="txt h1">Resource Catalogue</text>
    <text x="0" y="28" class="muted body">Find and manage network-relevant resources.</text>
    <rect x="1000" y="-26" width="145" height="42" rx="7" class="btn"/>
    <text x="1024" y="0" class="btnText">+ New resource</text>

    <rect x="0" y="58" width="1148" height="730" rx="10" class="card"/>
    <rect x="20" y="78" width="1108" height="42" rx="7" class="control"/>
    <text x="40" y="104" class="muted body">⌕  Search by name, reference, address, scope or owner…</text>

    <text x="20" y="151" class="muted label">SCOPE</text><text x="330" y="151" class="muted label">LIFECYCLE</text><text x="505" y="151" class="muted label">DATA STATE</text>
    <rect x="20" y="161" width="290" height="42" rx="6" class="control"/><text x="36" y="187" class="txt body">All scopes</text>
    <rect x="330" y="161" width="155" height="42" rx="6" class="control"/><text x="346" y="187" class="txt body">Active  ▾</text>
    <rect x="505" y="161" width="230" height="42" rx="6" class="control"/><text x="521" y="187" class="txt body">All  ▾</text>
    <rect x="750" y="161" width="84" height="42" rx="6" class="control"/><text x="771" y="187" class="txt body bold">Apply</text>
    <text x="856" y="187" class="muted body bold">Reset</text>

    <g transform="translate(20 222)">
      <rect width="48" height="28" rx="14" class="chip"/><text x="16" y="19" class="chipText">All</text>
      <rect x="60" width="92" height="28" rx="14" class="control"/><text x="77" y="19" class="muted small bold">No address</text>
      <rect x="164" width="135" height="28" rx="14" class="control"/><text x="181" y="19" class="muted small bold">No responsibility</text>
      <rect x="311" width="83" height="28" rx="14" class="control"/><text x="328" y="19" class="muted small bold">No scope</text>
    </g>

    <g transform="translate(0 270)">
      <rect x="0" y="0" width="1148" height="44" fill="#f8fafc"/>
      <text x="22" y="28" class="muted label">NAME</text><text x="202" y="28" class="muted label">REFERENCE</text><text x="342" y="28" class="muted label">ADDRESSES</text><text x="526" y="28" class="muted label">SCOPE(S)</text><text x="692" y="28" class="muted label">TECHNICAL OWNER</text><text x="884" y="28" class="muted label">LIFECYCLE</text><text x="995" y="28" class="muted label">DATA STATE</text>
      <line x1="0" y1="44" x2="1148" y2="44" class="line"/>

      <g transform="translate(0 44)"><text x="22" y="35" class="txt body bold" style="fill:#2563eb">api-gateway</text><text x="202" y="35" class="muted small mono">res-a31…</text><text x="342" y="27" class="txt small mono">10.20.30.40</text><text x="342" y="44" class="txt small mono">10.20.30.41</text><rect x="526" y="18" width="78" height="24" rx="4" fill="#eff6ff"/><text x="539" y="35" class="chipText">Payments</text><text x="692" y="35" class="txt body">Platform Team</text><rect x="884" y="17" width="60" height="25" rx="13" class="green"/><text x="895" y="34" class="greenText">Active</text><text x="995" y="35" class="greenText">✓ No missing facts</text><line x1="0" y1="62" x2="1148" y2="62" class="line"/></g>
      <g transform="translate(0 106)"><text x="22" y="35" class="txt body bold" style="fill:#2563eb">orders-db</text><text x="202" y="35" class="muted small mono">res-b42…</text><text x="342" y="35" class="txt small mono">10.20.40.10</text><rect x="526" y="18" width="60" height="24" rx="4" fill="#eff6ff"/><text x="539" y="35" class="chipText">Orders</text><text x="692" y="35" class="txt body">Database Team</text><rect x="884" y="17" width="60" height="25" rx="13" class="green"/><text x="895" y="34" class="greenText">Active</text><text x="995" y="35" class="warnText">△ No responsibility</text><line x1="0" y1="62" x2="1148" y2="62" class="line"/></g>
      <g transform="translate(0 168)"><text x="22" y="35" class="txt body bold" style="fill:#2563eb">legacy-dns</text><text x="202" y="35" class="muted small mono">res-c19…</text><text x="342" y="35" class="muted body">—</text><rect x="526" y="18" width="50" height="24" rx="4" fill="#eff6ff"/><text x="539" y="35" class="chipText">Core</text><text x="692" y="35" class="muted body">—</text><rect x="884" y="17" width="60" height="25" rx="13" class="green"/><text x="895" y="34" class="greenText">Active</text><text x="995" y="35" class="warnText">△ No address</text><line x1="0" y1="62" x2="1148" y2="62" class="line"/></g>
      <g transform="translate(0 230)"><text x="22" y="35" class="txt body bold" style="fill:#2563eb">batch-worker</text><text x="202" y="35" class="muted small mono">res-d80…</text><text x="342" y="35" class="txt small mono">10.20.55.23</text><text x="526" y="35" class="muted body">—</text><text x="692" y="35" class="txt body">Runtime Team</text><rect x="884" y="17" width="60" height="25" rx="13" class="green"/><text x="895" y="34" class="greenText">Active</text><text x="995" y="35" class="warnText">△ No scope</text><line x1="0" y1="62" x2="1148" y2="62" class="line"/></g>
    </g>

    <line x1="0" y1="726" x2="1148" y2="726" class="line"/>
    <text x="20" y="760" class="muted small">Page 1 · up to 50 resources per page</text>
    <rect x="874" y="740" width="83" height="34" rx="6" class="control"/><text x="890" y="762" class="muted small bold">Previous</text>
    <rect x="967" y="740" width="34" height="34" rx="6" class="chip"/><text x="980" y="762" class="chipText">1</text>
    <rect x="1011" y="740" width="64" height="34" rx="6" class="control"/><text x="1027" y="762" class="txt small bold">Next</text>
  </g>
</svg>
