version: 2
kind: artifact-type-registry
id: DOCS-V2-ARTIFACT-TYPE-REGISTRY
status: active
owner_phase: H4
owner_task: H4-T2
last_updated: '2026-09-16'

purpose: >-
  Define the machine-readable registry for retained Documentation System v2 artifact families,
  their classification, single semantic owner, applicability, canonical representation,
  schema/DSL selection and validator requirements while preserving H3 identity/provenance
  invariants and completing the S2 artifact families required by the full DDD pipeline.

authority:
  defines:
    - artifact classification vocabulary
    - retained artifact type identities
    - single semantic owner per retained type
    - machine-checkable applicability expressions
    - canonical format and schema/DSL selection rules
    - per-type validator requirement identifiers
    - mapping of anchor types to the H3 Design Anchor envelope
    - legacy catalog disposition
    - S2 ownership split among capability, bounded-context, process, relationship and tactical model truth
  does_not_define:
    - project-specific product or domain truth
    - physical repository paths or filenames
    - dependency graph edge semantics or impact traversal
    - fingerprint/canonicalization algorithm
    - detailed DDD schemas or derivation methods
    - executable validators or Harness runtime
    - product code, tests, CI or workflows
    - canonical cutover from docs/ to docs-v2/
  direct_dependency: {id: DOCS-V2-DESIGN-ANCHOR-CONTRACT, path: docs-v2/spec/design-anchor.yaml}
  redesign_input: [docs-v2/spec/artifacts.md]

cutover_guard:
  current_product_domain_authority: docs/
  registry_effect: classification-and-format-contract-only
  rule: Registry presence or an anchor ACCEPTED status does not perform product/domain cutover.

classification_model:
  allowed: [anchor, evidence, projection, process-state]
  anchor:
    canonical_design_truth: true
    h3_envelope_required: true
    owner_stage_allowed: [S0, S1, S2, S3, S4]
    may_be_current_downstream_truth: only when H3 status == ACCEPTED and validation freshness == CURRENT
  evidence:
    canonical_design_truth: false
    h3_envelope_required: false
    purpose: Durable observation, external source or executable implementation evidence used to justify or validate design truth.
    may_introduce_new_product_domain_truth: false
  projection:
    canonical_design_truth: false
    h3_envelope_required: false
    retained_by_default: false
    rule: Must identify canonical source refs; edits never mutate source truth.
  process-state:
    canonical_design_truth: false
    h3_envelope_required: false
    purpose: Durable Harness/meta/validation/authorization state used to coordinate work.
    may_introduce_new_product_domain_truth: false

owner_model:
  rule: Every retained artifact type declares exactly one owner_stage token. Anchor owner_stage is restricted by H3 to S0-S4.
  allowed_non_anchor_owner_stages: [S0, IMPLEMENTATION, S4, VALIDATION, HARNESS, META]
  forbidden: [multi-owner-syntax, S0/S1, S2/S3, Implementation/Validation]

applicability_model:
  classes:
    mandatory: Required whenever the declared owner stage/process enters the applicable scope.
    conditional: Required only when the structured expression evaluates true.
    optional: Never gate-required solely because the type exists.
  expression_dsl:
    leaf: {fact: stable boolean scope/process fact id}
    operators: [all, any, not]
    evaluation_rule: Expressions are evaluated over declared facts. The registry does not infer missing business facts.
    unknown_fact: NEED_MORE_DATA when human-owned and non-derivable; otherwise BLOCKED or classification work according to lifecycle routing.
  validation:
    - mandatory types require an owner-entry fact or equivalent deterministic true applicability expression
    - conditional types require a non-empty structured expression
    - optional types never block a gate when absent

canonical_representation_rules:
  - {id: CR-STANDARD-NATIVE-FIRST, rule: When an established machine-readable standard directly owns the semantic contract, use that standard rather than prose describing the same truth.}
  - {id: CR-NARRATIVE-MARKDOWN, rule: Use Markdown for primarily narrative rationale/problem/plan content; H3 carries identity/provenance/fingerprint metadata.}
  - {id: CR-NO-STANDARD-STRUCTURED-YAML, rule: When no adequate standard exists but machine validation is required, use YAML bound to a type-specific schema owned by the later phase defining detailed semantics.}
  - {id: CR-DIAGRAM-AS-SOURCE-ONLY-WHEN-SEMANTIC, rule: PlantUML/C4 text may be canonical only when the owned semantics are the diagram model itself; otherwise diagrams are projections.}
  - {id: CR-EXACTLY-ONE-CANONICAL, rule: A retained semantic type has exactly one canonical representation; generated/readable alternatives are projections.}
  - {id: CR-EXECUTABLE-NATIVE-EVIDENCE, rule: Implementation evidence remains executable/native source and never becomes Design Anchor truth merely because it is machine-readable.}

format_catalog:
  markdown-h3-anchor: {family: Markdown, machine_metadata: H3 envelope or deterministic adjacent metadata, version_policy: repository profile}
  yaml-schema-anchor: {family: YAML, schema: type-specific schema required; detailed schema may be owned by H6/H7/H8 as declared, version_policy: schema version required}
  gherkin-feature: {family: Gherkin, extensions: [.feature], version_policy: validator profile pins grammar/tool version}
  c4-plantuml: {family: C4-PlantUML, extensions: [.puml], version_policy: validator/render profile pins dependency version}
  plantuml-sequence: {family: PlantUML, profile: sequence, extensions: [.puml]}
  plantuml-deployment: {family: PlantUML, profile: deployment, extensions: [.puml]}
  plantuml-erd: {family: PlantUML, profile: ERD, extensions: [.puml]}
  openapi-yaml: {family: OpenAPI, serialization: YAML, version_policy: document declares OpenAPI version; accepted versions pinned by validation profile}
  asyncapi-yaml: {family: AsyncAPI, serialization: YAML, version_policy: document declares AsyncAPI version; accepted versions pinned by validation profile}
  json-schema: {family: JSON Schema, serialization: [JSON, YAML], version_policy: dialect declared by $schema when applicable; accepted dialects pinned by validation profile}
  infrastructure-native: {family: native declarative infrastructure format, selection_rule: exactly one format selected by accepted architecture decision for owned topology contract}
  migration-native: {family: native migration source, selection_rule: format follows authorized persistence/migration toolchain}
  test-source-native: {family: repository test source, selection_rule: format follows authorized implementation test toolchain}
  yaml-evidence-record: {family: YAML, schema: evidence-record}
  yaml-process-state: {family: YAML, schema: process-state-specific}
  generated-projection: {family: generated, canonical: false, requires: [canonical source refs, source fingerprint when available]}

validator_requirements:
  V-H3-ENVELOPE: Deterministically validate H3 identity, owner, status, provenance and freshness envelope.
  V-APPLICABILITY: Evaluate structured applicability expression against declared facts.
  V-CANONICAL-UNIQUENESS: Reject duplicate canonical owners/representations for one semantic key.
  V-FORMAT-SYNTAX: Parse the declared canonical format/DSL.
  V-TYPE-SCHEMA: Validate type-specific machine schema when one exists.
  V-STANDARD-CONTRACT: Validate standard-native contract structure/version profile.
  V-PROJECTION-SOURCES: Verify projection source refs and non-canonical status.
  V-EVIDENCE-PROVENANCE: Verify evidence provenance/source identity and that evidence does not claim anchor authority.
  V-PROCESS-STATE: Validate process-state schema and lifecycle/authorization consistency.
  V-STAGE-SEMANTICS: Bounded semantic validation owned by the applicable stage specification; executable implementation deferred.

artifact_types:
  - {id: problem-statement, classification: anchor, retained: true, owner_stage: S0, canonical_semantic_key: problem-statement, applicability: {class: mandatory, expression: {fact: stage.S0.scope_entered}}, canonical_representation: {format_id: markdown-h3-anchor, canonical: true}, validator_requirements: [V-H3-ENVELOPE, V-APPLICABILITY, V-CANONICAL-UNIQUENESS, V-FORMAT-SYNTAX, V-STAGE-SEMANTICS], h3_envelope: required, gate_relevance: G0}
  - {id: evidence, classification: evidence, retained: true, owner_stage: S0, canonical_semantic_key: problem-evidence, applicability: {class: conditional, expression: {fact: scope.material_claim_requires_durable_evidence}}, canonical_representation: {format_id: yaml-evidence-record, canonical: true}, validator_requirements: [V-APPLICABILITY, V-FORMAT-SYNTAX, V-TYPE-SCHEMA, V-EVIDENCE-PROVENANCE], h3_envelope: not-applicable, gate_relevance: G0, notes: Evidence supports claims/anchors but is not Design Anchor truth.}
  - {id: user-journey, classification: anchor, retained: true, owner_stage: S0, canonical_semantic_key: user-journey, applicability: {class: conditional, expression: {fact: scope.actor_goal_journey_required}}, canonical_representation: {format_id: markdown-h3-anchor, canonical: true}, validator_requirements: [V-H3-ENVELOPE, V-APPLICABILITY, V-CANONICAL-UNIQUENESS, V-FORMAT-SYNTAX, V-STAGE-SEMANTICS], h3_envelope: required, gate_relevance: G0}
  - {id: constraint, classification: anchor, retained: true, owner_stage: S0, canonical_semantic_key: external-constraint, applicability: {class: conditional, expression: {fact: scope.external_or_nonnegotiable_constraint_exists}}, canonical_representation: {format_id: markdown-h3-anchor, canonical: true}, validator_requirements: [V-H3-ENVELOPE, V-APPLICABILITY, V-CANONICAL-UNIQUENESS, V-FORMAT-SYNTAX, V-STAGE-SEMANTICS], h3_envelope: required, gate_relevance: G0}

