legacy_catalog_disposition:
  - {legacy_type: decision-record, disposition: split, replacement_types: [problem-decision, requirements-decision, domain-decision, architecture-decision, implementation-readiness-decision], reason: Fixed H4 ownership replaces dynamic decision-owner.}
  - {legacy_type: context-map, disposition: reclassified-projection, replacement_canonical_sources: [bounded-context, context-relationship-map, other referenced S2 anchors], reason: Prevent rendered context view from duplicating canonical boundary/relationship semantics.}
  - {legacy_type: requirement-domain-trace, disposition: reclassified-projection, replacement_canonical_source: H5 dependency/registry relations, reason: Trace views are generated from canonical refs/edges.}
  - {legacy_type: evidence, disposition: retained-with-normalized-envelope, canonical_change: YAML evidence record references native/external evidence instead of making arbitrary evidence payload formats co-canonical.}
  - {legacy_type: domain-model, disposition: retained-format-redesign, canonical_change: Structured YAML carrier; H6 defines detailed tactical DDD schema; diagrams are projections.}
  - {legacy_type: state-model, disposition: retained-format-redesign, canonical_change: Structured YAML carrier; H6 defines detailed lifecycle semantics; diagram is a projection.}
  - {legacy_gap: bounded-context, disposition: added-H4-T2, reason: H6 requires canonical Bounded Context identity/boundary truth distinct from relationship and tactical model truth.}
  - {legacy_gap: domain-process-model, disposition: added-H4-T2, reason: H6 requires durable Process Discovery/Event Storming truth before tactical modeling.}

s2_semantic_ownership:
  capability_map:
    owns: capability identity/grouping and strategic clustering semantics
    does_not_own: accepted Bounded Context identity/boundary
  bounded_context:
    owns: context identity/boundary/responsibility/model-language ownership
    capability_to_context_mapping: expressed by stable H5 semantic refs and generated as capability-context-map projection/index
    duplicate_mapping_anchor_allowed: false
  context_relationship_map:
    owns: inter-context direction and DDD relationship-pattern semantics
    does_not_own: context identity/boundary
  domain_process_model:
    owns: durable process-discovery/Event Storming semantics and candidate aggregate hypotheses
    candidate_aggregate_status: hypothesis-until-tactical-acceptance
  domain_model:
    owns: accepted tactical aggregate/entity/value-object/invariant/domain-service semantics
  state_model:
    owns: accepted material domain lifecycle state/transition semantics
  separation_rules:
    - Domain Event in domain-process-model is domain truth, not automatically an S3 integration message.
    - Candidate aggregate hypotheses cannot satisfy accepted domain-model aggregate semantics.
    - Capability-to-context projection cannot be edited as independent truth.
    - Runtime/deployment boundaries remain S3 architecture truth and cannot redefine a Bounded Context.

registry_invariants:
  - {id: AR-ONE-OWNER, rule: Every retained type has exactly one owner_stage token; retained anchor types use only S0-S4.}
  - {id: AR-ONE-CANONICAL-SEMANTIC-KEY, rule: canonical_semantic_key is unique across retained canonical types; projections use projection:* keys and are non-canonical.}
  - {id: AR-H3-ANCHOR-MAPPING, rule: Every anchor type requires the H3 envelope and cannot weaken H3 identity/provenance/status/fingerprint guards.}
  - {id: AR-APPLICABILITY-DECLARATIVE, rule: Conditional applicability is a structured expression over declared facts; missing facts are routed, never invented.}
  - {id: AR-PROJECTION-NONCANONICAL, rule: Projection types are non-canonical and cannot become current downstream truth independently of sources.}
  - {id: AR-STANDARD-FIRST, rule: OpenAPI, AsyncAPI, JSON Schema and Gherkin are used where they directly own the semantic contract.}
  - {id: AR-S2-NO-DUPLICATE-TRUTH, rule: Capability, context boundary, relationship, process-discovery and tactical-model semantics have distinct canonical owners; cross-cutting mappings are refs/projections.}
  - {id: AR-NO-CUTOVER, rule: This registry does not change docs/ product/domain authority.}

conformance_cases:
  - {id: AR-CF-ONE-OWNER-PER-RETAINED, oracle: deterministic, given: {retained_types: all}, expect: {each_has_exactly_one_owner_stage: true, retained_anchor_owner_in: [S0, S1, S2, S3, S4]}}
  - {id: AR-CF-CONDITIONAL-APPLICABILITY-STRUCTURED, oracle: deterministic, given: {types_with_applicability_class: conditional}, expect: {expression_present: true, expression_uses_declared_dsl: true}}
  - {id: AR-CF-NO-DUPLICATE-CANONICAL-OWNER, oracle: deterministic, given: {retained_canonical_types: all}, expect: {canonical_semantic_key_unique: true}}
  - {id: AR-CF-ANCHOR-H3-ENVELOPE, oracle: deterministic, given: {classification: anchor}, expect: {h3_envelope: required, may_weaken_h3_guards: false}}
  - {id: AR-CF-STANDARD-NATIVE-MAPPINGS, oracle: deterministic, given: {types: [http-contract, event-contract, data-schema, acceptance-scenario]}, expect: {formats: [openapi-yaml, asyncapi-yaml, json-schema, gherkin-feature]}}
  - {id: AR-CF-LEGACY-DECISION-OWNER-RESOLVED, oracle: deterministic, given: {legacy_type: decision-record}, expect: {retained_generic_type: false, stage_specific_replacement_count: 5}}
  - {id: AR-CF-PROJECTION-NOT-CANONICAL, oracle: deterministic, given: {classification: projection}, expect: {canonical: false, may_be_independent_truth: false}}
  - {id: AR-CF-BOUNDED-CONTEXT-CANONICAL-OWNER, oracle: deterministic, given: {semantic_truth: bounded-context-identity-boundary}, expect: {canonical_type: bounded-context, owner_stage: S2, format_id: yaml-schema-anchor}}
  - {id: AR-CF-DOMAIN-PROCESS-CANONICAL-OWNER, oracle: deterministic, given: {semantic_truth: process-discovery-event-storming}, expect: {canonical_type: domain-process-model, owner_stage: S2, format_id: yaml-schema-anchor}}
  - {id: AR-CF-CAPABILITY-CONTEXT-NO-DUPLICATE, oracle: deterministic, given: {capability_to_context_view_requested: true}, expect: {separate_canonical_mapping_type: false, source_truth: [capability-map, bounded-context-semantic-refs], projection_allowed: true}}
  - {id: AR-CF-CANDIDATE-AGGREGATE-NOT-TACTICAL-TRUTH, oracle: deterministic, given: {candidate_aggregate_in_process_model: true, accepted_domain_model_derivation_absent: true}, expect: {accepted_tactical_aggregate: false, process_hypothesis_retained: true}}
  - {id: AR-CF-DOMAIN-EVENT-NOT-INTEGRATION-CONTRACT, oracle: deterministic, given: {domain_event_in_process_model: true, S3_async_contract_decision_absent: true}, expect: {event_contract_created_implicitly: false}}
  - {id: AR-CF-CUTOVER-NOT-IMPLICIT, oracle: deterministic, given: {registry_defined: true, explicit_cutover_authorization: false}, expect: {docs_remains_product_domain_authority: true}}

h5_compatibility_review:
  reviewed_contracts:
    - docs-v2/spec/dependency-registry-impact.yaml
    - docs-v2/spec/design-derivation-lineage.yaml
  result: PASS
  findings:
    - H5 registry source_set already includes all retained H4 anchors, so the two new anchor types require no registry-model change.
    - Both new types use existing H3 anchor identity/status/fingerprint semantics and structured YAML canonicalization profile.
    - H6 can express derivation through existing H5 semantic_refs and edge vocabulary; no new dependency relation is required.
    - Capability-to-context mapping uses existing refs and generated projection/index semantics, so no parallel graph is introduced.
    - Candidate aggregate hypotheses remain inside domain-process-model until an accepted domain-model derives/refines them; H5 lineage can represent that with existing DERIVES_FROM/REFINES/DECIDED_BY relations.
    - No H5 fingerprint, impact, earliest-stage, supersession or reference-resolution rule is weakened or contradicted.
  reopen_required:
    H5: false

h4_exit_evaluation:
  checks:
    - all type ids are unique
    - every retained type has exactly one owner_stage token
    - all retained anchor owner stages are one of S0-S4
    - every type has a canonical representation rule
    - every conditional type has a structured applicability expression
    - canonical_semantic_key is unique across retained canonical types
    - every retained anchor maps to H3 envelope
    - bounded-context owns Bounded Context identity/boundary truth
    - domain-process-model owns Process Discovery/Event Storming truth
    - capability-to-context mapping has no duplicate canonical owner
    - candidate aggregate hypotheses do not become accepted tactical truth implicitly
    - Domain Events do not become integration contracts implicitly
    - H5 compatibility review passes
    - no product/domain cutover is performed
  executable_validators_required: false

handoff_to_h5_h6:
  h5_compatibility: PASS
  resume_task: H6-T1
  requirements:
    - H6 defines detailed schemas and derivation methods for bounded-context and domain-process-model.
    - H6 uses H5 semantic refs for capability-to-context lineage and all downstream derivation.
    - H6 preserves candidate aggregate hypotheses as non-accepted until tactical domain-model acceptance guards pass.
    - H6 preserves the domain-event versus integration-message boundary.
