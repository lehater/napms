version: 1
kind: problem-evidence
id: NAPMS-FIRST-MVP-HCD-PROBLEM-EVIDENCE
status: ACCEPTED

knowledge_coverage:
  subject: FIRST-MVP-HCD
  knowledge: problem-evidence

scope:
  selected_causal_subjects: [application-components, access-request, policy-export]
  boundary: Human-facing first-MVP work for the selected subjects; no screen, route or layout decisions.

problem_statement: >-
  People responsible for application connectivity need to preserve reusable
  network communication-profile meaning, submit concrete connectivity requests
  from Resources under their request authority, and obtain an explainable
  vendor-neutral representation of formed policy without reconstructing intent
  from current technical realization or collapsing request authority, permission
  outcome and technical materialization readiness into one kind of truth.

observations:
  - id: OBS-APP-01
    subject: application-components
    statement: >-
      Reusable network communication meaning must remain distinct from concrete
      deployment and changing technical realization.
    evidence_refs:
      - current-stakeholder-input:2026-09-23
  - id: OBS-REQUEST-01
    subject: access-request
    statement: >-
      Deliberate connectivity work must preserve business justification, the exact
      request subject and the distinction between authority to request and the
      later permission outcome.
    evidence_refs:
      - current-stakeholder-input:2026-09-23
  - id: OBS-EXPORT-01
    subject: policy-export
    statement: >-
      Policy/network users need the formed policy represented completely in
      source-neutral form; missing current address realization must remain visible
      as incomplete technical materialization rather than silently removing policy.
    evidence_refs:
      - current-stakeholder-input:2026-09-23

acceptance:
  status: ACCEPTED
  accepted_at: 2026-09-23
  basis: Stakeholder explicitly confirmed the selected problem observations and goals/User Needs.
