version: 2
kind: discovery-slice
id: NAPMS-DISCOVERY-RC-CURATION

problem: |-
  NAPMS needs supported maintenance of access-relevant Resource knowledge without direct seed/database edits. Resource identity must survive changing technical realization and downstream access workflows need stable logical endpoints, explicit scope affiliation, Site/responsibility and history.

journey: |-
  A responsible user registers a Resource with stable AuthorityScopeRef, adds logical Endpoint presence, supplies or changes HOST/PREFIX realization when known, maintains Site and OWNER/ADMINISTRATOR responsibility, inspects current/history state, and uses the Resource from downstream deployment/request/export workflows.

capability_discovery_evidence:
  role: derived-slice-evidence
  strategic_authority_ref: NAPMS-STRATEGIC-CAPABILITIES
  capabilities:
    - capability_id: CAP-RC-RESOURCE-CURATION
      name: Resource catalogue curation
      business_outcome: Maintain stable Resource scope endpoint realization Site and responsibility truth through supported workflows.
      responsibility: Maintain Resource identity, immutable AuthorityScopeRef, logical Endpoint/address realization and explanatory history.
      language_terms: [Resource, AuthorityScopeRef, ResourceEndpoint, AddressRealization, Site, Resource Responsibility]
      basis_refs: [NAPMS-UC-RC-CURATION#behavior, NAPMS-UC-RC-CURATION#integrity]
    - capability_id: CAP-AM-CURATION-ADMISSION
      name: Catalogue mutation admission
      business_outcome: Protected mutations fail closed under the accepted security admission contract.
      responsibility: Evaluate authenticated operation admission; Resource metadata does not create authority.
      language_terms: [Actor, Action, Effective Authority]
      basis_refs: [NAPMS-UC-RC-CURATION#authorization]
  clustering:
    - {cluster_id: CLUSTER-RC-RESOURCE-CATALOGUE, capability_ids: [CAP-RC-RESOURCE-CURATION], rationale: Resource identity endpoint realization scope and responsibility are one cohesive Resource catalogue truth., status: accepted}
    - {cluster_id: CLUSTER-AM-AUTHORITY, capability_ids: [CAP-AM-CURATION-ADMISSION], rationale: Actor authority evaluation remains independent from Resource metadata., status: accepted}

observations: []
