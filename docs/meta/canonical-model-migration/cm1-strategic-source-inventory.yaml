inventory_findings:
  - The strategic spine has ten peer Bounded Contexts: eight from H16 plus corrected Resource Catalogue and Authority Management sources from H12.
  - Required Policy Materialization and Evidence Access Recognition are non-peer compositions and must not be promoted to Bounded Contexts merely for visualization.
  - H16 whole-domain relationships are semantic collaborations; a generic from/to arrow is not automatically a named DDD Context Mapping pattern.
  - The accepted H12 Authority Management -> Resource Catalogue relation does contain explicit upstream/downstream direction but deliberately no stronger pattern.
  - Context Map must be generated from the target strategic owners after semantic migration; a hand-maintained PlantUML map cannot be a peer authority.

