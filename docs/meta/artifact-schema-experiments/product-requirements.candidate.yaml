version: 0
kind: harness-artifact-schema-candidate
schema: product-requirements/v0-experiment
artifact: FIRST-MVP-REQUIREMENTS
source: docs/requirements/first-mvp-policy-export.yaml
capability_claims:
  - engineering.requirements.product-intent
  - engineering.requirements.acceptance

content:
  purpose: Own the accepted first-MVP product intent, observable journey, scope boundaries and acceptance examples independently of domain and technical realization.
  goals:
    - Establish current effective Access Policy truth and export the complete applicable policy set as one vendor-neutral technical policy view inspectable as a table and downloadable as CSV.
  requirement_groups:
    - id: first-mvp-journey
      title: First MVP observable journey
      requirements:
        - Define Resources and their current AddressSpace realization.
        - Define one Application with Components and directed same-Application Interactions.
        - Create immutable InteractionContractRevision traffic semantics for an Interaction.
        - Define concrete ComponentDeployments, each binding exactly one Component to exactly one Resource for this MVP.
        - Establish a current Process-backed ConnectivityNeed for the required Interaction as business justification.
        - Propose access for one concrete source ComponentDeployment and one concrete destination ComponentDeployment using one exact InteractionContractRevision and the current ConnectivityNeed basis.
        - Establish current effective PolicyRule truth through the formal Pending to Accepted or Rejected RuleChange lifecycle.
        - Request the complete current effective policy export.
        - Materialize each effective rule using exact traffic revision, concrete deployments and current Resource AddressSpace.
        - Inspect the complete vendor-neutral result as a table and export the same semantics as CSV.
    - id: output-row-minimum
      title: Minimum exported policy-row semantics
      requirements:
        - Include source AddressSpace.
        - Include destination AddressSpace.
        - Include protocol/service semantics.
        - Include applicable source/destination port or range.
        - Include PolicyRule provenance.
        - Include InteractionContractRevision provenance.
        - Include source/destination ComponentDeployment provenance.
        - Include source/destination Resource provenance.
  constraints: []
  acceptance_examples:
    - One effective HTTPS rule between concrete deployments whose Resources have HostAddresses yields one TCP destination-port 443 row.
    - A deliberate RuleChange without a current Process-backed ConnectivityNeed is not a valid formal submission.
    - A ConnectivityNeed supplies business justification but does not itself authorize access.
    - A pending or rejected traffic revision change leaves the previous accepted revision in the export.
    - A missing required Resource AddressSpace makes the full export Unresolved.
    - A Prefix remains a Prefix and is not expanded into hosts.
    - A withdrawn PolicyRule contributes no current export row.
    - The displayed table and downloaded CSV preserve the same policy meaning.
  non_goals:
    - Network Enforcement Placement or firewall selection.
    - Provider/device/ACL-specific rendering.
    - Configured-state comparison or remediation.
    - Network Environment Operations or device mutation.
    - Evidence-derived proposal recognition as a prerequisite.
    - Time-travel/as-of export.
  evidence_refs:
    - docs/migration/revalidated/h17-mvp-journey/s1/mvp-vendor-neutral-policy-export.yaml
