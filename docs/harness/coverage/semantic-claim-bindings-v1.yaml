version: 1
kind: harness-semantic-claim-bindings
project: NAPMS
status: canonical

bindings:
  - capability: engineering.requirements.product-intent
    semantic_claims:
      - engineering.intent.scope
      - engineering.intent.behavior
      - engineering.intent.quality-targets
  - capability: engineering.domain.strategic-model
    semantic_claims: [engineering.domain.model, engineering.domain.boundaries]
  - capability: engineering.domain.tactical.organization-structure
    semantic_claims:
      - {claim: engineering.domain.model, subject: BC-ORGANIZATION-STRUCTURE}
      - {claim: engineering.domain.invariants, subject: BC-ORGANIZATION-STRUCTURE}
  - capability: engineering.domain.tactical.resource-catalogue
    semantic_claims:
      - {claim: engineering.domain.model, subject: BC-RESOURCE-CATALOGUE}
      - {claim: engineering.domain.invariants, subject: BC-RESOURCE-CATALOGUE}
  - capability: engineering.domain.tactical.authority-management
    semantic_claims:
      - {claim: engineering.domain.model, subject: BC-AUTHORITY-MANAGEMENT}
      - {claim: engineering.domain.invariants, subject: BC-AUTHORITY-MANAGEMENT}
  - capability: engineering.domain.tactical.application-communication
    semantic_claims:
      - {claim: engineering.domain.model, subject: BC-APPLICATION-COMMUNICATION-CATALOGUE}
      - {claim: engineering.domain.invariants, subject: BC-APPLICATION-COMMUNICATION-CATALOGUE}
  - capability: engineering.domain.tactical.application-deployment
    semantic_claims:
      - {claim: engineering.domain.model, subject: BC-APPLICATION-DEPLOYMENT}
      - {claim: engineering.domain.invariants, subject: BC-APPLICATION-DEPLOYMENT}
  - capability: engineering.domain.tactical.business-connectivity
    semantic_claims:
      - {claim: engineering.domain.model, subject: BC-BUSINESS-CONNECTIVITY}
      - {claim: engineering.domain.invariants, subject: BC-BUSINESS-CONNECTIVITY}
  - capability: engineering.domain.tactical.access-policy
    semantic_claims:
      - {claim: engineering.domain.model, subject: BC-ACCESS-POLICY}
      - {claim: engineering.domain.invariants, subject: BC-ACCESS-POLICY}
  - capability: engineering.domain.use-case.organization-structure
    semantic_claims:
      - {claim: engineering.application.use-cases, subject: BC-ORGANIZATION-STRUCTURE}
  - capability: engineering.domain.use-case.resource-catalogue
    semantic_claims:
      - {claim: engineering.application.use-cases, subject: BC-RESOURCE-CATALOGUE}
      - {claim: engineering.application.use-cases, subject: Resource management}
  - capability: engineering.domain.use-case.authority-management
    semantic_claims:
      - {claim: engineering.application.use-cases, subject: BC-AUTHORITY-MANAGEMENT}
  - capability: engineering.domain.use-case.application-communication
    semantic_claims:
      - {claim: engineering.application.use-cases, subject: BC-APPLICATION-COMMUNICATION-CATALOGUE}
      - {claim: engineering.application.use-cases, subject: Application management}
      - {claim: engineering.application.use-cases, subject: Component management}
      - {claim: engineering.application.use-cases, subject: Interaction management}
  - capability: engineering.domain.use-case.application-deployment
    semantic_claims:
      - {claim: engineering.application.use-cases, subject: BC-APPLICATION-DEPLOYMENT}
      - {claim: engineering.application.use-cases, subject: Deployment management}
  - capability: engineering.domain.use-case.business-connectivity
    semantic_claims:
      - {claim: engineering.application.use-cases, subject: BC-BUSINESS-CONNECTIVITY}
      - {claim: engineering.application.use-cases, subject: Business process and connectivity need}
  - capability: engineering.domain.use-case.access-policy
    semantic_claims:
      - {claim: engineering.application.use-cases, subject: BC-ACCESS-POLICY}
      - {claim: engineering.application.use-cases, subject: Access request}
      - {claim: engineering.application.use-cases, subject: Policy rule}
  - capability: engineering.application.journey
    semantic_claims:
      - engineering.application.use-cases
      - engineering.application.orchestration
      - engineering.application.failures
      - {claim: engineering.application.use-cases, subject: Policy export}
  - capability: engineering.architecture.c4-model
    semantic_claims: [engineering.architecture.structure]
  - capability: engineering.architecture.module-contracts
    semantic_claims: [engineering.architecture.boundaries]
  - capability: engineering.interface.http-contract
    semantic_claims:
      - engineering.interface.machine.contract
      - engineering.interface.machine.errors
      - engineering.interface.machine.compatibility
  - capability: engineering.data.persistence-model
    semantic_claims:
      - engineering.data.model
      - engineering.data.integrity
      - engineering.data.lifecycle
      - engineering.data.classification
      - engineering.delivery.migration
  - capability: engineering.security.threat-analysis
    semantic_claims:
      - engineering.security.threat-analysis
      - engineering.security.availability-abuse
      - engineering.security.vulnerability-management
      - engineering.security.secure-development
  - capability: engineering.verification.strategy
    semantic_claims:
      - engineering.verification.strategy
  - capability: engineering.verification.acceptance-scenarios
    semantic_claims:
      - engineering.verification.requirement-traceability
      - engineering.verification.functional
      - engineering.verification.quality
      - engineering.verification.security
      - engineering.verification.interface.machine
      - engineering.verification.interface.human
      - engineering.verification.architecture
      - engineering.verification.data
      - engineering.transition.revalidation

  - capability: engineering.security.identity
    semantic_claims:
      - engineering.security.identity
  - capability: engineering.architecture.security
    semantic_claims:
      - engineering.security.boundaries
      - engineering.security.confidentiality
      - engineering.security.integrity
      - engineering.security.authorization
      - engineering.security.accountability
  - capability: engineering.security.browser-credential-lifecycle
    semantic_claims:
      - engineering.security.identity
  - capability: engineering.operability.observability
    semantic_claims:
      - engineering.operability.logging
      - engineering.operability.configuration
      - engineering.operability.health
      - engineering.operability.incident
  - capability: engineering.interface.ui-navigation
    semantic_claims:
      - engineering.interface.human.journeys
      - engineering.interface.human.usability
  - capability: engineering.interface.resource-detail-ui
    semantic_claims:
      - engineering.interface.human.journeys
      - engineering.interface.human.usability
      - engineering.interface.human.accessibility
      - engineering.interface.human.responsiveness
  - capability: engineering.quality.constraints
    semantic_claims:
      - engineering.quality.maintainability.modularity
      - engineering.quality.maintainability.analysability
      - engineering.quality.maintainability.modifiability
      - engineering.quality.maintainability.testability
      - engineering.quality.performance.latency
      - engineering.quality.performance.throughput
      - engineering.quality.performance.capacity
      - engineering.quality.performance.resource-efficiency

# Intentionally unbound because current capability semantics are too broad:
  - capability: engineering.architecture.rules
    semantic_claims:
      - engineering.reliability.availability
      - engineering.reliability.durability
      - engineering.reliability.recovery
  - capability: engineering.implementation.plan
    semantic_claims:
      - engineering.engineering.error-handling
      - engineering.delivery.release
      - engineering.delivery.rollback

# Broad capabilities remain only partially bound above. Unlisted concern semantics
# are intentionally left open rather than inferred from artifact existence.

  - capability: engineering.frontend.presentation-system
    semantic_claims:
      - engineering.interface.human.presentation-system

  - capability: engineering.frontend.screen-view-design
    semantic_claims:
      - engineering.interface.human.screen-composition

  - capability: engineering.frontend.human-interface
    semantic_claims:
      - engineering.interface.human.journeys
      - engineering.interface.human.usability
      - engineering.interface.human.accessibility
      - engineering.interface.human.responsiveness
      - {claim: engineering.interface.human.journeys, subject: Resource management}
      - {claim: engineering.interface.human.journeys, subject: Application management}
      - {claim: engineering.interface.human.journeys, subject: Component management}
      - {claim: engineering.interface.human.journeys, subject: Interaction management}
      - {claim: engineering.interface.human.journeys, subject: Deployment management}
      - {claim: engineering.interface.human.journeys, subject: Business process and connectivity need}
      - {claim: engineering.interface.human.journeys, subject: Access request}
      - {claim: engineering.interface.human.journeys, subject: Policy rule}
      - {claim: engineering.interface.human.journeys, subject: Policy export}

  - capability: engineering.frontend.architecture
    semantic_claims:
      - engineering.architecture.structure
      - engineering.reliability.availability
      - engineering.reliability.recovery

  - capability: engineering.backend.component-design
    semantic_claims:
      - engineering.engineering.principles
      - engineering.engineering.components
      - engineering.engineering.code-quality

  - capability: engineering.frontend.component-design
    semantic_claims:
      - engineering.engineering.principles
      - engineering.engineering.components
      - engineering.engineering.error-handling
      - engineering.engineering.code-quality

  - capability: engineering.frontend.presentation-verification
    semantic_claims:
      - engineering.verification.interface.presentation

  - capability: engineering.frontend.verification
    semantic_claims:
      - engineering.verification.strategy
      - engineering.verification.requirement-traceability
      - engineering.verification.functional
      - engineering.verification.quality
      - engineering.verification.security
      - engineering.verification.interface.machine
      - engineering.verification.interface.human
      - engineering.verification.architecture
      - engineering.verification.data
      - engineering.transition.revalidation

  - capability: engineering.frontend.implementation-design
    semantic_claims:
