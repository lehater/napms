kind: harness-knowledge-artifact
artifact: NAPMS-FIRST-MVP-PRODUCT-REQUIREMENTS
schema: product-requirements/v1
title: NAPMS First-MVP Product Requirements

content:
  purpose: >-
    Define the accepted observable first-MVP product behavior from semantic
    resource/application/connectivity description through permission and current
    desired access to a complete, explainable vendor-neutral policy export.

  requirements:
    - id: REQ-MVP-001
      statement: >-
        The first MVP shall support the end-to-end journey from describing Resources,
        Applications, Components and directed Interactions through connectivity request
        and permission decision to current desired access and normalized policy export.
      status: ACCEPTED
      source_refs:
        - c403ceed:docs/requirements/wave1-product-requirements.md#Scope
        - current-stakeholder-input:2026-09-20
      rationale: Preserve the explicitly selected narrow MVP outcome.

    - id: REQ-AUTH-001
      statement: >-
        Connectivity request submission shall be accepted only from an actor
        authorized to initiate connectivity on behalf of the source side at the
        time of submission. Authorization to act for the destination side is not
        required merely to submit the request.
      status: ACCEPTED
      source_refs:
        - c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-001
        - c403ceed:docs/requirements/wave1-acceptance-examples.md#E1
        - current-stakeholder-input:2026-09-23
      rationale: Preserve the observable distinction between authority to initiate from the source side and the later decision on whether the requested connectivity is allowed.

    - id: REQ-AUTH-002
      statement: >-
        Policy export shall be available only to an actor authorized to view and
        export the selected policy scope.
      status: ACCEPTED
      source_refs:
        - c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-008

    - id: REQ-APP-001
      statement: >-
        Users shall be able to define and reuse an application communication profile
        describing network communication roles and requirements independently from
        one concrete software-system inventory identity, deployment placement or
        current network realization.
      status: ACCEPTED
      source_refs:
        - stakeholder-network-intent:application-communication
        - current-stakeholder-input:2026-09-23
      rationale: Preserve the established Application term while making its network-communication-profile meaning explicit.

    - id: REQ-APP-002
      statement: >-
        Within an application communication profile, users shall be able to describe
        participant roles in network data exchange without treating those roles as
        network devices.
      status: ACCEPTED
      source_refs:
        - stakeholder-network-intent:application-communication

    - id: REQ-INT-001
      statement: >-
        The product shall accept a directed communication definition only between
        participant roles of the same reusable application communication profile and
        shall reject a definition that crosses profile boundaries.
      status: ACCEPTED
      source_refs:
        - stakeholder-network-intent:application-communication
        - current-stakeholder-input:2026-09-23
      rationale: Application classifies a reusable network communication contract; cross-Application interaction would cross profile boundaries instead of instantiating one profile.

    - id: REQ-INT-002
      statement: >-
        The product shall allow multiple independently meaningful directed Interactions
        between the same Component pair when their communication reasons or independent
        applicability are distinct.
      status: ACCEPTED
      source_refs:
        - stakeholder-network-intent:application-communication

    - id: REQ-INT-003
      statement: >-
        Each Interaction shall represent one independently meaningful communication
        reason and the complete minimal traffic semantics required for that reason.
      status: ACCEPTED
      source_refs:
        - stakeholder-network-intent:application-communication

    - id: REQ-DEP-001
      statement: >-
        Users shall be able to identify a concrete deployment of an application
        communication participant on a Resource independently from that Resource's
        current network address.
      status: ACCEPTED
      source_refs:
        - stakeholder-network-intent:application-communication

    - id: REQ-DEP-002
      statement: >-
        For the first MVP, technical policy derived from authorized connectivity shall
        use the current applicable network realization of each participating Resource
        without treating realization changes as a new connectivity permission.
      status: ACCEPTED
      source_refs:
        - stakeholder-network-intent:application-communication

    - id: REQ-RES-001
      statement: >-
        Changing or removing a Resource's current network address shall not by itself
        create a different Resource identity.
      status: ACCEPTED
      source_refs:
        - stakeholder-network-intent:resource-evidence

    - id: REQ-RES-002
      statement: >-
        A Resource network presence shall remain representable when its current address
        changes or is not yet known, with that missing realization remaining explicit.
      status: ACCEPTED
      source_refs:
        - stakeholder-network-intent:resource-evidence

    - id: REQ-RES-003
      statement: >-
        For the first MVP, each represented Resource network presence shall have at most
        one current address realization at a time, expressed as either one host address
        or one network prefix.
      status: ACCEPTED
      source_refs:
        - stakeholder-network-intent:resource-evidence

    - id: REQ-RES-004
      statement: >-
        The product may represent several logical network presences under one Resource
        only when they are intended to remain one access-management identity; otherwise
        they shall remain distinguishable Resources.
      status: ACCEPTED
      source_refs:
        - stakeholder-network-intent:resource-evidence

    - id: REQ-RES-005
      statement: >-
        The first MVP shall allow a Resource to be associated with a Site, an
        organizational owner and descriptive operational responsibilities. Those
        associations shall not by themselves grant authority to perform protected actions.
      status: ACCEPTED
      source_refs:
        - stakeholder-network-intent:resource-evidence

    - id: REQ-RES-006
      statement: >-
        Changes to Resource network realization, Site, organizational ownership and
        responsibility facts required by the first MVP shall preserve Resource identity
        and basic history sufficient to explain prior states.
      status: ACCEPTED
      source_refs:
        - stakeholder-network-intent:resource-evidence

    - id: REQ-BUS-001
      statement: >-
        Deliberate connectivity requests shall have structured Process-backed business
        justification, and business justification shall remain distinct from permission.
      status: ACCEPTED
      source_refs:
        - stakeholder-business-connectivity:SRC-BC-001
        - stakeholder-business-connectivity:SRC-BC-002

    - id: REQ-BUS-002
      statement: >-
        A Connectivity Need shall be representable independently from a concrete Access
        Request, deployment, Resource endpoint or IP address.
      status: ACCEPTED
      source_refs:
        - stakeholder-business-connectivity:SRC-BC-002

    - id: REQ-BUS-003
      statement: >-
        A Connectivity Need shall identify the Business Process, required Interaction and
        dependent participant/component perspective that provides its business basis.
      status: ACCEPTED
      source_refs:
        - stakeholder-business-connectivity:SRC-BC-002

    - id: REQ-BUS-004
      statement: >-
        Source-side and destination-side participants shall be able to contribute
        business justification for the same Interaction independently.
      status: ACCEPTED
      source_refs:
        - stakeholder-business-connectivity:SRC-BC-002

    - id: REQ-BUS-005
      statement: >-
        One Connectivity Need may lead to multiple concrete connectivity requests over
        time or for different deployments, and one Interaction may support Needs from
        multiple Business Processes.
      status: ACCEPTED
      source_refs:
        - stakeholder-business-connectivity:SRC-BC-002

    - id: REQ-BUS-006
      statement: >-
        Currently authorized access may acquire additional Process/Need justification
        without requiring duplicate authoritative access solely because justification
        was added.
      status: ACCEPTED
      source_refs:
        - stakeholder-business-connectivity:SRC-BC-002

    - id: REQ-BUS-007
      statement: >-
        Loss or retirement of a Connectivity Need shall not rewrite historical requests
        or permission decisions, and loss of all current known Needs shall remain
        distinguishable without requiring automatic revocation.
      status: ACCEPTED
      source_refs:
        - stakeholder-business-connectivity:SRC-BC-002

    - id: REQ-BUS-008
      statement: >-
        The product shall be able to identify and describe a Business Process and
        associate organizational responsibility with it, while that association shall
        not by itself grant authority or determine an authorization decision.
      status: ACCEPTED
      source_refs:
        - stakeholder-business-connectivity:SRC-BC-002

    - id: REQ-BUS-009
      statement: >-
        Business importance or criticality shall be representable for downstream impact
        analysis, while scoring and propagation rules remain unspecified for the first MVP.
      status: ACCEPTED
      source_refs:
        - stakeholder-business-connectivity:SRC-BC-002

    - id: REQ-PERM-001
      statement: >-
        Permission to submit/request connectivity shall remain distinct from the
        decision whether that connectivity is Allowed or NotAllowed.
      status: ACCEPTED
      source_refs:
        - c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-001
        - c403ceed:docs/requirements/wave1-acceptance-examples.md#E2

    - id: REQ-PERM-002
      statement: >-
        A permission decision shall remain correlated to the exact submitted connectivity
        meaning it decided. A material change to that meaning shall require a new
        permission decision rather than silently inheriting the earlier outcome.
      status: ACCEPTED
      source_refs:
        - c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-002
        - c403ceed:docs/requirements/wave1-acceptance-examples.md#E5

    - id: REQ-PERM-003
      statement: >-
        A NotAllowed decision shall create no authoritative desired-access Rule.
      status: ACCEPTED
      source_refs:
        - c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-003
        - c403ceed:docs/requirements/wave1-acceptance-examples.md#E2

    - id: REQ-RULE-001
      statement: >-
        For one accepted semantic access identity, the product shall maintain one stable
        authoritative current-access identity; repeated processing of the same Allowed
        semantic access shall not create a duplicate solely because it was processed again.
      status: RETIRED
      source_refs:
        - c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-004
        - c403ceed:docs/requirements/wave1-acceptance-examples.md#E3-E4
      rationale: Superseded by REQ-RULE-006 because current effective access is now one authorization episode at a time rather than one permanently reusable access identity.

    - id: REQ-RULE-002
      statement: >-
        When a submitted connectivity request reaches an Allowed outcome, the resulting
        access shall become current effective access for the exact decided connectivity.
      status: ACCEPTED
      source_refs:
        - c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-004
        - c403ceed:docs/requirements/wave1-acceptance-examples.md#E3

    - id: REQ-RULE-003
      statement: >-
        An authorized actor shall be able to change authoritative current access
        Active to Inactive and back without a new connectivity permission decision;
        identity, history and prior decision provenance shall be preserved and the
        transition shall be auditable.
      status: RETIRED
      source_refs:
        - c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-005
        - c403ceed:docs/requirements/wave1-acceptance-examples.md#E7
      rationale: Superseded by REQ-RULE-007 and REQ-RULE-008; revocation is terminal for the current authorization episode and regrant requires a new permission decision.

    - id: REQ-RULE-004
      statement: >-
        Current effective access may carry supported declarative effective conditions
        that determine whether it contributes at evaluation time without redefining the
        decided connectivity meaning or rewriting historical permission outcomes.
      status: ACCEPTED
      source_refs:
        - c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-006
        - c403ceed:docs/requirements/wave1-acceptance-examples.md#E8

    - id: REQ-RULE-005
      statement: >-
        Changes in IP address, endpoint realization, virtual machine, provider or other
        technical realization alone shall not change authoritative access identity or
        rewrite its historical permission decision.
      status: ACCEPTED
      source_refs:
        - c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-007
        - c403ceed:docs/requirements/wave1-acceptance-examples.md#E6

    - id: REQ-ORG-001
      statement: >-
        The product shall support an organizational structure used to express
        administrative ownership of Resources, and changing a Resource's current
        organizational owner shall preserve the Resource identity and history.
      status: ACCEPTED
      source_refs:
        - current-stakeholder-input:2026-09-23
      rationale: State the observable organizational-management need without prescribing the tactical ownership entity or authority-evaluation representation.

    - id: REQ-ORG-002
      statement: >-
        An authenticated user associated with an organization shall be able to discover
        Resources belonging to that organization even when the user lacks management
        authority over those Resources; visibility shall not itself grant protected-action
        authority.
      status: ACCEPTED
      source_refs:
        - current-stakeholder-input:2026-09-23

    - id: REQ-PERM-004
      statement: >-
        A submitted connectivity request shall require the accepted administrative
        approval for both source and destination sides when those sides are distinct;
        when both sides are the same administrative side, one approval may satisfy both.
      status: ACCEPTED
      source_refs:
        - current-stakeholder-input:2026-09-23

    - id: REQ-PERM-005
      statement: >-
        Any actor currently authorized to decide for a required approval side may
        approve or deny that side. Any required denial shall make the request Denied;
        all required approvals shall be necessary before the request may become Allowed.
      status: ACCEPTED
      source_refs:
        - current-stakeholder-input:2026-09-23

    - id: REQ-PERM-006
      statement: >-
        While a connectivity request is pending, the requester shall be able to cancel it
        and the product shall be able to expire it according to accepted organization
        policy; terminal request outcomes shall remain historical facts rather than being
        reopened in place.
      status: ACCEPTED
      source_refs:
        - current-stakeholder-input:2026-09-23

    - id: REQ-PERM-007
      statement: >-
        Before a pending connectivity request becomes Allowed, the product shall
        revalidate that the submitted connectivity meaning, participating Resources and
        deployments, and business basis are still applicable. A material loss of that
        basis shall produce an explicit invalidated outcome rather than silently granting
        changed access.
      status: ACCEPTED
      source_refs:
        - current-stakeholder-input:2026-09-23

    - id: REQ-PERM-008
      statement: >-
        The approval requirements determined when a connectivity request is submitted
        shall remain explainable for that request; later approval-policy changes shall
        apply to later requests rather than rewriting the submitted request's historical
        basis. Authority to take each pending approval action shall still be evaluated
        when that action is performed.
      status: ACCEPTED
      source_refs:
        - current-stakeholder-input:2026-09-23

    - id: REQ-PERM-009
      statement: >-
        Repeated submission of the same still-pending exact connectivity request shall
        not create a second independent pending request solely because submission was
        repeated; after a terminal outcome, a new request may be submitted.
      status: ACCEPTED
      source_refs:
        - current-stakeholder-input:2026-09-23

    - id: REQ-PERM-010
      statement: >-
        The product shall allow organization policy to determine whether a requester may
        approve their own pending connectivity request; when self-approval is forbidden,
        such an approval action shall be rejected without changing the request outcome.
      status: ACCEPTED
      source_refs:
        - current-stakeholder-input:2026-09-23

    - id: REQ-RULE-006
      statement: >-
        For one exact decided connectivity meaning, the product shall have at most one
        current effective access authorization at a time while preserving any earlier
        historical authorization episodes.
      status: ACCEPTED
      source_refs:
        - current-stakeholder-input:2026-09-23
      rationale: Replaces the retired permanent-current-access identity rule with an observable uniqueness rule for current effective access.

    - id: REQ-RULE-007
      statement: >-
        An authorized actor shall be able to revoke current effective access without
        rewriting the earlier Allowed request, permission decision or historical
        provenance.
      status: ACCEPTED
      source_refs:
        - current-stakeholder-input:2026-09-23

    - id: REQ-RULE-008
      statement: >-
        Restoring the same connectivity after its current effective access has been
        revoked shall require a new connectivity request and permission decision; an old
        Allowed decision shall not silently reactivate revoked access.
      status: ACCEPTED
      source_refs:
        - current-stakeholder-input:2026-09-23

    - id: REQ-EXP-001
      statement: >-
        An authorized actor shall be able to select all current desired policy or an
        explicit domain-policy subset for export without expressing selection in
        vendor/device syntax.
      status: ACCEPTED
      source_refs:
        - c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-008

    - id: REQ-EXP-002
      statement: >-
        Selected access shall contribute desired effect at export evaluation time only
        when it is current effective access resulting from an Allowed decision and all
        supported declarative effective conditions are satisfied.
      status: ACCEPTED
      source_refs:
        - c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-008
        - c403ceed:docs/requirements/wave1-acceptance-examples.md#E8-E11

    - id: REQ-EXP-003
      statement: >-
        Policy export shall be evaluated for one logical evaluation time and required
        source facts used for included effective access shall be coherent for that time.
      status: ACCEPTED
      source_refs:
        - c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-009
        - c403ceed:docs/requirements/wave1-acceptance-examples.md#E9-E10

    - id: REQ-EXP-004
      statement: >-
        The product shall produce a complete vendor-neutral enriched representation
        of the selected effective policy without requiring downstream consumers to
        reconstruct Resource identity, traffic semantics or provenance. Fully
        materialized rows shall expose the technical address/protocol/port tuple.
      status: ACCEPTED
      source_refs:
        - c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-010
        - current-stakeholder-input:2026-09-23

    - id: REQ-EXP-005
      statement: >-
        Missing current source or destination address realization shall not remove
        an otherwise valid selected effective Policy Rule from the MVP export.
        Instead the enriched row shall retain Resource identity/name and traffic
        semantics, expose the missing address as null/empty, and mark the row as
        technically incomplete rather than as a deployable permit. Missing address
        realization shall not make the whole export UNRESOLVED.
      status: ACCEPTED
      source_refs:
        - c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-009-REQ-W1-011
        - c403ceed:docs/requirements/wave1-acceptance-examples.md#E10
        - current-stakeholder-input:2026-09-23
      rationale: The MVP proves that formed policy can be exported even when a Resource has not yet been assigned a current address; richer rows make that state visible without silently omitting policy.

    - id: REQ-EXP-006
      statement: >-
        Selected access that is not currently effective, or whose effective conditions
        are not satisfied at evaluation time, shall contribute no policy row; missing
        technical realization for such non-effective access shall not by itself make the
        effective-policy export incomplete.
      status: ACCEPTED
      source_refs:
        - c403ceed:docs/requirements/wave1-acceptance-examples.md#E11

    - id: REQ-EXP-007
      statement: >-
        Normalization may expand one semantic access requirement into multiple
        enriched technical rows when required by endpoint/address or traffic-clause
        multiplicity, but it shall not broaden or narrow represented traffic
        semantics, hide rows whose current address is missing, or merge independently
        authoritative access when doing so would lose provenance.
      status: ACCEPTED
      source_refs:
        - c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-012
        - c403ceed:docs/requirements/wave1-acceptance-examples.md#E12-E13

    - id: REQ-PROV-001
      statement: >-
        The product shall preserve end-to-end explainable provenance from the requesting
        actor and submission-admission evidence through the submitted connectivity
        meaning, permission decisions, current effective access, relevant effective
        conditions and source realization facts to normalized export rows and evaluation time.
      status: ACCEPTED
      source_refs:
        - c403ceed:docs/requirements/wave1-product-requirements.md#REQ-W1-013

    - id: REQ-QUAL-001
      statement: >-
        Numeric latency, throughput, availability and scale targets shall not be mandatory
        product requirements for the first MVP.
      status: ACCEPTED
      source_refs:
        - docs/requirements/first-mvp-quality-targets.yaml#decision
      rationale: Preserve the explicit 2026-09-19 product answer rather than treating these targets as unknown.

    - id: REQ-SCALE-001
      statement: >-
        The first MVP shall validate that the complete accepted context set and end-to-end
        product idea work coherently; it is expected to be exercised primarily by one
        developer and may be shared with approximately five to ten concurrent users.
      status: ACCEPTED
      source_refs:
        - current-stakeholder-input:2026-09-21
      rationale: Define the implementation scale needed for the proof-of-concept MVP without inventing production-scale demand.

    - id: REQ-SCALE-002
      statement: >-
        The first MVP is required to support operation for one organization in one
        installation. Cross-organization operation and multi-organization hosting are not
        required first-MVP user-visible capabilities.
      status: ACCEPTED
      source_refs:
        - current-stakeholder-input:2026-09-21

    - id: REQ-SCALE-003
      statement: >-
        The first MVP is not required to accommodate material future growth in users,
        traffic volume or processing scale; production scaling is a later-scope concern
        that shall reopen architecture when concrete requirements are accepted.
      status: ACCEPTED
      source_refs:
        - current-stakeholder-input:2026-09-21

    - id: REQ-SCALE-004
      statement: >-
        First-MVP workload is ordinary interactive catalogue, request and policy-export
        use. Future production capabilities may include many users and heavy asynchronous
        network-reading, comparison and policy-generation jobs, but such background job
        processing and queueing are outside the first-MVP runtime requirement.
      status: ACCEPTED
      source_refs:
        - current-stakeholder-input:2026-09-21
      rationale: Preserve the future architectural reopening signal without prematurely adding distributed or asynchronous runtime complexity to the MVP.

  non_goals:
    - Provider/device-specific configuration rendering.
    - Direct firewall/provider execution and deployment.
    - Configured-state reconciliation/remediation.
    - General-purpose or customer-specific CAB/ticket/quorum/multi-stage workflow mechanics beyond the accepted first-MVP connectivity approval behavior.
    - Word/Excel/XUIT transition compatibility.
    - Firewall/topology placement calculation.
    - BPMN/workflow-engine semantics for Business Processes.
    - Automatic criticality propagation/scoring rules.
    - Network address translation calculation/rules; the product consumes the already meaningful corporate address/prefix.
    - Automatic revocation solely because current known business justification disappears.
    - A separate reversible operational enable/disable switch that can reactivate revoked access without a new permission decision.
