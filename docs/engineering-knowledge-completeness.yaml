version: 2
kind: engineering-knowledge-completeness
id: NAPMS-FIRST-MVP-KNOWLEDGE-COMPLETENESS
status: PILOT

purpose: Configure structural completeness rules for the accepted first-MVP scope. Expected subjects and ordinary coverage are derived from canonical engineering artifacts rather than repeated here.

sources:
  journey: docs/model/use-cases/first-mvp-policy-export.yaml
  strategic_contexts: docs/model/strategic/bounded-contexts.yaml
  canonical_graph: docs/canonical-graph.yaml

rules:
  - id: MVP-TACTICAL-COVERAGE
    dimension: tactical-domain-design
    subjects_from: journey.participating_strategic_owners
    supporting_subjects_from: journey.supporting_owner
    coverage_kind: tactical-domain-model
    supporting_coverage_kinds: [tactical-domain-model, domain-language]

  - id: MVP-DOMAIN-USE-CASE-COVERAGE
    dimension: domain-use-case-design
    subjects_from: journey.participating_strategic_owners
    coverage_kind: use-case

principles:
  - Expected subjects come from accepted canonical scope/journey semantics.
  - Coverage comes from canonical artifact metadata and artifact content, not a duplicated PRESENT/MISSING table.
  - Supporting owners may use a lighter accepted knowledge form than participating strategic owners when the canonical journey explicitly marks them supporting.
  - This checker validates structural presence only; semantic correctness remains human review.
