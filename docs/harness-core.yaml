version: 4
kind: harness-canonical-graph-projection
id: NAPMS-FIRST-MVP-DOCUMENTATION-VERTICAL
status: PILOT
scope: Complete Authority ownership projection for the current canonical design graph plus first-MVP downstream consumer contracts.
source_graph: canonical-graph.yaml

principle: Authority boundaries follow semantic decision ownership, not lifecycle stages. Each Authority must pass semantic-cohesion, independent-change and stable-public-contract checks.

decomposed_clusters:
  - id: DOMAIN-DESIGN
    replaced_by: [DOMAIN-TOPOLOGY, RESOURCE-CATALOGUE, AUTHORITY-MANAGEMENT, APPLICATION-COMMUNICATION-CATALOGUE, APPLICATION-DEPLOYMENT, BUSINESS-CONNECTIVITY, ACCESS-POLICY, POLICY-EXPORT-COMPOSITION]
  - id: SYSTEM-ARCHITECTURE
    replaced_by: [RUNTIME-TOPOLOGY, APPLICATION-ARCHITECTURE, SECURITY-ARCHITECTURE, SHARED-TECHNICAL-CONVENTIONS, HTTP-CONTRACT, PERSISTENCE-DESIGN, QUALITY-CONSTRAINTS, SECURITY-ANALYSIS, OBSERVABILITY-DESIGN]
  - id: TECHNICAL-REPRESENTATION
    replaced_by: [SHARED-TECHNICAL-CONVENTIONS, APPLICATION-ARCHITECTURE, HTTP-CONTRACT, PERSISTENCE-DESIGN]
  - id: IMPLEMENTATION-DESIGN
    replaced_by: [IMPLEMENTATION-PLAN]

authorities:
  - id: PRODUCT-REQUIREMENTS
    responsibility: Own accepted first-MVP intent, externally observable behavior, scope boundaries and acceptance examples.
    boundary: {semantic_cohesion: "One product slice and its observable expectations.", independent_change: "Product intent changes without deciding domain internals or technical realization.", public_contract: "Provides goal/scope, behavior and acceptance; product Questions route here.", atomic: true}

  - id: RESOURCE-CATALOGUE-DISCOVERY
    responsibility: Own the Resource Catalogue curation problem, affected actor, desired outcome and discovery evidence without deciding requirements/domain/architecture realization.
    boundary: {semantic_cohesion: "One Resource Catalogue curation problem/evidence slice.", independent_change: "Problem evidence can be revised before changing accepted behavior or domain semantics.", public_contract: "Provides problem/outcome evidence; discovery Questions route here.", atomic: true}

  - id: RESOURCE-CATALOGUE-REQUIREMENTS
    responsibility: Own observable Resource Catalogue curation behavior, mutation-admission requirements and integrity expectations.
    boundary: {semantic_cohesion: "One externally meaningful Resource Catalogue curation behavior contract.", independent_change: "Behavior requirements can change without directly editing tactical domain or technical realization.", public_contract: "Provides curation behavior/authorization/integrity requirements; requirement Questions route here.", atomic: true}

  - id: DOMAIN-TOPOLOGY
    responsibility: Own strategic capability ownership, Bounded Context boundaries and semantic context relationships.
    boundary: {semantic_cohesion: "One strategic ownership topology.", independent_change: "Strategic boundaries can change without co-editing private tactical models.", public_contract: "Provides capability/context/relationship topology; strategic-boundary Questions route here.", atomic: true}

  - id: RESOURCE-CATALOGUE
    responsibility: Own Resource identity/lifecycle, AddressSpace realization, scope affiliation and responsibility semantics.
    boundary: {semantic_cohesion: "One Resource catalogue language, lifecycle and invariant set.", independent_change: "Resource semantics evolve behind stable owner contracts.", public_contract: "Provides Resource and current realization semantics; Resource Questions route here.", atomic: true}

  - id: AUTHORITY-MANAGEMENT
    responsibility: Own actor/action/scope authority and protected-action admission semantics.
    boundary: {semantic_cohesion: "One reusable authority-evaluation model.", independent_change: "Authority evaluation evolves independently from Resource/Policy/presentation semantics.", public_contract: "Provides effective admission semantics; authority-meaning Questions route here.", atomic: true}

  - id: APPLICATION-COMMUNICATION-CATALOGUE
    responsibility: Own Application, Component, Interaction and immutable InteractionContractRevision semantics.
    boundary: {semantic_cohesion: "One language for application structure and intended communication revisions.", independent_change: "Communication intent evolves without owning placement or policy lifecycle.", public_contract: "Provides component/interaction identities and traffic revision semantics; communication Questions route here.", atomic: true}

  - id: APPLICATION-DEPLOYMENT
    responsibility: Own ComponentDeployment identity and Component-to-Resource placement semantics.
    boundary: {semantic_cohesion: "One placement identity relation between ComponentRef and ResourceRef.", independent_change: "Placement evolves independently from component definition and resource realization.", public_contract: "Provides deployment endpoint semantics; placement Questions route here.", atomic: true}

  - id: BUSINESS-CONNECTIVITY
    responsibility: Own BusinessProcess and ConnectivityNeed semantics expressing why communication is needed.
    boundary: {semantic_cohesion: "One business-justification language and lifecycle.", independent_change: "Business justification evolves independently from authorization and realization.", public_contract: "Provides current Process-backed ConnectivityNeed semantics; justification Questions route here.", atomic: true}

  - id: ACCESS-POLICY
    responsibility: Own PolicyRule, RuleChange decisions, current effective revision and withdrawal semantics.
    boundary: {semantic_cohesion: "One policy proposal/decision/effectiveness lifecycle.", independent_change: "Policy lifecycle references but does not own deployment, traffic or business-basis models.", public_contract: "Provides effective policy and decision history; policy Questions route here.", atomic: true}

  - id: POLICY-EXPORT-COMPOSITION
    responsibility: Own cross-context first-MVP orchestration and complete-or-Unresolved policy materialization semantics.
    boundary: {semantic_cohesion: "One vendor-neutral policy materialization use case.", independent_change: "Composition can evolve while source context ownership remains stable.", public_contract: "Provides cross-context flow/materialization contract; composition Questions route here.", atomic: true}

  - id: RUNTIME-TOPOLOGY
    responsibility: Own C4 runtime structure and deployment mapping for the first-MVP baseline.
    boundary: {semantic_cohesion: "One runtime topology across containers, components and deployment nodes.", independent_change: "Placement/topology can change while semantic and transport contracts remain stable.", public_contract: "Provides runtime/deployment topology; runtime Questions route here.", atomic: true}

  - id: APPLICATION-ARCHITECTURE
    responsibility: Own application-boundary organization, in-process module interaction, consistency rules, integration-boundary choices and module contracts.
    boundary: {semantic_cohesion: "One modular-monolith coordination model.", independent_change: "Coordination evolves independently from HTTP schema, security identity boundary and storage details.", public_contract: "Provides application/module contracts and consistency rules; orchestration Questions route here.", atomic: true}

  - id: SECURITY-ARCHITECTURE
    responsibility: Own authenticated-identity boundary and protected-action admission architecture for the first MVP.
    boundary: {semantic_cohesion: "One authentication/identity/admission boundary.", independent_change: "Security boundary can evolve independently from module coordination, transport payloads and threat review.", public_contract: "Provides authentication/admission architecture; security-boundary Questions route here.", atomic: true}

  - id: SHARED-TECHNICAL-CONVENTIONS
    responsibility: Own technical representation conventions shared across multiple concrete technical contracts.
    boundary: {semantic_cohesion: "Only cross-contract identity/time/provenance/address representation conventions.", independent_change: "Shared conventions evolve independently while concrete HTTP/persistence owners adapt.", public_contract: "Provides shared representation conventions; shared-representation Questions route here.", atomic: true}

  - id: HTTP-CONTRACT
    responsibility: Own external HTTP/JSON/CSV application contract and OpenAPI realization, including transport-specific status/security representation.
    boundary: {semantic_cohesion: "One external application protocol contract.", independent_change: "HTTP adapter evolves independently from internal modules and storage when accepted behavior is preserved.", public_contract: "Provides canonical HTTP contract; transport Questions route here.", atomic: true}

  - id: PERSISTENCE-DESIGN
    responsibility: Own PostgreSQL topology, module-owned schemas, relational constraints and persistence-specific representations.
    boundary: {semantic_cohesion: "One physical storage design.", independent_change: "Storage evolves independently from semantic and HTTP contracts.", public_contract: "Provides persistence schema/constraints; storage Questions route here.", atomic: true}

  - id: QUALITY-CONSTRAINTS
    responsibility: Own architecture-significant implementation qualities derived from accepted product/architecture truth without inventing SLOs.
    boundary: {semantic_cohesion: "One cross-cutting quality constraint set.", independent_change: "Quality constraints evolve with accepted quality needs without reallocating domain ownership.", public_contract: "Provides realization/verification quality constraints; missing product quality facts route upstream.", atomic: true}

  - id: SECURITY-ANALYSIS
    responsibility: Own threat analysis and control coverage for the accepted first-MVP trust boundaries.
    boundary: {semantic_cohesion: "One threat/control analysis over a fixed architecture baseline.", independent_change: "Threat review evolves independently while consuming security architecture.", public_contract: "Provides threat/control coverage; analysis Questions route here and decision gaps route to SECURITY-ARCHITECTURE.", atomic: true}

  - id: OBSERVABILITY-DESIGN
    responsibility: Own diagnostic observability requirements for verifying and operating the first-MVP modular monolith.
    boundary: {semantic_cohesion: "One diagnostic contract for correlation, outcome visibility and dependency health.", independent_change: "Observability evolves independently from domain semantics.", public_contract: "Provides diagnostic requirements; observability Questions route here.", atomic: true}

  - id: IMPLEMENTATION-PLAN
    responsibility: Own implementation slicing, sequencing and completion criteria after upstream decisions are available.
    boundary: {semantic_cohesion: "One realization plan for the accepted first-MVP design.", independent_change: "Slice order changes without redefining upstream truth.", public_contract: "Provides slices/completion criteria; missing design truth routes to original owner.", atomic: true}

  - id: VERIFICATION-DESIGN
    responsibility: Own verification levels and scenarios proving implementation realizes accepted canonical truth.
    boundary: {semantic_cohesion: "One verification evidence design.", independent_change: "Verification strategy evolves independently while retaining traceability.", public_contract: "Provides verification strategy/scenarios; design gaps route upstream.", atomic: true}

root_authorities:
  - id: PRODUCT-REQUIREMENTS
    reason: Accepted first-MVP product requirement is a current root of this selected design graph; its historical/stakeholder evidence is provenance, not another current semantic owner.
  - id: RESOURCE-CATALOGUE-DISCOVERY
    reason: Problem/evidence discovery is an input root; it does not require another current canonical engineering decision.
  - id: DOMAIN-TOPOLOGY
    reason: Strategic capability ownership is the accepted semantic topology root for the current domain graph.

consumers:
  - id: IMPLEMENTATION
    purpose: Realize the complete first-MVP design without inventing product, domain or architecture decisions.

bindings:
  - {artifact: FIRST-MVP-REQUIREMENTS, authority: PRODUCT-REQUIREMENTS, provides: [requirements.first-mvp.goal-scope, requirements.first-mvp.behavior, requirements.first-mvp.acceptance]}
  - {artifact: RC-DISCOVERY, authority: RESOURCE-CATALOGUE-DISCOVERY, provides: [discovery.resource-catalogue.problem, discovery.resource-catalogue.outcome]}
  - {artifact: STRATEGIC-CAPABILITIES, authority: DOMAIN-TOPOLOGY, provides: [domain.capability-map]}
  - {artifact: STRATEGIC-CONTEXTS, authority: DOMAIN-TOPOLOGY, provides: [domain.bounded-contexts]}
  - {artifact: STRATEGIC-RELATIONSHIPS, authority: DOMAIN-TOPOLOGY, provides: [domain.context-relationships]}
  - {artifact: RC-CURATION, authority: RESOURCE-CATALOGUE-REQUIREMENTS, provides: [requirements.resource-catalogue-curation.behavior, requirements.resource-catalogue-curation.authorization, requirements.resource-catalogue-curation.integrity]}
  - {artifact: RC-LANGUAGE, authority: RESOURCE-CATALOGUE, provides: [domain.resource-catalogue.language]}
  - {artifact: RC-DECISIONS, authority: RESOURCE-CATALOGUE, provides: [domain.resource-catalogue.decisions]}
  - {artifact: RC-PROCESS, authority: RESOURCE-CATALOGUE, provides: [domain.resource-catalogue.process]}
  - {artifact: RC-DOMAIN, authority: RESOURCE-CATALOGUE, provides: [domain.resource-catalogue.semantics]}
  - {artifact: AM-LANGUAGE, authority: AUTHORITY-MANAGEMENT, provides: [domain.authority-management.semantics]}
  - {artifact: ACC-DOMAIN, authority: APPLICATION-COMMUNICATION-CATALOGUE, provides: [domain.application-communication.semantics]}
  - {artifact: AD-DOMAIN, authority: APPLICATION-DEPLOYMENT, provides: [domain.application-deployment.semantics]}
  - {artifact: BC-DOMAIN, authority: BUSINESS-CONNECTIVITY, provides: [domain.business-connectivity.semantics]}
  - {artifact: AP-DOMAIN, authority: ACCESS-POLICY, provides: [domain.access-policy.semantics]}
  - {artifact: FIRST-MVP-JOURNEY, authority: POLICY-EXPORT-COMPOSITION, provides: [application.policy-export.flow, application.policy-export.materialization]}
  - {artifact: C4-STRUCTURE, authority: RUNTIME-TOPOLOGY, provides: [architecture.runtime-structure, architecture.deployment-topology]}
  - {artifact: SYSTEM-RULES, authority: APPLICATION-ARCHITECTURE, provides: [architecture.application-boundary, architecture.module-interaction, architecture.consistency-rules, architecture.integration-boundary, architecture.async-messaging-not-applicable]}
  - {artifact: MODULE-CONTRACTS, authority: APPLICATION-ARCHITECTURE, provides: [architecture.module-contracts]}
  - {artifact: SECURITY-ARCHITECTURE, authority: SECURITY-ARCHITECTURE, provides: [architecture.security-boundary, architecture.authentication-baseline]}
  - {artifact: TECH-REPRESENTATION, authority: SHARED-TECHNICAL-CONVENTIONS, provides: [architecture.shared-technical-conventions]}
  - {artifact: HTTP-REQUIREMENTS, authority: HTTP-CONTRACT, provides: [architecture.http-requirements, architecture.http-transport-decisions]}
  - {artifact: OPENAPI, authority: HTTP-CONTRACT, provides: [architecture.http-contract]}
  - {artifact: PERSISTENCE, authority: PERSISTENCE-DESIGN, provides: [architecture.persistence]}
  - {artifact: QUALITY-REQUIREMENTS, authority: QUALITY-CONSTRAINTS, provides: [architecture.quality-constraints]}
  - {artifact: THREAT-MODEL, authority: SECURITY-ANALYSIS, provides: [architecture.threat-analysis]}
  - {artifact: OBSERVABILITY, authority: OBSERVABILITY-DESIGN, provides: [architecture.observability]}
  - {artifact: MVP-IMPLEMENTATION-READINESS, authority: IMPLEMENTATION-PLAN, provides: [implementation.plan, implementation.completion-criteria]}
  - {artifact: MVP-TEST-INTENT, authority: VERIFICATION-DESIGN, provides: [verification.strategy, verification.acceptance-scenarios]}

questions: []

contracts:
  - id: AUTHORITY-MANAGEMENT-INPUT
    consumer: AUTHORITY-MANAGEMENT
    requires:
      - {id: contexts, capability: domain.bounded-contexts, authority: DOMAIN-TOPOLOGY}

  - id: APPLICATION-COMMUNICATION-CATALOGUE-INPUT
    consumer: APPLICATION-COMMUNICATION-CATALOGUE
    requires:
      - {id: contexts, capability: domain.bounded-contexts, authority: DOMAIN-TOPOLOGY}

  - id: APPLICATION-DEPLOYMENT-INPUT
    consumer: APPLICATION-DEPLOYMENT
    requires:
      - {id: contexts, capability: domain.bounded-contexts, authority: DOMAIN-TOPOLOGY}
      - {id: communication, capability: domain.application-communication.semantics, authority: APPLICATION-COMMUNICATION-CATALOGUE}
      - {id: resource, capability: domain.resource-catalogue.semantics, authority: RESOURCE-CATALOGUE}

  - id: BUSINESS-CONNECTIVITY-INPUT
    consumer: BUSINESS-CONNECTIVITY
    requires:
