    consumer: POLICY-EXPORT-COMPOSITION
    requires:
      - {id: behavior, capability: requirements.first-mvp.behavior, authority: PRODUCT-REQUIREMENTS}
      - {id: relationships, capability: domain.context-relationships, authority: DOMAIN-TOPOLOGY}
      - {id: resource, capability: domain.resource-catalogue.semantics, authority: RESOURCE-CATALOGUE}
      - {id: authority, capability: domain.authority-management.semantics, authority: AUTHORITY-MANAGEMENT}
      - {id: communication, capability: domain.application-communication.semantics, authority: APPLICATION-COMMUNICATION-CATALOGUE}
      - {id: deployment, capability: domain.application-deployment.semantics, authority: APPLICATION-DEPLOYMENT}
