      - {id: materialization, capability: application.policy-export.materialization, authority: POLICY-EXPORT-COMPOSITION}
      - {id: runtime, capability: architecture.runtime-structure, authority: RUNTIME-TOPOLOGY}

  - id: TECHNICAL-REPRESENTATION-INPUT
