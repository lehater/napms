requirement_refs:
  - REQ-AUTH-001
  - REQ-BUS-001
  - REQ-BUS-003
  - REQ-PERM-001
  - REQ-PERM-002
  - REQ-PERM-003
  - REQ-PERM-004
  - REQ-PERM-005
  - REQ-PERM-006
  - REQ-PERM-007
  - REQ-PERM-008
  - REQ-PERM-009
  - REQ-PERM-010
  - REQ-RULE-002
  - REQ-RULE-006

purpose: >-
  Define the requester's human work for selecting, submitting and later explaining
  one exact connectivity request without constructing internal identifiers and
  without confusing request authority, approval obligations, permission outcome
  or resulting authorization episode.

plan:
  - id: REQUEST-TASK-1
    responsibility: SYSTEM
    outcome: Candidate source Resources for which the requester currently has access.request authority are available.
    system_support:
      - resolve each Resource current OrganizationalUnit owner
      - evaluate effective access.request authority against the applicable Organization or OrganizationalUnit scope
      - preserve Resource identity independently from current owner and address
    rule: Destination-side request authority is not required merely to ask for access to it.

  - id: REQUEST-TASK-2
    responsibility: USER
    depends_on: [REQUEST-TASK-1]
    outcome: One requester-controlled source Resource is selected.
    required_information:
      - source Resource identity and human-recognizable name
      - current organizational owner and enough Resource context to distinguish it
    decision: Choose the Resource from which access is needed.

  - id: REQUEST-TASK-3
    responsibility: SYSTEM
    depends_on: [REQUEST-TASK-2]
    outcome: Technically possible destination choices are derived from accepted communication/deployment truth.
    system_support:
      - resolve ComponentDeployments on the selected source Resource
      - find directed Interactions whose source Component is realized there
      - find destination ComponentDeployments realizing the destination Component
      - expose the corresponding destination Resources and current immutable Interaction revision/traffic meaning
    rule: Technical possibility comes from deployed Components plus an accepted directed Interaction; it is not itself permission.

  - id: REQUEST-TASK-4
    responsibility: USER
    depends_on: [REQUEST-TASK-3]
    outcome: The intended destination Resource and communication possibility are selected.
    required_information:
      - destination Resource identity and human-recognizable name
      - communication purpose/meaning
      - protocol and port semantics needed to understand the requested network access
      - associated current Process-backed business justification
    decision: Select the intended technically possible access.
    input: Select destination/communication candidate and the applicable business justification.
    rule: Raw sourceDeploymentRef destinationDeploymentRef interactionRevisionRef and needRef are system identities, not the primary human selection model.

  - id: REQUEST-TASK-5
    responsibility: SYSTEM
    depends_on: [REQUEST-TASK-4]
    outcome: One exact AccessSubject and immutable submission basis are derived and validated.
    system_support:
      - resolve exact source/destination ComponentDeployments
      - resolve exact immutable InteractionRevision
      - validate current Process-backed business basis
      - reevaluate access.request authority for the source side at submission time
      - resolve applicable immutable ApprovalPolicyRevisions and ApprovalObligations into ApprovalBasis
      - detect an existing exact PENDING request instead of creating a parallel duplicate

  - id: REQUEST-TASK-6
    responsibility: USER
    depends_on: [REQUEST-TASK-5]
    outcome: The exact request is deliberately submitted or the existing exact pending request is opened.
    required_information:
      - selected source Resource
      - selected destination Resource
      - communication meaning/traffic semantics
      - business justification
      - required approval sides and current request state
    decision: Submit, inspect the existing pending request, or abandon the action.

  - id: REQUEST-TASK-7
    responsibility: SYSTEM
    depends_on: [REQUEST-TASK-6]
    outcome: A PENDING AccessRequest remains inspectable with immutable subject ApprovalBasis obligations and approval history.
    system_support:
      - preserve submitter and submission time
      - expose required approval sides without assigning the obligation permanently to one person
      - accept approval/denial actions only after current authority evaluation for that action and side
      - preserve completed approval evidence after later authority loss
      - allow requester cancellation while still PENDING
      - apply accepted expiration policy
      - before ALLOWED revalidate submitted meaning Resources deployments and business basis

  - id: REQUEST-TASK-8
    responsibility: USER
    depends_on: [REQUEST-TASK-7]
    outcome: The requester can inspect the current pending state or final historical outcome.
    required_information:
      - PENDING approval progress or terminal outcome
      - DENIED decision evidence when applicable
      - CANCELLED EXPIRED or INVALIDATED reason when applicable
      - resulting current authorization episode when ALLOWED
    decision: While PENDING cancel the request or leave it awaiting required decisions; after a terminal outcome inspect the result.

  - id: REQUEST-TASK-9
    responsibility: SYSTEM
    depends_on: [REQUEST-TASK-8]
    outcome: Terminal outcome is preserved without reopening the request.
    system_support:
      - any required denial produces DENIED
      - all required approvals plus successful semantic revalidation are necessary for ALLOWED
      - requester cancellation produces CANCELLED
      - policy expiration produces EXPIRED
      - material pre-Allow loss of basis produces INVALIDATED
      - ALLOWED creates one distinct PolicyRule authorization episode
      - non-ALLOWED terminal outcomes create no PolicyRule

alternate_and_recovery:
  - trigger: Requester lacks effective access.request authority for the selected source side.
    system_outcome: Reject submission before creating an AccessRequest.
    user_work: No permission decision exists to continue; the attempted action ends as an authority rejection.
  - trigger: The same exact AccessSubject already has a PENDING request.
    system_outcome: Do not create an independent parallel request; identify the existing pending request.
    user_work: Inspect or continue with the existing request.
  - trigger: No directed Interaction/deployment combination makes the selected destination technically possible.
    system_outcome: Do not offer the destination as a requestable communication candidate.
    user_work: Choose another technically possible destination/communication or return to catalogue work.
  - trigger: Requester cancels while PENDING.
    system_outcome: Persist CANCELLED as a terminal historical outcome and create no PolicyRule.
    user_work: A later request, if still needed, is a new request.
  - trigger: Accepted expiration policy fires while PENDING.
    system_outcome: Persist EXPIRED as a terminal historical outcome and create no PolicyRule.
    user_work: A later request, if still needed, is a new request.
  - trigger: Submitted meaning Resources deployments or business basis materially cease to apply before ALLOWED.
    system_outcome: Persist INVALIDATED and create no PolicyRule.
    user_work: Correct the underlying truth and submit a new request when applicable.
  - trigger: Any required approval side denies.
    system_outcome: Persist DENIED and create no PolicyRule.
    user_work: The request ends; a later attempt is a new request.
  - trigger: All required approvals complete and semantic revalidation succeeds.
    system_outcome: Persist ALLOWED and create one distinct PolicyRule authorization episode for the exact AccessSubject.
    user_work: Inspect the resulting current access authorization.

