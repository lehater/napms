version: 1
kind: use-case-model
id: NAPMS-UC-AP-RULE-LIFECYCLE
bounded_context_refs:
  - BC-ACCESS-POLICY

purpose: Define the context-focused Access Policy behavior required by the accepted first-MVP product intent without deciding tactical structure or technical realization.

behavior: |-
  # Access Policy rule lifecycle behavior

  For the accepted first-MVP journey, the supported behavior shall allow the user to:

  1. propose access for one concrete source ComponentDeployment and one concrete destination ComponentDeployment;
  2. bind the proposal to one exact immutable InteractionContractRevision;
  3. supply a current Process-backed ConnectivityNeed as the required deliberate business basis;
  4. submit the proposal as a formal RuleChange;
  5. decide the pending RuleChange as Accepted or Rejected;
  6. expose current effective policy truth only from an Accepted applicable change; and
  7. withdraw an effective PolicyRule without deleting its decision history.

  Pending or Rejected changes do not replace existing effective policy semantics. ConnectivityNeed supplies justification but never authorization.

inputs:
  product_intent: docs/requirements/first-mvp-policy-export.yaml
  strategic_model: docs/model/strategic/bounded-contexts.yaml

ownership_boundary: This artifact owns context-focused observable Access Policy behavior for the accepted MVP slice. Tactical aggregate structure and invariants, source-context truth and technical realization remain outside this artifact.
