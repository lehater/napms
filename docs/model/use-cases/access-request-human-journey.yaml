version: 2
kind: user-journey-design
id: NAPMS-HCD-ACCESS-REQUEST-JOURNEY
status: ACCEPTED

knowledge_coverage:
  subject: access-request
  knowledge: user-journey-design

actor: ACTOR-CONNECTIVITY-REQUESTER
goal_ref: GOAL-ACCESS-REQUEST
task_model_ref: NAPMS-HCD-ACCESS-REQUEST-TASK-MODEL

entry_condition: The user needs network access from one Resource for whose current organizational scope they have request authority.

preconditions:
  - Source and candidate destination Resources exist with current organizational owners.
  - Application communication profiles, Components, directed Interactions and concrete ComponentDeployments exist.
  - Current Process-backed business basis can justify the selected Interaction.

interactions:
  - step: 1
    system: Present source Resources for which the actor currently has access.request authority on the applicable Organization or OrganizationalUnit scope.
    user: Select the Resource from which access is needed.
  - step: 2
    system: Derive technically possible communication candidates from deployed Components and directed Interactions and present destination Resources with communication meaning.
    user: Select the intended destination/communication candidate and applicable business justification.
  - step: 3
    system: Resolve exact deployments and immutable InteractionRevision, validate business basis and source-side request authority, and determine immutable ApprovalBasis plus required administrative sides.
    user: Review source destination traffic meaning business basis and approval requirements, then submit.
  - step: 4
    system: Create the exact PENDING AccessRequest or identify the already-existing exact pending request; expose immutable subject approval basis and current approval progress.
    user: Inspect the request and, while it remains PENDING, optionally cancel it.
  - step: 5
    system: Accept approve/deny actions only from actors currently authorized for their required side, preserve completed approval evidence, and apply self-approval/expiration policy.
  - step: 6
    system: Before ALLOWED revalidate submitted meaning Resources deployments and business basis; terminate as INVALIDATED on material loss.
  - step: 7
    system: Preserve one terminal ALLOWED DENIED CANCELLED EXPIRED or INVALIDATED outcome; ALLOWED creates one distinct PolicyRule authorization episode and other outcomes create none.
    user: Inspect the final outcome and, when allowed, the resulting current authorization episode.

alternate_paths:
  - condition: Source-side request authority is absent.
    result: Submission is rejected before AccessRequest creation; this is not a DENIED permission decision.
  - condition: Exact AccessSubject already has a PENDING request.
    result: No parallel request is created; the existing request is opened.
  - condition: Destination has no technically possible deployed Interaction from the selected source.
    result: It is not offered as a requestable communication candidate.
  - condition: Requester cancels while PENDING.
    result: Request becomes CANCELLED and never reopens.
  - condition: Request expires under accepted policy.
    result: Request becomes EXPIRED and never reopens.
  - condition: Submitted semantic basis materially ceases to apply before ALLOWED.
    result: Request becomes INVALIDATED and no PolicyRule is created.
  - condition: Permission decision is DENIED.
    result: Request history remains visible with decision evidence and no PolicyRule.
  - condition: Permission decision is ALLOWED.
    result: A new exact-subject PolicyRule authorization episode becomes current subject to its effective conditions.

completion_condition: The exact request is either still PENDING and inspectable or has one terminal outcome; terminal requests never reopen and a PolicyRule exists only for ALLOWED.

externally_visible_side_effects:
  - Request history preserves immutable submission basis approval evidence and terminal outcome.
  - Allowed access becomes inspectable as a distinct authorization episode for the exact AccessSubject.

