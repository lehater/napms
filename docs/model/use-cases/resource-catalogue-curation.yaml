version: 2
kind: use-case-model
id: NAPMS-UC-RC-CURATION
knowledge_coverage:
  subject: BC-RESOURCE-CATALOGUE
  knowledge: domain-use-case
depends_on: [NAPMS-DISCOVERY-RC-CURATION]
bounded_context_refs: [BC-RESOURCE-CATALOGUE, BC-AUTHORITY-MANAGEMENT]

behavior: |-
  Resource Catalogue curation shall allow an authenticated admitted actor to register a Resource with stable identity and required immutable AuthorityScopeRef; explicitly add logical Endpoints to that Resource access-management unit; set replace or clear one current HostAddress-or-Prefix per Endpoint while preserving Endpoint identity/history; maintain Site and singular OWNER/ADMINISTRATOR responsibility with history; and inspect current Resource truth without direct database edits.

  Resource identity is independent from address. Endpoint identity is independent from current address. Multiple Endpoints may belong to one Resource only by explicit caller choice that they are one logical access-management unit; no automatic grouping by address, Site, responsibility or name is permitted.

authorization: |-
  Resource Catalogue mutation uses authenticated identity and the accepted security admission contract. Resource AuthorityScopeRef is catalogue truth used by scoped request/export authorization, but Site OWNER ADMINISTRATOR and address facts never grant authority. Caller-supplied actor/permission/authority fields are not trusted.

integrity: |-
  Address Site and responsibility mutation preserves explanatory history. Prefix input is canonical and host bits may not be silently masked. Aggregate versioning prevents lost updates. Missing current address does not invalidate Resource or Endpoint identity.
