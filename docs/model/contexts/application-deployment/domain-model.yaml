version: 1
kind: tactical-domain-model
id: NAPMS-AD-DOMAIN-MODEL
bounded_context_ref: BC-APPLICATION-DEPLOYMENT

aggregate: ComponentDeployment
invariants:
  - One ComponentDeployment represents one concrete deployed Component instance.
  - It references exactly one ACC ComponentRef and exactly one RC ResourceRef.
  - ComponentRef and ResourceRef are fixed for that ComponentDeployment identity in the MVP.
  - Redeployment of the same Component to another Resource creates another ComponentDeployment.
  - Resource AddressSpace change does not change ComponentDeployment identity.
  - Lifecycle is Active to Retired; retired identities remain historically explainable.
public_semantics: [ComponentDeploymentRef, ResolveComponentDeployment]
