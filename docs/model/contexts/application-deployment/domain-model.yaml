version: 2
kind: tactical-domain-model
id: NAPMS-AD-DOMAIN-MODEL
bounded_context_ref: BC-APPLICATION-DEPLOYMENT
knowledge_coverage:
  subject: BC-APPLICATION-DEPLOYMENT
  knowledge: tactical-domain-model

aggregate: ComponentDeployment
invariants:
  - One ComponentDeployment represents one concrete deployed Component instance.
  - It references exactly one ACC ComponentRef and one RC ResourceRef.
  - ComponentRef and ResourceRef are immutable for deployment identity.
  - Resource address change never changes ComponentDeployment identity.
  - Another placement is another ComponentDeployment.
  - Update relocation retirement and deletion are outside the selected MVP.
public_semantics: [ComponentDeploymentRef, ResolveComponentDeployment]
