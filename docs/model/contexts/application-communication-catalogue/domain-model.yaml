version: 2
kind: tactical-domain-model
id: NAPMS-ACC-DOMAIN-MODEL
bounded_context_ref: BC-APPLICATION-COMMUNICATION-CATALOGUE
knowledge_coverage:
  subject: BC-APPLICATION-COMMUNICATION-CATALOGUE
  knowledge: tactical-domain-model

aggregate: Application and independent Interaction aggregates
entities: [Application, Component, Interaction, InteractionRevision]
language:
  Application: Reusable application communication profile that classifies one family of network communication requirements; it is not inventory identity for a concrete software system.
  Component: Participant role inside one Application communication profile; concrete realization belongs to ComponentDeployment.
invariants:
  - A Component belongs to exactly one Application for its lifetime.
  - Interaction source and destination are explicit ComponentRefs belonging to the same Application.
  - Cross-Application Interaction is invalid.
  - Several independently meaningful Interactions may exist for the same directed Component pair.
  - One Interaction represents one independently meaningful communication reason.
  - Interaction endpoints and purpose are immutable; traffic changes publish a new immutable InteractionRevision.
  - Every InteractionRevision contains at least one canonical TrafficClause and remains historically resolvable.
  - ipProtocol is integer 0..255; only TCP 6 and UDP 17 may carry source or destination port ranges.
  - Port ranges are canonical sorted non-overlapping non-adjacent ranges.
public_semantics: [ApplicationRef, ComponentRef, InteractionRef, InteractionRevisionRef, ResolveInteractionRevision, TrafficClause]
