version: 2
kind: tactical-domain-model
id: NAPMS-BC-DOMAIN-MODEL
bounded_context_ref: BC-BUSINESS-CONNECTIVITY
knowledge_coverage:
  subject: BC-BUSINESS-CONNECTIVITY
  knowledge: tactical-domain-model

aggregate_semantics: [BusinessProcess, ConnectivityNeed]
invariants:
  - BusinessProcess has stable identity name optional description optional responsible organization and optional opaque criticalityLabel.
  - criticalityLabel is descriptive text only; no score ordering taxonomy authority or propagation is inferred.
  - Every ConnectivityNeed belongs to one BusinessProcess.
  - Need references reusable InteractionRef plus participantComponentRef and businessBasis; it never references Deployment Resource Endpoint or IP as its identity.
  - participantComponentRef must be one of the Interaction source or destination Components.
  - Source-side and destination-side Needs for the same Interaction are independent and may coexist.
  - Need is business justification only and never grants permission.
  - One Need may justify several concrete requests and one Interaction may support Needs from several Processes.
  - Need status is ACTIVE or RETIRED; retirement preserves history and never rewrites request decision or Rule history.
  - Zero current Needs is a reconciliation condition and does not automatically revoke desired access.
public_semantics: [BusinessProcessRef, ConnectivityNeedRef, participantComponentRef, businessBasis, criticalityLabel, current justification status]
