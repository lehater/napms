version: 3
kind: domain-decision-set
id: NAPMS-RC-DOMAIN-DECISIONS
bounded_context_ref: BC-RESOURCE-CATALOGUE
depends_on: [NAPMS-UC-RC-CURATION]

decisions:
  - decision_id: DEC-RC-ORGANIZATIONAL-OWNER
    decision: Every Resource has exactly one current OrganizationalUnitRef; an explicit move to another Unit in the same Organization preserves Resource identity and records ownership history.
    rationale: Accepted requirements make organizational ownership mutable while preserving Resource identity and distinguish ownership from protected-action authority.
    consequences:
      - OrganizationalUnit identity and hierarchy remain owned by Organization Structure.
      - Resource Catalogue owns the current Resource-to-Unit affiliation and its history.
      - Cross-Organization transfer is not an ordinary ownership edit and requires separate migration semantics.
      - Site OWNER ADMINISTRATOR BusinessProcess and address never manufacture authority.

  - decision_id: DEC-RC-ENDPOINT
    decision: Resource owns stable logical Endpoint identities and each Endpoint has zero or one current HOST-or-PREFIX realization.
    rationale: Resource identity and logical network presence must survive address changes.
    consequences:
      - Multiple Endpoints are allowed only as explicit members of one logical Resource access-management unit.
      - No automatic endpoint grouping or address-to-Resource inference exists.
      - Prefix remains Prefix and is not expanded to hosts by Resource Catalogue.

  - decision_id: DEC-RC-RESPONSIBILITY
    decision: First MVP Resource responsibility roles are OWNER and ADMINISTRATOR descriptive facts, singular per role at one time, with history.
    rationale: Accepted stakeholder requirements distinguish ownership/administration metadata from security authority.
    consequences:
      - Responsibility assignments do not grant application authority.
      - Replacement or clear preserves history.
