version: 2
kind: domain-decision-set
id: NAPMS-RC-DOMAIN-DECISIONS
bounded_context_ref: BC-RESOURCE-CATALOGUE
depends_on: [NAPMS-UC-RC-CURATION]

decisions:
  - decision_id: DEC-RC-AUTHORITY-SCOPE
    decision: Every Resource has one immutable AuthorityScopeRef used by protected request/export admission.
    rationale: Canonical requirements require effective authority for relevant scope/time and Resource owns the domain-policy scope affiliation.
    consequences:
      - Scope is explicit Resource truth.
      - Site OWNER ADMINISTRATOR BusinessProcess and address never manufacture scope or authority.
      - Changing Resource scope identity is outside the first MVP; a materially different scope requires another Resource identity or future accepted migration semantics.

  - decision_id: DEC-RC-ENDPOINT
    decision: Resource owns stable logical Endpoint identities and each Endpoint has zero or one current HOST-or-PREFIX realization.
    rationale: Resource identity and logical network presence must survive address changes.
    consequences:
      - Multiple Endpoints are allowed only as explicit members of one logical Resource access-management unit.
      - No automatic endpoint grouping or address-to-Resource inference exists.
      - Prefix remains Prefix and is not expanded to hosts by Resource Catalogue.

  - decision_id: DEC-RC-RESPONSIBILITY
    decision: First MVP Resource responsibility roles are OWNER and ADMINISTRATOR organizational groups, singular per role at one time, with history.
    rationale: Accepted stakeholder requirements distinguish ownership/administration from security authority.
    consequences:
      - Responsibility assignments do not grant application authority.
      - Replacement or clear preserves history.
