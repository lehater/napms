version: 2
kind: strategic-context-relationship-model
id: NAPMS-STRATEGIC-CONTEXT-RELATIONSHIPS

whole_domain_relationships:
  - {from: Resource Catalogue, to: Authority Management, semantics: Resource supplies immutable AuthorityScopeRef affiliation; it does not grant actor authority.}
  - {from: Authority Management, to: Access Policy, semantics: AccessRequest submission consumes effective access.request authority for the source Resource scope at admission time; destination request authority is not required merely to submit.}
  - {from: Authority Management, to: Required Policy Materialization, semantics: Export consumes effective policy.export authority for all selected Resource scopes at evaluation time.}
  - {from: Application Communication Catalogue, to: Application Deployment, semantics: Deployment references Component identity while ACC retains communication ownership.}
  - {from: Resource Catalogue, to: Application Deployment, semantics: Deployment references Resource identity while RC retains realization and scope ownership.}
  - {from: Application Communication Catalogue, to: Business Connectivity, semantics: Need references reusable Interaction plus one participant Component.}
  - {from: Business Connectivity, to: Access Policy, semantics: Current Need supplies business justification but never permission.}
  - {from: Application Deployment, to: Access Policy, semantics: AccessSubject references concrete source and destination deployments.}
  - {from: Application Communication Catalogue, to: Access Policy, semantics: AccessSubject references exact immutable InteractionRevision.}
  - {from: Access Policy, to: Required Policy Materialization, semantics: Selected PolicyRules supply authoritative desired access.}
  - {from: Business Connectivity, to: Required Policy Materialization, semantics: Need currentness supplies reconciliation status without automatic revocation.}
  - {from: Application Communication Catalogue, to: Required Policy Materialization, semantics: Exact InteractionRevision supplies traffic semantics.}
  - {from: Application Deployment, to: Required Policy Materialization, semantics: Deployments identify participating Resources.}
  - {from: Resource Catalogue, to: Required Policy Materialization, semantics: Current addressed Endpoints supply technical realization and AuthorityScopeRefs.}

context_mapping_relationships:
  - relationship_id: REL-AM-RC-SCOPE
    from: Resource Catalogue
    to: Authority Management
    direction: upstream-downstream
    patterns: []
    semantics: Resource Catalogue publishes AuthorityScopeRef affiliation; Authority Management evaluates actor grants without owning Resource facts.

strategic_invariants:
  - No Shared Kernel between peer contexts
  - business justification is not permission
  - Resource responsibility is not authority
  - denied permission creates no PolicyRule
  - technical realization does not define access identity
  - zero current Need does not automatically revoke access
  - missing current address realization is explicit incomplete technical realization and is not silently omitted from exported policy
