version: 6
kind: strategic-context-relationship-model
id: NAPMS-STRATEGIC-CONTEXT-RELATIONSHIPS

whole_domain_relationships:
  - {from: Organization Structure, to: Resource Catalogue, semantics: Organization Structure supplies stable Organization/OrganizationalUnit identities and hierarchy; Resource Catalogue owns each Resource's current OrganizationalUnit affiliation and ownership history.}
  - {from: Organization Structure, to: Authority Management, semantics: Organization Structure supplies Organization/OrganizationalUnit identity and hierarchy; hierarchy alone grants no authority.}
  - {from: Organization Structure, to: Access Policy, semantics: Organization identity provides administrative-side and security-boundary references; Access Policy owns whether access may cross those boundaries and owns each Organization-scoped approval policy.}
  - {from: Resource Catalogue, to: Authority Management, semantics: Resource Catalogue supplies the Resource's current OrganizationalUnit affiliation; Authority Management resolves current scope inheritance without owning Resource facts.}
  - {from: Authority Management, to: Access Policy, semantics: AccessRequest protected actions consume current effective authority derived from Principal RoleAssignments and System/Organization/OrganizationalUnit scope semantics; request admission remains distinct from permission outcome.}
  - {from: Authority Management, to: Required Policy Materialization, semantics: Export consumes current effective policy.export authority for the organizational scopes covering all selected Resources at evaluation time.}
  - {from: Application Communication Catalogue, to: Application Deployment, semantics: Deployment references Component identity while ACC retains communication ownership.}
  - {from: Resource Catalogue, to: Application Deployment, semantics: Deployment references Resource identity while RC retains realization and organizational-ownership truth.}
  - {from: Application Communication Catalogue, to: Business Connectivity, semantics: Need references reusable Interaction plus one participant Component.}
  - {from: Business Connectivity, to: Access Policy, semantics: Current Need supplies business justification but never permission.}
  - {from: Application Deployment, to: Access Policy, semantics: AccessSubject references concrete source and destination deployments.}
  - {from: Application Communication Catalogue, to: Access Policy, semantics: AccessSubject references one exact immutable InteractionRevision; a newer revision is new connectivity meaning, invalidates an old-revision pending request at pre-Allow semantic revalidation, and never silently migrates an existing authorization episode.}
  - {from: Access Policy, to: Required Policy Materialization, semantics: At most one non-revoked authorization episode per exact AccessSubject contributes current effective access when its EffectiveWindow applies; revoked or superseded historical episodes never silently become current again.}
  - {from: Business Connectivity, to: Required Policy Materialization, semantics: Need currentness supplies reconciliation status without automatic revocation.}
  - {from: Application Communication Catalogue, to: Required Policy Materialization, semantics: Exact InteractionRevision supplies traffic semantics.}
  - {from: Application Deployment, to: Required Policy Materialization, semantics: Deployments identify participating Resources.}
  - {from: Resource Catalogue, to: Required Policy Materialization, semantics: Current addressed Endpoints and current Resource organizational ownership supply technical realization and authority-scope resolution inputs.}

context_mapping_relationships:
  - relationship_id: REL-OS-RC-OWNERSHIP
    from: Organization Structure
    to: Resource Catalogue
    direction: upstream-downstream
    patterns: []
    semantics: Organization Structure owns Organization/OrganizationalUnit hierarchy; Resource Catalogue owns current Resource-to-OrganizationalUnit affiliation and its history.
  - relationship_id: REL-OS-AM-HIERARCHY
    from: Organization Structure
    to: Authority Management
    direction: upstream-downstream
    patterns: []
    semantics: Organization and OrganizationalUnit hierarchy is an authority-scope input; Authority Management owns RoleAssignment inheritance/evaluation and Organization Structure never grants authority by itself.
  - relationship_id: REL-RC-AM-SCOPE-RESOLUTION
    from: Resource Catalogue
    to: Authority Management
    direction: upstream-downstream
    patterns: []
    semantics: Resource Catalogue publishes current OrganizationalUnit affiliation; Authority Management evaluates matching Organization/OrganizationalUnit RoleAssignments without owning Resource facts.

strategic_invariants:
  - No Shared Kernel between peer contexts
  - OrganizationalUnit reparenting is explicit, preserves Unit identity/history, stays inside one Organization and cannot create cycles
  - OrganizationalUnit retirement is terminal for current use and requires no active child Units and no currently owned Resources
  - Organization is the root security boundary for its OrganizationalUnit hierarchy
  - Organization and OrganizationalUnit identity/history are never physically deleted as ordinary lifecycle operations
  - Resource ownership change within one Organization preserves Resource identity; cross-Organization transfer is separate migration semantics
  - OrganizationalUnit hierarchy never crosses an Organization boundary
  - Resource organizational ownership is current mutable truth with preserved history and does not change Resource identity
  - organizational ownership and descriptive responsibility are not authority
  - System authority is distinct from Organization and OrganizationalUnit authority
  - Authority scope is a semantic target over System Organization or OrganizationalUnit rather than an independently mutable CRUD Scope entity
  - Role contains Actions; RoleAssignments are temporal and may target Actor or Group principals
  - explicit deny/exclusion uses deny-overrides when allow and deny authority both match
  - effective authority is reevaluated fail-closed for every protected action; historical AuthorityEvidence remains preserved even when current authority later changes
  - Group membership is external IdP truth; missing or unresolved membership fails closed for current authority without destroying historical evidence
  - authority inheritance flows parent to descendants inside one Organization
  - retired Roles confer no current authority while historical evidence remains explainable
  - cross-Organization access eligibility is an Access Policy decision and is never implied by organizational structure
  - each administrative side uses the ApprovalPolicyRevision accepted for its Organization
  - submission preserves immutable ApprovalBasis and resolved ApprovalObligations; Actor Group and RoleAssignment membership are reevaluated at each approval action rather than frozen into that basis
  - completed approval evidence remains valid historical input after the approving actor later loses authority; only a new approval action reevaluates current authority
  - any required denial terminates the request as DENIED; all required approvals plus successful semantic revalidation are necessary before ALLOWED
  - requester cancellation, policy-driven expiration and semantic invalidation are distinct terminal outcomes and terminal AccessRequests are never reopened
  - ApprovalPolicyRevision defines whether self-approval is permitted; a forbidden self-approval attempt changes no request outcome
  - for one exact AccessSubject there is at most one pending AccessRequest; repeated submission does not create an independent parallel approval process
  - ApprovalPolicy revisions are immutable; a submitted AccessRequest preserves the resolved approval basis and later revisions govern later requests
  - request expiration semantics are Access Policy truth and are resolved from the applicable policy basis at submission
  - approval-policy basis defines which approvals are required, while current Authority Management determines who may perform each approval action at decision time
  - business justification is not permission
  - denied permission creates no current effective access authorization
  - each Allowed AccessRequest creates one distinct PolicyRule authorization episode; PolicyRule identity does not span later revoke and regrant
  - for one exact AccessSubject there is at most one current authorization episode while earlier episodes remain historical
  - revocation is terminal for an authorization episode and preserves the Allowed request, approval decisions and original evidence
  - regrant after revocation requires a new AccessRequest, new permission decision and new authorization episode
  - a newer immutable InteractionRevision is new AccessSubject meaning; an old-revision pending request is invalidated before Allowed, while an existing old-revision authorization remains exact historical/current authorization for that old revision until separately revoked or otherwise ceases to be effective
  - revoked access does not become current again without a new request and permission decision
  - technical realization does not define access identity
  - zero current Need does not automatically revoke access
  - missing current address realization is explicit incomplete technical realization and is not silently omitted from exported policy
