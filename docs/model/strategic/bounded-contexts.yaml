version: 3
kind: bounded-context-model
id: NAPMS-BOUNDED-CONTEXTS

contexts:
  - context_id: BC-ORGANIZATION-STRUCTURE
    capability_ref: CAP-ORGANIZATION-STRUCTURE
    name: Organization Structure
    purpose: Own administrative organizational identity and hierarchy.
    responsibility: [Organization identity and lifecycle, OrganizationalUnit identity and lifecycle, parent-child hierarchy inside one Organization, Organization as root security boundary]
    boundary_basis:
      cohesion_rationale: Organization and OrganizationalUnit identity, hierarchy and lifecycle form one administrative structure with one root boundary.
      separation_rationale: Resource ownership, actor/group membership, role assignment, permission decisions and technical realization remain external.
    model_language_ownership:
      owned_terms_or_model_scope: [Organization, OrganizationalUnit, organizational hierarchy]
      explicitly_external_terms: [Resource, ActorRef, GroupRef, RoleAssignment, AccessRequest, PolicyRule]

  - context_id: BC-RESOURCE-CATALOGUE
    capability_ref: CAP-RESOURCE-CATALOGUE
    name: Resource Catalogue
    purpose: Own logical Resource identity and access-relevant Resource truth.
    responsibility: [Resource identity, one current OrganizationalUnitRef with ownership history, logical Endpoint membership, current HostAddress-or-Prefix realization, Site, OWNER and ADMINISTRATOR descriptive responsibility, basic history]
    boundary_basis:
      cohesion_rationale: Resource identity, organizational ownership, logical network presence, realization and descriptive responsibility change together as Resource catalogue truth.
      separation_rationale: Organization hierarchy, application meaning, deployment placement, business need, permission and actor authority remain external.
    model_language_ownership:
      owned_terms_or_model_scope: [Resource, OrganizationalUnitRef, ResourceEndpoint, HostAddress, Prefix, Site, ResponsibilityGroup]
      explicitly_external_terms: [Organization, OrganizationalUnit, Application, ComponentDeployment, ConnectivityNeed, PolicyRule, RoleAssignment]

  - context_id: BC-AUTHORITY-MANAGEMENT
    capability_ref: CAP-AUTHORITY-MANAGEMENT
    name: Authority Management
    purpose: Own effective principal/action/scope/time authority semantics.
    responsibility: [ActorRef and GroupRef principals, Role and Action semantics, temporal RoleAssignments, System Organization and OrganizationalUnit scope targets, parent-to-descendant inheritance, Role retirement, fail-closed current effective authority evaluation]
    boundary_basis:
      cohesion_rationale: Principal, role/action, scope target, inheritance, assignment time and role lifecycle jointly determine reusable current authority.
      separation_rationale: Organization Structure owns Organization/OrganizationalUnit hierarchy; Resource Catalogue owns current Resource organizational affiliation; authentication and external IdP membership are inputs; domain responsibility metadata never manufactures authority.
    model_language_ownership:
      owned_terms_or_model_scope: [ActorRef, GroupRef, PrincipalRef, Role, Action, RoleAssignment, System Scope, Organization Scope, OrganizationalUnit Scope, Effective Authority]
      explicitly_external_terms: [Organization, OrganizationalUnit, Resource, Site, ResponsibilityGroup, BusinessProcess, Group membership]

  - context_id: BC-APPLICATION-COMMUNICATION-CATALOGUE
    capability_ref: CAP-APPLICATION-COMMUNICATION-CATALOGUE
    name: Application Communication Catalogue
    purpose: Own reusable network communication-profile meaning.
    responsibility: [Application communication-profile identity, Component role identity, independent intra-Application directed Interaction identity, immutable InteractionRevision traffic semantics]
    boundary_basis:
      cohesion_rationale: Reusable network communication-profile meaning changes independently from deployment and Resource realization; Application is not concrete software-system inventory identity.
      separation_rationale: Concrete deployment, Resource realization, business need and access permission remain external.
    model_language_ownership:
      owned_terms_or_model_scope: [Application, Component, Interaction, InteractionRevision, TrafficClause]
      explicitly_external_terms: [ComponentDeployment, Resource, PolicyRule]

  - context_id: BC-APPLICATION-DEPLOYMENT
    capability_ref: CAP-APPLICATION-DEPLOYMENT
    name: Application Deployment
    purpose: Own concrete deployment of one Component on one Resource.
    responsibility: [ComponentDeployment identity, immutable ComponentRef and ResourceRef placement truth]
    boundary_basis:
      cohesion_rationale: Concrete placement is independently governed from reusable application and Resource realization.
      separation_rationale: Component semantics remain ACC-owned and Resource realization RC-owned.
    model_language_ownership:
      owned_terms_or_model_scope: [ComponentDeployment]
      explicitly_external_terms: [Component, Resource, AddressRealization]

  - context_id: BC-BUSINESS-CONNECTIVITY
    capability_ref: CAP-BUSINESS-CONNECTIVITY
    name: Business Connectivity
    purpose: Own why application connectivity is needed.
    responsibility: [BusinessProcess, responsible organization, descriptive criticalityLabel, participant-attributed ConnectivityNeed currentness/history]
    boundary_basis:
      cohesion_rationale: Business process and Need share business-justification semantics.
      separation_rationale: Business justification is not permission and is independent from concrete deployment/address.
    model_language_ownership:
      owned_terms_or_model_scope: [BusinessProcess, ConnectivityNeed, criticalityLabel, business justification]
      explicitly_external_terms: [PolicyRule, ComponentDeployment, RoleAssignment]

  - context_id: BC-ACCESS-POLICY
    capability_ref: CAP-ACCESS-POLICY
    name: Access Policy
    purpose: Own deliberate access requests, permission outcomes/history and authoritative current effective access.
    responsibility: [AccessRequest lifecycle, AccessSubject, approval and permission outcomes, AuthorizationEvidence, justification associations, current effective access authorization, declarative EffectiveWindow, revocation history, audit history]
    boundary_basis:
      cohesion_rationale: Request subject, approval/permission evidence and resulting current-access authorization history form one access-governance lifecycle owner.
      separation_rationale: Organization hierarchy, Resource ownership, Need currentness, Resource realization, communication semantics and current authority evaluation remain independently owned.
    model_language_ownership:
      owned_terms_or_model_scope: [AccessRequest, AccessSubject, PolicyRule, AuthorizationEvidence, Current Effective Access, Revocation, EffectiveWindow]
      explicitly_external_terms: [Organization, OrganizationalUnit, ConnectivityNeed, RoleAssignment, ComponentDeployment, InteractionRevision]

  - context_id: BC-NETWORK-ENFORCEMENT-PLACEMENT
    capability_ref: CAP-NETWORK-ENFORCEMENT-PLACEMENT
    name: Network Enforcement Placement
    purpose: Future enforcement-placement capability outside first MVP.
    responsibility: [future placement semantics]
    boundary_basis: {cohesion_rationale: Future concern., separation_rationale: Outside first MVP.}
    model_language_ownership: {owned_terms_or_model_scope: [enforcement target], explicitly_external_terms: [PolicyRule]}
  - context_id: BC-TECHNICAL-ACCESS-EVIDENCE
    capability_ref: CAP-TECHNICAL-ACCESS-EVIDENCE
    name: Technical Access Evidence
    purpose: Future evidence capability outside first MVP.
    responsibility: [future evidence semantics]
    boundary_basis: {cohesion_rationale: Future concern., separation_rationale: Outside first MVP.}
    model_language_ownership: {owned_terms_or_model_scope: [technical evidence], explicitly_external_terms: [PolicyRule]}
  - context_id: BC-ACCESS-POLICY-REALIZATION
    capability_ref: CAP-ACCESS-POLICY-REALIZATION
    name: Access Policy Realization
    purpose: Future reconciliation capability outside first MVP.
    responsibility: [future required-vs-configured assessment]
    boundary_basis: {cohesion_rationale: Future concern., separation_rationale: Outside first MVP.}
    model_language_ownership: {owned_terms_or_model_scope: [convergence], explicitly_external_terms: [PolicyRule]}
  - context_id: BC-NETWORK-ENVIRONMENT-OPERATIONS
    capability_ref: CAP-NETWORK-ENVIRONMENT-OPERATIONS
    name: Network Environment Operations
    purpose: Future provider/device execution capability outside first MVP.
    responsibility: [future execution lifecycle]
    boundary_basis: {cohesion_rationale: Future concern., separation_rationale: Outside first MVP.}
    model_language_ownership: {owned_terms_or_model_scope: [execution], explicitly_external_terms: [PolicyRule]}
