version: 3
kind: strategic-capability-model
id: NAPMS-STRATEGIC-CAPABILITIES

capabilities:
  - capability_id: CAP-ORGANIZATION-STRUCTURE
    name: Organization Structure
    business_outcome: Maintain stable organizational identity and administrative hierarchy.
    responsibility: Own Organization and OrganizationalUnit identity, parent-child hierarchy, lifecycle and root security-boundary semantics.
    language_terms: [Organization, OrganizationalUnit, organizational hierarchy]
  - capability_id: CAP-RESOURCE-CATALOGUE
    name: Resource Catalogue
    business_outcome: Maintain stable logical Resource truth, current organizational ownership and current network realization.
    responsibility: Own Resource identity, current OrganizationalUnit affiliation with ownership history, logical Endpoints, address realization, Site, descriptive responsibility and explanatory history.
    language_terms: [Resource, OrganizationalUnitRef, ResourceEndpoint, HostAddress, Prefix, Site, ResponsibilityGroup]
  - capability_id: CAP-APPLICATION-COMMUNICATION-CATALOGUE
    name: Application Communication Catalogue
    business_outcome: Describe reusable network communication profiles and independently meaningful directed communication.
    responsibility: Own Application communication-profile, Component-role, intra-Application Interaction and immutable InteractionRevision semantics.
    language_terms: [Application, Component, Interaction, InteractionRevision, TrafficClause]
  - capability_id: CAP-APPLICATION-DEPLOYMENT
    name: Application Deployment
    business_outcome: Relate concrete Component instances to Resources.
    responsibility: Own immutable ComponentDeployment ComponentRef plus ResourceRef placement truth.
    language_terms: [ComponentDeployment, ComponentRef, ResourceRef]
  - capability_id: CAP-BUSINESS-CONNECTIVITY
    name: Business Connectivity
    business_outcome: Maintain why application connectivity is needed.
    responsibility: Own BusinessProcess, criticality attribution and participant-side ConnectivityNeed currentness/history.
    language_terms: [BusinessProcess, ConnectivityNeed, criticalityLabel, business justification]
  - capability_id: CAP-ACCESS-POLICY
    name: Access Policy
    business_outcome: Maintain deliberate access requests, permission history and authoritative current effective access.
    responsibility: Own AccessRequest lifecycle, exact AccessSubject, approval/permission outcomes and evidence, business-justification associations, current effective access authorization, declarative effective conditions, revocation history and audit history.
    language_terms: [AccessRequest, AccessSubject, PolicyRule, AuthorizationEvidence, Current Effective Access, Revocation, EffectiveWindow]
  - capability_id: CAP-AUTHORITY-MANAGEMENT
    name: Authority Management
    business_outcome: Evaluate effective principal action scope authority.
    responsibility: Own Actor/Group principal references, Role and Action semantics, temporal RoleAssignments, System/Organization/OrganizationalUnit scope-target semantics, parent-to-descendant authority inheritance, Role retirement and fail-closed current effective authority evaluation; Group membership remains external IdP truth.
    language_terms: [ActorRef, GroupRef, PrincipalRef, Role, Action, RoleAssignment, System Scope, Organization Scope, OrganizationalUnit Scope, Effective Authority]
  - capability_id: CAP-NETWORK-ENFORCEMENT-PLACEMENT
    name: Network Enforcement Placement
    business_outcome: Identify candidate enforcement targets and policy locators.
    responsibility: Future capability; outside first MVP.
    language_terms: [enforcement target, policy locator]
  - capability_id: CAP-TECHNICAL-ACCESS-EVIDENCE
    name: Technical Access Evidence
    business_outcome: Preserve technical evidence.
    responsibility: Future capability; outside first MVP.
    language_terms: [technical evidence]
  - capability_id: CAP-ACCESS-POLICY-REALIZATION
    name: Access Policy Realization
    business_outcome: Assess configured versus required access.
    responsibility: Future capability; outside first MVP.
    language_terms: [ConfiguredEffectivePolicySnapshot, convergence]
  - capability_id: CAP-NETWORK-ENVIRONMENT-OPERATIONS
    name: Network Environment Operations
    business_outcome: Execute controlled provider/device mutation.
    responsibility: Future capability; outside first MVP.
    language_terms: [execution]

peer_bounded_context_capabilities:
  - CAP-ORGANIZATION-STRUCTURE
  - CAP-RESOURCE-CATALOGUE
  - CAP-APPLICATION-COMMUNICATION-CATALOGUE
  - CAP-APPLICATION-DEPLOYMENT
  - CAP-BUSINESS-CONNECTIVITY
  - CAP-ACCESS-POLICY
  - CAP-AUTHORITY-MANAGEMENT
  - CAP-NETWORK-ENFORCEMENT-PLACEMENT
  - CAP-TECHNICAL-ACCESS-EVIDENCE
  - CAP-ACCESS-POLICY-REALIZATION
  - CAP-NETWORK-ENVIRONMENT-OPERATIONS

non_peer_compositions:
  - id: Required Policy Materialization
    responsibility: Compose selected Access Policy, Business Connectivity, Application Communication, Deployment, Resource realization and scoped export admission into a complete vendor-neutral policy result without owning those truths.
  - id: Evidence Access Recognition
    responsibility: Future composition outside first MVP.
