[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "napms"
version = "0.1.0"
description = "Network Access Policy Management System"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.141,<1"]

[project.scripts]
napms-http = "napms.runtime.main:run"
napms-migrate = "napms.runtime.migrations:run"
napms-seed-local = "napms.runtime.local_seed:run"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.28,<1"]
runtime = ["uvicorn>=0.52,<1", "psycopg[binary]>=3.2,<4"]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"napms.access_policy.adapters.postgres" = ["migrations/*.sql"]
"napms.authority_management.adapters.postgres" = ["migrations/*.sql"]
"napms.application_catalogue.adapters.postgres" = ["migrations/*.sql"]
"napms.resource_catalogue.adapters.postgres" = ["migrations/*.sql"]
"napms.connectivity_requirements.adapters.postgres" = ["migrations/*.sql"]
"napms.connectivity_decision.adapters.postgres" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: requires the PostgreSQL integration test environment",
]
