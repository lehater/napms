[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "napms"
version = "0.1.0"
description = "Network Access Policy Management System"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.141,<1"]

[project.scripts]
napms-http = "napms.platform.bootstrap.main:run"
napms-migrate = "napms.platform.database.cli:run"
napms-seed-local = "napms.platform.bootstrap.local_seed:run"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.28,<1"]
runtime = ["uvicorn>=0.52,<1", "psycopg[binary]>=3.2,<4"]
postgres = ["psycopg[binary]>=3.2,<4"]
e2e = ["pytest>=8.0.0", "playwright>=1.55,<2", "pillow>=11,<13"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"napms.contexts.access_policy.infrastructure.persistence.postgres" = ["migrations/*.sql"]
"napms.contexts.authority_management.infrastructure.persistence.postgres" = ["migrations/*.sql"]
"napms.contexts.application_catalogue.infrastructure.persistence.postgres" = ["migrations/*.sql"]
"napms.contexts.resource_catalogue.infrastructure.persistence.postgres" = ["migrations/*.sql"]
"napms.contexts.connectivity_requirements.infrastructure.persistence.postgres" = ["migrations/*.sql"]
"napms.contexts.connectivity_decision.infrastructure.persistence.postgres" = ["migrations/*.sql"]
"napms.contexts.technical_access_evidence.infrastructure.persistence.postgres" = ["migrations/*.sql"]
"napms.contexts.network_enforcement_placement.infrastructure.persistence.postgres" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: requires the PostgreSQL integration test environment",
]
