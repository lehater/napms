[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "napms"
version = "0.1.0"
description = "Network Access Policy Management System"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.141,<1"]

[project.scripts]
napms-http = "napms.platform.bootstrap.main:run"
napms-migrate = "napms.platform.database.cli:run"
napms-seed-local = "napms.platform.bootstrap.local_seed:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28,<1",
    "ruff==0.16.8",
    "mypy==2.3.1",
    "import-linter==2.15",
    "pip-audit==2.10.1",
]
runtime = ["uvicorn>=0.52,<1", "psycopg[binary]>=3.2,<4", "PyJWT[crypto]>=2.10,<3"]
postgres = ["psycopg[binary]>=3.2,<4"]
e2e = ["pytest>=8.0.0", "playwright==1.55.0", "pillow==11.3.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"napms.contexts.access_policy.infrastructure.persistence.postgres" = ["migrations/*.sql"]
"napms.contexts.authority_management.infrastructure.persistence.postgres" = ["migrations/*.sql"]
"napms.contexts.application_catalogue.infrastructure.persistence.postgres" = ["migrations/*.sql"]
"napms.contexts.resource_catalogue.infrastructure.persistence.postgres" = ["migrations/*.sql"]
"napms.contexts.connectivity_requirements.infrastructure.persistence.postgres" = ["migrations/*.sql"]
"napms.contexts.connectivity_decision.infrastructure.persistence.postgres" = ["migrations/*.sql"]
"napms.contexts.technical_access_evidence.infrastructure.persistence.postgres" = ["migrations/*.sql"]
"napms.contexts.network_enforcement_placement.infrastructure.persistence.postgres" = ["migrations/*.sql"]
"napms.contexts.application_communication_catalogue.infrastructure.persistence.postgres" = ["migrations/*.sql"]
"napms.contexts.application_deployment.infrastructure.persistence.postgres" = ["migrations/*.sql"]
"napms.contexts.business_connectivity.infrastructure.persistence.postgres" = ["migrations/*.sql"]
"napms.platform.database" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
    "postgres: requires the PostgreSQL integration test environment",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP"]


[tool.mypy]
python_version = "3.10"
packages = ["napms"]
mypy_path = "src"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
