version: 1
kind: meta-roadmap
id: DOCS-V2-HARNESS-ROADMAP
status: active
scope: documentation-system-v2-and-harness-redesign
canonical_for:
  - meta-work-sequence
  - phase-dependencies
  - phase-exit-criteria
  - test-first-delivery-policy
not_canonical_for:
  - product-domain-truth
  - product-implementation

purpose: >
  Provide a durable, machine-readable roadmap so Documentation System v2 and Harness
  redesign can continue across separate chats and work sessions without reconstructing
  sequence, dependencies, completion state or next work from conversation history.

operating_constraints:
  - docs/ remains the sole canonical source of current product/project design truth until explicit cutover.
  - Product code and product tests must not be inspected or used as sources of product/domain/architecture truth during the current documentation-design work.
  - Current roadmap work may modify only docs-v2/**.
  - No product implementation, test, runtime configuration, workflow or CI change is authorized by this roadmap.
  - No merge is authorized by this roadmap.

principles:
  - id: P-HUMAN-TRUTH
    statement: Human-approved facts and accepted canonical artifacts own design truth; agents may derive consequences but must not invent missing business facts.
  - id: P-MACHINE-READABLE
    statement: Every Design Anchor must have a canonical machine-readable representation; human-readable projections are optional unless required for review.
  - id: P-STANDARD-FIRST
    statement: Prefer established formal standards or DSLs such as OpenAPI, AsyncAPI and architecture DSLs when they preserve required semantics; invent custom schemas only where needed.
  - id: P-REPO-SYSTEM-OF-RECORD
    statement: Durable project/process state belongs in the repository, not in chat history or agent memory.
  - id: P-PROGRESSIVE-DISCLOSURE
    statement: Agents load only the task capsule, applicable specifications and direct dependencies needed for one bounded task.
  - id: P-DETERMINISTIC-FIRST
    statement: Enforce structure, references, lifecycle legality, fingerprints and dependency invariants deterministically before semantic LLM evaluation.
  - id: P-HUMAN-ESCALATION
    statement: Missing business truth routes to NEED_MORE_DATA and a structured stakeholder question rather than repeated speculative retries.
  - id: P-TEST-FIRST
    statement: New Harness behavior is specified by conformance cases and expected failures before runtime implementation is authorized.
  - id: P-TRACEABLE
    statement: Important claims, decisions and derived artifacts preserve provenance and stable references.
  - id: P-OPENAI-ALIGNED
    statement: Harness design should remain compatible with current OpenAI guidance on structured outputs, bounded tool use, progressive context, layered guardrails, evals, tracing and human escalation without coupling project semantics to one SDK.

work_policy:
  unit_of_execution: one-meta-task-or-one-gate-evaluation
  state_source: docs-v2/meta/workstream-state.yaml
  completion_rule: >
    A phase is complete only when its declared deliverables exist, its specified conformance
    cases are defined, its exit criteria are satisfied and the workstream state advances explicitly.
  no_silent_advance: true

# Test-first protocol applies to every phase that introduces executable Harness behavior.
test_first_protocol:
  - step: SPECIFY
    result: Machine-readable behavior/invariant contract exists.
  - step: RED
    result: Conformance scenarios and negative fixtures describe behavior that the not-yet-implemented Harness must fail/pass; executable tests remain unauthorized until a later implementation phase.
  - step: GREEN
    result: After implementation is explicitly authorized, implement the smallest behavior required to satisfy the conformance suite.
  - step: REFACTOR
    result: Simplify implementation without weakening contracts or tests.
  - step: REGRESSION
    result: Re-run the complete applicable deterministic and semantic evaluation set before accepting the phase.

phases:
  - id: H0
    title: Roadmap and redesign charter
    depends_on: []
    objective: Establish durable roadmap, state tracking and governing redesign principles.
    deliverables:
      - docs-v2/meta/roadmap.yaml
      - docs-v2/meta/workstream-state.yaml
    exit_criteria:
      - Roadmap and current state are repository-resident and discoverable from docs-v2/README.md.
      - Current task, next task, blockers and authorization state can be recovered without chat history.

  - id: H1
    title: Harness conformance and eval contract
    depends_on: [H0]
    objective: Define the tests before redesigning or implementing Harness behavior.
    deliverables:
      - conformance scenario taxonomy
      - positive and negative fixture specification
      - deterministic-versus-semantic validator boundary
      - expected transition and failure-routing cases
      - OpenAI-alignment eval cases for context minimization, structured outputs, tool boundaries, guardrails and human escalation
    exit_criteria:
      - Each planned Harness capability has at least one success case and one material failure case where applicable.
      - Conformance cases are referenceable by stable IDs.
      - No executable implementation is required to complete H1.

  - id: H2
    title: Executable lifecycle model
    depends_on: [H1]
    objective: Replace prose-only lifecycle assumptions with a machine-readable state-machine specification.
    deliverables:
      - lifecycle states and transitions
      - S0/S1/S2/S3/S4 stage ownership
      - S2 internal checkpoints for strategic, process-discovery and tactical work
      - G0-G4 contracts
      - REWORK, REOPEN, BLOCKED and NEED_MORE_DATA routing
    exit_criteria:
      - Every legal transition and rejection path is covered by H1 conformance cases.
      - G2 occurs only after complete applicable S2 domain design rather than strategic decomposition alone.

  - id: H3
    title: Design Anchor contract
    depends_on: [H2]
    objective: Define the universal contract for canonical, machine-readable design anchors.
    deliverables:
      - stable identity model
      - canonical representation rules
      - status/lifecycle model
      - provenance model
      - human override semantics
      - supersession rules
      - fingerprint/revalidation semantics
    exit_criteria:
      - Accepted anchors can be safely referenced by downstream work.
      - Manual edits can deterministically invalidate prior validation evidence.
      - Unsupported agent-generated domain assertions cannot become accepted truth.

  - id: H4
    title: Artifact type registry and canonical formats
    depends_on: [H3]
    objective: Define every anchor/artifact family, applicability, owner, format, schema and validator requirements.
    deliverables:
      - machine-readable artifact type registry
      - schema/DSL selection rules
      - standard-format mappings for OpenAPI, AsyncAPI, architecture DSL and other native specifications
      - classification of anchor, evidence, projection and process-state artifacts
    exit_criteria:
      - Every retained artifact type has one owner stage and canonical representation rule.
      - Optional and conditional applicability is machine-checkable.
      - No duplicate canonical owners exist for the same semantic truth.

  - id: H5
    title: Dependency, registry and impact model
    depends_on: [H4]
    objective: Make project design state graph-addressable and changes impact-computable.
    deliverables:
      - generated anchor registry model
      - dependency edge vocabulary
      - reference resolution rules
      - content fingerprints
      - DIRTY/STALE propagation
      - earliest-affected-stage calculation contract
    exit_criteria:
      - Dangling references, invalid statuses and stale validation evidence are deterministically detectable.
      - A changed upstream anchor produces a reproducible affected downstream set.

  - id: H6
    title: Complete DDD pipeline specification
    depends_on: [H5]
    objective: Formalize strategic discovery, context design, domain process discovery/Event Storming and tactical DDD as anchor-producing work.
    deliverables:
      - subdomain and domain-distillation model
      - capability map and capability-to-context mapping
      - bounded-context and relationship specifications
      - domain process model for commands, events, actors, policies, timelines and external systems
      - candidate aggregate derivation
      - tactical aggregate/entity/value-object/invariant/domain-service/state semantics
    exit_criteria:
      - Strategic, process and tactical phases have explicit inputs/outputs and checkpoints.
      - Domain Events are not automatically treated as integration messages.
      - Aggregate design cannot proceed through unresolved blocking business questions.

  - id: H7
    title: Human knowledge acquisition protocol
    depends_on: [H6]
    objective: Turn unresolved domain knowledge and user examples into durable project knowledge without invention.
    deliverables:
      - domain-question schema
      - option/recommendation/consequence format
      - stakeholder-decision schema
      - use-case/example capture
      - user-journey enrichment rules
      - hypothesis-versus-accepted-fact distinction
    exit_criteria:
      - Missing semantic truth routes to a structured question.
      - User answers update or create durable anchors with provenance.
      - Examples are preserved without silently generalizing them into universal rules.

  - id: H8
    title: Validation and gate engine specification
    depends_on: [H5, H6, H7]
    objective: Define layered deterministic and semantic validation against the executable process and anchor graph.
    deliverables:
      - schema/reference/dependency validators
      - applicability and lifecycle validators
      - fingerprint freshness validation
      - semantic judge contracts with bounded questions and allowed outcomes
      - gate evidence format with validator/process specification versions
    exit_criteria:
      - Every gate result is reproducible from declared inputs and validator versions.
      - Deterministic failures are resolved before semantic judging.
      - Semantic judges cannot silently invent or mutate upstream truth.

  - id: H9
    title: Agent execution and context model v2
    depends_on: [H8]
    objective: Rebase Task Capsules and routing on the machine-readable process, anchor registry and validation model.
    deliverables:
      - Task Capsule v2
      - known-facts and allowed-derivations fields
      - question/decision/example references
      - minimal context selection rules
      - bounded tool/authority rules
      - concise feedback-loop contract
    exit_criteria:
      - One execution can be reconstructed and validated from durable state alone.
      - Context expansion is explicit and auditable.
      - Agents stop rather than cross blocking questions or authorization boundaries.

  - id: H10
    title: Harness evals, tracing and regression model
    depends_on: [H9]
    objective: Specify how Harness quality itself is measured over time.
    deliverables:
      - regression corpus
      - routing evals
      - context-minimization evals
      - unsupported-inference evals
      - semantic-judge evals
      - trace and failure-corpus requirements
    exit_criteria:
      - Critical Harness behaviors have repeatable eval coverage.
      - Failures can be diagnosed without storing private chain-of-thought.

  - id: H11
    title: Repository and CI enforcement design
    depends_on: [H10]
    objective: Define how local and hosted checks enforce the specifications after implementation is authorized.
    deliverables:
      - check matrix by changed artifact type
      - local-versus-hosted validation responsibilities
      - generated-registry verification
      - stale-gate rejection rules
      - specification-version invalidation rules
    exit_criteria:
      - A future CI implementation can fail deterministically on invalid anchors, references, transitions or stale evidence.
      - Existing repository validation surfaces can be evolved rather than duplicated where practical.

  - id: H12
    title: NAPMS migration and revalidation plan
    depends_on: [H11]
    objective: Rebase existing docs-v2 candidate work on the redesigned Harness specifications and revalidate NAPMS without using product implementation as design truth.
    deliverables:
      - migration dispositions for existing candidate artifacts
      - strategic reconstruction under new anchor model
      - interactive domain process discovery questions
      - tactical DDD after blockers are resolved
      - new applicable G2 evidence
    exit_criteria:
      - Current NAPMS candidate design can be reconstructed from accepted anchors and stakeholder decisions.
      - Former horizontal G2 evidence is replaced by evidence from the redesigned S2 process.

  - id: H13
    title: Runtime Harness implementation plan
    depends_on: [H12]
    objective: Plan actual orchestrator/validator implementation only after specifications and conformance suite have stabilized.
    deliverables:
      - runtime architecture decision
      - OpenAI runtime/SDK integration boundary
      - implementation slices ordered by H1 conformance tests
      - rollout and rollback plan
    exit_criteria:
      - Runtime implementation can proceed test-first under an explicit implementation authorization.
      - Project-specific process semantics remain independent of a single OpenAI SDK or runtime.

program_exit:
  - Machine-readable process and anchor specifications are authoritative for Harness behavior after explicit cutover.
  - Harness implementation is covered by deterministic conformance checks and semantic evals.
  - Cross-session work resumes from repository state without relying on chat history.
  - Human decisions and examples accumulate as traceable project knowledge.
