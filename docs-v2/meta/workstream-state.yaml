carry_forward:
  - Harness is a universal project-agnostic design execution rail from idea/problem/evidence through requirements, DDD, architecture and implementation readiness before first product code; NAPMS is a pilot, never a hard-coded semantic special case.
  - Harness is a critical engineering instrument: explicit versioned rule or explicit stable stop; silent heuristic fallback is forbidden.
  - Project documentation is a graph of machine-readable Design Anchors and typed relations; human-readable documentation is a reproducible non-canonical book/view projection.
  - Every accepted non-root anchor preserves logical derivation lineage with accepted predecessors/evidence/constraints/decisions, derivation kind and durable design rationale.
  - H6 owns universal S2 DDD semantics; H7 owns human knowledge acquisition; H8 owns deterministic-first validation/gates; H9 owns Task Capsule v2 execution/context; H10 owns Harness regression/evals/tracing; H11 owns repository/CI enforcement design.
  - Source specifications remain canonical owners of conformance-case expected behavior; generated regression indexes and other generated views are never a second truth source.
  - Deterministic Harness behavior requires exact replay on declared contract outputs; semantic evaluation is bounded by structured outcomes and prohibited-behavior guards, never private chain-of-thought.
  - Existing repository Harness integration surface is make harness-check locally and .github/workflows/harness.yml hosted; future H4-H10 enforcement should evolve those surfaces rather than create a parallel validation stack where practical.
  - Current tools/validate_docs_v2.py still validates legacy artifacts.md and superseded agent-execution.md, so a green current harness-check is not proof of redesigned H4-H10 compliance.
  - Current harness.yml includes docs-v2/** and invokes make harness-check, but its pull-request trigger is ready_for_review only; hosted evidence used for integration must be bound to the exact candidate revision and becomes stale after a relevant head change.
  - A push-main result is post-merge/integration evidence and cannot substitute for required pre-merge candidate evidence.
  - Current core/web checks do not enforce redesigned exact-scope G4 authorization; future product implementation enforcement must reuse a shared G4 guard alongside existing product checks.
  - Path filters are an execution optimization only after logical changed-artifact classification; they cannot remove a required check.
  - Generated anchor registries, dependency graphs and H10 regression indexes must be regenerated deterministically and drift must fail closed; manual generated edits do not change canonical truth.
  - Validation/checkpoint/gate evidence is current only while exact content/dependency fingerprints, execution basis and accepted validator/spec/profile versions match; stale evidence is rejected, not warned through.
  - Behavior-affecting contract/validator/judge changes require explicit version and compatibility impact plus complete H10 applicable regression evidence.
  - Deterministic CI cannot fabricate semantic-eval PASS. When required semantic execution is unavailable, the result is BLOCKED until version-bound real eval evidence exists.
  - A generated CI capability index should expose current local/hosted commands, triggers, scopes and evidence roles to H9 capsules; connector inability does not imply repository CI absence and the index grants no authority.
  - AGENTS.md already directs agents to inspect applicable workflows/commands/triggers, prefer local checks, inspect hosted run/log evidence, and distinguish tool limitations from absent CI.
  - H12 must distinguish specification/manual revalidation from executable CI enforcement until H11/H13 implementation is separately authorized and must not use current green legacy Harness CI as redesigned compliance evidence.
  - docs/ remains canonical product/project design truth until explicit cutover; ACCEPTED docs-v2 anchors do not override docs/ before cutover.
  - Product code/tests remain excluded as sources of product/domain/architecture truth during current documentation-design work.

