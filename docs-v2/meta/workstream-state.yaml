carry_forward:
  - Harness is a universal project-agnostic design execution rail from idea/problem/evidence through requirements, DDD, architecture and implementation readiness before first product code; NAPMS is a pilot, never a hard-coded semantic special case.
  - Harness is a critical engineering instrument: explicit versioned rule or explicit stable stop; silent heuristic fallback is forbidden.
  - Project documentation is a graph of machine-readable Design Anchors and typed relations; human-readable documentation is a reproducible non-canonical book/view projection.
  - Every accepted non-root anchor preserves logical derivation lineage with accepted predecessors/evidence/constraints/decisions, derivation kind and durable design rationale.
  - H6 owns the complete universal S2 DDD method/schema contract in docs-v2/spec/ddd-pipeline.yaml.
  - H7 owns human knowledge acquisition: questions/recommendations are process state; stakeholder responses require fixed-owner materialization before they are current design truth.
  - H8 owns deterministic-first validation/gates, versioned validators/judges, execution basis and replayable gate evidence.
  - H9 owns active agent execution/context semantics in docs-v2/spec/agent-execution-context-v2.yaml; docs-v2/spec/agent-execution.md is superseded and historical only.
  - Task Capsule v2 is process state, never canonical product/domain truth, and executes exactly one bounded task/evaluation with exactly one primary instruction.
  - Semantic known facts are only current authority-valid H3/H5/H7 sources. Read access, chat/session memory, recommendations, hypotheses and concrete examples do not become semantic authority by being visible to the agent.
  - Allowed derivations are explicit. H6 method rules used by a DDD task must be allowlisted in the capsule; human-owned choices still require H7 materialized authority.
  - Context loading is metadata/direct-ref first and minimal. Broad repository/stage/context preloading is invalid unless a concrete need is recorded.
  - Context expansion is allowed only during capsule preparation, recorded before load with a concrete unresolved question/reason. After H8 execution-basis freeze, any new semantic input stops the operation and requires a new capsule revision/new operation_id.
  - Capsule semantic inputs/fingerprints/versions and the H8 execution basis must match exactly; mismatch fails closed.
  - Tool/action/resource/mutation authority is deny-by-default. Read permission never grants semantic authority. Writes are restricted to declared targets/output contract.
  - Implementation requires a current exact-scope G4 lease and current gate evidence; capsule fields cannot create or broaden authorization. CI modification and merge require separate explicit authorization.
  - Agents stop on blocking H7 knowledge, stale/changed inputs, earlier-owner deficiencies, scope expansion, undeclared derivations, missing authority or unauthorized tools; they do not patch around the boundary.
  - Durable execution feedback contains capsule/basis/evidence/diagnostics/blockers/context expansions/next hint but never private chain-of-thought or scratch transcripts.
  - Replaying the same operation/basis is idempotent; the same operation ID with a different basis fails.
  - H10 must turn stable conformance IDs and H9 observable execution records into regression/eval/trace coverage for Harness quality without private chain-of-thought.
  - docs/ remains canonical product/project design truth until explicit cutover; ACCEPTED docs-v2 anchors do not override docs/ before cutover.
  - Product code/tests remain excluded as sources of product/domain/architecture truth during current documentation-design work.
  - H2 owns lifecycle; H3 anchor identity/provenance/acceptance; H4 type/format/applicability; H5 registry/refs/fingerprints/lineage/impact; H6 DDD; H7 human knowledge; H8 validation/gates; H9 agent execution/context.

