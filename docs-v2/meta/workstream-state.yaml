  merge_authorization: false

resume_protocol:
  - Read this file first.
  - Resolve active_scope.state_ref; treat that scope state as the sole current lifecycle/task/gate owner.
  - Read docs-v2/spec/harness-control-plane.yaml for effective integration semantics.
  - Read only the current scope task direct dependencies and applicable phase/spec contracts.
  - Build one transaction-scoped Task Capsule; persist it atomically/idempotently before starting another transaction.
  - The same orchestration session may start the next eligible capsule after commit unless a control-plane stop condition applies.
  - Do not infer progress or authority from chat history when repository state is available.

