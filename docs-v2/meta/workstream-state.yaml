carry_forward:
  - Harness is a universal, project-agnostic design execution rail from idea/problem/evidence through requirements, DDD, architecture and implementation readiness before first product code; NAPMS is the pilot, not a hard-coded semantic special case.
  - Project documentation is fundamentally a graph of machine-readable Design Anchors and typed relations; human-readable documentation is a reproducible book/view projection of that graph rather than a parallel source of truth.
  - Provenance alone is insufficient for derived design truth. Every accepted non-root anchor must preserve logical derivation lineage: accepted predecessors/evidence/constraints/decisions, derivation kind and concise durable design rationale.
  - Accepted root anchors must terminate in durable stakeholder/external/evidence/constraint authority; an agent proposal cannot be an unexplained root.
  - docs-v2/spec/design-derivation-lineage.yaml extends H5 and is a required direct design input for H6-H13 wherever artifact generation, validation, context selection, migration or documentation projection depends on design lineage.
  - H5 impact dependency and derivation lineage reuse the same H3 semantic_refs and anchor identities; there must not be a second parallel hand-maintained lineage graph.
  - General impact dependencies may be cyclic when explicitly valid, but logical derivation lineage is acyclic; a derivation cycle means the real predecessor/decision basis has not been exposed.
  - Design rationale is durable project-level justification, not private chain-of-thought. It must be sufficient to review why a design step follows without storing hidden model reasoning.
  - Existing M1-M6 specifications are redesign inputs and may be revised by H6-H11.
  - M7 evidence exposed missing strategic-DDD derivation artifacts and broader Harness/process gaps.
  - The previously recorded horizontal strategic G2 PASS is stale under the revised direction and must not authorize architecture or implementation.
  - Product code/tests remain excluded as sources of product/domain/architecture truth in the current documentation-design work.
  - docs/ remains canonical product/project design truth until explicit cutover.
  - docs-v2/spec/lifecycle-state-machine.yaml owns redesigned Harness lifecycle coordination semantics; docs-v2/spec/lifecycle.md remains pre-H2 redesign input only.
  - docs-v2/spec/design-anchor.yaml owns the universal Design Anchor contract; later phases must not weaken H3 identity, provenance, acceptance, human-control or freshness invariants.
  - docs-v2/spec/artifact-type-registry.yaml owns redesigned artifact classification, retained type identity, semantic ownership, applicability and canonical-format selection; docs-v2/spec/artifacts.md remains pre-H4 redesign input only.
  - docs-v2/spec/dependency-registry-impact.yaml owns generated registry, typed semantic-reference, fingerprint/canonicalization, validation-basis and impact-calculation semantics for the redesign.
  - Before cutover, ACCEPTED in the Design Anchor model denotes redesigned-model conformance and does not override docs/ product/domain authority.
  - Every retained H4 anchor type has exactly one S0-S4 owner and requires the H3 envelope; non-anchor evidence/process-state cannot introduce product/domain truth.
  - The legacy generic decision-record is not retained as a canonical dynamic-owner type; it is split into fixed-owner stage-specific decision types.
  - context-map and requirement-domain-trace are non-canonical generated projections; canonical relationship/trace semantics come from anchors and H5 typed references/edges.
  - S2 domain-model and state-model use structured YAML as canonical carriers; H6 owns their detailed DDD schemas and generated diagrams are projections.
  - H5 registry current resolution is keyed by anchor_id; historical resolution is keyed by anchor_id plus semantic_fingerprint. Registry fields are generated indexes, not independent truth.
  - H5 semantic dependencies are explicit typed H3 semantic_refs; text mentions, file paths and generated projections never create dependency edges implicitly.
  - H3 supersession metadata remains the single owner of replacement history and is not duplicated as a dependency edge.
  - H5 semantic fingerprints use the versioned sha256-jcs-v1 profile: type-specific semantic projection, RFC 8785 JCS serialization and SHA-256 digest.
  - Structured payload key order is canonicalized; text payloads normalize only line endings and otherwise preserve code points, whitespace, comments and order unless a later type-specific semantic projection is explicitly defined.
  - Validation freshness is bound to the local semantic fingerprint plus an exact typed dependency snapshot; dependency fingerprint drift deterministically makes evidence STALE and an ACCEPTED dependent DIRTY.
  - Impact propagation follows only explicit effective reverse dependency edges; stage order alone never expands the blast radius.
  - A dependent G4 lease becomes revoked/non-current when its basis contains any affected anchor.
  - Earliest affected stage is calculated from semantic roots or explicit deficiency ownership, not from the numerically earliest downstream affected stage.
  - If semantic ownership cannot be derived, route to narrow classification; do not invent an owner stage or preload all stage protocols.
  - OpenAPI, AsyncAPI, JSON Schema and Gherkin remain canonical standard families for applicable H4 contract types; accepted concrete versions are pinned by validation profiles.
  - H1 conformance scenarios remain RED-stage behavioral requirements and must not be weakened to fit later specifications or implementation.
  - No new lifecycle transition class or rejection path may be added outside H1 lifecycle_transition_coverage; a missing class reopens H1 first.
  - G2 evaluation is eligible only when all applicable S2 checkpoints are ACCEPTED; non-applicable checkpoints are skipped rather than fabricated as complete.
  - Domain Process Discovery/Event Storming must escalate unsupported business choices to structured stakeholder questions; user answers/examples should become durable decisions, use cases or journeys with provenance.
  - Deterministic structural/reference/authority/transition failures must be resolved before semantic eval can produce PASS.

