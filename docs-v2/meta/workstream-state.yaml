carry_forward:
  - Harness is a universal project-agnostic design execution rail; NAPMS is a migration/pilot case, never a hard-coded semantic special case.
  - Harness behavior is explicit, versioned and fail-closed; silent fallback, ambient authority and project-specific magic are forbidden.
  - Project documentation is a graph of machine-readable Design Anchors and H5 relations; readable documentation is a non-canonical projection.
  - Every accepted non-root anchor preserves logical derivation lineage to accepted predecessors/evidence/constraints/decisions.
  - H6 owns S2 DDD semantics; H7 human knowledge acquisition; H8 validation/gates; H9 transaction-scoped Task Capsules; H10 regression/evals/tracing; H11 repository/CI enforcement design.
  - DOCS-V2-HARNESS-CONTROL-PLANE v1 is the normative composition root for transaction/session/state/evidence integration semantics.
  - One Task Capsule equals one atomic Harness transaction; an orchestration session may chain multiple committed eligible capsules until a real stop condition.
  - Gate/checkpoint evaluations remain separate transactions with separate evidence; they do not require separate agent/session invocations.
  - The active scope lifecycle state is the sole writable owner of current task, stage/checkpoint/gate states and blockers; this global state only points to it.
  - Anchor semantic consistency uses SJ-ANCHOR-CONSISTENCY; gate/checkpoint sufficiency judges are reserved for gate/checkpoint profiles.
  - Exact context may be resolved lazily inside a predeclared authority closure; the final consumed execution basis is frozen and fingerprint-bound before decision/persistence.
  - Coherent same-stage/same-scope anchor changes may be validated as one change set while preserving per-target fingerprints and graph/lineage guarantees.
  - docs/ remains canonical NAPMS product/project design truth until explicit cutover; product code/tests/runtime config cannot reconstruct missing product/domain/architecture truth during H12.
  - Existing horizontal/pilot docs-v2 candidates are migration/history/comparison input until rematerialized; former V0-V3/G2/PASS evidence is stale.
  - H12 legal semantic sequence remains S0 -> G0 -> S1 -> G1 -> S2 Strategic -> Process Discovery -> Tactical -> G2 -> planning; only session/transaction mechanics changed.
  - Current canonical S1 catalogue-curation behavior explicitly permits a realization version with one or more technical addresses.
  - The later S2 single-effective-AddressSpace rule cannot override current S1 without explicit S1/H7 authority change.
  - The prior Resource Catalogue tactical pilot cannot satisfy current S2 because applicable Process Discovery was not durably performed before tactical modelling.
  - New bounded-scope G2 does not authorize docs cutover, S3/S4 acceptance, product implementation, workflow changes, merge or broader NAPMS domain completeness.

