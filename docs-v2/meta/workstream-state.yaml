    Extend the RED-stage Harness conformance contract only where H2-T1 proved lifecycle
    behavior is not yet specified test-first. Add stable conformance cases for gate PASS,
    BLOCKED routing, DIRTY propagation and dependent G4 revocation, S2 checkpoint
    progression/applicability, and representative illegal-transition rejection so H2 can
    define the lifecycle state machine without inventing untested transition semantics.
  expected_outputs:
    - additional stable lifecycle conformance scenario IDs in docs-v2/spec/harness-conformance.yaml
    - explicit BLOCKED versus NEED_MORE_DATA behavioral boundary
    - gate PASS to accepted-state/next-stage eligibility case without same-capsule auto-execution
    - DIRTY propagation and dependent implementation-lease revocation case
    - S2 strategic/process-discovery/tactical checkpoint progression and complete-applicable-S2 G2 eligibility cases
    - representative illegal-transition rejection case
    - refreshed HE-LIFECYCLE-ROUTING suite with reference-integrity validation
  next_after_completion: Retry H2-T1 executable lifecycle model

