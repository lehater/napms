carry_forward:
  - Harness is a universal project-agnostic design execution rail from idea/problem/evidence through requirements, DDD, architecture and implementation readiness before first product code; NAPMS is a pilot, never a hard-coded semantic special case.
  - Harness is a critical engineering instrument: explicit versioned rule or explicit stable stop; silent heuristic fallback is forbidden.
  - Project documentation is a graph of machine-readable Design Anchors and typed relations; human-readable documentation is a reproducible non-canonical book/view projection.
  - Provenance alone is insufficient: every accepted non-root anchor preserves logical derivation lineage with accepted predecessors/evidence/constraints/decisions, derivation kind and durable design rationale.
  - H6 now owns the detailed universal S2 DDD method/schema contract in docs-v2/spec/ddd-pipeline.yaml.
  - S2 is ordered Strategic -> Process Discovery -> Tactical. G2 is eligible only when all applicable checkpoints are ACCEPTED.
  - Strategic DDD derives capability-map, domain-distillation, bounded-context and applicable context-relationship-map from accepted behavior/constraints; capability, subdomain and Bounded Context are never assumed one-to-one.
  - Bounded Context boundaries require explicit model/language/responsibility cohesion basis; legacy code/service/team/database boundaries are insufficient by themselves.
  - Process Discovery/Event Storming persists actors, commands, Domain Events, policies, timeline, external systems, hotspots and candidate aggregate hypotheses in domain-process-model.
  - Accepted process commands/events/policies cannot rely on agent-hypothesis alone; unresolved human-owned semantics route NEED_MORE_DATA.
  - Candidate aggregate records in domain-process-model are hypotheses only. Accepted aggregate truth exists only in domain-model after tactical derivation/validation.
  - Tactical aggregate boundaries require accepted requirement/process/invariant consistency basis inside exactly one accepted Bounded Context; table/object graph/transaction convenience is insufficient.
  - Entities require domain identity semantics; value objects require value/equality semantics without independent identity; invariants require authority-bearing lineage; domain services require a domain responsibility that does not naturally belong to an entity/value object.
  - Domain Events are S2 domain facts and do not imply S3 integration messages, brokers or AsyncAPI contracts.
  - Cross-anchor whole/item references in H6 payloads never create a parallel graph: semantic payload refs/selectors must have matching H5 semantic_refs when they contribute semantics.
  - H6 specializes H5 sha256-jcs-v1 only by declaring explicit set-like arrays and deterministic local-ID sort keys; unlisted arrays preserve order and process timelines remain order-sensitive.
  - Later S2 work that exposes invalid earlier S2 truth routes to the owning earlier checkpoint; tactical work must not patch around strategic/process defects.
  - H7 must turn H6 NEED_MORE_DATA/hotspot/aggregate questions into durable stakeholder knowledge, options/decisions/examples without silently generalizing or inventing truth.
  - docs-v2/spec/harness-reliability-conformance.yaml remains mandatory for downstream routing/validation/execution design.
  - docs/ remains canonical product/project design truth until explicit cutover; ACCEPTED docs-v2 anchors do not override docs/ before cutover.
  - Product code/tests remain excluded as sources of product/domain/architecture truth during current documentation-design work.
  - H2 lifecycle-state-machine owns lifecycle semantics; H3 design-anchor owns anchor identity/provenance/acceptance; H4 artifact-type-registry owns type/format/applicability; H5 owns registry/refs/fingerprints/lineage/impact; H6 owns DDD method/schema semantics.
  - Deterministic structural/reference/authority/self-consistency failures must be resolved before semantic evaluation can PASS.

