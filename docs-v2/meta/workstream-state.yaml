carry_forward:
  - Harness guides design from problem/discovery to implementation readiness before code.
  - docs-v2/ is authoritative evolving design documentation during migration; docs/ is frozen legacy evidence only.
  - Product code/tests cannot reconstruct missing design truth during documentation design.
  - Human-owned truth is never invented; material gaps become questions/blockers.
  - Domain stories/process evidence precede settled slices/boundaries; Strategic and Process Discovery may refine each other.
  - Tactical acceptance requires current relevant strategic boundaries and process evidence.
  - Design documentation is a graph; affected-only revalidation replaces waterfall restart.
  - Downstream design conforms to current applicable upstream authoritative constraints; clear divergence is REWORK, not automatically a human question.
  - Readiness gates are lifecycle guarantees, not separate execution units; current unrelated evidence is reused.
  - Operational IDs, fingerprints, execution bases, receipts, caching and atomicity are infrastructure details.
  - H12 demonstrated the corrected flow through G2 on Resource Catalogue curation without Task Capsule/gate transaction ceremony.
  - H13 selects a single repository-local runtime boundary with deterministic validation/impact/readiness core plus thin Git persistence; generated indexes/caches are rebuildable and non-authoritative.
restrictions:
  product_implementation_authorization: none
  executable_test_change_authorization: none
  runtime_implementation_authorization: none
  workflow_ci_change_authorization: none
  namespace_cutover_authorization: false
  merge_authorization: false
blockers:
