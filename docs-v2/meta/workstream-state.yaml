carry_forward:
  - Existing M1-M6 specifications are redesign inputs and may be revised by H5-H11.
  - M7 evidence exposed missing strategic-DDD derivation artifacts and broader Harness/process gaps.
  - The previously recorded horizontal strategic G2 PASS is stale under the revised direction and must not authorize architecture or implementation.
  - Product code/tests remain excluded as sources of product/domain/architecture truth in the current documentation-design work.
  - docs/ remains canonical product/project design truth until explicit cutover.
  - docs-v2/spec/lifecycle-state-machine.yaml owns redesigned Harness lifecycle coordination semantics; docs-v2/spec/lifecycle.md remains pre-H2 redesign input only.
  - docs-v2/spec/design-anchor.yaml owns the universal Design Anchor contract; later phases must not weaken H3 identity, provenance, acceptance, human-control or freshness invariants.
  - docs-v2/spec/artifact-type-registry.yaml owns redesigned artifact classification, retained type identity, semantic ownership, applicability and canonical-format selection; docs-v2/spec/artifacts.md is retained only as pre-H4 redesign input.
  - Before cutover, ACCEPTED in the Design Anchor model denotes redesigned-model conformance and does not override docs/ product/domain authority.
  - Every retained H4 anchor type has exactly one S0-S4 owner and requires the H3 envelope; non-anchor evidence/process-state cannot introduce product/domain truth.
  - The legacy generic decision-record is not retained as a canonical dynamic-owner type; it is split into problem-, requirements-, domain-, architecture- and implementation-readiness-decision types with fixed owners.
  - context-map and requirement-domain-trace are non-canonical generated projections; canonical relationship/trace semantics must come from anchors and the H5 dependency/registry model.
  - S2 domain-model and state-model use structured YAML as canonical carriers; H6 owns their detailed DDD schemas and generated diagrams are projections.
  - OpenAPI, AsyncAPI, JSON Schema and Gherkin are canonical standard families for their applicable contract types; accepted concrete versions are pinned by future validation profiles rather than silently defaulted by H4.
  - H4 does not define physical repository paths; path resolution must preserve H3 anchor identity and belongs to repository-layout/integration work.
  - H5 must define generated registry/reference/fingerprint/dependency semantics without changing H4 semantic owners or creating duplicate canonical truth.
  - Manual edits to fingerprint-included semantics stale prior validation evidence and move an ACCEPTED anchor to DIRTY until revalidated.
  - Human acceptance/override provides durable authority but never bypasses deterministic integrity/fingerprint validation.
  - Unsupported agent-generated human-owned business assertions cannot become ACCEPTED; they route to NEED_MORE_DATA/BLOCKED when truth is not derivable.
  - H1 conformance scenarios remain RED-stage behavioral requirements and must not be weakened to fit later specifications or implementation.
  - No new lifecycle transition class or rejection path may be added outside H1 lifecycle_transition_coverage; a missing class reopens H1 first.
  - G2 evaluation is eligible only when all applicable S2 checkpoints are ACCEPTED; non-applicable checkpoints are skipped rather than fabricated as complete.
  - Domain Process Discovery/Event Storming must escalate unsupported business choices to structured stakeholder questions; user answers/examples should become durable decisions, use cases or journeys with provenance.
  - Deterministic structural/reference/authority/transition failures must be resolved before semantic eval can produce PASS.

