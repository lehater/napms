carry_forward:
  - Harness is a universal project-agnostic design execution rail from idea/problem/evidence through requirements, DDD, architecture and implementation readiness before first product code; NAPMS is a pilot, never a hard-coded semantic special case.
  - Harness is a critical engineering instrument: explicit versioned rule or explicit stable stop; silent heuristic fallback is forbidden.
  - Project documentation is a graph of machine-readable Design Anchors and typed relations; human-readable documentation is a reproducible non-canonical book/view projection.
  - Every accepted non-root anchor preserves logical derivation lineage with accepted predecessors/evidence/constraints/decisions, derivation kind and durable design rationale.
  - H6 owns the complete universal S2 DDD method/schema contract in docs-v2/spec/ddd-pipeline.yaml.
  - H7 owns human knowledge acquisition: questions/recommendations are process state; stakeholder responses require fixed-owner materialization before they are current design truth.
  - H8 owns validation/gate evaluation in docs-v2/spec/validation-gate-engine.yaml plus concrete validator/judge version resolution in docs-v2/spec/validation-engine-catalog.yaml.
  - H8 validation is strictly deterministic-first. Any deterministic FAIL/BLOCKED/NEED_MORE_DATA stops semantic judging; semantic PASS can never override a deterministic non-PASS finding.
  - H8 execution basis is immutable and version-bound: exact target/scope, durable state/input refs and fingerprints, Harness/process/profile versions, validator versions and semantic judge versions determine the evaluation.
  - Chat/session memory, process-local cache and undeclared context carry no validation or authorization authority.
  - H8 has 14 stable h8-v1 deterministic validators bound to ordered validation layers and 8 bounded h8-v1 semantic judges for G0, G1, S2 Strategic/Process/Tactical, G2, G3 and G4.
  - Semantic judges consume only declared ACCEPTED/CURRENT inputs, return only PASS/REWORK/REOPEN/NEED_MORE_DATA, cannot mutate truth/state, cannot choose stakeholder options and cannot invent lifecycle routes.
  - H7 human authority/materialization is checked before semantic sufficiency; recommendations, hypotheses, open questions and unmaterialized answers are not current truth.
  - Validation evidence is H4 validation-evidence process state, never product/domain truth; H8 defines anchor/checkpoint/gate evidence schemas and validation-evidence-sha256-jcs-v1.
  - Gate PASS is bound to an exact input snapshot, validator/judge/spec versions and execution-basis fingerprint; inputs are re-resolved immediately before PASS/state-effect commit.
  - If an exact input changes before commit, PASS is not committed; existing H2/H5 ownership/routing determines rework/blocking.
  - G4 implementation lease is issued only from current exact-scope G4 gate evidence and becomes unusable when its upstream basis becomes stale/dirty.
  - H8 diagnostic codes are stable machine-readable semantics; human-readable detail is non-authoritative and semantic judge outcome conflicts FAIL rather than being silently resolved.
  - Durable validation/gate persistence is idempotent by operation_id plus execution basis; same operation ID with different basis FAILs.
  - H9 must make Task Capsule v2 reconstruct or carry the H8 execution basis, restrict known facts to ACCEPTED/CURRENT refs, declare allowed derivations and question/decision/example refs, and make context expansion explicit before semantic work.
  - docs/ remains canonical product/project design truth until explicit cutover; ACCEPTED docs-v2 anchors do not override docs/ before cutover.
  - Product code/tests remain excluded as sources of product/domain/architecture truth during current documentation-design work.
  - H2 owns lifecycle; H3 anchor identity/provenance/acceptance; H4 type/format/applicability; H5 registry/refs/fingerprints/lineage/impact; H6 DDD semantics; H7 human knowledge acquisition; H8 validation/gates.
  - Deterministic structural/reference/authority/self-consistency failures must be resolved before semantic evaluation can PASS.

