resume_protocol:
  - Read this file first.
  - Read roadmap.yaml and docs-v2/meta/h13-minimal-runtime-plan.yaml.
  - Treat H12 pilot artifacts only as evidence for the accepted runtime boundary unless new design evidence requires reopening them.
  - Treat docs/ only as frozen migration evidence; never edit it.
  - Do not implement runtime code or executable tests until explicit authorization is granted.
  - If runtime implementation is authorized, implement only the accepted minimal boundary first and validate with the listed acceptance tests before adding architecture.
  - Do not add Task Capsule, separate gate transaction, daemon/service, database or CI dependency without demonstrated need and explicit affected design change.
