id: DOCS-V2-HARNESS-STATE
roadmap: docs-v2/meta/roadmap.yaml
branch: meta/docs-v2-m7-pilot
last_updated: 2026-09-17
program: {status: ACTIVE, current_phase: H12, current_phase_state: IN_PROGRESS, completed_phases: [H0, H1, H2, H3, H4, H5, H6, H7, H8, H9, H10, H11]}
control_plane:
  contract: {id: DOCS-V2-HARNESS-CONTROL-PLANE, path: docs-v2/spec/harness-control-plane.yaml, version: 1, revision: 2}
  rule: meaningful design work is the visible unit; runtime reliability bookkeeping is internal
active_scope: {scope_id: H12-RC-CURATION-MVP, state_ref: docs-v2/migration/revalidated/h12-rc-curation/lifecycle-scope-state.yaml, state_owner: sole-writable-lifecycle-owner}
carry_forward:
  - Harness guides design from problem/discovery to implementation readiness before code.
  - docs/ remains canonical NAPMS product/domain/architecture truth until explicit cutover.
  - Product code/tests cannot reconstruct missing design truth during H12.
  - Human-owned truth is never invented; material gaps become questions/blockers.
  - Domain stories/process evidence precede settled slices/boundaries; Strategic and Process Discovery may refine each other.
  - Tactical acceptance requires current relevant strategic boundaries and process evidence.
  - Design documentation is a graph; affected-only revalidation replaces waterfall restart.
  - Semantic precedence follows authority and derivation direction: a downstream artifact must conform to current applicable upstream authoritative constraints and may refine but not contradict, weaken, narrow, broaden or replace them without an explicit authorized upstream change/decision.
  - When two statements differ, first resolve authority/dependency precedence. Ask a human only when authoritative upstream truth is ambiguous/missing or a new human-owned choice is actually required.
  - A later explicit stakeholder correction may amend an upstream artifact; when it does, correct that upstream truth first and propagate the change through all affected downstream artifacts.
  - Readiness gates are lifecycle guarantees, not separate execution units; current unrelated evidence is reused.
  - Operational IDs, fingerprints, execution bases, receipts, caching and atomicity are infrastructure details.
restrictions:
  product_implementation_authorization: none
  executable_test_change_authorization: none
  workflow_ci_change_authorization: none
  canonical_cutover_authorization: false
  merge_authorization: false
blockers: []
resume_protocol:
  - Read this file first.
  - Read roadmap.yaml for design dependency order and slice-selection rules.
  - Read active_scope.state_ref for current design maturity, blockers and next meaningful work.
  - Load only target artifacts, direct semantic dependencies and applicable method/schema contracts.
  - Before classifying a semantic mismatch as a conflict/question, resolve authority and derivation precedence; downstream divergence from a clear upstream constraint is REWORK, not NEED_MORE_DATA.
  - Perform coherent meaningful design work; validate changed/affected design and readiness at reached boundaries.
  - Persist coherent artifacts/state/evidence and continue unless a real stop condition applies.
  - Do not infer authority or progress from chat when repository state is available.
