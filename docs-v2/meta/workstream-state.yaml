carry_forward:
  - Harness is a universal project-agnostic design execution rail from idea/problem/evidence through requirements, DDD, architecture and implementation readiness before first product code; NAPMS is a pilot, never a hard-coded semantic special case.
  - Harness is a critical engineering instrument: explicit versioned rule or explicit stable stop; silent heuristic fallback is forbidden.
  - Project documentation is a graph of machine-readable Design Anchors and typed relations; human-readable documentation is a reproducible non-canonical book/view projection.
  - Every accepted non-root anchor preserves logical derivation lineage with accepted predecessors/evidence/constraints/decisions, derivation kind and durable design rationale.
  - H6 owns universal S2 DDD semantics; H7 owns human knowledge acquisition; H8 owns deterministic-first validation/gates; H9 owns active Task Capsule v2 agent execution/context semantics.
  - Semantic known facts are only current authority-valid H3/H5/H7 sources. Read access, chat/session memory, recommendations, hypotheses and concrete examples do not become semantic authority by visibility.
  - Context expansion is explicit before load and only during capsule preparation; after execution-basis freeze a new semantic input stops the current operation and requires a new basis/operation identity.
  - Tool/action/resource/mutation authority is deny-by-default; implementation requires a current exact-scope G4 lease; CI modification and merge require separate explicit authorization.
  - H10 owns Harness quality measurement in docs-v2/spec/harness-evals-tracing-regression.yaml.
  - Source specifications remain canonical owners of conformance-case given/expect semantics. H10 generates/indexes stable scenario IDs and must not create a second expected-behavior truth source.
  - H10 treats an active conformance case with missing critical field as effective-critical; only explicit critical false excludes it from the universal sentinel unless promoted after a material failure.
  - Deterministic Harness behavior requires exact contract-level replay for declared outcomes/routes/state/authorization/diagnostics; semantic judges are evaluated only by bounded structured outcomes, refs and prohibited-behavior guards, never private reasoning text.
  - HE-CRITICAL-REGRESSION must cover every active effective-critical case; routing, context minimization, unsupported inference, semantic judges, replay/restart/idempotency and authority/tool/G4 boundaries have required specialized suites.
  - Unauthorized mutation, invented human-owned truth, silent fallback, authority escalation and implementation without a valid lease have zero tolerance in required critical runs.
  - H10 traces store only observable durable refs/fingerprints/versions/results/diagnostics/state effects; private chain-of-thought and scratch transcripts are prohibited.
  - A reproduced critical/material Harness failure cannot close until the violated behavior is represented by a stable regression fixture (or durably classified not-a-defect) and the applicable regression suite passes.
  - Every Harness behavior/spec/runtime change declares affected contracts/scenarios and passes the complete applicable regression set; historical baselines cannot redefine the current contract oracle.
  - H11 must map H8 validators and H10 suites onto existing local/hosted repository validation surfaces, enforce generated index integrity and stale evidence/version rejection, and avoid creating a parallel CI stack when existing infrastructure can be evolved.
  - docs/ remains canonical product/project design truth until explicit cutover; ACCEPTED docs-v2 anchors do not override docs/ before cutover.
  - Product code/tests remain excluded as sources of product/domain/architecture truth during current documentation-design work.

