carry_forward:
  - Harness is a universal project-agnostic design execution rail; NAPMS is a pilot/migration case, never a hard-coded semantic special case.
  - Harness behavior is explicit/versioned/fail-closed; silent fallback, ambient authority and project-specific magic are forbidden.
  - Project documentation is a graph of machine-readable Design Anchors and typed H5 relations; human-readable documentation is a generated non-canonical projection.
  - Every accepted non-root anchor preserves logical derivation lineage to accepted predecessors/evidence/constraints/decisions.
  - H6 owns S2 DDD semantics; H7 human knowledge acquisition; H8 validation/gates; H9 Task Capsule execution; H10 Harness evals/tracing/regression; H11 repository/CI enforcement design.
  - Source-owned conformance cases remain the expected-behavior truth; generated regression indexes are projections only.
  - Existing repository Harness surfaces are make harness-check and .github/workflows/harness.yml; future enforcement should evolve them rather than create a parallel stack where practical.
  - Current tools/validate_docs_v2.py still validates legacy docs-v2 contracts, so current green harness-check is not redesigned H4-H10 compliance evidence.
  - Hosted evidence used for integration must bind to the exact candidate revision; push-main evidence is post-merge only.
  - Deterministic CI cannot fabricate semantic-eval PASS; required unavailable semantic evidence means BLOCKED.
  - docs/ remains canonical NAPMS product/project design truth until explicit cutover; docs-v2 product candidates remain non-canonical.
  - Product code/tests/runtime configuration remain excluded as sources for reconstructing missing product/domain/architecture truth during H12.
  - H12 migration is semantic/provenance reconstruction, not file copying. Existing horizontal/pilot candidates are comparison input until rematerialized under current H3-H8 contracts.
  - Existing horizontal/pilot V0-V3/G2/PASS evidence is stale for redesigned gates and cannot satisfy current H8 evidence requirements.
  - Old context-map is projection-only after current bounded-context/context-relationship anchors exist; old traceability must be replaced by H5 semantic refs/lineage plus generated views.
  - The prior Resource Catalogue tactical pilot cannot satisfy current S2 because H6 process discovery is applicable and was not durably performed before tactical modelling.
  - H12 selected bounded migration sequence is T2 S0/S1 -> T3 Strategic -> T4 Process Discovery -> T5 Tactical -> T6 redesigned G2 -> T7 remaining-breadth planning.
  - The single-effective-AddressSpace rule must be classified at the earliest semantic owner during H12-T2; S2 cannot silently rewrite S1. If it is a true S1 behavior choice not derivable from current docs, route through H7.
  - Examples remain examples unless separately generalized/materialized with authority.
  - New bounded-scope G2 does not authorize docs cutover, S3/S4 acceptance, product implementation, workflow changes, merge or broader NAPMS domain completeness.

