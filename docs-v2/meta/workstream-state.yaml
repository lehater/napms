routing_history:
  - id: H2-T1-ATTEMPT-1
    task: H2-T1
    result: REOPEN(H1)
    observed_at: 2026-09-16
    reason: >
      H2 roadmap exit criteria require every legal lifecycle transition and rejection path
      to be covered by H1 conformance cases before the machine-readable lifecycle is defined.
      The current H1 contract does not cover all behavior H2 is required to specify.
    evidence:
      roadmap_requires:
        - lifecycle states and transitions
        - S2 strategic/process-discovery/tactical checkpoints
        - G0-G4 contracts
        - REWORK, REOPEN, BLOCKED and NEED_MORE_DATA routing
        - every legal transition and rejection path covered by H1 conformance cases
      existing_h1_coverage:
        - REWORK current-stage routing
        - REOPEN earlier-stage routing
        - NEED_MORE_DATA for non-derivable missing business truth
        - stop after one bounded execution
        - rejection of G2 when applicable S2 work is incomplete
      missing_test_first_coverage:
        - BLOCKED route and its boundary from NEED_MORE_DATA
        - normal gate PASS transition to accepted state and next-stage eligibility
        - DIRTY downstream propagation and dependent G4 lease revocation
        - legal S2 checkpoint progression and applicability behavior
        - representative illegal lifecycle transition rejection
    decision: >
      Do not define these missing semantics inside H2. Reopen H1 and specify the RED
      conformance cases first, then retry H2-T1.
    files_reviewed:
      - docs-v2/meta/roadmap.yaml
      - docs-v2/spec/harness-conformance.yaml
      - docs-v2/spec/lifecycle.md

carry_forward:
  - Existing M1-M6 specifications are redesign inputs and may be revised by H2-H11.
  - M7 evidence exposed missing strategic-DDD derivation artifacts and broader Harness/process gaps.
  - The previously recorded horizontal strategic G2 PASS is stale under the revised direction and must not authorize architecture or implementation.
  - Product code/tests remain excluded as sources of product/domain/architecture truth in the current documentation-design work.
  - docs/ remains canonical product/project design truth until explicit cutover.
  - Design Anchors are intended to become canonical machine-readable, human-controllable reference points with stable identity, provenance, dependency and validation semantics.
  - Domain Process Discovery/Event Storming must escalate unsupported business choices to structured stakeholder questions; user answers/examples should become durable decisions, use cases or journeys with provenance.
  - H1 conformance scenarios in docs-v2/spec/harness-conformance.yaml are RED-stage behavioral requirements for H2-H13 and must not be weakened to fit an implementation.
  - NEED_MORE_DATA is required when business truth is missing and not derivable from accepted facts; speculative retries or invented business rules are non-conformant.
  - G2 must reject a scope where applicable S2 process-discovery or tactical work remains incomplete even if strategic decomposition is complete.
  - Deterministic structural/reference/authority failures must be resolved before semantic eval can produce PASS.
  - H2-T1 must remain blocked until H1-T2 closes the lifecycle conformance gaps recorded in routing_history.

