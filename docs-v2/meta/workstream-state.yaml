carry_forward:
  - Harness is a universal project-agnostic design execution rail; NAPMS is a migration/pilot case, never a hard-coded semantic special case.
  - Harness behavior is explicit, versioned and fail-closed; silent fallback, ambient authority and project-specific magic are forbidden.
  - Project documentation is a graph of machine-readable Design Anchors and H5 relations; readable documentation is a non-canonical projection.
  - Every accepted non-root anchor preserves logical derivation lineage to accepted predecessors/evidence/constraints/decisions.
  - H6 owns S2 DDD semantics; H7 human knowledge acquisition; H8 validation/gates; H9 Task Capsule execution; H10 regression/evals/tracing; H11 repository/CI enforcement design.
  - Existing repository Harness surfaces remain make harness-check and .github/workflows/harness.yml; current legacy docs-v2 validator is not redesigned H4-H10 compliance evidence.
  - docs/ remains canonical NAPMS product/project design truth until explicit cutover; product code/tests/runtime config cannot reconstruct missing product/domain/architecture truth during H12.
  - Existing horizontal/pilot docs-v2 candidates are comparison/historical input until rematerialized under current H3-H8 contracts; former V0-V3/G2/PASS evidence is stale.
  - H12 v2 legal migration sequence is H12-T2 S0 -> H12-G0-1 -> H12-T3 S1 -> H12-G1-1 -> H12-T4 Strategic -> H12-T5 Process Discovery -> H12-T6 Tactical -> H12-G2-1 -> H12-T7.
  - One bounded execution may perform one design task or one gate/checkpoint evaluation, never both; successor lifecycle stages require their predecessor gate PASS.
  - Current canonical S1 catalogue-curation behavior explicitly permits a realization version with one or more technical addresses.
  - The later S2 single-effective-AddressSpace rule is a downstream narrowing and cannot override current S1. Reconstructing current S1 requires no H7 question; adopting the narrower rule would require an explicit S1/H7 authority change.
  - Acceptance Example F is concrete-only evidence of replacing one address with another and cannot establish a universal max-one cardinality rule.
  - The prior Resource Catalogue tactical pilot cannot satisfy current S2 because applicable H6 Process Discovery was not durably performed before tactical modelling.
  - Old context-map is projection-only after current bounded-context/context-relationship anchors exist; old traceability is replaced by H5 semantic refs/lineage plus generated views.
  - New bounded-scope G2 does not authorize docs cutover, S3/S4 acceptance, product implementation, workflow changes, merge or broader NAPMS domain completeness.

