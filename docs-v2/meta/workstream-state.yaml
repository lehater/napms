carry_forward:
  - Existing M1-M6 specifications are redesign inputs and may be revised by H2-H11.
  - M7 evidence exposed missing strategic-DDD derivation artifacts and broader Harness/process gaps.
  - The previously recorded horizontal strategic G2 PASS is stale under the revised direction and must not authorize architecture or implementation.
  - Product code/tests remain excluded as sources of product/domain/architecture truth in the current documentation-design work.
  - docs/ remains canonical product/project design truth until explicit cutover.
  - Design Anchors are intended to become canonical machine-readable, human-controllable reference points with stable identity, provenance, dependency and validation semantics.
  - Domain Process Discovery/Event Storming must escalate unsupported business choices to structured stakeholder questions; user answers/examples should become durable decisions, use cases or journeys with provenance.
  - H1 conformance scenarios in docs-v2/spec/harness-conformance.yaml are RED-stage behavioral requirements for H2-H13 and must not be weakened to fit an implementation.
  - H2 must not introduce a legal lifecycle transition class or rejection path absent from H1 lifecycle_transition_coverage; such a gap reopens H1 first.
  - BLOCKED is for a known unavailable prerequisite/authority/evidence with a known resolution path and no new business semantic choice; NEED_MORE_DATA is for non-derivable human-owned business truth and requires a stakeholder question.
  - NEED_MORE_DATA leaves the current stage BLOCKED while durable stakeholder input is awaited.
  - G2 evaluation is eligible only when all applicable S2 checkpoints are accepted; non-applicable checkpoints are skipped rather than fabricated as complete.
  - Material upstream change dirties only declared dependent accepted stages and revokes any dependent G4 implementation authorization.
  - Deterministic structural/reference/authority/transition failures must be resolved before semantic eval can produce PASS.

