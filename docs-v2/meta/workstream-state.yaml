carry_forward:
  - Harness is a universal project-agnostic design execution rail from idea/problem/evidence through requirements, DDD, architecture and implementation readiness before first product code; NAPMS is a pilot, never a hard-coded semantic special case.
  - Harness is a critical engineering instrument: it must either execute an explicit versioned rule or stop with a stable machine-readable reason; silent heuristic fallback is forbidden.
  - docs-v2/spec/harness-reliability-conformance.yaml is mandatory downstream design input for H6-H13 wherever routing, validation, execution, regression, CI or runtime behavior is specified.
  - Deterministic Harness decisions must be replayable from the same durable execution basis and contract versions; natural-language wording need not be byte-identical.
  - Any state that can affect routing, authorization or deterministic validation must be durable and declared; chat/session memory and process-local caches carry no authority.
  - Durable mutations require operation identity and must be idempotent; replay cannot duplicate transitions, evidence, decisions or semantic mutations.
  - Required Harness self-state/spec/registry inputs must validate before project semantic work begins.
  - Stable diagnostic codes are required for deterministic stop/rejection classes; human-readable detail is non-authoritative.
  - Behavior-changing Harness contract changes must declare affected conformance scenario IDs and downstream compatibility review; critical behavior cannot be silently weakened.
  - Project documentation is a graph of machine-readable Design Anchors and typed relations; human-readable documentation is a reproducible non-canonical book/view projection.
  - Provenance alone is insufficient: every accepted non-root anchor must preserve logical derivation lineage with accepted predecessors/evidence/constraints/decisions, derivation kind and durable design rationale.
  - Accepted roots require durable stakeholder/external/evidence/constraint authority; agent plausibility cannot be an unexplained root.
  - H5 impact dependencies and derivation lineage reuse the same H3 semantic refs and anchor identities; no parallel hand-maintained lineage graph is allowed.
  - General impact graphs may contain explicit valid cycles; logical derivation lineage is acyclic.
  - docs/ remains canonical product/project design truth until explicit cutover; ACCEPTED docs-v2 anchors do not override docs/ before cutover.
  - Product code/tests remain excluded as sources of product/domain/architecture truth during current documentation-design work.
  - H2 lifecycle-state-machine owns redesigned lifecycle semantics; no new lifecycle transition class/rejection path may appear outside H1 coverage.
  - H3 design-anchor owns identity/provenance/acceptance/human-control/freshness invariants.
  - H4 artifact-type-registry owns artifact classification, fixed semantic owners, applicability and canonical-format selection.
  - H5 dependency-registry-impact owns generated registry, typed refs, fingerprint/canonicalization, validation-basis and impact semantics.
  - S2 G2 is eligible only when all applicable strategic/process-discovery/tactical checkpoints are ACCEPTED; non-applicable checkpoints are skipped, not fabricated complete.
  - Domain Process Discovery/Event Storming must escalate unsupported human-owned business choices; stakeholder answers/examples become durable knowledge with provenance.
  - Deterministic structural/reference/authority/self-consistency failures must be resolved before semantic evaluation can PASS.
  - H8 must define concrete execution-basis/result-evidence schemas and diagnostic-code catalog.
  - H9 Task Capsule v2 must carry declared durable execution inputs and operation identity; ambient context cannot authorize.
  - H10 must include H1-T3 reliability scenarios in the permanent regression corpus.
  - H11 enforcement must reject invalid Harness self-state and unversioned/stale execution evidence.
  - H13 runtime plan must provide idempotent durable effects, restart-safe execution and no silent fallback.

