legacy_catalog_disposition:
- legacy_type: decision-record
  disposition: split
  replacement_types: [problem-decision, requirements-decision, domain-decision, architecture-decision, implementation-readiness-decision]
  reason: H4 requires each retained type to have one fixed semantic owner; legacy decision-owner placeholder is resolved into stage-specific types.
- legacy_type: context-map
  disposition: reclassified-projection
  replacement_canonical_sources: [context-relationship-map, other referenced S2 boundary anchors]
  reason: Prevent a rendered context view from duplicating canonical boundary/relationship semantics.
- legacy_type: requirement-domain-trace
  disposition: reclassified-projection
  replacement_canonical_source: H5 dependency/registry relations
  reason: Trace views should be generated from canonical references/edges rather than own duplicate mapping truth.
- legacy_type: evidence
  disposition: retained-with-normalized-envelope
  canonical_change: YAML evidence record references native/external evidence instead of making arbitrary evidence payload formats co-canonical.
- legacy_type: domain-model
  disposition: retained-format-redesign
  canonical_change: Structured YAML carrier; H6 defines detailed DDD schema. Diagrams become projections.
- legacy_type: state-model
  disposition: retained-format-redesign
  canonical_change: Structured YAML carrier; H6 defines detailed lifecycle semantics. Diagram is a projection.
registry_invariants:
- id: AR-ONE-OWNER
  rule: Every retained type has exactly one owner_stage token; retained anchor types use only S0-S4.
- id: AR-ONE-CANONICAL-SEMANTIC-KEY
  rule: canonical_semantic_key is unique across retained canonical types; projections use projection:* keys and are non-canonical.
- id: AR-H3-ANCHOR-MAPPING
  rule: Every anchor type requires the H3 envelope and cannot weaken H3 identity/provenance/status/fingerprint guards.
- id: AR-APPLICABILITY-DECLARATIVE
  rule: Conditional applicability is a structured expression over declared facts; missing facts are routed, never invented.
- id: AR-PROJECTION-NONCANONICAL
  rule: Projection types are non-canonical and cannot become current downstream truth independently of their sources.
- id: AR-STANDARD-FIRST
  rule: OpenAPI, AsyncAPI, JSON Schema and Gherkin are used for the contract classes they directly express; prose is not a parallel canonical copy.
- id: AR-NO-CUTOVER
  rule: This registry does not change docs/ product/domain authority.
conformance_cases:
- id: AR-CF-ONE-OWNER-PER-RETAINED
  oracle: deterministic
  given: {retained_types: all}
  expect: {each_has_exactly_one_owner_stage: true, retained_anchor_owner_in: [S0, S1, S2, S3, S4]}
- id: AR-CF-CONDITIONAL-APPLICABILITY-STRUCTURED
  oracle: deterministic
  given: {types_with_applicability_class: conditional}
  expect: {expression_present: true, expression_uses_declared_dsl: true}
- id: AR-CF-NO-DUPLICATE-CANONICAL-OWNER
  oracle: deterministic
  given: {retained_canonical_types: all}
  expect: {canonical_semantic_key_unique: true}
- id: AR-CF-ANCHOR-H3-ENVELOPE
  oracle: deterministic
  given: {classification: anchor}
  expect: {h3_envelope: required, may_weaken_h3_guards: false}
- id: AR-CF-STANDARD-NATIVE-MAPPINGS
  oracle: deterministic
  given: {types: [http-contract, event-contract, data-schema, acceptance-scenario]}
  expect: {formats: [openapi-yaml, asyncapi-yaml, json-schema, gherkin-feature]}
- id: AR-CF-LEGACY-DECISION-OWNER-RESOLVED
  oracle: deterministic
  given: {legacy_type: decision-record}
  expect: {retained_generic_type: false, stage_specific_replacement_count: 5}
- id: AR-CF-PROJECTION-NOT-CANONICAL
  oracle: deterministic
  given: {classification: projection}
  expect: {canonical: false, may_be_independent_truth: false}
- id: AR-CF-CUTOVER-NOT-IMPLICIT
  oracle: deterministic
  given: {registry_defined: true, explicit_cutover_authorization: false}
  expect: {docs_remains_product_domain_authority: true}
h4_exit_evaluation:
  checks:
  - all retained type ids are unique
  - every retained type has exactly one owner_stage token
  - all retained anchor owner stages are one of S0-S4
  - every type has a canonical representation rule
  - every conditional type has a structured applicability expression
  - canonical_semantic_key is unique across retained canonical types
  - every retained anchor maps to H3 envelope
  - standard mappings exist for OpenAPI, AsyncAPI, JSON Schema and architecture/text DSL families
  - generic legacy decision-record is not retained as a dynamic-owner canonical type
  - projection types are explicitly non-canonical
  - no product/domain cutover is performed
  executable_validators_required: false
handoff_to_h5:
  next_task: H5-T1
  requirements:
  - Build the generated anchor registry from retained H4 types and H3 anchor identities.
  - Define dependency-edge vocabulary and reference resolution without changing H4 semantic ownership.
  - Define concrete content fingerprint/canonicalization algorithm compatible with H3 freshness semantics.
  - Compute reproducible DIRTY/STALE downstream impact from H4/H3 references and H2 lifecycle routing.
