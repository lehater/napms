version: 1
kind: harness-execution-kernel-specification
id: DOCS-V2-HARNESS-EXECUTION-KERNEL
status: design-only
owner_phase: H12
owner_task: H12-P1-EXECUTION-KERNEL-DESIGN
last_updated: 2026-09-17

purpose: >-
  Specify the minimum project-agnostic execution kernel needed to operationalize the corrected
  Harness control plane with substantially lower steady-state repository/tool cost. The kernel
  compiles immutable process contracts, target-specific validation work and atomic repository
  effects without changing lifecycle, DDD, authority, provenance, lineage or fail-closed semantics.

authority:
  direct_dependency:
    id: DOCS-V2-HARNESS-CONTROL-PLANE
    path: docs-v2/spec/harness-control-plane.yaml
    version: 1
  required_contracts:
    - {id: DOCS-V2-HARNESS-RELIABILITY-CONFORMANCE, path: docs-v2/spec/harness-reliability-conformance.yaml, version: 1}
    - {id: DOCS-V2-LIFECYCLE-STATE-MACHINE, path: docs-v2/spec/lifecycle-state-machine.yaml, version: 1}
    - {id: DOCS-V2-VALIDATION-GATE-ENGINE, path: docs-v2/spec/validation-gate-engine.yaml, version: 1}
    - {id: DOCS-V2-VALIDATION-ENGINE-CATALOG, path: docs-v2/spec/validation-engine-catalog.yaml, version: 1}
    - {id: DOCS-V2-AGENT-EXECUTION-CONTEXT-V2, path: docs-v2/spec/agent-execution-context-v2.yaml, version: 1}
    - {id: DOCS-V2-HARNESS-EVALS-TRACING-REGRESSION, path: docs-v2/spec/harness-evals-tracing-regression.yaml, version: 1}
    - {id: DOCS-V2-REPOSITORY-CI-ENFORCEMENT, path: docs-v2/spec/repository-ci-enforcement.yaml, version: 1}
  empirical_input:
    id: DOCS-V2-HARNESS-V2-1-G0-COST-MEASUREMENT
    path: docs-v2/review/harness-v2-1-g0-cost-measurement.yaml
  defines:
    - immutable engine-bundle contract
    - transaction context resolver contract
    - validation-plan compiler contract
    - reusable current-evidence rules
    - atomic repository transaction writer contract
    - kernel execution loop and observable metrics
    - performance budgets that never override correctness
    - kernel conformance cases for later H10/H13 implementation planning
  does_not_define:
    - new product/domain/architecture truth
    - new lifecycle stages, gates or routes
    - new DDD artifact semantics
    - weaker provenance, lineage, authority or freshness rules
    - executable runtime implementation
    - executable validator or test implementation
    - CI/workflow changes
    - implementation authorization
    - docs cutover
    - H13 runtime technology choice

positioning:
  classification: pre-runtime-operational-design
  h13_relationship: >-
    This contract is design input to H13. It does not start H13 implementation planning early and
    does not satisfy H13 exit criteria; H12 remains the active migration phase until its own exit.
  control_plane_relationship: >-
    The control plane owns semantics. This kernel owns only how those semantics can be compiled,
    resolved and persisted efficiently. On disagreement, the control plane and its component
    contracts remain authoritative and kernel execution fails closed.

quality_goals:
  - id: EK-QG-01
    statement: Unchanged Harness/process contracts are not physically re-read for every transaction.
  - id: EK-QG-02
    statement: Each transaction validates only what can affect its target outcome while reusing provably current evidence.
  - id: EK-QG-03
    statement: Evidence and lifecycle/state effects persist atomically with compare-and-swap conflict detection.
  - id: EK-QG-04
    statement: Runtime optimization never converts unknown freshness, authority or applicability into PASS.
  - id: EK-QG-05
    statement: Cost is observable separately for semantic work and transport/runtime plumbing.

kernel_components:
  - engine_bundle_builder
  - transaction_context_resolver
  - validation_plan_compiler
  - validation_executor
  - repository_transaction_writer
  - metrics_recorder

engine_bundle:
  purpose: >-
    Compile the stable Harness/process execution environment into one immutable, content-addressed
    manifest so ordinary transactions bind to one bundle identity instead of reopening every
    unchanged specification file.
  identity:
    bundle_id_format: harness-engine-bundle/<bundle_semver>/<content_digest>
    digest_algorithm: sha256-over-canonical-manifest
    immutable: true
  manifest_required:
    - bundle_schema_version
    - bundle_semver
    - contract_refs
    - exact_contract_fingerprints
    - lifecycle_schema_version
    - validation_profile_versions
    - deterministic_validator_versions
    - semantic_judge_versions
    - diagnostic_catalog_version
    - validation_plan_compiler_version
    - context_resolver_version
    - repository_writer_contract_version
  source_contracts:
    include_only_execution_relevant: true
    project_specific_product_truth_forbidden: true
    project_adapter_may_be_separate: true
  cache:
    reusable_across_transactions: true
    reusable_across_sessions: true
    authority_source: durable bundle manifest plus exact content digest
    invalidation:
      - any included contract fingerprint changes
      - required validator or judge version changes
      - compiler/resolver/writer contract version changes
      - bundle manifest fails self-validation
    forbidden:
      - trusting process semantics from chat/session memory
      - silently accepting a bundle whose digest cannot be reproduced
      - mutating a bundle in place
  transaction_binding:
    execution_basis_field: engine_bundle_id
    exact_manifest_digest_required: true
    individual_contract_versions_need_not_be_repeated_in_every_receipt_when_resolvable_from_bundle: true
    audit_rule: historical bundle manifests remain durable/resolvable

transaction_context_resolver:
  purpose: Resolve the minimum exact current context required by one Task Capsule inside its authority closure.
  initial_inputs:
    - active scope-state ref
    - task/gate/checkpoint id
    - engine_bundle_id
    - declared authority closure
  resolution_order:
    - read sole scope lifecycle state
    - resolve task target and lifecycle eligibility
    - resolve current target anchors/evidence directly referenced by state or target profile
    - resolve dependency/lineage refs lazily only when required by the compiled plan
    - resolve canonical project truth only for semantic work whose current evidence cannot be reused
  rules:
    - No global repository scan is part of ordinary transaction startup.
    - Current gate/checkpoint evaluation may consume current accepted anchors plus current receipts without reopening their source documents.
    - Anchor creation/change may require canonical source reads according to provenance/authority closure.
    - A ref outside the frozen authority closure returns authority-closure-expansion-required and stops semantic use.
    - Every actually consumed mutable ref enters the final execution basis with an exact fingerprint.
  output:
    - resolved_target
    - consumed_refs
    - consumed_fingerprints
    - reusable_evidence_candidates
    - unresolved_or_blocking_refs

validation_plan_compiler:
  purpose: >-
    Deterministically compile the minimal sufficient validator/judge plan from target kind,
    lifecycle state, engine bundle, target refs and current evidence.
  inputs:
    - engine_bundle_id
    - target_kind
    - target_id
    - scope_state_snapshot
    - resolved_target_refs
    - reusable_evidence_candidates
    - validation_profile_id
  output_required:
    - plan_id
    - plan_fingerprint
    - required_repository_reads
    - reused_evidence_refs
    - required_deterministic_checks
    - required_semantic_judges
    - required_commit_rechecks
    - mutation_targets
    - expected_state_effect_class
  evidence_reuse:
    allowed_only_when_all:
      - evidence target/ref resolves unambiguously
      - validated target fingerprint equals current target fingerprint
      - evidence dependency/authority basis is current for the intended reuse
      - evidence profile/spec/bundle compatibility is accepted
      - target lifecycle status permits reuse
      - no impact/dirty signal requires revalidation
    on_uncertain_reuse: run-required-validation-or-fail-closed
    prohibited:
      - treating a historical receipt as current because content looks similar
      - reusing gate sufficiency as anchor semantic acceptance
      - reusing current anchor acceptance as proof of a later gate without gate-specific checks
  gate_plan_rule: >-
    When current anchor receipts already prove anchor integrity, a gate plan performs current
    execution-basis, lifecycle/applicability, reference/authority/freshness and gate-precondition
    checks plus the gate-specific semantic judge; it does not re-run unrelated per-anchor stacks.
  change_set_rule: >-
    Coherent same-stage/same-scope anchor changes compile graph-level checks once and target-level
    schema/type/fingerprint checks per changed anchor as defined by the control plane.

validation_executor:
  rules:
    - Execute deterministic checks in compiled order; first blocking non-PASS stops semantic judging.
    - Execute only semantic judges named by the compiled plan and active bundle.
    - Judges cannot mutate anchors, state, authority or evidence.
    - Produce structured results sufficient for a canonical receipt without copying full catalogs.
  runtime_independence: >-
    The kernel contract does not require a specific LLM, SDK, agent framework or process host.

repository_transaction_writer:
  purpose: >-
    Persist one Harness transaction as one atomic repository state change rather than a sequence
    of Contents-API microcommits.
  request_required:
    - operation_id
    - execution_basis_fingerprint
    - expected_repository_head
    - expected_input_blob_fingerprints
    - creates
    - updates
    - deletes
    - resulting_scope_state_ref
  mutation_rule:
    - Build all new blobs/tree entries without moving the branch ref.
    - Recheck expected repository head and every mutable consumed input immediately before commit.
    - Create one coherent repository commit/tree containing all effects for the transaction.
    - Move the branch ref only if compare-and-swap expectations still hold.
    - On conflict, do not expose a partial transaction; return input-changed-before-commit or repository-head-conflict.
  idempotency:
    same_operation_same_basis_same_effects: return-existing-committed-result
    same_operation_different_basis: FAIL-operation-id-basis-conflict
    duplicate_evidence_creation: forbidden
  atomicity:
    partial_state_visible_on_working_branch: false
    evidence_without_state_effect_visible: false
    state_effect_without_evidence_visible: false
  commit_model:
    target: one-final-repository-commit-per-transaction
    note: >-
      The control plane permits a coherent repository revision to contain multiple completed
      transactions, but the minimum kernel does not depend on cross-transaction batching.
  adapter_requirements:
    git_native_preferred_capabilities:
      - create blobs without branch mutation
      - create tree from expected base tree
      - create commit from that tree
      - compare-and-swap branch ref
    contents_api_adapter: >-
      If an adapter can only create per-file commits, it must stage off-branch or synthesize a final
      atomic tree before moving the authoritative branch; temporary microcommits must not become
      the authoritative transaction history.

kernel_execution_loop:
  - step: resolve-bundle
    effect: verify/cache engine bundle
  - step: resolve-scope
    effect: read sole scope state and target eligibility
  - step: compile-plan
    effect: compile exact validation/read/mutation plan
  - step: resolve-context
    effect: lazily fetch only plan-required current refs inside authority closure
  - step: freeze-final-basis
    effect: bind scope state, consumed refs, engine bundle and plan fingerprints
  - step: validate-deterministic
    effect: fail closed on first blocking result
  - step: validate-semantic
    effect: run bounded required judges only
  - step: derive-state-effect
    effect: deterministic route/lifecycle effect
  - step: commit-recheck
    effect: re-resolve mutable consumed refs and repository head
  - step: atomic-persist
    effect: one writer request for evidence plus state/semantic mutations
  - step: record-metrics
    effect: persist or emit observable execution-cost metrics
  - step: continue-or-stop
    effect: new capsule only when control-plane continuation guards pass

observability:
  transaction_metrics:
    required:
      - operation_id
      - target_kind
      - engine_bundle_id
      - validation_plan_id
      - repository_reads
      - contract_file_reads
      - canonical_product_truth_reads
      - reusable_evidence_hits
      - deterministic_checks_run
      - semantic_judges_run
      - repository_write_attempts
      - final_repository_commits
      - conflict_retries
      - result
    optional:
      - connector_calls
      - cache_hits
      - cache_misses
      - bytes_read
      - wall_clock_ms
  privacy_rule: No private chain-of-thought or hidden reasoning is recorded.
  interpretation_rule: >-
    Semantic metrics and connector/transport metrics remain separate so tool limitations are not
    misdiagnosed as Harness semantic complexity.

performance_budgets:
  semantics: engineering-target-not-correctness-override
  ordinary_current_gate:
    repository_reads: {target_max: 5}
    contract_file_reads_with_cached_bundle: {target_max: 0}
    canonical_product_truth_reads: {target_max: 0}
    repository_write_attempts_without_conflict: {target_max: 1}
    final_repository_commits: {target_max: 1}
  budget_failure_effect: >-
    Record a performance regression finding. Never skip a required input/check/judge merely to
    satisfy the budget. Correct fail-closed execution takes precedence over cost targets.

h12_usage_before_runtime:
  runtime_available: false
  rule: >-
    H12 may continue using specification-guided manual execution under the control plane. This
    kernel specification is not executable and therefore cannot be claimed as realized cost savings.
  benchmark_use: >-
    Future manual H12 transactions may record the same metrics to validate whether the design is
    converging, but lack of the runtime kernel is not a reason to infer product/domain semantics.

conformance_cases:
  - id: EK-CF-BUNDLE-CONTENT-ADDRESSED
    critical: true
    given: {contract_fingerprint_changed: true, old_bundle_requested: true}
    expect: {old_bundle_mutated: false, new_bundle_required: true}
  - id: EK-CF-CACHED-BUNDLE-NO-CONTRACT-REREAD
    critical: false
    given: {bundle_digest_verified: true, bundle_cached: true, contracts_unchanged: true}
    expect: {individual_contract_file_reads_required: false}
  - id: EK-CF-REUSE-CURRENT-ANCHOR-EVIDENCE
    critical: true
    given: {anchor_fingerprint_current: true, evidence_basis_current: true, gate_target: true}
    expect: {full_anchor_validation_rerun_required: false, gate_specific_checks_required: true}
  - id: EK-CF-STALE-EVIDENCE-NOT-REUSED
    critical: true
    given: {evidence_basis_current: false}
    expect: {reuse_allowed: false, fail_closed_or_revalidate: true}
  - id: EK-CF-PLAN-DOES-NOT-SCAN-REPOSITORY
    critical: true
    given: {direct_refs_resolvable: true, graph_closure_known: true}
    expect: {global_repository_scan_required: false}
  - id: EK-CF-ATOMIC-WRITER-NO-PARTIAL-EVIDENCE
    critical: true
    given: {state_update_conflict: true, evidence_blob_prepared: true}
    expect: {authoritative_branch_partial_effect_visible: false, transaction_committed: false}
  - id: EK-CF-HEAD-CAS-CONFLICT
    critical: true
    given: {expected_head_matches: false}
    expect: {branch_ref_moved: false, result: repository-head-conflict}
  - id: EK-CF-IDEMPOTENT-REPLAY
    critical: true
    given: {same_operation_id: true, same_basis: true, same_effects: true, previously_committed: true}
    expect: {new_commit_created: false, existing_result_returned: true}
  - id: EK-CF-OPERATION-BASIS-CONFLICT
    critical: true
    given: {same_operation_id: true, same_basis: false}
    expect: {result: FAIL, diagnostic_code: operation-id-basis-conflict}
  - id: EK-CF-BUDGET-NEVER-OVERRIDES-CORRECTNESS
    critical: true
    given: {extra_required_read_needed: true, read_budget_would_be_exceeded: true}
    expect: {required_read_performed: true, performance_finding_recorded: true}

implementation_slices_for_h13:
  order:
    - engine-bundle-builder-and-self-validation
    - read-only-context-resolver
    - validation-plan-compiler
    - deterministic-validator-adapters
    - semantic-judge-adapter
    - atomic-repository-writer
    - orchestration-loop-and-metrics
  test_first_requirement: each slice starts from existing/new conformance cases before implementation
  technology_choice_deferred: true

exit_criteria_for_this_design:
  - The kernel can explain the observed H12 G0 execution without reloading canonical product docs.
  - Every optimization has an explicit fail-closed fallback.
  - One transaction can be represented as one atomic writer request and one final repository commit.
  - Engine bundle identity replaces repeated per-receipt contract-map duplication where resolvable.
  - Validation-plan compilation never treats evidence reuse as gate sufficiency proof.
  - Observable metrics distinguish semantic cost from connector/runtime cost.
  - No product/runtime/test/CI implementation is authorized or performed.

restrictions:
  product_implementation_created_or_changed: false
  executable_runtime_created_or_changed: false
  executable_tests_created_or_changed: false
  executable_validators_created_or_changed: false
  workflow_ci_created_or_changed: false
  h12_t3_started: false
  h13_started: false
  canonical_cutover_performed: false
  merge_performed: false
