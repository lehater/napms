version: 1
revision: 2
kind: lifecycle-state-machine
id: DOCS-V2-LIFECYCLE-STATE-MACHINE
status: active
owner_phase: H2
last_updated: 2026-09-17
purpose: >-
  Express design maturity from problem through implementation readiness. Lifecycle boundaries
  describe design guarantees, not agent sessions, Task Capsules, transactions or Git commits.
authority:
  integration_contract: docs-v2/spec/harness-control-plane.yaml
  defines: [S0-S4, S2-checkpoints, G0-G4-readiness, routing]
  does_not_define: [execution-units, task-capsules, operation-ids, execution-bases, commit-boundaries, product-domain-truth]
invariants:
  - Later design requires current applicable predecessor guarantees.
  - G2 requires all applicable S2 checkpoints.
  - Missing human-owned truth is never invented.
  - Deficiencies are corrected at their semantic owner rather than patched downstream.
  - Material upstream change invalidates only dependent downstream guarantees.
states:
  NOT_STARTED: no current design work
  IN_PROGRESS: design exists but readiness is not yet accepted
  BLOCKED: progress needs unavailable authority, evidence or human truth
  ACCEPTED: readiness guarantee is current
  DIRTY: accepted guarantee needs revalidation after dependency change
stage_order: [S0, S1, S2, S3, S4, IMPLEMENTATION]
stages:
  S0: {title: Problem / Evidence, owns: [problem, outcome, actors, constraints, evidence], gate: G0}
  S1: {title: Requirements, owns: [observable-behavior, quality-requirements, acceptance-intent], gate: G1}
  S2: {title: Domain Design, owns: [responsibilities, language, semantics, boundaries, processes, tactical-model], checkpoints: [S2-STRATEGIC, S2-PROCESS-DISCOVERY, S2-TACTICAL], gate: G2}
  S3: {title: Architecture, owns: [technical-realization, system-boundaries, technical-contracts, technical-decisions], gate: G3}
  S4: {title: Implementation Readiness, owns: [implementation-slice, dependencies, migration-intent, validation-intent, execution-order], gate: G4}
readiness_guarantees:
  G0: Problem and material constraints are bounded enough to derive requirements without invention.
  G1: Behavior and applicable qualities are explicit enough for domain design.
  S2-STRATEGIC: Strategic responsibilities and required boundaries are coherent.
  S2-PROCESS-DISCOVERY: Applicable temporal/process semantics are known before tactical design.
  S2-TACTICAL: Applicable invariants and tactical ownership follow from strategic/process design.
  G2: Complete applicable domain design is sufficient for architecture without inventing domain truth.
  G3: Architecture and contracts are sufficient to derive a concrete implementation-ready slice.
  G4: The selected implementation slice is sufficiently specified and verifiable.
readiness_evaluation:
  rule: >-
    Evaluate a gate/checkpoint when current design reaches that meaningful boundary. Readiness is
    logically distinct from artifact consistency, but may be evaluated and persisted in the same
    coherent work cycle.
  separate_execution_required: false
  pass_effect: [mark-owner-ACCEPTED, make-successor-eligible]
routing:
  PASS: continue when requested scope remains clear
  REWORK: correct current semantic owner
  REOPEN: reopen earlier semantic owner and invalidate dependent downstream design
  BLOCKED: persist known blocker and stop
  NEED_MORE_DATA: persist material human question and stop
continuation:
  successful_validation_or_gate_pass_requires_stop: false
  next_meaningful_design_work_may_continue: true
