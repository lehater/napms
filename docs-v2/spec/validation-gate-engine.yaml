h8_exit_evaluation:
  checks:
    - exact versioned execution-basis schema is defined
    - deterministic validation layers precede every semantic judge
    - H4 schema/type/applicability and H2 lifecycle legality are deterministic
    - H5 fingerprint/reference/graph/lineage/freshness validation is preserved
    - H7 question/response/materialization authority is validated before semantic sufficiency
    - semantic judges have bounded questions, declared inputs and bounded allowed outcomes
    - semantic judges cannot mutate truth/state or override deterministic findings
    - G0-G4 and S2 checkpoint validation profiles are explicit
    - validation/gate evidence is replayable and version-bound
    - exact input snapshot is rechecked before committing gate PASS
    - stable diagnostic codes are defined
    - G4 lease binds to exact current gate evidence/scope
    - idempotent persistence and operation-basis conflict behavior are defined
    - no new artifact type, H5 relation or H1/H2 transition class is introduced
    - no executable validator/test/runtime/CI/cutover is performed

handoff_to_h9:
  next_task: H9 Agent execution and context model v2
  required_behavior:
    - Task Capsule v2 carries H8 execution-basis inputs or enough durable refs to construct them deterministically
    - known facts are ACCEPTED/CURRENT refs only
    - allowed derivations are explicitly bounded by current task/profile
    - question/decision/example refs are selected from H7 durable state
    - context expansion is explicit and updates the execution basis before semantic work
    - agent/tool actions cannot mutate beyond H8/H9 declared authority
    - result persistence uses stable operation identity and H8 evidence/diagnostics

restrictions:
  executable_validators_created_or_changed: false
  executable_tests_created_or_changed: false
  runtime_implementation_created_or_changed: false
  workflow_ci_created_or_changed: false
  product_code_created_or_changed: false
  product_domain_cutover_performed: false
