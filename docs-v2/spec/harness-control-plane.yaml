version: 1
revision: 3
kind: harness-control-plane
id: DOCS-V2-HARNESS-CONTROL-PLANE
status: active
owner_phase: H12
owner_task: H12-P0-CORRECTION
last_updated: 2026-09-17

purpose: >-
  Keep Harness centered on design work. The unit visible to an agent is a design artifact,
  coherent design change set, human decision, or lifecycle readiness check. Reliability
  mechanics such as operation identities, execution-basis fingerprints, receipts and atomic
  persistence are implementation details and must not create extra design work.

authority:
  integration_precedence: >-
    This contract is the active integration interpretation for execution boundaries, gate
    execution, validation evidence, resume behavior and documentation migration authority.
    Component specifications remain authoritative for the design semantics they own, but clauses
    that require separate execution ceremony or treat frozen legacy docs/ as the current writable
    design authority are superseded by this control-plane interpretation.
  documentation_migration:
    evolving_authority: docs-v2/
    legacy_source: docs/
    legacy_status: frozen-read-only-migration-evidence
    rule: >-
      Accepted design produced or revalidated by the new Harness in docs-v2/ is current design truth
      for its migrated/affected scope. Legacy docs/ may supply provenance and evidence, but it cannot
      override accepted docs-v2 design merely because it is older or was previously canonical.
    reverse_sync: forbidden
    namespace_cutover:
      status: deferred
      target: {authoritative_docs: docs/, legacy_docs: docs-legacy/}
      rule: Perform the physical rename only as a controlled cutover after migration/stabilization.
  preserves:
    - S0 -> S1 -> S2 -> S3 -> S4 lifecycle order
    - G0-G4 readiness guarantees
    - machine-readable Design Anchors and typed relations
    - derivation lineage and provenance
    - DDD semantics and applicability
    - human-owned truth boundaries
    - deterministic structural/reference validation
    - stale-input detection and safe persistence
  does_not_define:
    - NAPMS product/domain/architecture truth by itself
    - new lifecycle stages or artifact types
    - executable runtime, tests, workflow or CI changes
    - product implementation authorization
    - physical namespace cutover authorization
    - merge authorization

core_rule:
  statement: >-
    Harness exists to move design from problem to implementation readiness. A reliability
    mechanism is not a design step. It may constrain or reject a design operation, but it must
    not require an additional user-visible task, checkpoint transaction, capsule or artifact
    unless that additional artifact carries independent design meaning.

work_model:
  visible_units: [design-artifact, coherent-design-change-set, human-decision-or-answer, lifecycle-readiness-check]
  ordinary_flow: >-
    Read the current design state, perform the next meaningful design work, validate what was
    changed, evaluate readiness when a stage/checkpoint boundary is reached, and persist the
    coherent result. Continue while the requested scope is clear and no real stop condition exists.
  forbidden_ceremony:
    - separate Task Capsule only because validation follows design creation
    - separate transaction only because a gate/checkpoint follows a completed design change
    - separate repository commit for validation evidence
    - mandatory stop after successful persistence
    - requiring an agent to manually construct operation IDs, fingerprints or execution-basis records
  gate_rule: >-
    A gate/checkpoint is a readiness decision at a meaningful lifecycle boundary. It remains
    logically distinct from artifact consistency validation, but it may be evaluated and persisted
    in the same coherent work cycle after its inputs are current. Separate execution is required
    only when a real stop condition or independent human authorization requires it.

progressive_rigor:
  rule: >-
    Apply the minimum validation sufficient for the risk and semantics of the current design work.
    Optional DDD work and expensive semantic checks run only when their applicability or the
    significance of the decision requires them.
  ordinary_anchor_or_change_set:
    required: [canonical-format-schema-integrity, stable-reference-resolution, required-lineage-provenance, semantic-consistency-when-material]
  lifecycle_boundary:
    additional: [readiness-sufficiency-check]
  high_risk_or_authority_boundary:
    additional_when_applicable: [explicit-human-authority, impact-freshness-analysis, exact-authorization-scope]
  no_global_preflight_rule: >-
    Do not revalidate unrelated Harness contracts, registries, graph regions or historical
    evidence for an ordinary operation when current reusable evidence already establishes them.

operational_internals:
  visibility: implementation-detail
  may_be_generated_or_managed_automatically: [operation_id, execution_basis, semantic_fingerprint, validator_and_spec_version_binding, validation_receipt, idempotency_key, atomic_repository_write, cache_or_engine_bundle]
  agent_contract: >-
    The agent supplies the design intent, semantic inputs, changed targets and any required human
    authority. Infrastructure derives operational identities and bookkeeping automatically.
  safety_invariants:
    - consumed semantic inputs must be current at decision/persistence time
    - retry must not duplicate semantic effects
    - conflicting concurrent input changes must fail rather than silently overwrite
    - generated operational metadata must not become a second source of product/domain truth

context_model:
  rule: >-
    Load current scope state, the design targets and direct semantic dependencies needed for the
    work. Resolve additional dependencies lazily when the graph shows they are relevant.
  legacy_read_rule: >-
    Read docs/ only when needed as migration evidence or provenance. Never edit it, never back-port
    corrected truth into it, and never use a contradictory legacy statement to override accepted
    docs-v2 truth in migrated/affected scope.
  no_capsule_requirement: >-
    A serialized Task Capsule is not required for ordinary design work. A runtime may generate a
    compact internal execution manifest when useful, but design progress and authority must remain
    recoverable from durable scope state and canonical artifacts without that manifest.
  authority_boundary: >-
    Access outside the allowed repository/project authority remains fail-closed. This safety
    boundary does not require predeclaring every file that may be read inside the already-authorized
    semantic dependency closure.

validation_model:
  order: [structural-and-reference-integrity, lineage-and-human-authority-when-applicable, semantic-consistency-when-material, lifecycle-readiness-at-boundary]
  reuse_rule: Current evidence for unchanged inputs is reused. Gate/checkpoint evaluation does not rerun unrelated per-anchor validation.
  evidence_rule: >-
    Persist the smallest evidence needed to explain the current accepted state and invalidate it
    when its semantic basis changes. Operational validator catalogs and complete execution bases
    may be generated internally and are not required as design artifacts.
  semantic_split:
    anchor_consistency: Check that changed design content follows accepted inputs and does not invent human-owned truth.
    lifecycle_readiness: Check that the applicable stage/checkpoint guarantee is sufficient to move forward.

state_ownership:
  scope_lifecycle_state:
    role: sole-writable-owner
    owns: [current-meaningful-design-work, stage-checkpoint-gate-states, blockers-and-blocking-questions, accepted-anchor-references, current-validation-readiness-evidence-when-useful]
  global_workstream_state:
    role: program-pointer-and-restrictions
    forbidden_duplicates: [scope-current-work, scope-stage-state, scope-gate-state]
  state_minimization_rule: >-
    Do not persist transaction/capsule bookkeeping in lifecycle state unless it is required to
    recover an interrupted unsafe write. Normal resume is from design state, not transaction history.

stop_conditions:
  mandatory: [route-NEED_MORE_DATA, route-BLOCKED, route-REOPEN, required-human-decision-missing, authorization-tool-boundary-not-granted, consumed-semantic-input-changed, requested-scope-complete]
  not_stops: [design-artifact-persisted, validation-PASS, checkpoint-PASS, G0-G3-PASS, eligible-next-design-work]

repository_rule:
  coherent_commit: >-
    One repository commit may contain the coherent design changes, their readiness result and
    state update. Git commits are persistence units, not design-semantic transaction boundaries.
  evolving_product_domain_authority: docs-v2/
  legacy_migration_source: docs/
  legacy_mutation: forbidden
  reverse_sync_to_legacy: forbidden
  namespace_cutover: deferred
  post_cutover_paths: {evolving_product_domain_authority: docs/, legacy_migration_source: docs-legacy/}

amendments:
  H1_H2:
    effective_rule: Interpret one-execution-unit and persist-and-stop scenarios as safety requirements for atomic persistence, not as a requirement to split adjacent design work and readiness checks.
  H8:
    effective_rule: Collapse ordinary validation to the minimal applicable checks in validation_model; detailed execution-basis and receipt schemas are runtime internals unless needed for a concrete failure.
  H9:
    effective_rule: Task Capsule v2 is no longer a mandatory design-work abstraction; agents do not create or manage capsules as workflow steps.
  H10:
    effective_rule: Preserve regression coverage for failures that can corrupt design truth or violate authority; transaction/capsule-shape conformance is not a product-quality goal by itself.
  H12:
    effective_rule: >-
      Continue the NAPMS pilot from current durable docs-v2 design state. Use frozen docs/ as migration
      evidence only. Do not create separate gate/checkpoint transactions merely to satisfy historical sequencing.

conformance_cases:
  - id: CP-CF-DESIGN-WORK-IS-PRIMARY
    given: {design_change_complete: true, readiness_check_due: true, real_stop_condition: false}
    expect: {separate_capsule_required: false, separate_transaction_required: false, continuation_allowed: true}
  - id: CP-CF-LEGACY-DOES-NOT-OVERRIDE
    given: {legacy_docs_statement_conflicts_with_accepted_docs_v2_truth: true, scope_migrated_or_affected: true}
    expect: {legacy_override_allowed: false, reverse_sync_required: false, docs_v2_remains_current: true}
  - id: CP-CF-LEGACY-IMMUTABLE
    given: {correction_discovered_during_migration: true}
    expect: {edit_legacy_docs: false, persist_correction_in_docs_v2: true}
  - id: CP-CF-NAMESPACE-CUTOVER-DEFERRED
    given: {migration_in_progress: true}
    expect: {rename_docs_now: false, target_names_preserved_for_later_cutover: true}
  - id: CP-CF-HUMAN-TRUTH-STILL-STOPS
    given: {required_human_owned_truth_missing: true}
    expect: {route: NEED_MORE_DATA, continuation_allowed: false}
  - id: CP-CF-STALE-INPUT-STILL-FAILS
    given: {consumed_semantic_input_changed_before_persist: true}
    expect: {persist_allowed: false}
