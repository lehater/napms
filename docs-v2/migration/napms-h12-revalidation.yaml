  disposition: MIGRATION_EVIDENCE
  target: H12 migration index/summary only
  after_h12: HISTORICAL_ONLY
- path: docs-v2/horizontal/gate-review.md
  disposition: HISTORICAL_ONLY
  target: none
  reason: Prior horizontal review is not redesigned H8 gate evidence.
- path: docs-v2/horizontal/s0/problem-landscape.md
  disposition: SPLIT_REDERIVE
  target_types:
  - problem-statement
  - constraint
  source_rule: Reconstruct from current S0-equivalent docs/ sources or H7 materialized authority.
- path: docs-v2/horizontal/s0/user-journeys.md
