version: 1
kind: napms-migration-revalidation-plan
id: DOCS-V2-NAPMS-H12-REVALIDATION
status: active
owner_phase: H12
owner_task: H12-T1
last_updated: 2026-09-17
purpose: Rebase the existing non-canonical NAPMS docs-v2 candidate material onto the redesigned H3-H11 Harness without treating old candidate files, product code, tests or legacy gate reviews as current design authority. Preserve docs/ as canonical until explicit cutover, reconstruct accepted Design Anchors and lineage from current documented truth and stakeholder decisions, execute the complete applicable S2 strategic/process/tactical sequence, and replace former horizontal/pilot G2 claims with redesigned checkpoint and gate evidence.
authority:
  direct_dependency:
    id: DOCS-V2-REPOSITORY-CI-ENFORCEMENT
    path: docs-v2/spec/repository-ci-enforcement.yaml
  required_contracts:
  - id: DOCS-V2-DDD-PIPELINE
    path: docs-v2/spec/ddd-pipeline.yaml
  - id: DOCS-V2-HUMAN-KNOWLEDGE-ACQUISITION
    path: docs-v2/spec/human-knowledge-acquisition.yaml
  - id: DOCS-V2-AGENT-EXECUTION-CONTEXT-V2
    path: docs-v2/spec/agent-execution-context-v2.yaml
  - id: DOCS-V2-HARNESS-EVALS-TRACING-REGRESSION
    path: docs-v2/spec/harness-evals-tracing-regression.yaml
  redesign_specs:
  - docs-v2/spec/design-anchor.yaml
  - docs-v2/spec/artifact-type-registry.yaml
  - docs-v2/spec/dependency-registry-impact.yaml
  - docs-v2/spec/design-derivation-lineage.yaml
  - docs-v2/spec/validation-gate-engine.yaml
  - docs-v2/spec/validation-engine-catalog.yaml
  historical_inputs:
  - docs-v2/migration/plan.md
  - docs-v2/horizontal/**
  - docs-v2/pilot/**
  - docs-v2/review/**
  defines:
  - H12 source-authority and migration-disposition rules
  - disposition of existing non-canonical NAPMS docs-v2 candidate material
  - bounded migration/revalidation sequence and task boundaries
  - first pilot scope under redesigned S2 checkpoints
  - H7 question routing for migration ambiguities
  - conditions for accepting new redesigned S2/G2 evidence
  - H12 completion and handoff criteria
  does_not_define:
  - new product/domain truth
  - new H4 artifact types or H5 relations
  - new lifecycle transitions
  - executable validators, tests, workflows or Harness runtime
  - product implementation
  - canonical docs-to-docs-v2 cutover
  - merge authorization
cutover_guard:
  current_product_domain_authority: docs/
  docs_v2_role: non-canonical migration/revalidation workspace
  canonical_cutover_authorized: false
  rule: Nothing produced by H12 changes canonical product/project authority. Candidate redesign anchors, checkpoint evidence and gate evidence remain non-canonical until a separately authorized cutover.
source_authority_policy:
  semantic_premise_order:
  - current accepted docs/ artifact owned by the applicable semantic stage
  - current accepted stakeholder decision materialized under H7
  - current external authoritative evidence when the owning contract permits it
  docs_v2_existing_candidate_role:
    allowed:
    - migration inventory
    - comparison target
    - hypothesis seed
    - provenance pointer to the docs/ source from which it was previously derived
    - evidence of a prior Harness/design-process defect
    forbidden:
    - direct promotion to ACCEPTED solely because a prior pilot/review said PASS
    - authority over conflicting current docs/
    - satisfying H5 derivation lineage without current accepted predecessors
    - satisfying H6 process-discovery requirements through an old tactical model
  product_code_and_tests:
    semantic_authority: forbidden
    allowed_role: implementation/realization evidence only after the owning design truth exists
    current_h12_use: excluded from migration design reconstruction
  current_green_legacy_harness_ci:
    redesigned_h4_h10_compliance_evidence: false
    reason_ref: DOCS-V2-REPOSITORY-CI-ENFORCEMENT.current_repository_observation.current_gaps.GAP-LEGACY-DOCS-V2-VALIDATOR
  conflict_rule:
  - classify the semantic owner of the conflicting propositions
  - later-stage material cannot silently rewrite earlier-stage truth
  - explicit current same-owner supersession may resolve a conflict when provenance is durable
  - otherwise route to H7 NEED_MORE_DATA rather than selecting the convenient proposition
migration_disposition_vocabulary:
  REBASE_FROM_DOCS:
    meaning: Preserve useful candidate intent only by reconstructing the new anchor from current authoritative docs/ inputs and H3-H7 lineage.
  SPLIT_REDERIVE:
    meaning: Existing file mixes multiple new owners/types; split and derive each target independently from accepted predecessors.
  REGENERATE_PROJECTION:
    meaning: Existing file is or becomes a noncanonical projection generated from accepted anchors/refs; it cannot own truth.
  REPLACE_WITH_H5_GRAPH:
    meaning: Existing hand-maintained trace/relationship file is replaced by H5 semantic refs/generated indexes or projections.
  REVALIDATE_AFTER_PROCESS:
    meaning: Existing tactical candidate is retained only as comparison/hypothesis until strategic and process-discovery checkpoints are accepted.
  HOLD_DOWNSTREAM:
    meaning: Existing S3/S4 candidate is not revalidated until the required redesigned upstream gate/checkpoint basis is current.
  MIGRATION_EVIDENCE:
    meaning: Retain temporarily as process/migration evidence; never use as product/domain semantic premise.
  HISTORICAL_ONLY:
    meaning: Prior review/gate/readiness result remains interpretable history but cannot satisfy current H8/H10 evidence.
  SUPERSEDED_META:
    meaning: Prior methodology/migration plan is historical input superseded by H0-H12 active contracts.
  RETIRE_AFTER_H12:
    meaning: Remove from the active candidate surface after equivalent current graph/projection/evidence is reconstructible; Git remains the archive.
candidate_dispositions:
