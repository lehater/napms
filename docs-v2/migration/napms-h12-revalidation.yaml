active_specs_excluded_from_candidate_migration:
  paths:
  - docs-v2/meta/**
  - docs-v2/spec/**
  rule: These are active Harness redesign contracts/state, not NAPMS product candidate artifacts.
selected_revalidation_scope:
  scope_id: H12-RC-CURATION-MVP
  name: Resource Catalogue curation / address-realization slice
  rationale:
  - already has accepted current docs/ product and domain sources
  - previous pilot gives comparison material without being authority
  - exercises observable S1 behavior, strategic ownership, temporal process behavior and tactical invariants
  - small enough for bounded Task Capsules
  - contains a known migration-risk boundary between older endpoint wording and current AddressSpace target semantics
  - does not require product implementation to reconstruct design truth
  authoritative_initial_sources:
    s1:
    - docs/requirements/catalogue-curation.md
    - docs/requirements/catalogue-curation-acceptance-examples.md
    - docs/requirements/catalogue-curation-security.md
    current_s2_reference_for_later_revalidation:
    - docs/domain/resource-catalogue/target-realization-model.md
    - docs/domain/resource-catalogue/tactical-model.md
  candidate_comparison_only:
  - docs-v2/pilot/materialized/requirements/functional/catalogue-curation.md
  - docs-v2/pilot/materialized/requirements/functional/catalogue-curation-acceptance.md
  - docs-v2/pilot/materialized/requirements/quality/catalogue-curation.md
  - docs-v2/pilot/materialized/domain/resource-catalogue/README.md
  - docs-v2/pilot/materialized/domain/resource-catalogue/domain-model.puml
  - docs-v2/pilot/catalogue-curation/s2-inventory.md
known_migration_risks:
- id: H12-RISK-S1-S2-ENDPOINT-ADDRESSSPACE
  owner_classification: must-be-determined-before-materialization
  finding: Accepted S1 catalogue-curation material uses Resource Endpoint/realization wording while current S2 Resource Catalogue target explicitly removes ResourceEndpoint identity and uses at most one effective AddressSpace at a logical time.
  deterministic_resolution_if: Current S1 behavior can be represented without asserting endpoint identity/cardinality and the difference is only solution/domain terminology.
  h7_required_if: Preserving or removing endpoint identity/cardinality changes observable S1 behavior or a human-owned product rule rather than merely normalizing terminology.
  forbidden_resolution: Let later S2 silently rewrite an earlier S1 requirement.
- id: H12-RISK-OLD-G2-SKIPPED-PROCESS
  finding: Previous horizontal/pilot G2 reasoning covered strategic or tactical classification but predates the mandatory applicable S2 Process Discovery checkpoint.
  effect: All former G2 PASS labels are historical only; redesigned G2 must be rebuilt.
- id: H12-RISK-TACTICAL-AS-PROCESS-SOURCE
  finding: Existing tactical model contains operations/invariants but cannot be used as the authority from which process truth is reverse-derived.
  effect: Process discovery uses accepted requirements/examples/journeys plus accepted strategic anchors; tactical candidate is comparison-only until S2-TACTICAL.
- id: H12-RISK-LEGACY-CI-NOT-NEW-EVIDENCE
  finding: Current make harness-check does not yet implement H4-H10 enforcement.
  effect: H12 validation may be specification/manual evidence only and must label enforcement status explicitly.
h12_task_sequence:
- id: H12-T1
  title: Inventory and migration/revalidation plan
  stage: META
  status_after_this_document: COMPLETE
  output: docs-v2/migration/napms-h12-revalidation.yaml
  semantic_mutation_of_product_truth: false
- id: H12-T2
  title: Reconstruct Resource Catalogue curation S0 basis
  stage: S0
  bounded_scope: H12-RC-CURATION-MVP
  primary_outcome: Materialize the minimum current problem statement, actor/goal journey and any applicable external/non-negotiable constraints for this scope from current authoritative docs/ wording, without importing S1/S2 solution semantics.
  input_policy:
    semantic_premises:
    - docs/requirements/catalogue-curation.md
    - docs/requirements/catalogue-curation-acceptance-examples.md
    docs_v2_old_candidates: comparison-only
    product_code_tests: forbidden
  required_checks:
  - classify semantic content by H4 owner rather than physical docs/requirements location
  - preserve examples as examples; do not generalize them into S0 facts without accepted basis
  - do not import Bounded Context, endpoint, AddressSpace, API or persistence design into the problem statement
  outputs_when_unblocked:
  - problem-statement
  - user-journey when actor/goal flow is materially supported
  - constraint only when a current external/nonnegotiable constraint is actually present
  - explicit migration provenance back to docs/ source revisions
  stop_conditions:
  - material S0 contradiction
  - human-owned problem/actor/goal truth is missing and non-derivable
  - source cannot establish provenance
  next_when_pass: H12-T3
- id: H12-T3
  title: Rebase Resource Catalogue curation S1 requirements
  stage: S1
  bounded_scope: H12-RC-CURATION-MVP
  prerequisite: H12-T2 accepted/current S0 basis
  primary_outcome: Materialize current observable functional/quality/acceptance/glossary truth for the selected RC curation slice from authoritative docs/ sources with H3/H5 lineage.
  semantic_premises:
  - accepted/current H12-T2 S0 anchors
  - docs/requirements/catalogue-curation.md
  - docs/requirements/catalogue-curation-acceptance-examples.md
  - docs/requirements/catalogue-curation-security.md
  old_docs_v2_role: comparison-only
  required_checks:
  - resolve H12-RISK-S1-S2-ENDPOINT-ADDRESSSPACE at the S1 owner boundary
  - preserve acceptance examples as examples unless a generalized rule is independently accepted
  - keep Authority Management mutation-admission behavior observable at S1 without transferring domain ownership
  outputs_when_unblocked:
  - functional-requirement
  - quality-requirement when applicable
  - acceptance-scenario
  - requirements-glossary when needed
  stop_conditions:
  - endpoint-versus-AddressSpace difference is a material S1 behavior choice not resolved by current S1 authority
  - current authoritative S1 sources conflict without accepted same-owner precedence
  - human-owned requirement choice is missing
  h7_route_on_stop: NEED_MORE_DATA with fixed owner S1 when human-owned/non-derivable
  next_when_pass: H12-T4
- id: H12-T4
  title: Reconstruct Resource Catalogue strategic S2
  stage: S2
  checkpoint: S2-STRATEGIC
  bounded_scope: H12-RC-CURATION-MVP
  primary_outcome: Derive current capability/subdomain/context ownership for the selected scope under H6 instead of promoting the old Resource Catalogue boundary by name.
  allowed_h6_rules:
  - DDD-MR-CAPABILITY-DISCOVERY
  - DDD-MR-SUBDOMAIN-DISTILLATION
  - DDD-MR-BOUNDED-CONTEXT-DERIVATION
  - DDD-MR-CONTEXT-RELATIONSHIP
  old_horizontal_strategic_model_role: hypothesis-and-comparison-only
  outputs_when_applicable:
  - capability-map
  - domain-distillation
  - bounded-context
  - context-relationship-map
  - domain-glossary
  stop_conditions:
  - boundary/prioritization choice lacks accepted basis or H7 authority
  - accepted S1 inputs become DIRTY
  next_when_pass: H12-T5
- id: H12-T5
  title: Resource Catalogue process discovery and stakeholder hotspots
  stage: S2
  checkpoint: S2-PROCESS-DISCOVERY
  bounded_scope: H12-RC-CURATION-MVP
  primary_outcome: Build the domain-process-model for the selected curation/address lifecycle from accepted S1 examples and accepted strategic boundaries, recording commands, domain events, policies, actors, temporal ordering, external interactions and aggregate candidates as hypotheses.
  semantic_premises:
  - accepted/current H12-T3 anchors
  - accepted/current H12-T4 anchors
  - current accepted stakeholder examples according to H7 example semantics
  forbidden_premise:
  - old tactical candidate as process authority
  - product code/tests
  h7_question_rule: Any non-derivable business policy, command/event meaning, lifecycle rule, invariant or boundary hotspot becomes one durable H7 question. The checkpoint remains blocked until each blocking answer is materialized into its fixed-owner anchor.
  outputs:
  - domain-process-model
  - updated domain-glossary when needed
  - domain-decision anchors for materialized S2 choices
  - durable H7 questions/hotspots when unresolved
  next_when_pass: H12-T6
- id: H12-T6
  title: Revalidate Resource Catalogue tactical S2
  stage: S2
  checkpoint: S2-TACTICAL
  bounded_scope: H12-RC-CURATION-MVP
  prerequisite: H12-T5 accepted/current or explicitly nonapplicable with accepted rationale
  primary_outcome: Derive tactical aggregates/entities/value objects/invariants/state semantics from the accepted strategic/process basis, then compare the result with the old pilot/current docs tactical model without allowing the comparison target to define the derivation.
  comparison_sources:
  - docs/domain/resource-catalogue/target-realization-model.md
  - docs/domain/resource-catalogue/tactical-model.md
  - docs-v2/pilot/materialized/domain/resource-catalogue/domain-model.puml
  - docs-v2/pilot/materialized/domain/resource-catalogue/README.md
  required_guards:
  - aggregate boundary justified by requirement/process/invariant basis
  - candidate aggregate hypothesis alone is insufficient
  - every invariant has accepted authority/lineage
  - current docs/ semantics that cannot be reproduced from the redesigned basis become an explicit finding, never silently discarded
  - process finding that invalidates the strategic boundary routes strategic rework
  outputs:
  - domain-model
  - state-model when applicable
  - domain-glossary
  - domain-decision when needed
  next_when_pass: H12-T7
- id: H12-T7
  title: Build redesigned S2 checkpoint and G2 evidence
  stage: S2
  task_kind: checkpoint-and-gate-evaluation
  bounded_scope: H12-RC-CURATION-MVP
  prerequisites:
  - applicable S2-STRATEGIC evidence current
  - applicable S2-PROCESS-DISCOVERY evidence current
  - applicable S2-TACTICAL evidence current
  - no blocking H7 questions
  - H5 lineage backward-explainable to accepted roots
  primary_outcome: Replace former horizontal/pilot G2 labels with H8-shaped evidence over the redesigned three-checkpoint S2 basis.
  evidence_status_rule: Until H11 executable enforcement exists, explicitly distinguish manual/specification revalidation from executable repository enforcement. Do not cite the current legacy harness-check as H4-H10 compliance evidence.
  pass_effect:
  - former horizontal/pilot G2 evidence remains historical
  - new H8-compatible candidate G2 evidence becomes the only redesigned G2 evidence for this scope
  - held S3 pilot candidates may enter a later revalidation task but are not auto-accepted
  next_when_pass: H12-T8
- id: H12-T8
  title: H12 migration closure review
  stage: META
  primary_outcome: Confirm the selected scope is reconstructible from redesigned accepted anchors and stakeholder decisions, all old candidate artifacts have durable dispositions, and H12 exit criteria are met.
  h12_phase_pass_requires:
  - H12-T2 through H12-T7 complete or explicitly routed/blocked with no false PASS
  - current selected-scope design backward-reconstructible without treating old docs-v2 candidate files as truth
  - former horizontal/pilot G2 labels replaced by redesigned evidence for the selected scope
  - all stakeholder decisions used by redesign are durable H7/H3 materializations
  - H11 enforcement implementation gap remains explicit if not separately authorized
  next_when_pass: H13
first_next_task_capsule_blueprint:
  task_id: H12-T2
  task_kind: revalidation-task
  stage: S0
  scope: H12-RC-CURATION-MVP
  primary_instruction:
    instruction_id: H12-REBASE-S0
    instruction_version: h12-v1
  targets:
  - target_kind: anchor
    target_id: H12-RC-CURATION-S0-BASIS
    intended_effect: create
  known_fact_source_policy:
    allowed:
    - docs/requirements/catalogue-curation.md
    - docs/requirements/catalogue-curation-acceptance-examples.md
    - current H3-H11 Harness contracts
    comparison_only:
    - existing docs-v2 horizontal/pilot candidate material
    forbidden_semantic_premise:
    - product code/tests
    - old candidate G0/G1/G2/G3 PASS labels
    - chat/session memory
  allowed_derivations:
  - owner-classify S0 problem/journey/constraint semantics according to H4
  - extract the minimum problem/actor/goal basis without importing solution/domain design
  - preserve concrete examples without automatic generalization
  tool_authority:
    allowed_action_classes:
    - read
    - search
    - validate
    - write-canonical-anchor
    - write-process-state
    prohibited_actions:
    - execute-implementation
    - modify-ci
    - merge
  stop_conditions:
  - current authoritative sources conflict on S0 problem/actor/goal truth
  - required S0 human-owned truth is missing and non-derivable
  - scope expands beyond Resource Catalogue curation slice
  next_task_hint: H12-T3 only after H12-T2 durable validation/persistence
h12_validation_model:
  deterministic:
  - every existing non-spec/meta docs-v2 candidate path identified by the H12 inventory has one disposition
  - no disposition promotes prior candidate PASS labels into current gate evidence
  - downstream S3/S4 candidates remain held until new G2
  - old traceability owners are replaced by H5 refs/projections, not duplicated
  - bounded migration capsules preserve single-stage/checkpoint execution
  - process discovery precedes tactical acceptance when applicable
  - docs/ remains canonical and product code/tests remain excluded as design truth
  semantic:
  - migration order preserves earliest semantic owner
  - selected scope is sufficiently narrow for one-task capsules
  - candidate comparison material cannot silently strengthen accepted current docs/
  execution_enforcement:
    current_status: specification/manual-only-for-redesigned-H4-H11-rules
    reason: H11 executable enforcement has not been authorized/implemented
    false_claim_forbidden: current legacy make harness-check proves redesigned compliance
conformance_cases:
- id: H12-CF-OLD-CANDIDATE-NOT-AUTHORITY
  oracle: deterministic
  given:
    old_docs_v2_candidate_pass: true
    current_docs_source_present: true
  expect:
    semantic_authority_source: current-docs
    direct_candidate_promotion: false
- id: H12-CF-CODE-NOT-MIGRATION-TRUTH
  oracle: deterministic
  given:
    docs_semantic_gap: true
    product_code_contains_plausible_rule: true
  expect:
    code_used_as_design_premise: false
- id: H12-CF-HORIZONTAL-G2-HISTORICAL
  oracle: deterministic
  given:
    old_horizontal_g2_label: PASS
    redesigned_process_checkpoint_missing: true
  expect:
    redesigned_g2_pass: false
- id: H12-CF-TACTICAL-WAITS-FOR-PROCESS
  oracle: deterministic
  given:
    process_discovery_applicable: true
    process_checkpoint_current: false
    old_tactical_candidate_present: true
  expect:
    tactical_acceptance_allowed: false
- id: H12-CF-ENDPOINT-CONFLICT-OWNER-FIRST
  oracle: semantic
  given:
    s1_endpoint_wording: true
    later_s2_addressspace_model: true
    observable_behavior_equivalence_derivable: false
  expect:
    later_s2_overwrites_s1: false
    route: NEED_MORE_DATA
- id: H12-CF-PROJECTION-REGENERATED
  oracle: deterministic
  given:
    legacy_context_map_projection_present: true
    accepted_new_context_anchors_changed: true
  expect:
    manual_projection_truth_preserved: false
    regenerate_from_current_anchors: true
- id: H12-CF-TRACE-REPLACED-BY-H5
  oracle: deterministic
  given:
    legacy_traceability_file_present: true
    h5_semantic_refs_available: true
  expect:
    second_trace_truth_owner_created: false
- id: H12-CF-S3-HELD-BEFORE-NEW-G2
  oracle: deterministic
  given:
