discovery_revalidation:
  status: ACCEPTED_FOR_CURRENT_SLICE
  source_authority: docs/
  source_refs:
    - docs/requirements/catalogue-curation.md
    - docs/requirements/catalogue-curation-acceptance-examples.md
    - docs/domain/capabilities.md
    - docs/domain/context-map.md
    - docs/domain/resource-catalogue/tactical-model.md
    - docs/domain/authority-management/README.md
    - docs/domain/application-deployment/README.md
    - docs/domain/application-communication-catalogue/README.md
  bounded_big_picture:
    product_outcome: >-
      A responsible admitted user can establish and maintain catalogue truth required for governed connectivity without
      direct SQL/seed edits, then use that truth in downstream Connectivity/Need/Policy/Checker/Realization workflows.
    surrounding_flow:
      - Resource catalogue truth is established and maintained in Resource Catalogue.
      - Application/Component communication meaning is established in Application Communication Catalogue.
      - Concrete ComponentDeployment-to-Resource truth is owned by Application Deployment in the current target domain model.
      - Catalogue mutation is admitted by Authority Management and responsibility metadata does not itself grant authority.
      - Downstream Business Connectivity, Access Policy and materialization/realization capabilities consume stable catalogue references/projections rather than owning catalogue truth.
    context_touchpoints:
      inside_current_slice: [Resource Catalogue, Authority Management admission]
      adjacent_not_designed_internally: [Application Communication Catalogue, Application Deployment, Business Connectivity, Access Policy, Required Policy Materialization, Checker/Realization workflows]
  slice_assessment:
    selected_outcome: >-
      Make one new or changed access-relevant Resource usable by supported NAPMS workflows through supported Resource
      Catalogue curation, with stable identity, current/historical realization, scope affiliation and responsibility facts,
      backend mutation admission, and inspectable current projection.
    result: CONFIRMED_WITH_PROCESS_REWORK
    rationale:
      - The outcome is independently meaningful: downstream workflows can discover/reference a curated Resource without SQL/seed edits.
      - It crosses a real context interaction with Authority Management rather than being a table/API/UI slice.
      - It exercises stable identity, temporal facts, missing-current-relation semantics, responsibility/authority separation and provenance.
      - It is narrower than the full I27 journey because ACC/AD/DCS authoring is a separate coherent catalogue outcome that later composes with RC truth.
      - The current process artifact does not yet cover enough behavior to justify Tactical DDD.
  process_coverage_gaps:
    - Current timeline is an onboarding happy path and incorrectly suggests realization, affiliation and responsibility are one mandatory linear sequence; accepted requirements allow missing current relations and independent later maintenance.
    - End/replace behavior is not modeled as explicit lifecycle alternatives even though historical facts must not be silently rewritten.
    - Inspect/current projection and the downstream handoff/use of the Resource are absent from the process narrative.
    - Authorization denial and domain/integrity conflict paths are not represented despite accepted requirements requiring backend admission and explicit validation/conflict failures.
    - Resource retirement exists in current canonical domain/acceptance material but is not required to complete this bounded curation outcome; it must not be silently added to the slice merely because the tactical model contains it.
  strategic_effect:
    result: NO_BOUNDARY_CONTRADICTION_FOUND
    rationale: >-
      Bounded discovery supports RC ownership of Resource identity/realization/scope/responsibility and AM ownership of
      mutation admission. Adjacent ACC/AD ownership confirms that the RC slice should expose Resource identity/projection
      for composition rather than absorb application/deployment semantics.
    revalidation_rule: Keep strategic anchors current unless process rework exposes a concrete contradiction.
