      name: Admitted catalogue curator
      role: Authenticated actor admitted to catalogue-wide Resource Catalogue curation
      origin_class: accepted-requirement
  commands:
    - {command_id: CMD-REGISTER-RESOURCE, name: Register Resource, target_context_ref: {anchor_id: NAPMS-S2-BC-RESOURCE-CATALOGUE}, intent: Create a stable access-relevant Resource identity with required provenance., actor_ref: ACTOR-CURATOR, origin_class: accepted-requirement}
    - {command_id: CMD-ADD-REALIZATION, name: Add Resource Realization, target_context_ref: {anchor_id: NAPMS-S2-BC-RESOURCE-CATALOGUE}, intent: Add a time-qualified technical realization version with one or more technical addresses., actor_ref: ACTOR-CURATOR, origin_class: accepted-requirement}
    - {command_id: CMD-END-REALIZATION, name: End Resource Realization, target_context_ref: {anchor_id: NAPMS-S2-BC-RESOURCE-CATALOGUE}, intent: End an existing time-qualified realization without rewriting history., actor_ref: ACTOR-CURATOR, origin_class: accepted-requirement}
    - {command_id: CMD-AFFILIATE-SCOPE, name: Affiliate Resource With Responsibility Scope, target_context_ref: {anchor_id: NAPMS-S2-BC-RESOURCE-CATALOGUE}, intent: Add a time-qualified Resource Scope Affiliation., actor_ref: ACTOR-CURATOR, origin_class: accepted-requirement}
    - {command_id: CMD-END-SCOPE-AFFILIATION, name: End Resource Scope Affiliation, target_context_ref: {anchor_id: NAPMS-S2-BC-RESOURCE-CATALOGUE}, intent: End an existing scope affiliation without changing Resource identity., actor_ref: ACTOR-CURATOR, origin_class: accepted-requirement}
    - {command_id: CMD-ASSIGN-RESPONSIBILITY, name: Assign Resource Responsibility, target_context_ref: {anchor_id: NAPMS-S2-BC-RESOURCE-CATALOGUE}, intent: Assign an extensible responsibility role to a supported responsible party for a time-qualified period., actor_ref: ACTOR-CURATOR, origin_class: human-decision}
    - {command_id: CMD-END-RESPONSIBILITY, name: End Resource Responsibility, target_context_ref: {anchor_id: NAPMS-S2-BC-RESOURCE-CATALOGUE}, intent: End a responsibility assignment while preserving its history., actor_ref: ACTOR-CURATOR, origin_class: human-decision}
  domain_events:
    - {event_id: EVT-RESOURCE-REGISTERED, name: Resource Registered, context_ref: {anchor_id: NAPMS-S2-BC-RESOURCE-CATALOGUE}, fact_meaning: A Resource identity now exists with its provenance., origin_class: accepted-requirement, caused_by_command_ref: CMD-REGISTER-RESOURCE}
    - {event_id: EVT-REALIZATION-ADDED, name: Resource Realization Added, context_ref: {anchor_id: NAPMS-S2-BC-RESOURCE-CATALOGUE}, fact_meaning: A time-qualified technical realization version was added to the Resource., origin_class: accepted-requirement, caused_by_command_ref: CMD-ADD-REALIZATION}
    - {event_id: EVT-REALIZATION-ENDED, name: Resource Realization Ended, context_ref: {anchor_id: NAPMS-S2-BC-RESOURCE-CATALOGUE}, fact_meaning: A time-qualified technical realization ceased to be effective without erasing its history., origin_class: accepted-requirement, caused_by_command_ref: CMD-END-REALIZATION}
    - {event_id: EVT-SCOPE-AFFILIATED, name: Resource Scope Affiliated, context_ref: {anchor_id: NAPMS-S2-BC-RESOURCE-CATALOGUE}, fact_meaning: A time-qualified Responsibility Scope affiliation was added to the Resource., origin_class: accepted-requirement, caused_by_command_ref: CMD-AFFILIATE-SCOPE}
    - {event_id: EVT-SCOPE-AFFILIATION-ENDED, name: Resource Scope Affiliation Ended, context_ref: {anchor_id: NAPMS-S2-BC-RESOURCE-CATALOGUE}, fact_meaning: A Responsibility Scope affiliation ceased to be effective without changing Resource identity., origin_class: accepted-requirement, caused_by_command_ref: CMD-END-SCOPE-AFFILIATION}
    - {event_id: EVT-RESPONSIBILITY-ASSIGNED, name: Resource Responsibility Assigned, context_ref: {anchor_id: NAPMS-S2-BC-RESOURCE-CATALOGUE}, fact_meaning: A responsible party now holds the specified responsibility role for the applicable time interval., origin_class: human-decision, caused_by_command_ref: CMD-ASSIGN-RESPONSIBILITY}
    - {event_id: EVT-RESPONSIBILITY-ENDED, name: Resource Responsibility Ended, context_ref: {anchor_id: NAPMS-S2-BC-RESOURCE-CATALOGUE}, fact_meaning: A responsibility assignment ceased to be effective while its historical fact remains., origin_class: human-decision, caused_by_command_ref: CMD-END-RESPONSIBILITY}
  policies: []
  timeline:
    - {step_id: T1, sequence: 1, kind: external-system, item_ref: EXT-AUTHORITY-MANAGEMENT}
