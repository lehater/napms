    - {step_id: T6, sequence: 6, kind: command, item_ref: CMD-AFFILIATE-SCOPE}
    - {step_id: T7, sequence: 7, kind: domain-event, item_ref: EVT-SCOPE-AFFILIATED}
    - {step_id: T8, sequence: 8, kind: command, item_ref: CMD-ASSIGN-RESPONSIBILITY}
    - {step_id: T9, sequence: 9, kind: domain-event, item_ref: EVT-RESPONSIBILITY-ASSIGNED}
  external_systems:
    - external_system_id: EXT-AUTHORITY-MANAGEMENT
      name: Authority Management
      interaction_meaning: Admits or denies each protected Resource Catalogue mutation for the authenticated Actor using the fixed MVP catalogue-wide curation action/scope.
      origin_class: human-decision
  hotspots:
    - {hotspot_id: HOTSPOT-SCOPED-AUTHORIZATION, question_or_uncertainty: How should authorization be scoped to subsets of Resources if a future confirmed customer requirement needs it?, owner_kind: stakeholder, blocking: false, status: deferred-nonblocking}
    - {hotspot_id: HOTSPOT-MANDATORY-RESPONSIBILITY-COVERAGE, question_or_uncertainty: Do any responsibility roles become mandatory for a Resource and are temporary gaps or overlaps during responsibility transfer forbidden?, owner_kind: stakeholder, blocking: false, status: deferred-nonblocking}
  candidate_aggregates:
