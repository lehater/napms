      context_ref: {anchor_id: NAPMS-S2-BC-RESOURCE-CATALOGUE}
      command_refs: [CMD-REGISTER-RESOURCE, CMD-ADD-REALIZATION, CMD-END-REALIZATION, CMD-AFFILIATE-SCOPE, CMD-END-SCOPE-AFFILIATION, CMD-ASSIGN-RESPONSIBILITY, CMD-END-RESPONSIBILITY]
      event_refs: [EVT-RESOURCE-REGISTERED, EVT-REALIZATION-ADDED, EVT-REALIZATION-ENDED, EVT-SCOPE-AFFILIATED, EVT-SCOPE-AFFILIATION-ENDED, EVT-RESPONSIBILITY-ASSIGNED, EVT-RESPONSIBILITY-ENDED]
      consistency_boundary_rationale: Commands and temporal facts are centered on continuity of one Resource identity, but exact aggregate boundaries remain a Tactical DDD hypothesis.
      status: candidate
