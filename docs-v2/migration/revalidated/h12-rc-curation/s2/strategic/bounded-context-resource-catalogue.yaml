canonical_payload:
  name: Resource Catalogue
  purpose: Own the access-domain meaning and lifecycle of Resources and the Resource catalogue facts needed by downstream NAPMS workflows.
  responsibility:
  - Resource identity and lifecycle
  - time-qualified technical realization information for a Resource
  - Resource Scope Affiliation
  - Resource Responsibility and operational contact facts
  boundary_basis:
    cohesion_rationale: 'These concepts change around one Resource identity and use a cohesive catalogue language: what Resource exists, how it is technically realized over time, and which scope/responsibility facts describe it.'
    separation_rationale: 'Actor/action admission is not Resource catalogue truth: Resource ownership, scope affiliation, responsibility and visibility never grant mutation permission by themselves. Authority Management therefore remains outside this model boundary.'
    rejected_boundary_alternatives:
    - merge Authority Management admission semantics into Resource Catalogue
    - treat UI/workspace or persistence boundaries as the domain boundary
  capability_selectors:
  - {anchor_id: NAPMS-S2-RC-CAPABILITY-MAP, item_id: CAP-RC-RESOURCE-CURATION}
  model_language_ownership:
    owned_terms_or_model_scope: [Resource, Resource technical realization, Resource Scope Affiliation, Resource Responsibility]
    explicitly_external_terms: [Actor, Action, Effective Authority, ResponsibilityScopeRef identity/authority semantics]
  logical_derivation:
    basis_refs:
    - {kind: anchor-current, anchor_id: NAPMS-S2-RC-CAPABILITY-MAP, item_id: CAP-RC-RESOURCE-CURATION}
    - {kind: anchor-current, anchor_id: NAPMS-S1-RC-CURATION-BEHAVIOR}
    - {kind: anchor-current, anchor_id: NAPMS-S1-RC-CURATION-INTEGRITY}
    - {kind: anchor-current, anchor_id: NAPMS-S1-RC-CURATION-AUTHORIZATION}
    derivation_kind: synthesis
    rationale: The accepted Resource-curation capability is cohesive around Resource catalogue language and lifecycle. The explicit S1 authority separation supplies a stable model boundary against Authority Management; no code/service/database boundary is used.
    method_rule_ids: [DDD-MR-BOUNDED-CONTEXT-DERIVATION]
