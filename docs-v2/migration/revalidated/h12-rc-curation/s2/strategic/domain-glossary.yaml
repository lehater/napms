canonical_payload:
  terms:
  - term_id: TERM-RESOURCE
    term: Resource
    definition: An access-relevant catalogue identity whose existence is independent from whether current realization, scope-affiliation or responsibility facts are present.
    context_ref: {anchor_id: NAPMS-S2-BC-RESOURCE-CATALOGUE}
    source_selectors: [{anchor_id: NAPMS-S1-RC-CURATION-BEHAVIOR}]
  - term_id: TERM-RESOURCE-REALIZATION
    term: Resource technical realization
    definition: Time-qualified technical realization information attached to a Resource. Curation adds/ends/replaces realization versions; current S1 permits a new version to carry one or more technical addresses.
    context_ref: {anchor_id: NAPMS-S2-BC-RESOURCE-CATALOGUE}
    source_selectors: [{anchor_id: NAPMS-S1-RC-CURATION-BEHAVIOR}, {anchor_id: NAPMS-S1-RC-CURATION-INTEGRITY}]
  - term_id: TERM-RESOURCE-SCOPE-AFFILIATION
    term: Resource Scope Affiliation
    definition: A time-qualified Resource Catalogue fact associating a Resource with a Responsibility Scope reference; the affiliation is catalogue business data and does not grant curation authority.
    context_ref: {anchor_id: NAPMS-S2-BC-RESOURCE-CATALOGUE}
    source_selectors: [{anchor_id: NAPMS-S1-RC-CURATION-BEHAVIOR}, {anchor_id: NAPMS-S1-RC-CURATION-AUTHORIZATION}]
  - term_id: TERM-RESOURCE-RESPONSIBILITY
    term: Resource Responsibility
    definition: A Resource Catalogue fact recording supported operational person/team responsibility or contact roles for a Resource; responsibility is not mutation permission.
    context_ref: {anchor_id: NAPMS-S2-BC-RESOURCE-CATALOGUE}
    source_selectors: [{anchor_id: NAPMS-S1-RC-CURATION-BEHAVIOR}, {anchor_id: NAPMS-S1-RC-CURATION-AUTHORIZATION}]
  - term_id: TERM-EFFECTIVE-AUTHORITY
    term: Effective Authority
    definition: Authority Management's effective determination of whether an Actor may perform an Action for the applicable scope and effective time; catalogue facts do not substitute for this determination.
    context_ref: {anchor_id: NAPMS-S2-BC-AUTHORITY-MANAGEMENT}
    source_selectors: [{anchor_id: NAPMS-S1-RC-CURATION-AUTHORIZATION}]
  - term_id: TERM-RESPONSIBILITY-SCOPE-REF
    term: ResponsibilityScopeRef
    definition: A shared correlation reference used by catalogue affiliation and authority semantics. Its use does not create a separate bounded context and it is not itself a permission.
    context_ref: {anchor_id: NAPMS-S2-BC-AUTHORITY-MANAGEMENT}
    source_selectors: [{anchor_id: NAPMS-S1-RC-CURATION-AUTHORIZATION}]
  logical_derivation:
