anchor_id: NAPMS-S3-FIRST-MVP-SYSTEM-ARCHITECTURE
type_id: software-architecture
owner_stage: S3
scope: {scope_id: H18-FIRST-MVP-ARCHITECTURE, product_area: Complete first MVP journey, lifecycle_boundary: S3 Software Architecture / Solution Design}
status: CANDIDATE
canonical_payload:
  architecture_goal: Realize the complete accepted MVP journey on one frontend plus modular-monolith backend baseline, making system-wide technical choices once rather than independently per Bounded Context.
  system_shape:
    frontend: Single user-facing application for resource, application/component/interaction, deployment, connectivity need, policy change and policy export workflow.
    backend: Single deployable modular monolith containing domain-aligned modules and an application composition layer.
    deployment_units: [frontend, backend]
    rule: 'Bounded Context ownership guides backend module boundaries; it does not imply one service, process or network API per context.'
  backend_modules:
    resource_catalogue: {owns: Resource and current AddressSpace application/domain realization, domain_anchor: NAPMS-S2-BC-RESOURCE-CATALOGUE}
    application_communication_catalogue: {owns: 'ApplicationDefinition, Component, Interaction and immutable InteractionContractRevision realization', domain_anchor: NAPMS-S2-BC-APPLICATION-COMMUNICATION-CATALOGUE}
    application_deployment: {owns: ComponentDeployment realization and references to ACC Component and RC Resource, domain_anchor: NAPMS-S2-BC-APPLICATION-DEPLOYMENT}
    business_connectivity: {owns: BusinessProcess and ConnectivityNeed realization, domain_anchor: NAPMS-S2-BC-BUSINESS-CONNECTIVITY}
    access_policy: {owns: 'PolicyRule, RuleChange and current EffectivePolicyRule realization', domain_anchor: NAPMS-S2-BC-ACCESS-POLICY}
    policy_export_composition: {owns: No domain truth; orchestrates reads from owner modules to materialize complete vendor-neutral policy and render table/CSV projections, peer_bounded_context: false}
  interaction_rules:
    - Backend domain modules interact in-process through explicit module/application interfaces; HTTP is not an internal Bounded Context boundary.
    - Cross-module references use owner-defined identities and resolved semantics; consuming modules do not duplicate another module's mutable truth.
    - Policy export composition is read/orchestration logic and must not become an alternate owner of Resource, ACC, Deployment, Connectivity or Policy state.
    - Access Policy acceptance must validate exact deployment endpoints, exact immutable ACC revision and required current ConnectivityNeed basis through explicit module contracts.
    - Failure to resolve required materialization input propagates as Unresolved; the composition must not silently omit rows.
  frontend_backend_boundary:
    kind: system delivery boundary
    required_capabilities: [manage Resources and AddressSpace, manage Application/Components/Interactions and traffic revisions, manage ComponentDeployments, manage BusinessProcess/ConnectivityNeed, submit and decide RuleChange, view complete current vendor-neutral policy table, download same result as CSV]
    protocol: TBD during H18 contract design; one system-level choice, not one choice per module
  persistence:
    baseline: Backend modules own their persistence model and may share one physical database within the modular monolith while preserving logical ownership boundaries.
    cross_module_rule: No module directly mutates another module's owned tables/state; cross-module semantics pass through module contracts.
    technology: TBD; no database product selected by domain design.
  consistency:
    local: Aggregate invariants are enforced transactionally inside the owning module.
    cross_module: Cross-context validation uses explicit orchestration/contracts; do not manufacture distributed-service semantics inside the monolith.
    policy_acceptance: Formal Access Policy state transition is owned and committed by Access Policy after prerequisite semantic validation.
    export: 'Read composition may span modules; it returns Success with a complete result or Unresolved with explicit causes.'
  excluded_from_mvp_runtime: [Network Enforcement Placement, provider-specific rendering, Access Policy Realization, Network Environment Operations, Technical Access Evidence ingestion/recognition]
  architecture_questions_remaining:
    - {id: H18-Q1, question: Choose the concrete frontend-backend API style and contract representation., owner: architecture, blocking: S3 completion not current architecture baseline}
    - {id: H18-Q2, question: Choose persistence technology and module schema/migration convention., owner: architecture, blocking: S3 completion not current architecture baseline}
    - {id: H18-Q3, question: Define authorization integration at the frontend/backend use-case boundary using accepted Authority Management semantics., owner: architecture, blocking: S3 completion}
  logical_derivation:
    basis_refs: [{kind: anchor-current, anchor_id: NAPMS-S1-FIRST-MVP-POLICY-EXPORT}, {kind: anchor-current, anchor_id: NAPMS-S2-FIRST-MVP-JOURNEY-DOMAIN-MODEL}]
    derivation_kind: architecture-from-accepted-domain-slice
    rationale: Apply the roadmap-selected frontend plus modular-monolith baseline once to the whole accepted MVP journey while preserving domain ownership and avoiding per-context transport/deployment decisions.
