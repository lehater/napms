name: Unified Harness Integration

on:
  pull_request:
    paths:
      - ".harness-version"
      - "docs/canonical-graph.yaml"
      - "docs/harness-engineering-graph.yaml"
      - "docs/harness-projection.yaml"
      - "tools/check_harness_integration.py"
      - "tools/prepare_authority_execution.py"
      - ".github/workflows/unified-harness.yml"
  push:
    branches: [main]
    paths:
      - ".harness-version"
      - "docs/canonical-graph.yaml"
      - "docs/harness-engineering-graph.yaml"
      - "docs/harness-projection.yaml"
      - "tools/check_harness_integration.py"
      - "tools/prepare_authority_execution.py"
      - ".github/workflows/unified-harness.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NAPMS
        uses: actions/checkout@v5

      - name: Read pinned Harness version
        id: harness-version
        run: echo "sha=$(cat .harness-version)" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Harness
        uses: actions/checkout@v5
        with:
          repository: lehater/harness
          ref: ${{ steps.harness-version.outputs.sha }}
          path: .harness-tool

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"

      - name: Install runtime dependency
        run: python -m pip install PyYAML

      - name: Validate NAPMS through canonical Harness
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/check_harness_integration.py

      - name: Validate capability-scoped Authority context
        env:
          HARNESS_ROOT: .harness-tool
        run: |
          python tools/prepare_authority_execution.py             SYSTEM-ARCHITECTURE             --capability engineering.architecture.rules             --check-write docs/architecture/mvp-system-rules.yaml             > /tmp/system-context.json
