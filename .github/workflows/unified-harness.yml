name: Unified Harness Integration

on:
  pull_request:
    paths:
      - ".harness-version"
      - ".harness-version"
      - "docs/canonical-graph.yaml"
      - "docs/harness-core.yaml"
      - "docs/harness-engineering-graph.yaml"
      - "tools/check_harness_vertical.py"
      - "tools/test_unified_harness_migration.py"
      - ".github/workflows/unified-harness.yml"
  push:
    branches: [main]
    paths:
      - "docs/canonical-graph.yaml"
      - "docs/harness-core.yaml"
      - "docs/harness-engineering-graph.yaml"
      - ".github/workflows/unified-harness.yml"

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NAPMS
        uses: actions/checkout@v5

      - name: Read pinned Harness version
        id: harness-version
        run: echo "sha=$(cat .harness-version)" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Harness
        uses: actions/checkout@v5
        with:
          repository: lehater/harness
          ref: ${{ steps.harness-version.outputs.sha }}
          path: .harness-tool

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"

      - name: Install runtime dependency
        run: python -m pip install PyYAML

      - name: Run legacy NAPMS evaluator
        run: python tools/check_harness_vertical.py

      - name: Validate unified Engineering Graph
        run: python .harness-tool/engineering_graph.py validate docs/harness-engineering-graph.yaml

      - name: Validate canonical graph alignment and derive Core
        run: |
          python .harness-tool/integration_alignment.py             docs/canonical-graph.yaml             docs/harness-core.yaml             docs/harness-engineering-graph.yaml             --output-core /tmp/napms-core.yaml

      - name: Evaluate backend and frontend consumers
        run: |
          python .harness-tool/engineering_graph.py evaluate             docs/harness-engineering-graph.yaml             BACKEND-IMPLEMENTATION             /tmp/napms-core.yaml > /tmp/backend.json
          python .harness-tool/engineering_graph.py evaluate             docs/harness-engineering-graph.yaml             FRONTEND-IMPLEMENTATION             /tmp/napms-core.yaml > /tmp/frontend.json
          python - <<'PY'
          import json
          backend = json.load(open("/tmp/backend.json"))
          frontend = json.load(open("/tmp/frontend.json"))
          assert backend["status"] == "COMPLETE", backend
          assert frontend["status"] == "READY", frontend
          assert {item["capability"] for item in frontend["create"]} == {
              "engineering.frontend.human-interface"
          }, frontend
          PY

      - name: Run migration mutation differential
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/test_unified_harness_migration.py

      - name: Prove capability-scoped Authority context
        run: |
          python .harness-tool/authority_context.py             docs/harness-engineering-graph.yaml             /tmp/napms-core.yaml             SYSTEM-ARCHITECTURE             --capability engineering.architecture.rules > /tmp/system-context.json
          python - <<'PY'
          import json
          ctx = json.load(open("/tmp/system-context.json"))
          assert ctx["status"] == "READY", ctx
          assert ctx["selected_outputs"] == ["engineering.architecture.rules"], ctx
          assert "docs/architecture/mvp-system-rules.yaml" in ctx["access"]["write"], ctx
          PY
