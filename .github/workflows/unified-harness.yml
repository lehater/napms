name: Unified Harness Integration

on:
  pull_request:
    paths:
      - ".harness-version"
      - "docs/canonical-graph.yaml"
      - "docs/harness-engineering-graph.yaml"
      - "docs/harness-projection.yaml"
      - "tools/check_harness_integration.py"
      - "tools/prepare_authority_execution.py"
      - ".github/ci-impact.json"
      - "tools/ci_impact.py"
      - ".github/workflows/unified-harness.yml"
  push:
    branches: [main]
    paths:
      - ".harness-version"
      - "docs/canonical-graph.yaml"
      - "docs/harness-engineering-graph.yaml"
      - "docs/harness-projection.yaml"
      - "tools/check_harness_integration.py"
      - "tools/prepare_authority_execution.py"
      - ".github/ci-impact.json"
      - "tools/ci_impact.py"
      - ".github/workflows/unified-harness.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NAPMS
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select incremental Harness integration checks
        id: impact
        run: >-
          python tools/ci_impact.py
          --group unified_harness
          --github-output "$GITHUB_OUTPUT"

      - name: Read pinned Harness version
        if: steps.impact.outputs.unified_harness == 'true'
        id: harness-version
        run: echo "sha=$(cat .harness-version)" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Harness
        if: steps.impact.outputs.unified_harness == 'true'
        uses: actions/checkout@v5
        with:
          repository: lehater/harness
          ref: ${{ steps.harness-version.outputs.sha }}
          path: .harness-tool

      - uses: actions/setup-python@v6
        if: steps.impact.outputs.unified_harness == 'true'
        with:
          python-version: "3.14.7"

      - name: Install runtime dependency
        if: steps.impact.outputs.unified_harness == 'true'
        run: python -m pip install PyYAML

      - name: Validate NAPMS through canonical Harness
        if: steps.impact.outputs.unified_harness == 'true'
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/check_harness_integration.py

      - name: Diagnose backend graph health
        if: steps.impact.outputs.unified_harness == 'true'
        run: |
          python .harness-tool/graph_doctor.py \
            docs/harness-engineering-graph.yaml \
            --source-graph docs/canonical-graph.yaml \
            --projection docs/harness-projection.yaml \
            --target BACKEND-IMPLEMENTATION \
            --source-root .

      - name: Diagnose frontend graph health
        if: steps.impact.outputs.unified_harness == 'true'
        run: |
          python .harness-tool/graph_doctor.py \
            docs/harness-engineering-graph.yaml \
            --source-graph docs/canonical-graph.yaml \
            --projection docs/harness-projection.yaml \
            --target FRONTEND-IMPLEMENTATION \
            --source-root .

      - name: Validate capability-scoped Authority context
        if: steps.impact.outputs.unified_harness == 'true'
        env:
          HARNESS_ROOT: .harness-tool
        run: |
          python tools/prepare_authority_execution.py             SYSTEM-ARCHITECTURE             --capability engineering.architecture.rules             --check-write docs/architecture/mvp-system-rules.yaml             > /tmp/system-context.json
