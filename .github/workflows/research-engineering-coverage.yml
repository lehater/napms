name: Research Engineering Coverage

on:
  push:
    branches:
      - research/hierarchical-coverage-map
    paths:
      - "docs/**"
      - ".github/workflows/research-engineering-coverage.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/research-engineering-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NAPMS
        uses: actions/checkout@v5

      - name: Checkout Harness coverage research
        uses: actions/checkout@v5
        with:
          repository: lehater/harness
          ref: research/hierarchical-engineering-concerns-v1
          path: .harness-coverage-tool

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"

      - name: Install runtime dependency
        run: python -m pip install PyYAML

      - name: Evaluate backend coverage
        run: |
          python .harness-coverage-tool/engineering_coverage.py             docs/harness-engineering-graph.yaml             docs/harness-projection.yaml             BACKEND-IMPLEMENTATION             --canonical-source docs/canonical-graph.yaml             --scope first-mvp             --authority-aliases docs/research/authority-role-aliases-v1.yaml             --overlay docs/research/concern-activation-overlay-v1.yaml             --semantic-claim-bindings docs/research/semantic-claim-bindings-v1.yaml             > /tmp/backend-coverage.json

      - name: Evaluate frontend coverage
        run: |
          python .harness-coverage-tool/engineering_coverage.py             docs/harness-engineering-graph.yaml             docs/harness-projection.yaml             FRONTEND-IMPLEMENTATION             --canonical-source docs/canonical-graph.yaml             --scope first-mvp             --authority-aliases docs/research/authority-role-aliases-v1.yaml             --overlay docs/research/concern-activation-overlay-v1.yaml             --semantic-claim-bindings docs/research/semantic-claim-bindings-v1.yaml             > /tmp/frontend-coverage.json

      - name: Inspect Coverage frontier
        run: |
          python - <<'PY'
          import json
          from collections import Counter

          with open("/tmp/backend-coverage.json", encoding="utf-8") as f:
              backend = json.load(f)
          with open("/tmp/frontend-coverage.json", encoding="utf-8") as f:
              frontend = json.load(f)

          for name, result in (("backend", backend), ("frontend", frontend)):
              assert result["kind"] == "harness-engineering-coverage-evaluation"
              assert result["remaining_work_count"] == len(result["remaining_work"])
              assert result["work_item_count"] == len(result["work_items"])
              print(
                  name,
                  result["activated_count"],
                  "activated /",
                  result["remaining_work_count"],
                  "remaining / completion=",
                  result["completion_ready"],
              )
              print(
                  name,
                  "actions:",
                  dict(Counter(item["action"] for item in result["work_items"])),
              )
              print(name, "question_frontier:", len(result["question_frontier"]))
              for item in result["work_items"]:
                  if item["action"] == "MODEL_PRODUCTION_CONTRACT":
                      print(
                          " ",
                          name,
                          "MODEL_PRODUCTION_CONTRACT",
                          item["concern"],
                          "->",
                          ",".join(item["candidate_authorities"]),
                      )
                  elif item["action"] == "ASSIGN_AUTHORITY":
                      print(" ", name, "ASSIGN_AUTHORITY", item["concern"])
                  elif item["action"] == "PRODUCE_CAPABILITY":
                      print(
                          " ",
                          name,
                          "PRODUCE_CAPABILITY",
                          item["capability"],
                          "->",
                          item.get("authority"),
                          "[",
                          ",".join(item["concerns"]),
                          "]",
                      )
          PY
