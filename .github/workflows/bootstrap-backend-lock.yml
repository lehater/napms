name: bootstrap backend lock

on:
  push:
    branches:
      - implementation/first-mvp-rebuild
    paths:
      - "backend/pyproject.toml"
      - ".github/workflows/bootstrap-backend-lock.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/first-mvp-rebuild
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Generate backend lock
        run: |
          python -m pip install "pip-tools==7.6.1"
          python -m piptools compile backend/pyproject.toml \
            --extra dev \
            --extra runtime \
            --extra postgres \
            --resolver=backtracking \
            --output-file backend/requirements.lock
      - name: Commit backend lock
        run: |
          if git diff --quiet -- backend/requirements.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/requirements.lock
          git commit -m "chore: refresh backend dependency lock"
          git push origin HEAD:implementation/first-mvp-rebuild
