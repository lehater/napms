name: core gate

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - "src/**"
      - "tests/access_policy/**"
      - "tests/application_catalogue/**"
      - "tests/authority_management/**"
      - "tests/runtime/**"
      - "tests/architecture/**"
      - "pyproject.toml"
      - "web/**"
      - "Makefile"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: make test
