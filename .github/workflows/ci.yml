name: core gate

on:
  push:
    branches: [main]
    paths:
      - "backend/src/**"
      - "backend/tests/**"
      - "backend/pyproject.toml"
      - "Makefile"
      - ".github/ci-impact.json"
      - "tools/ci_impact.py"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/src/**"
      - "backend/tests/**"
      - "backend/pyproject.toml"
      - "Makefile"
      - ".github/ci-impact.json"
      - "tools/ci_impact.py"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select incremental core checks
        id: impact
        run: >-
          python tools/ci_impact.py
          --group core
          --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.impact.outputs.core == 'true'
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - if: steps.impact.outputs.core == 'true'
        run: python -m pip install -e "backend[dev,postgres,runtime]"
      - if: steps.impact.outputs.core == 'true'
        run: make test
