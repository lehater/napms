name: core gate

on:
  push:
    branches: [main]
    paths:
      - "backend/src/**"
      - "backend/tests/access_policy/**"
      - "backend/tests/application_catalogue/**"
      - "backend/tests/authority_management/**"
      - "backend/tests/platform/**"
      - "backend/tests/architecture/**"
      - "backend/pyproject.toml"
      - "Makefile"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e "backend[dev,postgres,runtime]"
      - run: make test
