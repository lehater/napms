name: Graph Doctor Research

on:
  push:
    branches: [research/graph-doctor-v1]
    paths:
      - "docs/canonical-graph.yaml"
      - "docs/harness-engineering-graph.yaml"
      - "docs/harness-projection.yaml"
      - ".github/workflows/graph-doctor-research.yml"
  pull_request:
    paths:
      - "docs/canonical-graph.yaml"
      - "docs/harness-engineering-graph.yaml"
      - "docs/harness-projection.yaml"
      - ".github/workflows/graph-doctor-research.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Checkout Harness Graph Doctor research
        uses: actions/checkout@v5
        with:
          repository: lehater/harness
          ref: 34256efe16e4e3d9380418a405786a7b86f8075d
          path: .graph-doctor-harness
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"
      - run: python -m pip install PyYAML
      - name: Diagnose NAPMS engineering graph
        run: |
          set +e
          python .graph-doctor-harness/graph_doctor.py             docs/harness-engineering-graph.yaml             --source-graph docs/canonical-graph.yaml             --projection docs/harness-projection.yaml             --target BACKEND-IMPLEMENTATION             --source-root .             --json | tee /tmp/graph-doctor.json
          code=$?
          set -e
          python - <<'PY'
          import json
          report=json.load(open("/tmp/graph-doctor.json"))
          print(json.dumps(report["summary"], indent=2))
          assert report["summary"]["ERROR"] == 0, report
          PY
          exit "$code"
