name: J01 browser journey gate

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - "e2e/**"
      - "web/**"
      - "src/napms/application_catalogue/**"
      - "src/napms/runtime/**"
      - "src/napms/composition/**"
      - "src/napms/authority_management/**"
      - "Dockerfile"
      - "compose.yaml"
      - "tools/prepare_local_postgres.py"
      - "tools/local_start.py"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/journey-e2e.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  j01:
    runs-on: ubuntu-latest
    env:
      NAPMS_POSTGRES_PASSWORD: j01-postgres-password
      NAPMS_LOCAL_AUTH_LOGIN: local-admin
      NAPMS_LOCAL_AUTH_ACTOR_ID: local-admin
      NAPMS_E2E_LOGIN: local-admin
      NAPMS_E2E_PASSWORD: j01-browser-password
      NAPMS_E2E_BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install -e ".[e2e]"
          python -m playwright install --with-deps chromium
      - name: Configure deterministic local authentication
        run: |
          password_hash="$(python -c 'import os; from tools.local_start import hash_password; print(hash_password(os.environ["NAPMS_E2E_PASSWORD"]))')"
          printf 'NAPMS_LOCAL_AUTH_PASSWORD_HASH=%s\n' "$password_hash" >> "$GITHUB_ENV"
      - name: Start local product stack
        run: |
          python tools/prepare_local_postgres.py
          docker compose up --build --detach --remove-orphans
          python -c 'import os; from tools.local_start import wait_ready; wait_ready(os.environ["NAPMS_E2E_BASE_URL"])'
      - name: Run J01 through the browser
        run: make journey-e2e
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes --remove-orphans
