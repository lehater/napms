name: browser journey gate

on:
  push:
    branches: [main]
    paths:
      - "e2e/**"
      - "web/**"
      - "backend/src/napms/contexts/application_catalogue/**"
      - "backend/src/napms/contexts/resource_catalogue/**"
      - "backend/src/napms/contexts/authority_management/**"
      - "backend/src/napms/platform/**"
      - "backend/Dockerfile"
      - "compose.yaml"
      - "tools/prepare_local_postgres.py"
      - "tools/local_start.py"
      - "backend/pyproject.toml"
      - "Makefile"
      - ".github/workflows/journey-e2e.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journeys:
    runs-on: ubuntu-latest
    env:
      NAPMS_POSTGRES_PASSWORD: journey-postgres-password
      NAPMS_LOCAL_AUTH_LOGIN: local-admin
      NAPMS_LOCAL_AUTH_ACTOR_ID: local-admin
      NAPMS_E2E_LOGIN: local-admin
      NAPMS_E2E_PASSWORD: browser-journey-password
      NAPMS_E2E_BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install -e "backend[e2e]"
          python -m playwright install --with-deps chromium
      - name: Configure deterministic local authentication
        run: |
          password_hash="$(python -c 'import os; from tools.local_start import hash_password; print(hash_password(os.environ["NAPMS_E2E_PASSWORD"]))')"
          printf 'NAPMS_LOCAL_AUTH_PASSWORD_HASH=%s\n' "$password_hash" >> "$GITHUB_ENV"
      - name: Start local product stack
        run: |
          python tools/prepare_local_postgres.py
          docker compose up --build --detach --remove-orphans
          python -c 'import os; from tools.local_start import wait_ready; wait_ready(os.environ["NAPMS_E2E_BASE_URL"])'
      - name: Run browser journeys
        run: make journey-e2e
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes --remove-orphans
