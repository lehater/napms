name: browser journey gate

on:
  push:
    branches: [main, implementation/first-mvp-rebuild]
    paths:
      - "e2e/**"
      - "web/**"
      - "backend/src/napms/contexts/**"
      - "backend/src/napms/platform/**"
      - "backend/Dockerfile"
      - "compose.yaml"
      - "tools/**"
      - "backend/pyproject.toml"
      - "Makefile"
      - ".github/workflows/journey-e2e.yml"
  pull_request:
    types: [ready_for_review, synchronize, reopened]
    branches: [main]
    paths:
      - "e2e/**"
      - "web/**"
      - "backend/src/napms/contexts/**"
      - "backend/src/napms/platform/**"
      - "backend/Dockerfile"
      - "compose.yaml"
      - "tools/**"
      - "backend/pyproject.toml"
      - "Makefile"
      - ".github/workflows/journey-e2e.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journeys:
    runs-on: ubuntu-latest
    env:
      NAPMS_POSTGRES_PASSWORD: journey-postgres-password
      NAPMS_E2E_BASE_URL: http://127.0.0.1:8080
      NAPMS_E2E_OIDC_URL: https://127.0.0.1:8443
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install browser test dependencies
        run: |
          python -m pip install -e "backend[e2e]"
          python -m playwright install chromium
      - name: Start deterministic OIDC issuer
        run: |
          docker compose up --build --detach oidc
          python - <<'PY'
          import ssl, time, urllib.request
          context = ssl._create_unverified_context()
          for attempt in range(60):
              try:
                  urllib.request.urlopen("https://127.0.0.1:8443/health", context=context, timeout=2).read()
                  break
              except Exception:
                  if attempt == 59:
                      raise
                  time.sleep(1)
          PY
      - name: Start local product stack
        run: |
          docker compose up --build --detach --remove-orphans
          python -c 'import os; from tools.local_start import wait_ready; wait_ready(os.environ["NAPMS_E2E_BASE_URL"])'
      - name: Run browser journeys
        run: make journey-e2e
      - name: Upload rendered presentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-rendered-evidence
          path: e2e-artifacts/*.png
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes --remove-orphans
