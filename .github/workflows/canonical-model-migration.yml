name: canonical model migration

on:
  push:
    branches: [meta/canonical-model-migration]
    paths:
      - "docs/meta/canonical-model-migration/**"
      - "docs/model/**"
      - "docs/architecture/**"
      - "docs/contracts/**"
      - "docs/discovery/**"
      - "docs/migration/revalidated/h12-rc-curation/s0/**"
      - "docs/migration/revalidated/h12-rc-curation/s1/**"
      - "docs/migration/revalidated/h12-rc-curation/s2/**"
      - "docs/migration/revalidated/h16-strategic/s2/strategic/**"
      - "docs/migration/revalidated/h17-mvp-journey/s1/**"
      - "docs/migration/revalidated/h17-mvp-journey/s2/tactical/**"
      - "docs/migration/revalidated/h18-mvp-architecture/s3/**"
      - "docs/migration/revalidated/h19-mvp-implementation-readiness/s4/**"
      - "tools/check_cm1_strategic_equivalence.py"
      - "tools/check_cm2_resource_catalogue_equivalence.py"
      - "tools/check_cm3_authority_management_equivalence.py"
      - "tools/check_cm3_acc_equivalence.py"
      - "tools/check_cm3_ad_equivalence.py"
      - "tools/check_cm3_bc_equivalence.py"
      - "tools/check_cm3_ap_equivalence.py"
      - "tools/check_cm4_mvp_journey_equivalence.py"
      - "tools/check_cm5_architecture_split.py"
      - "tools/check_cm5_openapi_design.py"
      - "tools/generate_bc_view.py"
      - "tools/generate_ap_view.py"
      - "tools/generate_mvp_journey_view.py"
      - "tools/generate_ad_view.py"
      - "tools/generate_acc_view.py"
      - "tools/generate_strategic_views.py"
      - "tools/generate_resource_catalogue_views.py"
      - "Makefile"
      - ".github/workflows/canonical-model-migration.yml"
  pull_request:
    paths:
      - "docs/meta/canonical-model-migration/**"
      - "docs/model/**"
      - "docs/discovery/**"
      - "tools/check_cm1_strategic_equivalence.py"
      - "tools/check_cm2_resource_catalogue_equivalence.py"
      - "tools/check_cm3_authority_management_equivalence.py"
      - "tools/check_cm3_acc_equivalence.py"
      - "tools/check_cm3_ad_equivalence.py"
      - "tools/check_cm3_bc_equivalence.py"
      - "tools/generate_bc_view.py"
      - "tools/generate_ad_view.py"
      - "tools/generate_acc_view.py"
      - "tools/generate_strategic_views.py"
      - "tools/generate_resource_catalogue_views.py"
      - "Makefile"
      - ".github/workflows/canonical-model-migration.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical semantic equivalence and projections
        run: make canonical-model-check
