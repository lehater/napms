name: Human Projection Research

on:
  push:
    branches: [research/human-documentation-projection-v1]
    paths:
      - "docs/research/human-projection/**"
      - "tools/test_human_projection_research.py"
      - ".github/workflows/human-projection-research.yml"
  pull_request:
    paths:
      - "docs/research/human-projection/**"
      - "tools/test_human_projection_research.py"
      - ".github/workflows/human-projection-research.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Checkout Harness research prototype
        uses: actions/checkout@v5
        with:
          repository: lehater/harness
          ref: 025239b68800cb56ed192ab4d51cbf9047e80f2e
          path: .human-projection-harness
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"
      - run: python -m pip install PyYAML
      - name: Generate project-owned visual projections
        run: |
          python tools/generate_strategic_views.py
          python tools/generate_resource_catalogue_views.py
          python tools/generate_acc_view.py
          python tools/generate_ad_view.py
          python tools/generate_bc_view.py
          python tools/generate_ap_view.py
          python tools/generate_mvp_journey_view.py
          python tools/generate_persistence_erd.py
      - env:
          HUMAN_PROJECTION_HARNESS: .human-projection-harness
        run: python tools/test_human_projection_research.py
