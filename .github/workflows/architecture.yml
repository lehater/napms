name: architecture gate

on:
  pull_request:
    paths:
      - "docs/architecture/structurizr/**"
      - "docs/migration/revalidated/h16-strategic/s2/strategic/capability-map.yaml"
      - "docs/migration/revalidated/h16-strategic/s2/strategic/context-relationships.yaml"
      - "docs/spec/artifacts.md"
      - "docs/spec/repository-layout.md"
      - "tools/generate_architecture_views.py"
      - "Makefile"
      - ".github/workflows/architecture.yml"
  push:
    branches: [main]
    paths:
      - "docs/architecture/structurizr/**"
      - "docs/migration/revalidated/h16-strategic/s2/strategic/capability-map.yaml"
      - "docs/migration/revalidated/h16-strategic/s2/strategic/context-relationships.yaml"
      - "docs/spec/artifacts.md"
      - "docs/spec/repository-layout.md"
      - "tools/generate_architecture_views.py"
      - "Makefile"
      - ".github/workflows/architecture.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structurizr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate projections and validate workspace
        run: make architecture-check
