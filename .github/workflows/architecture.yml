name: architecture

on:
  pull_request:
    paths:
      - ".harness-version"
      - ".harness-version"
      - "docs/canonical-graph.yaml"
      - "docs/model/**"
      - "docs/architecture/**"
      - "tools/generate_*_view.py"
      - "tools/generate_*_views.py"
      - "tools/generate_persistence_erd.py"
      - "Makefile"
      - ".github/workflows/architecture.yml"
  push:
    branches: [main]
    paths:
      - "docs/canonical-graph.yaml"
      - "docs/model/**"
      - "docs/architecture/**"
      - "tools/generate_*_view.py"
      - "tools/generate_*_views.py"
      - "tools/generate_persistence_erd.py"
      - "Makefile"
      - ".github/workflows/architecture.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structurizr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Harness version
        id: harness-version
        run: echo "sha=$(cat .harness-version)" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned Harness
        uses: actions/checkout@v5
        with:
          repository: lehater/harness
          ref: ${{ steps.harness-version.outputs.sha }}
          path: .harness-tool
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"
      - name: Install Harness runtime dependency
        run: python -m pip install PyYAML
      - name: Validate canonical Structurizr workspace and generated views
        run: make architecture-check
