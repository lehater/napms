name: architecture gate

on:
  pull_request:
    paths:
      - "docs/architecture/structurizr/**"
      - "docs/migration/revalidated/h12-rc-curation/s2/process/resource-curation-process.yaml"
      - "docs/migration/revalidated/h12-rc-curation/s2/tactical/resource-catalogue-domain-model.yaml"
      - "docs/migration/revalidated/h16-strategic/s2/strategic/capability-map.yaml"
      - "docs/migration/revalidated/h16-strategic/s2/strategic/context-relationships.yaml"
      - "docs/migration/revalidated/h17-mvp-journey/s1/mvp-vendor-neutral-policy-export.yaml"
      - "docs/migration/revalidated/h17-mvp-journey/s2/tactical/mvp-journey-domain-model.yaml"
      - "docs/migration/revalidated/h19-mvp-implementation-readiness/s4/mvp-implementation-readiness.yaml"
      - "docs/spec/artifacts.md"
      - "docs/spec/repository-layout.md"
      - "tools/generate_architecture_views.py"
      - "Makefile"
      - ".github/workflows/architecture.yml"
  push:
    branches: [main]
    paths:
      - "docs/architecture/structurizr/**"
      - "docs/migration/revalidated/h12-rc-curation/s2/process/resource-curation-process.yaml"
      - "docs/migration/revalidated/h12-rc-curation/s2/tactical/resource-catalogue-domain-model.yaml"
      - "docs/migration/revalidated/h16-strategic/s2/strategic/capability-map.yaml"
      - "docs/migration/revalidated/h16-strategic/s2/strategic/context-relationships.yaml"
      - "docs/migration/revalidated/h17-mvp-journey/s1/mvp-vendor-neutral-policy-export.yaml"
      - "docs/migration/revalidated/h17-mvp-journey/s2/tactical/mvp-journey-domain-model.yaml"
      - "docs/migration/revalidated/h19-mvp-implementation-readiness/s4/mvp-implementation-readiness.yaml"
      - "docs/spec/artifacts.md"
      - "docs/spec/repository-layout.md"
      - "tools/generate_architecture_views.py"
      - "Makefile"
      - ".github/workflows/architecture.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structurizr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate projections and validate workspace
        run: make architecture-check
