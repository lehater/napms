name: architecture

on:
  pull_request:
    paths:
      - "docs/canonical-graph.yaml"
      - "docs/model/**"
      - "docs/architecture/**"
      - "tools/generate_*_view.py"
      - "tools/generate_*_views.py"
      - "tools/generate_persistence_erd.py"
      - "Makefile"
      - ".github/workflows/architecture.yml"
  push:
    branches: [main]
    paths:
      - "docs/canonical-graph.yaml"
      - "docs/model/**"
      - "docs/architecture/**"
      - "tools/generate_*_view.py"
      - "tools/generate_*_views.py"
      - "tools/generate_persistence_erd.py"
      - "Makefile"
      - ".github/workflows/architecture.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structurizr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical Structurizr workspace and generated views
        run: make architecture-check
