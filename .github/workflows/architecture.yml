name: architecture

on:
  pull_request:
    paths:
      - ".harness-version"
      - "docs/canonical-graph.yaml"
      - "docs/model/**"
      - "docs/architecture/**"
      - "tools/generate_*_view.py"
      - "tools/generate_*_views.py"
      - "tools/generate_persistence_erd.py"
      - "Makefile"
      - ".github/ci-impact.json"
      - "tools/ci_impact.py"
      - ".github/workflows/architecture.yml"
  push:
    branches: [main]
    paths:
      - "docs/canonical-graph.yaml"
      - "docs/model/**"
      - "docs/architecture/**"
      - "tools/generate_*_view.py"
      - "tools/generate_*_views.py"
      - "tools/generate_persistence_erd.py"
      - "Makefile"
      - ".github/ci-impact.json"
      - "tools/ci_impact.py"
      - ".github/workflows/architecture.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structurizr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select incremental architecture checks
        id: impact
        run: >-
          python tools/ci_impact.py
          --group architecture
          --github-output "$GITHUB_OUTPUT"
      - name: Read pinned Harness version
        if: steps.impact.outputs.architecture == 'true'
        id: harness-version
        run: echo "sha=$(cat .harness-version)" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned Harness
        if: steps.impact.outputs.architecture == 'true'
        uses: actions/checkout@v5
        with:
          repository: lehater/harness
          ref: ${{ steps.harness-version.outputs.sha }}
          path: .harness-tool
      - uses: actions/setup-python@v6
        if: steps.impact.outputs.architecture == 'true'
        with:
          python-version: "3.14.7"
      - name: Install Harness runtime dependency
        if: steps.impact.outputs.architecture == 'true'
        run: python -m pip install PyYAML
      - name: Validate canonical Structurizr workspace and generated views
        if: steps.impact.outputs.architecture == 'true'
        run: make architecture-check
