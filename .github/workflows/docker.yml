name: docker local runtime gate

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - ".env.example"
      - "web/**"
      - "src/napms/runtime/**"
      - "src/napms/composition/**"
      - "src/napms/access_policy/adapters/postgres/migrations/**"
      - "src/napms/authority_management/adapters/postgres/migrations/**"
      - "src/napms/application_catalogue/adapters/postgres/migrations/**"
      - "src/napms/resource_catalogue/adapters/postgres/migrations/**"
      - "tools/dev_compose.py"
      - "tools/verify_local_postgres_auth.py"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      NAPMS_POSTGRES_PASSWORD: ci-local-postgres-password
    steps:
      - uses: actions/checkout@v4
      - run: docker compose version
      - run: python tools/dev_compose.py up --no-print-credentials
      - run: python tools/verify_local_postgres_auth.py
      - run: docker compose ps
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes --remove-orphans
