name: docker local runtime gate

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - ".env.example"
      - "web/**"
      - "src/napms/runtime/**"
      - "src/napms/composition/**"
      - "src/napms/access_policy/adapters/postgres/migrations/**"
      - "src/napms/authority_management/adapters/postgres/migrations/**"
      - "src/napms/application_catalogue/adapters/postgres/migrations/**"
      - "src/napms/resource_catalogue/adapters/postgres/migrations/**"
      - "tools/dev_compose.py"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose version
      - run: python tools/dev_compose.py up --no-print-credentials
      - run: docker compose run --rm migrate
      - run: docker compose run --rm seed
      - run: docker compose ps
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes --remove-orphans
