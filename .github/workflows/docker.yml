name: docker local runtime gate

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - "backend/Dockerfile"
      - "backend/.dockerignore"
      - "compose.yaml"
      - ".env.example"
      - "web/**"
      - "backend/src/napms/platform/**"
      - "backend/src/napms/platform/**"
      - "backend/src/napms/contexts/access_policy/infrastructure/persistence/postgres/migrations/**"
      - "backend/src/napms/authority_management/adapters/postgres/migrations/**"
      - "backend/src/napms/contexts/application_catalogue/infrastructure/persistence/postgres/migrations/**"
      - "backend/src/napms/resource_catalogue/adapters/postgres/migrations/**"
      - "tools/dev_compose.py"
      - "tools/local_start.py"
      - "tools/local_status.py"
      - "tools/local_postgres_backup.py"
      - "tools/prepare_local_postgres.py"
      - "tools/verify_local_postgres_auth.py"
      - "backend/pyproject.toml"
      - "Makefile"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      NAPMS_POSTGRES_PASSWORD: ci-compose-interpolation-placeholder
    steps:
      - uses: actions/checkout@v4
      - run: docker compose version
      - name: Prove fresh password-authenticated product journey
        run: |
          export NAPMS_POSTGRES_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          python tools/prepare_local_postgres.py
          python tools/dev_compose.py up --no-print-credentials
          python tools/verify_local_postgres_auth.py
      - name: Prove restart on preserved volume with rotated database credential
        run: |
          export NAPMS_POSTGRES_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          python tools/prepare_local_postgres.py
          python tools/local_start.py up --no-print-credentials
          python tools/verify_local_postgres_auth.py
      - name: Prove logical backup and clean-volume restore
        run: |
          before="$(docker compose exec -T postgres psql -U napms -d napms -Atc 'SELECT count(*) FROM napms_access_policy.access_rules')"
          test "$before" -gt 0
          python tools/local_postgres_backup.py backup /tmp/napms-ci.napms.dump
          python tools/local_postgres_backup.py restore-clean /tmp/napms-ci.napms.dump --confirm-reset --no-print-credentials
          after="$(docker compose exec -T postgres psql -U napms -d napms -Atc 'SELECT count(*) FROM napms_access_policy.access_rules')"
          test "$before" = "$after"
      - name: Prove migration replay is a no-op
        run: |
          journal_before="$(docker compose exec -T postgres psql -U napms -d napms -Atc 'SELECT count(*) FROM napms_runtime.schema_migrations')"
          rules_before="$(docker compose exec -T postgres psql -U napms -d napms -Atc 'SELECT count(*) FROM napms_access_policy.access_rules')"
          export NAPMS_POSTGRES_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          python tools/prepare_local_postgres.py
          docker compose run --rm migrate
          docker compose run --rm migrate
          journal_after="$(docker compose exec -T postgres psql -U napms -d napms -Atc 'SELECT count(*) FROM napms_runtime.schema_migrations')"
          rules_after="$(docker compose exec -T postgres psql -U napms -d napms -Atc 'SELECT count(*) FROM napms_access_policy.access_rules')"
          test "$journal_before" = "$journal_after"
          test "$rules_before" = "$rules_after"
          python tools/local_start.py up --no-print-credentials
          python tools/verify_local_postgres_auth.py
      - name: Prove local operator status diagnostics
        run: python tools/local_status.py
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes --remove-orphans
