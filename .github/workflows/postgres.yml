name: postgres persistence gate

on:
  push:
    branches: [main]
    paths:
      - "backend/src/napms/contexts/access_policy/infrastructure/persistence/postgres/**"
      - "backend/src/napms/contexts/authority_management/**"
      - "backend/src/napms/contexts/application_catalogue/**"
      - "backend/src/napms/contexts/resource_catalogue/**"
      - "backend/src/napms/contexts/technical_access_evidence/**"
      - "backend/src/napms/contexts/network_enforcement_placement/infrastructure/persistence/postgres/**"
      - "backend/src/napms/platform/**"
      - "backend/tests/integration/postgres/**"
      - "backend/pyproject.toml"
      - "Makefile"
      - ".github/workflows/postgres.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: napms
          POSTGRES_PASSWORD: napms
          POSTGRES_DB: napms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U napms -d napms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NAPMS_TEST_POSTGRES_DSN: postgresql://napms:napms@localhost:5432/napms_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e "backend[dev,postgres]"
      - run: make postgres-test
