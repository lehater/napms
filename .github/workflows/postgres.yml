name: postgres persistence gate

on:
  push:
    branches: [main, implementation/first-mvp-rebuild]
    paths:
      - "backend/src/napms/contexts/**/infrastructure/persistence/postgres/**"
      - "backend/src/napms/platform/**"
      - "backend/tests/integration/postgres/**"
      - "backend/requirements.lock"
      - "backend/pyproject.toml"
      - "Makefile"
      - ".github/ci-impact.json"
      - "tools/ci_impact.py"
      - ".github/workflows/postgres.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/src/napms/contexts/**/infrastructure/persistence/postgres/**"
      - "backend/src/napms/platform/**"
      - "backend/tests/integration/postgres/**"
      - "backend/requirements.lock"
      - "backend/pyproject.toml"
      - "Makefile"
      - ".github/ci-impact.json"
      - "tools/ci_impact.py"
      - ".github/workflows/postgres.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      postgres: ${{ steps.impact.outputs.postgres }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select incremental persistence checks
        id: impact
        run: >-
          python tools/ci_impact.py
          --group postgres
          --github-output "$GITHUB_OUTPUT"

  integration:
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: napms
          POSTGRES_PASSWORD: napms
          POSTGRES_DB: napms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U napms -d napms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NAPMS_TEST_POSTGRES_DSN: postgresql://napms:napms@localhost:5432/napms_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install locked backend environment
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install --no-deps -e backend
      - run: make postgres-test
