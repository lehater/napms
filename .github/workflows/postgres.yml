name: postgres persistence gate

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - "src/napms/access_policy/adapters/postgres/**"
      - "src/napms/authority_management/**"
      - "src/napms/application_catalogue/**"
      - "src/napms/resource_catalogue/**"
      - "src/napms/connectivity_decision/**"
      - "src/napms/composition/**"
      - "tests/integration/postgres/**"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/postgres.yml"
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: napms
          POSTGRES_PASSWORD: napms
          POSTGRES_DB: napms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U napms -d napms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NAPMS_TEST_POSTGRES_DSN: postgresql://napms:napms@localhost:5432/napms_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e ".[dev,postgres]"
      - run: make postgres-test
