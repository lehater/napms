name: implementation quality

on:
  push:
    branches:
      - implementation/first-mvp-rebuild
    paths:
      - "backend/**"
      - "web/**"
      - "Makefile"
      - ".github/workflows/implementation-quality.yml"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Makefile'
              - '.github/workflows/implementation-quality.yml'
            frontend:
              - 'web/**'
              - 'Makefile'
              - '.github/workflows/implementation-quality.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install locked backend environment
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install --no-deps -e backend
      - name: Backend format
        run: make backend-format
      - name: Backend lint
        run: make backend-lint
      - name: Backend typing
        run: make backend-type
      - name: Backend architecture
        run: make backend-architecture
      - name: Backend tests
        run: make test
      - name: Backend dependency audit
        run: make backend-security

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked frontend environment
        working-directory: web
        run: npm ci
      - name: Frontend format lint type boundary build
        run: make web-check
      - name: Frontend dependency audit
        run: make web-security
