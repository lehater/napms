name: Blind Source Coverage Postmortem

on:
  push:
    branches:
      - research/blind-greenfield-backend-reconstruction
    paths:
      - "experiments/blind-backend-2026-09-20/comparison/post-freeze-source-coverage.yaml"
      - ".github/workflows/blind-source-coverage-postmortem.yml"
  pull_request:
    paths:
      - "experiments/blind-backend-2026-09-20/comparison/post-freeze-source-coverage.yaml"
      - ".github/workflows/blind-source-coverage-postmortem.yml"

permissions:
  contents: read

jobs:
  source-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NAPMS experiment
        uses: actions/checkout@v4

      - name: Checkout Harness source-coverage validator
        uses: actions/checkout@v4
        with:
          repository: lehater/harness
          ref: df1c1c2d53a822d01f2c61a7894eab0dab6e5eae
          path: harness-source

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install PyYAML

      - name: Validate post-freeze source coverage ledger
        run: |
          python harness-source/source_coverage.py validate \
            experiments/blind-backend-2026-09-20/comparison/post-freeze-source-coverage.yaml \
            > /tmp/source-coverage.json
          cat /tmp/source-coverage.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("/tmp/source-coverage.json").read_text())
          assert result["valid"] is True, result
          assert result["coverage_status"] == "INCOMPLETE", result
          assert sorted(result["questions"]) == sorted([
              "W1-001-SUBMIT-AUTH-SCOPE",
              "W1-008-EXPORT-AUTH-SCOPE",
              "W1-013-AUTHORITY-PROVENANCE-SCOPE-TIME",
              "Q-001-NUMERIC-TARGETS",
          ]), result
          PY
