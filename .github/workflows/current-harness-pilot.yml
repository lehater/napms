name: current Harness pilot

on:
  push:
    paths:
      - ".harness/**"
      - "docs/canonical-graph.yaml"
      - "docs/harness-core.yaml"
      - ".github/workflows/current-harness-pilot.yml"
  pull_request:
    paths:
      - ".harness/**"
      - "docs/canonical-graph.yaml"
      - "docs/harness-core.yaml"
      - ".github/workflows/current-harness-pilot.yml"

permissions:
  contents: read

jobs:
  validate-current-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NAPMS
        uses: actions/checkout@v4

      - name: Checkout pinned current Harness
        uses: actions/checkout@v4
        with:
          repository: lehater/harness
          ref: 1d4cec57c9a9dc0bc0c148bbc9c626803d983dd7
          path: .harness-tool

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML dependency
        run: python -m pip install PyYAML

      - name: Verify existing NAPMS engineering vertical
        run: python tools/check_harness_vertical.py

      - name: Derive current implementation consumer profile
        run: |
          python .harness/derive_consumer_profile.py             docs/harness-core.yaml IMPLEMENTATION             --harness-root .harness-tool             --profile-output /tmp/implementation-profile.yaml             --model-output /tmp/implementation-model.yaml

      - name: Verify current implementation consumer is complete
        run: |
          python .harness-tool/target_state.py             /tmp/implementation-profile.yaml             /tmp/implementation-model.yaml
          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml

          sys.path.insert(0, ".harness-tool")
          from target_state import evaluate_target_state

          profile = yaml.safe_load(Path("/tmp/implementation-profile.yaml").read_text())
          model = yaml.safe_load(Path("/tmp/implementation-model.yaml").read_text())
          result = evaluate_target_state(profile, model)
          assert result["status"] == "COMPLETE", result
          assert result["create"] == [], result
          assert result["wait"] == [], result
          assert result["pending"] == [], result
          PY

      - name: Verify project-native not-applicable evidence maps to knowledge
        run: |
          python .harness/derive_consumer_profile.py \
            docs/harness-core.yaml IMPLEMENTATION-DESIGN \
            --harness-root .harness-tool \
            --profile-output /tmp/implementation-design-profile.yaml \
            --model-output /tmp/implementation-design-model.yaml
          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml

          sys.path.insert(0, ".harness-tool")
          from target_state import evaluate_target_state

          profile = yaml.safe_load(
              Path("/tmp/implementation-design-profile.yaml").read_text()
          )
          model = yaml.safe_load(
              Path("/tmp/implementation-design-model.yaml").read_text()
          )

          by_id = {item["id"]: item for item in profile["expectations"]}
          assert by_id["ASYNCHRONOUS-CONTRACT"]["capability"] == (
              "engineering.architecture.async-messaging-not-applicable"
          ), by_id["ASYNCHRONOUS-CONTRACT"]

          result = evaluate_target_state(profile, model)
          assert result["status"] == "COMPLETE", result
          assert result["create"] == [], result
          assert result["wait"] == [], result
          assert result["pending"] == [], result
          PY

      - name: Verify missing not-applicable evidence opens CREATE
        run: |
          python .harness/derive_consumer_profile.py \
            docs/harness-core.yaml IMPLEMENTATION-DESIGN \
            --harness-root .harness-tool \
            --profile-output /tmp/missing-na-profile.yaml \
            --model-output /tmp/missing-na-model.yaml \
            --drop-capability engineering.architecture.async-messaging-not-applicable
          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml

          sys.path.insert(0, ".harness-tool")
          from target_state import evaluate_target_state

          profile = yaml.safe_load(Path("/tmp/missing-na-profile.yaml").read_text())
          model = yaml.safe_load(Path("/tmp/missing-na-model.yaml").read_text())
          result = evaluate_target_state(profile, model)

          assert result["status"] == "READY", result
          create = {item["expectation"] for item in result["create"]}
          assert create == {"ASYNCHRONOUS-CONTRACT"}, result
          assert result["wait"] == [], result
          PY

      - name: Verify missing UI capability opens bounded frontier
        run: |
          python .harness/derive_consumer_profile.py             docs/harness-core.yaml IMPLEMENTATION             --harness-root .harness-tool             --profile-output /tmp/missing-ui-profile.yaml             --model-output /tmp/missing-ui-model.yaml             --drop-capability engineering.interface.resource-detail-ui
          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml

          sys.path.insert(0, ".harness-tool")
          from target_state import evaluate_target_state

          profile = yaml.safe_load(Path("/tmp/missing-ui-profile.yaml").read_text())
          model = yaml.safe_load(Path("/tmp/missing-ui-model.yaml").read_text())
          result = evaluate_target_state(profile, model)

          assert result["status"] == "READY", result
          assert {item["expectation"] for item in result["create"]} == {
              "RESOURCE-DETAIL-UI"
          }, result
          assert result["wait"] == [], result

          pending = {item["expectation"] for item in result["pending"]}
          assert {
              "IMPLEMENTATION-PLAN",
              "COMPLETION",
              "VERIFICATION",
              "VERIFICATION-SCENARIOS",
          }.issubset(pending), result
          PY
