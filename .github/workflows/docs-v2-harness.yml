name: documentation harness

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - meta/docs-v2-m7-pilot
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "tools/docs_v2_harness.py"
      - "tools/test_docs_v2_harness*.py"
      - "tools/requirements-docs-v2-harness.txt"
      - "Makefile"
      - ".github/workflows/docs-v2-harness.yml"
  pull_request:
    types: [ready_for_review]
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "tools/docs_v2_harness.py"
      - "tools/test_docs_v2_harness*.py"
      - "tools/requirements-docs-v2-harness.txt"
      - "Makefile"
      - ".github/workflows/docs-v2-harness.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Harness dependency
        run: python -m pip install -r tools/requirements-docs-v2-harness.txt
      - name: Validate canonical documentation
        run: make docs-v2-harness-check
