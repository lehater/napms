name: Engineering Coverage

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/engineering-coverage.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/engineering-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NAPMS
        uses: actions/checkout@v5

      - name: Checkout Harness
        uses: actions/checkout@v5
        with:
          repository: lehater/harness
          ref: main
          path: .harness-coverage-tool

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"

      - name: Install runtime dependency
        run: python -m pip install PyYAML

      - name: Evaluate backend coverage
        run: |
          python .harness-coverage-tool/engineering_coverage.py             docs/harness-engineering-graph.yaml             docs/harness-projection.yaml             BACKEND-IMPLEMENTATION             --canonical-source docs/canonical-graph.yaml             --scope first-mvp             --authority-aliases docs/harness/coverage/authority-role-aliases-v1.yaml             --overlay docs/harness/coverage/concern-activation-overlay-v1.yaml             --semantic-claim-bindings docs/harness/coverage/semantic-claim-bindings-v1.yaml             > /tmp/backend-coverage.json

      - name: Evaluate frontend coverage
        run: |
          python .harness-coverage-tool/engineering_coverage.py             docs/harness-engineering-graph.yaml             docs/harness-projection.yaml             FRONTEND-IMPLEMENTATION             --canonical-source docs/canonical-graph.yaml             --scope first-mvp             --authority-aliases docs/harness/coverage/authority-role-aliases-v1.yaml             --overlay docs/harness/coverage/concern-activation-overlay-v1.yaml             --semantic-claim-bindings docs/harness/coverage/semantic-claim-bindings-v1.yaml             > /tmp/frontend-coverage.json

      - name: Verify complete coverage
        run: |
          python - <<'PY'
          import json

          with open("/tmp/backend-coverage.json", encoding="utf-8") as f:
              backend = json.load(f)
          with open("/tmp/frontend-coverage.json", encoding="utf-8") as f:
              frontend = json.load(f)

          for expected_consumer, result in (
              ("BACKEND-IMPLEMENTATION", backend),
              ("FRONTEND-IMPLEMENTATION", frontend),
          ):
              assert result["kind"] == "harness-engineering-coverage-evaluation"
              assert result["status"] == "canonical"
              assert result["consumer"] == expected_consumer
              assert result["completion_ready"] is True
              assert result["remaining_work_count"] == 0
              assert result["work_items"] == []
              assert result["question_frontier"] == []

          print(
              "NAPMS Engineering Coverage COMPLETE:",
              backend["activated_count"],
              frontend["activated_count"],
          )
          PY
