# Coverage evaluates against the canonical Harness SHA pinned in .harness-version.
name: Engineering Coverage

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".harness-version"
      - "tools/evaluate_frontend_presentation_semantics.py"
      - "tools/evaluate_security_identity_semantics.py"
      - "tools/evaluate_frontend_coverage_semantics.py"
      - ".github/ci-impact.json"
      - "tools/ci_impact.py"
      - ".github/workflows/engineering-coverage.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".harness-version"
      - "tools/evaluate_frontend_presentation_semantics.py"
      - "tools/evaluate_security_identity_semantics.py"
      - "tools/evaluate_frontend_coverage_semantics.py"
      - ".github/ci-impact.json"
      - "tools/ci_impact.py"
      - ".github/workflows/engineering-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NAPMS
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select incremental engineering coverage checks
        id: impact
        run: >-
          python tools/ci_impact.py
          --group engineering_coverage
          --github-output "$GITHUB_OUTPUT"

      - name: Read pinned Harness version
        if: steps.impact.outputs.engineering_coverage == 'true'
        id: harness-version
        run: echo "sha=$(cat .harness-version)" >> "$GITHUB_OUTPUT"

      - name: Checkout Harness
        if: steps.impact.outputs.engineering_coverage == 'true'
        uses: actions/checkout@v5
        with:
          repository: lehater/harness
          ref: ${{ steps.harness-version.outputs.sha }}
          path: .harness-coverage-tool

      - uses: actions/setup-python@v6
        if: steps.impact.outputs.engineering_coverage == 'true'
        with:
          python-version: "3.14.7"

      - name: Install runtime dependency
        if: steps.impact.outputs.engineering_coverage == 'true'
        run: python -m pip install PyYAML

      - name: Evaluate backend coverage
        if: steps.impact.outputs.engineering_coverage == 'true'
        run: |
          python .harness-coverage-tool/engineering_coverage.py             docs/harness-engineering-graph.yaml             docs/harness-projection.yaml             BACKEND-IMPLEMENTATION             --canonical-source docs/canonical-graph.yaml             --scope first-mvp             --authority-aliases docs/harness/coverage/authority-role-aliases-v1.yaml             --overlay docs/harness/coverage/concern-activation-overlay-v1.yaml             --semantic-claim-bindings docs/harness/coverage/semantic-claim-bindings-v1.yaml             --subject-obligations docs/harness/coverage/backend-subject-obligations-v1.yaml             --scope-source docs/requirements/first-mvp-product-requirements.yaml             > /tmp/backend-coverage.json

      - name: Evaluate frontend semantic acceptance
        if: steps.impact.outputs.engineering_coverage == 'true'
        run: python tools/evaluate_frontend_coverage_semantics.py --output /tmp/frontend-semantic-evaluations.json

      - name: Evaluate frontend coverage
        if: steps.impact.outputs.engineering_coverage == 'true'
        run: |
          python .harness-coverage-tool/engineering_coverage.py             docs/harness-engineering-graph.yaml             docs/harness-projection.yaml             FRONTEND-IMPLEMENTATION             --canonical-source docs/canonical-graph.yaml             --scope first-mvp             --authority-aliases docs/harness/coverage/authority-role-aliases-v1.yaml             --overlay docs/harness/coverage/concern-activation-overlay-v1.yaml             --semantic-claim-bindings docs/harness/coverage/semantic-claim-bindings-v1.yaml             --semantic-evaluations /tmp/frontend-semantic-evaluations.json             --subject-obligations docs/harness/coverage/frontend-subject-obligations-v1.yaml             --scope-source docs/requirements/first-mvp-product-requirements.yaml             > /tmp/frontend-coverage.json

      - name: Verify complete coverage
        if: steps.impact.outputs.engineering_coverage == 'true'
        run: |
          python - <<'PY'
          import json

          with open("/tmp/backend-coverage.json", encoding="utf-8") as f:
              backend = json.load(f)
          with open("/tmp/frontend-coverage.json", encoding="utf-8") as f:
              frontend = json.load(f)

          if not frontend["completion_ready"]:
              print("FRONTEND COVERAGE GAPS")
              for row in frontend["remaining_work"]:
                  print(json.dumps(row, sort_keys=True))

          for expected_consumer, result in (
              ("BACKEND-IMPLEMENTATION", backend),
              ("FRONTEND-IMPLEMENTATION", frontend),
          ):
              assert result["kind"] == "harness-engineering-coverage-evaluation"
              assert result["status"] == "canonical"
              assert result["consumer"] == expected_consumer
              assert result["completion_ready"] is True
              assert result["remaining_work_count"] == 0
              assert result["work_items"] == []
              assert result["question_frontier"] == []

          print(
              "NAPMS concern/subject Engineering Coverage COMPLETE "
              "(independent of structural Consumer target):",
              backend["activated_count"],
              frontend["activated_count"],
          )
          PY
