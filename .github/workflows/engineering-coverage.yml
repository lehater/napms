# Coverage evaluates against the canonical Harness SHA pinned in .harness-version.
name: Engineering Coverage

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".harness-version"
      - ".github/workflows/engineering-coverage.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".harness-version"
      - ".github/workflows/engineering-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NAPMS
        uses: actions/checkout@v5

      - name: Read pinned Harness version
        id: harness-version
        run: echo "sha=$(cat .harness-version)" >> "$GITHUB_OUTPUT"

      - name: Checkout Harness
        uses: actions/checkout@v5
        with:
          repository: lehater/harness
          ref: ${{ steps.harness-version.outputs.sha }}
          path: .harness-coverage-tool

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"

      - name: Install runtime dependency
        run: python -m pip install PyYAML

      - name: Evaluate backend coverage
        run: |
          python .harness-coverage-tool/engineering_coverage.py             docs/harness-engineering-graph.yaml             docs/harness-projection.yaml             BACKEND-IMPLEMENTATION             --canonical-source docs/canonical-graph.yaml             --scope first-mvp             --authority-aliases docs/harness/coverage/authority-role-aliases-v1.yaml             --overlay docs/harness/coverage/concern-activation-overlay-v1.yaml             --semantic-claim-bindings docs/harness/coverage/semantic-claim-bindings-v1.yaml             --subject-obligations docs/harness/coverage/backend-subject-obligations-v1.yaml             --scope-source docs/requirements/first-mvp-product-requirements.yaml             > /tmp/backend-coverage.json

      - name: Evaluate frontend screen semantic closure
        run: |
          HARNESS_ROOT=.harness-coverage-tool python tools/check_frontend_screen_contracts.py \
            --semantic-evaluation-out /tmp/frontend-screen-evaluation.yaml

      - name: Evaluate frontend coverage
        run: |
          python .harness-coverage-tool/engineering_coverage.py             docs/harness-engineering-graph.yaml             docs/harness-projection.yaml             FRONTEND-IMPLEMENTATION             --canonical-source docs/canonical-graph.yaml             --scope first-mvp             --authority-aliases docs/harness/coverage/authority-role-aliases-v1.yaml             --overlay docs/harness/coverage/concern-activation-overlay-v1.yaml             --semantic-claim-bindings docs/harness/coverage/semantic-claim-bindings-v1.yaml             --semantic-evaluations /tmp/frontend-screen-evaluation.yaml             --subject-obligations docs/harness/coverage/frontend-subject-obligations-v1.yaml             --scope-source docs/requirements/first-mvp-product-requirements.yaml             > /tmp/frontend-coverage.json

      - name: Verify complete coverage
        run: |
          python - <<'PY'
          import json

          with open("/tmp/backend-coverage.json", encoding="utf-8") as f:
              backend = json.load(f)
          with open("/tmp/frontend-coverage.json", encoding="utf-8") as f:
              frontend = json.load(f)

          assert backend["kind"] == "harness-engineering-coverage-evaluation"
          assert backend["status"] == "canonical"
          assert backend["consumer"] == "BACKEND-IMPLEMENTATION"
          assert backend["completion_ready"] is True
          assert backend["remaining_work_count"] == 0
          assert backend["work_items"] == []
          assert backend["question_frontier"] == []

          assert frontend["kind"] == "harness-engineering-coverage-evaluation"
          assert frontend["status"] == "canonical"
          assert frontend["consumer"] == "FRONTEND-IMPLEMENTATION"
          assert frontend["completion_ready"] is False
          assert frontend["remaining_work_count"] > 0
          assert any(
              item.get("action") == "REVALIDATE_SEMANTICS"
              for item in frontend["work_items"]
          ), frontend["work_items"]

          print(
              "NAPMS Engineering Coverage:",
              "backend COMPLETE;",
              "frontend correctly BLOCKED by incomplete screen semantic closure",
          )
          PY
