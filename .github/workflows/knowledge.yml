name: knowledge gate

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - "docs/domain/**"
      - "docs/requirements/**"
      - "docs/architecture/**"
      - "docs/decisions/**"
      - "tools/validate_domain_model.py"
      - "Makefile"
      - ".github/workflows/knowledge.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: make knowledge-check
