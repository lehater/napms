name: knowledge gate

on:
  push:
    branches: [main]
    paths:
      - "docs/domain/**"
      - "docs/requirements/**"
      - "docs/architecture/**"
      - "docs/decisions/**"
      - "tools/validate_domain_model.py"
      - "Makefile"
      - ".github/workflows/knowledge.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: make knowledge-check
