name: Harness Scenario Suite experiment

on:
  push:
    branches: [experiment/harness-scenario-suite]
    paths:
      - "experiments/harness_scenarios/**"
      - ".github/workflows/harness-scenario-suite.yml"
      - "docs/canonical-graph.yaml"
      - "docs/harness-engineering-graph.yaml"
      - "docs/harness-projection.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenario-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"

      - name: Check out experimental Harness
        uses: actions/checkout@v5
        with:
          repository: lehater/harness
          ref: experiment/scenario-suite
          path: .harness-tool

      - run: python -m pip install PyYAML

      - name: Run NAPMS scenarios through generic Harness protocol
        run: |
          python .harness-tool/scenario_suite.py             experiments/harness_scenarios/scenarios             --catalog experiments/harness_scenarios/catalog.yaml             --json-report /tmp/napms-harness-scenarios.json
