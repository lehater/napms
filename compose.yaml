name: napms-local

x-backend: &backend
  image: napms-api:local
  build:
    context: backend
    dockerfile: Dockerfile
  init: true
  security_opt:
    - no-new-privileges:true
  environment: &backend-environment
    NAPMS_ENVIRONMENT: local-dev
    NAPMS_DATABASE_DSN: postgresql://napms:${NAPMS_POSTGRES_PASSWORD:?set NAPMS_POSTGRES_PASSWORD}@postgres:5432/napms
    NAPMS_OIDC_ISSUER: https://oidc:8443
    NAPMS_OIDC_AUDIENCE: napms-e2e
    NAPMS_OIDC_ALGORITHMS: RS256
    SSL_CERT_FILE: /e2e-oidc/tls.crt
    NAPMS_HTTP_HOST: 0.0.0.0
    NAPMS_HTTP_PORT: "8000"
  volumes:
    - oidc-material:/e2e-oidc:ro

services:
  oidc:
    build:
      context: e2e/oidc
      dockerfile: Dockerfile
    environment:
      NAPMS_TEST_OIDC_ISSUER: https://oidc:8443
      NAPMS_TEST_OIDC_AUDIENCE: napms-e2e
    volumes:
      - oidc-material:/material
    ports:
      - "127.0.0.1:${NAPMS_OIDC_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl, urllib.request; urllib.request.urlopen('https://127.0.0.1:8443/health', context=ssl.create_default_context(cafile='/material/tls.crt'), timeout=2).read()"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: napms
      POSTGRES_DB: napms
      POSTGRES_PASSWORD: ${NAPMS_POSTGRES_PASSWORD:?set NAPMS_POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - napms-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U napms -d napms"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["napms-migrate"]
    depends_on:
      oidc:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    depends_on:
      oidc:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: napms-web:local
    build:
      context: web
      dockerfile: Dockerfile
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      NAPMS_RUNTIME_ACCESS_TOKEN: ${NAPMS_RUNTIME_ACCESS_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NAPMS_WEB_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  napms-postgres:
  oidc-material:
